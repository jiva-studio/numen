syntax = "proto3";

package numen.sync.v1;

option go_package = "github.com/jiva-studio/numen/libs/shared/syncprotocol/gen/numen/sync/v1;syncv1";

// RevisionService stores the head revision of every file of a vault and feeds the changes to the other devices.
service RevisionService {
  // CommitRevisions commits a batch of signed revisions of one vault: all of them or none.
  rpc CommitRevisions(CommitRevisionsRequest) returns (CommitRevisionsResponse);

  // GetChanges returns the head revisions of files that changed after a cursor, in the order of seq.
  rpc GetChanges(GetChangesRequest) returns (GetChangesResponse);
}

message Revision {
  // vault_id is 16 bytes.
  bytes vault_id = 1;
  // file_id is 16 random bytes, stable for the file.
  bytes file_id = 2;
  // parent_rev is the revision id, 32 bytes, that the author saw as head; empty for a new file.
  bytes parent_rev = 3;
  // blob_id is 16 bytes from ReserveBlobs; empty when deleted.
  bytes blob_id = 4;
  // blob_hash is the SHA-256 of the stored object, 32 bytes; empty when deleted.
  bytes blob_hash = 5;
  // blob_size is the stored (padded) size in bytes, the size declared to ReserveBlobs; 0 when deleted.
  uint64 blob_size = 6;
  // enc_meta is ciphertext of the path, the revision key, the sizes and the mtime, at most 16 KiB. It may be empty only when deleted.
  bytes enc_meta = 7;
  // path_hash is the keyed hash of the normalized path, 32 bytes.
  bytes path_hash = 8;
  // share_root_id is 16 bytes or empty. It is stored and signed; the server does not act on it yet.
  bytes share_root_id = 9;
  // deleted marks a tombstone.
  bool deleted = 10;
  // epoch is the key epoch of the vault or the share root; stored and signed, not checked.
  uint32 epoch = 11;
  // author_device_sign_key is 32 bytes.
  bytes author_device_sign_key = 12;
  // signature is 64 bytes over syncprotocol.GetRevisionMessage, under the plugin domain.
  bytes signature = 13;
}

message StoredRevision {
  Revision revision = 1;
  // rev_id is syncprotocol.GetRevisionID of the revision, 32 bytes, computed by the server.
  bytes rev_id = 2;
  // seq is the vault sequence number of the commit that stored it.
  uint64 seq = 3;
}

message CommitRevisionsRequest {
  bytes vault_id = 1;
  // revisions holds 1 to 500 revisions.
  repeated Revision revisions = 2;
}

message CommitRevisionsResponse {
  bool committed = 1;
  // seq is the seq of the batch, or of the stored heads for a pure retry.
  uint64 seq = 2;
  // revisions are the stored revisions in request order, when committed.
  repeated StoredRevision revisions = 3;
  // conflicts are set when not committed.
  repeated Conflict conflicts = 4;
}

enum ConflictKind {
  CONFLICT_KIND_UNSPECIFIED = 0;
  // CONFLICT_KIND_PARENT_MISMATCH means parent_rev is not the head of the file.
  CONFLICT_KIND_PARENT_MISMATCH = 1;
  // CONFLICT_KIND_PATH_TAKEN means another live file has the same path_hash.
  CONFLICT_KIND_PATH_TAKEN = 2;
}

message Conflict {
  // file_id is the file of the request that conflicted.
  bytes file_id = 1;
  ConflictKind kind = 2;
  // head is the current head for PARENT_MISMATCH, unset when the file does not exist; for PATH_TAKEN the head of the file that holds the path.
  StoredRevision head = 3;
  // existing_file_id is set for PATH_TAKEN only.
  bytes existing_file_id = 4;
}

message GetChangesRequest {
  bytes vault_id = 1;
  // since_seq is 0 for the first load.
  uint64 since_seq = 2;
  // limit 0 means 200; at most 1000.
  uint32 limit = 3;
}

message GetChangesResponse {
  // changes are ordered by seq, then file_id; a batch is never split across pages.
  repeated StoredRevision changes = 1;
  // next_seq is the cursor for the next call.
  uint64 next_seq = 2;
  bool has_more = 3;
  // head_seq is the vault seq when the page was read.
  uint64 head_seq = 4;
  // is_reset is true when since_seq is older than the deletion records the server keeps. The page then holds
  // the head of every live file from seq 0, whatever since_seq was, and no deletion record.
  bool is_reset = 5;
}
