syntax = "proto3";

package numen.sync.v1;

option go_package = "github.com/jiva-studio/numen/libs/shared/syncprotocol/gen/numen/sync/v1;syncv1";

// BlobService hands out presigned URLs for the bodies of files.
service BlobService {
  // ReserveBlobs declares the sizes of bodies, reserves quota, and returns one presigned PUT for each.
  rpc ReserveBlobs(ReserveBlobsRequest) returns (ReserveBlobsResponse);

  // GetBlobUrls returns presigned GETs for the blobs of current heads.
  rpc GetBlobUrls(GetBlobUrlsRequest) returns (GetBlobUrlsResponse);
}

message ReserveBlobsRequest {
  bytes vault_id = 1;
  // sizes holds 1 to 100 padded stored sizes, each 1 to 67108864.
  repeated uint64 sizes = 2;
}

// ReserveBlobsResponse lists the uploads in the order of the sizes.
message ReserveBlobsResponse {
  repeated BlobUpload uploads = 1;
}

message BlobUpload {
  bytes blob_id = 1;
  // url takes one PUT with exactly size body bytes and a matching Content-Length; no other header is needed.
  string url = 2;
  // expires_at is in unix seconds.
  int64 expires_at = 3;
  uint64 size = 4;
}

message GetBlobUrlsRequest {
  bytes vault_id = 1;
  // blob_ids holds 1 to 100 ids.
  repeated bytes blob_ids = 2;
}

// GetBlobUrlsResponse lists the downloads in the order of blob_ids.
message GetBlobUrlsResponse {
  repeated BlobDownload downloads = 1;
}

message BlobDownload {
  bytes blob_id = 1;
  // url takes a GET; it is empty when found is false.
  string url = 2;
  // expires_at is in unix seconds.
  int64 expires_at = 3;
  // found is false when the blob is not a current head.
  bool found = 4;
}

// QuotaExceeded is the detail of RESOURCE_EXHAUSTED.
message QuotaExceeded {
  uint64 used_bytes = 1;
  uint64 limit_bytes = 2;
}

// BlobNotReady is the detail of the FAILED_PRECONDITION of CommitRevisions.
message BlobNotReady {
  uint32 revision_index = 1;
}

// BlobMissing is the detail of the NOT_FOUND of GetBlobUrls: the bodies of these blobs are gone from the store.
message BlobMissing {
  repeated bytes blob_ids = 1;
}
