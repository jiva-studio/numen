syntax = "proto3";

package numen.sync.v1;

option go_package = "github.com/jiva-studio/numen/libs/shared/syncprotocol/gen/numen/sync/v1;syncv1";

// AccountService returns the stored device chain of an account.
service AccountService {
  // GetAccountChain returns the stored chain of the account of the session. It needs the session bearer.
  rpc GetAccountChain(GetAccountChainRequest) returns (GetAccountChainResponse);

  // GetAccountChainByRoot returns the stored chain of the account with a root key, to a caller that proves it
  // holds the recovery key. It needs no session.
  rpc GetAccountChainByRoot(GetAccountChainByRootRequest) returns (GetAccountChainByRootResponse);

  // AppendChain presents a longer chain of the account of the session: a new device, or a revoke. The presented
  // chain must extend the stored one, list the device of the session as active, and every entry after the stored
  // head must be signed by that device or by the root key. A chain equal to the stored one is accepted again. When it
  // does not extend the stored one the answer is FAILED_PRECONDITION with a ChainStale detail. A revoke ends the
  // sessions of the revoked device in the same step. It needs the session bearer.
  rpc AppendChain(AppendChainRequest) returns (AppendChainResponse);

  // DeleteAccount starts the deletion of the account of the session. The device of the session proves it holds its
  // key by signing a challenge asked with that key as device_sign_key, under syncprotocol.GetAccountDeleteMessage;
  // the bearer alone does not delete. The server cancels the subscription of the account first, then marks the
  // account as deleting, ends its sessions and stops its sync. After the grace period of seven days it deletes every
  // row and every stored object of the account. A repeated call for a deleting account answers the same delete_at.
  // A subscription that cannot be cancelled leaves the account as it was. It needs the session bearer.
  rpc DeleteAccount(DeleteAccountRequest) returns (DeleteAccountResponse);

  // ExportAccount streams what the server holds of the account of the session, as one JSON document cut into
  // chunks. The chunks in the order of the stream concatenate to the document. It needs the session bearer.
  rpc ExportAccount(ExportAccountRequest) returns (stream ExportAccountResponse);
}

message GetAccountChainRequest {}

message GetAccountChainResponse {
  // chain is the signed device chain, the longest the server stores.
  bytes chain = 1;
}

message GetAccountChainByRootRequest {
  // challenge_id is the id of a challenge asked with the root key as device_sign_key.
  bytes challenge_id = 1;
  // root_sign_key is the Ed25519 public key of the recovery signing key, 32 bytes.
  bytes root_sign_key = 2;
  // signature is 64 bytes over syncprotocol.GetChainReadMessage, plain Ed25519 by the recovery key.
  bytes signature = 3;
}

message GetAccountChainByRootResponse {
  // found is false when no account has this root.
  bool found = 1;
  // chain is set when found.
  bytes chain = 2;
}

message AppendChainRequest {
  // chain is the chain to store, whole.
  bytes chain = 1;
}

message AppendChainResponse {
  bool accepted = 1;
  // chain is the stored head after the call.
  bytes chain = 2;
}

// ChainStale is the detail of FAILED_PRECONDITION when the presented chain does not extend the stored one.
message ChainStale {
  // chain is the stored head.
  bytes chain = 1;
}

// DeviceRevoked is the detail of the UNAUTHENTICATED answer to a sign-in of a device that proved its key but is not
// active in the stored chain of its account.
message DeviceRevoked {
  // chain is the stored chain.
  bytes chain = 1;
}

message DeleteAccountRequest {
  // challenge_id is the id of a challenge asked with the device key of the session as device_sign_key.
  bytes challenge_id = 1;
  // signature is 64 bytes over syncprotocol.GetAccountDeleteMessage, by the device key of the session.
  bytes signature = 2;
}

message DeleteAccountResponse {
  // delete_at is the Unix time in seconds after which the server deletes the account for good.
  int64 delete_at = 1;
}

message ExportAccountRequest {}

message ExportAccountResponse {
  // data is the next part of a UTF-8 JSON document that lists the device chain, the devices, the vaults, the metadata
  // and sizes of the revisions, and the plan and payment references of the account. It holds no key and no text of
  // a note. A chunk is at most 256 KiB and may end inside a JSON token.
  bytes data = 1;
}
