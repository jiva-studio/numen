syntax = "proto3";

// What a client may ask about the vaults an installation holds.
//
// A vault is one entry on a list: a folder this installation knows about, by
// the identity that folder carries. What is inside one is vault.proto, which
// answers about the vault a client is looking at.
package numen.v1;

import "numen/v1/shared.proto";

option go_package = "github.com/jiva-studio/numen/libs/shared/protocol/gen/numen/v1;numenv1";

// VaultsService answers about the vaults this installation holds, and changes
// the list. The window serves it, and so does the host endpoint to the plugins
// that call it: there a call needs vault:read to list and vault:manage to
// change, the request names no window, and a call that asks to trash the
// folder of a vault is an error.
service VaultsService {
  // ListVaults is every vault the installation holds. Which of them a window is
  // showing is asked of that window.
  rpc ListVaults(ListVaultsRequest) returns (ListVaultsResponse);

  // AddVault turns a folder into a vault and puts it on the list. The folder is
  // given an identity that stays with it, and is the same vault wherever it
  // moves to.
  rpc AddVault(AddVaultRequest) returns (AddVaultResponse);

  // RenameVault is what a person calls a vault. The folder keeps the name the
  // filesystem gives it.
  rpc RenameVault(RenameVaultRequest) returns (RenameVaultResponse);

  // RemoveVault takes a vault off the list and out of the index. The folder
  // keeps its position unless the request asks for it, and adding it back
  // brings back the same vault.
  rpc RemoveVault(RemoveVaultRequest) returns (RemoveVaultResponse);

  // OpenVault shows another vault in this window. What the window was showing
  // is released, and callers re-query the new vault.
  rpc OpenVault(OpenVaultRequest) returns (OpenVaultResponse);
}

// Vault is one vault the installation holds, as the list has it.
message Vault {
  // Id is the identity the folder carries, and how this vault is asked for
  // again. It survives the folder moving and the vault being renamed.
  string id = 1;

  // Name is what the person calls the collection. It lives on the list and not
  // in the folder.
  string name = 2;

  // Path is the folder, absolute on this machine.
  string path = 3;

  // Set when nothing is at the path. The vault stays on the list, and the
  // folder is found again if it returns.
  bool is_missing = 4;

  // managed_by is the id of the plugin that alone writes this vault; empty for a vault anyone may write.
  string managed_by = 5;
}

message ListVaultsRequest {}

// ListVaultsResponse is the list itself, which is the same for every window.
message ListVaultsResponse {
  repeated Vault vaults = 1;
}

message AddVaultRequest {
  // The folder to add, absolute on this machine.
  string path = 1;

  // What to call the vault. Empty takes the folder's own name, and a name
  // another vault has gets a number appended.
  string name = 2;

  // managed_by makes the vault one that only the plugin with this id writes. It is honored on the host endpoint only,
  // where it must equal the id of the plugin of the token and the plugin needs vault:manage; a window request ignores it.
  string managed_by = 3;
}

message AddVaultResponse {
  // The vault that joined the list. Absent when nothing was added.
  optional Vault vault = 1;

  ErrorCode error = 2;

  // The core's error text of a rejected call, set on the host endpoint; empty on success and in a window.
  string detail = 3;
}

message RenameVaultRequest {
  string id = 1;
  string name = 2;
}

message RenameVaultResponse {
  // The vault under its new name. Absent when it was not renamed. The name a
  // vault already has is not a change and answers with the unchanged vault.
  optional Vault vault = 1;

  ErrorCode error = 2;

  // The core's error text of a rejected call, set on the host endpoint; empty on success and in a window.
  string detail = 3;
}

message RemoveVaultRequest {
  string id = 1;

  // Moves the vault folder to the system trash. A folder no longer carrying
  // this vault's identity is left untouched and the vault stays on the list.
  bool is_folder_trashed = 2;
}

message RemoveVaultResponse {
  // Set when the vault is still on the list, and why. The folder is where it
  // was.
  ErrorCode error = 1;

  // The core's error text of a rejected call, set on the host endpoint; empty on success and in a window.
  string detail = 2;

  // The folder of the vault, which stays on the disk; set on the host endpoint.
  string path = 3;
}

message OpenVaultRequest {
  string id = 1;
}

message OpenVaultResponse {
  ErrorCode error = 1;

  // The core's error text of a rejected call, set on the host endpoint; empty on success and in a window.
  string detail = 2;
}
