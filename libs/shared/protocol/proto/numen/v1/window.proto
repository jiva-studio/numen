syntax = "proto3";

// What a client may ask about the window it is drawn in.
//
// A window is not a vault: the editor and the window a person runs their cards
// in are open at once, and which vault each has in front of the person, what
// each runs, and what has to be saved before it closes, are its own. Every question here names the window it is about.
package numen.v1;

option go_package = "github.com/jiva-studio/numen/libs/shared/protocol/gen/numen/v1;numenv1";

// WindowService answers about one window: what it has in front of the person,
// what tasks it runs, and what unsaved work a caller has when it closes.
service WindowService {
  // WatchTasks streams the tasks the window runs, for as long as the caller listens:
  // the title, subject and progress of each.
  //
  // The whole list is sent on every change, and the first list is sent at once.
  // It is a stream because tasks can start without a request from the window.
  rpc WatchTasks(WatchTasksRequest) returns (stream WatchTasksResponse);

  // WatchWindowClose streams a message when the window is about to close. A caller
  // holding unsaved work in memory saves it, then calls ReportPendingWork.
  rpc WatchWindowClose(WatchWindowCloseRequest) returns (stream WatchWindowCloseResponse);

  // ReportPendingWork reports whether a caller still has unsaved work. The window
  // closes when no caller has any, and stays open while a person is being asked
  // about the work.
  rpc ReportPendingWork(ReportPendingWorkRequest) returns (ReportPendingWorkResponse);

  // GetCurrentVault is which vault this window has in front of the person. Two
  // windows are open on one installation and each shows what it shows, so it is
  // the window that is asked and not the list of vaults.
  rpc GetCurrentVault(GetCurrentVaultRequest) returns (GetCurrentVaultResponse);

  // CancelTask stops one task that WatchTasks lists as cancellable. The task
  // stays in the list until its work has stopped, and WatchTasks then reports
  // the list without it. A task that is not listed, or cannot be cancelled,
  // answers NOT_FOUND.
  rpc CancelTask(CancelTaskRequest) returns (CancelTaskResponse);
}

message WatchTasksRequest {
  // The window this is asked of. A question naming another window than the one
  // answering it is not answered.
  string window_id = 1;
}

message WatchTasksResponse {
  // Everything being done now, in the order the work began. The list arrives
  // whole, because what is being done is a list and not a set of differences to
  // apply.
  repeated Task tasks = 1;
}

// A Task is one piece of work the application runs for the window. Every kind of
// work is a Task, so a new kind adds an entry to the list and no new field.
message Task {
  // Id identifies the work. A task reported again with the same id replaces the
  // earlier one.
  string id = 1;

  // Title names the work. Detail names what it is on, and is empty for work with
  // no particular subject.
  string title = 2;
  string detail = 3;

  // Progress of the work: completed_count out of total_count. Both zero means the
  // work runs with nothing to count.
  int64 completed_count = 4;
  int64 total_count = 5;

  // The reason the work failed. Empty when it did not fail.
  string failure_reason = 6;

  // Set for work a person started and is waiting on.
  bool is_user_started = 7;

  // Unit is what done and total are counted in.
  Unit unit = 8;

  // The plugin that reported the task, as the core knows the caller, and its
  // name from the manifest. Both are empty for the core's own work.
  string plugin_id = 9;
  string plugin_name = 10;

  // Set for work that CancelTask can stop.
  bool is_cancellable = 11;

  // Kind says what the entry is: work, or a message of the core.
  TaskKind kind = 12;
}

// TaskKind is what an entry of the list of tasks is.
enum TaskKind {
  // Work that runs, stops, or fails.
  TASK_KIND_UNSPECIFIED = 0;

  // A message of the core, such as a notice of the read of the settings. It is
  // neither running nor failed, and detail holds the message.
  TASK_KIND_NOTICE = 1;
}

// Unit is what a piece of work counts. Bytes are read out in the sizes a
// person reads them in, seconds as a length of time, and everything else is
// counted one by one.
enum Unit {
  UNIT_UNSPECIFIED = 0;
  UNIT_THINGS = 1;
  UNIT_BYTES = 2;

  // A stretch of a recording, read out as a length of time.
  UNIT_SECONDS = 3;
}

message WatchWindowCloseRequest {
  // The window this is asked of. A question naming another window than the one
  // answering it is not answered.
  string window_id = 1;
}

message WatchWindowCloseResponse {
  // What this caller answers ReportPendingWork with. The stream opens by saying it, so
  // a caller knows it is listening before anything is asked of it.
  string token = 1;

  // Set when this caller has unsaved work that has to be saved before the window closes.
  bool is_flush_required = 2;
}

// FlushResult is what a caller has left when it answers.
enum FlushResult {
  FLUSH_RESULT_UNSPECIFIED = 0;

  // Nothing is left. The caller held nothing of its own.
  FLUSH_RESULT_NOTHING = 1;

  // Everything this caller held is written.
  FLUSH_RESULT_WRITTEN = 2;

  // Something this caller holds could not be written, and a person is being
  // asked what to do with it. The window stays until they answer.
  FLUSH_RESULT_UNSAVED = 3;
}

message ReportPendingWorkRequest {
  // The window this is asked of. A question naming another window than the one
  // answering it is not answered.
  string window_id = 1;

  // The token this caller was given when it began listening.
  string token = 2;

  // What this caller has left. A request naming none has said nothing, and is
  // waited for the way one that never answered is waited for.
  FlushResult result = 3;
}

message ReportPendingWorkResponse {}

message GetCurrentVaultRequest {
  // The window this is asked of. A question naming another window than the one
  // answering it is not answered.
  string window_id = 1;
}

message GetCurrentVaultResponse {
  // The identity the list of vaults holds that vault under. Empty in a window
  // showing none, and in one that is open on the installation and not on
  // any one vault.
  string vault_id = 1;
}

message CancelTaskRequest {
  // The window this is asked of. A question naming another window than the one
  // answering it is not answered.
  string window_id = 1;

  // The id that WatchTasks lists the task under.
  string id = 2;
}

message CancelTaskResponse {}
