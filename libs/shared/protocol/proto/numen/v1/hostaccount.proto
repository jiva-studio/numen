syntax = "proto3";

package numen.v1;

option go_package = "github.com/jiva-studio/numen/libs/shared/protocol/gen/numen/v1;numenv1";

// HostAccountService serves the identity of this device to the plugins. The host identifies the plugin
// by its token, and every call needs the permission identity. No call returns or accepts a secret key.
//
// A device with no identity answers FAILED_PRECONDITION with an ErrorInfo detail whose reason is
// NO_IDENTITY.
service HostAccountService {
  // SignAsDevice signs the message with the key of this device. The signed bytes are
  // "numen/v1/plugin-sign/", the id of the plugin of the token, a zero byte and the message.
  rpc SignAsDevice(SignAsDeviceRequest) returns (SignAsDeviceResponse);

  // GetPublicIdentity returns what is public of the identity of this device.
  rpc GetPublicIdentity(GetPublicIdentityRequest) returns (GetPublicIdentityResponse);

  // SealData encrypts the data under a key only the plugin of the token can derive from the account keys
  // of this device. The context is bound into the sealed bytes. Plain is at most 32 KiB.
  rpc SealData(SealDataRequest) returns (SealDataResponse);

  // OpenData decrypts bytes that SealData sealed for the plugin of the token and the same context, on any
  // device of the account. Bytes that do not open answer FAILED_PRECONDITION with the reason CANNOT_OPEN.
  rpc OpenData(OpenDataRequest) returns (OpenDataResponse);

  // GetPendingRestore returns the public keys of a restore that waits for the account chain of the server.
  rpc GetPendingRestore(GetPendingRestoreRequest) returns (GetPendingRestoreResponse);

  // SignAsRecovery signs the message with the recovery key of the pending restore. The signed bytes are
  // "numen/v1/recovery-sign/", the id of the plugin of the token, a zero byte and the message. Nothing
  // pending answers FAILED_PRECONDITION with the reason NO_PENDING_RESTORE.
  rpc SignAsRecovery(SignAsRecoveryRequest) returns (SignAsRecoveryResponse);

  // CompleteRestore finishes the pending restore with the chain the server stores for the account, or
  // with no chain when the server has no such account. A chain that does not verify or does not belong to
  // the words answers INVALID_ARGUMENT with the reason INVALID_CHAIN.
  rpc CompleteRestore(CompleteRestoreRequest) returns (CompleteRestoreResponse);

  // GetEntitlements returns the products the account of this device owns right now, as the sync server of the account tells it:
  // the slug, the end of validity, the phase and the quota (0 for a product without one). A device with no identity answers
  // FAILED_PRECONDITION with the reason NO_IDENTITY, and a host that cannot reach the server answers UNAVAILABLE.
  rpc GetEntitlements(GetEntitlementsRequest) returns (GetEntitlementsResponse);
}

message SignAsDeviceRequest {
  // message is 1 to 4096 bytes.
  bytes message = 1;
}

message SignAsDeviceResponse {
  // signature is an Ed25519 signature of 64 bytes.
  bytes signature = 1;
}

message GetPublicIdentityRequest {}

message GetPublicIdentityResponse {
  // account_fingerprint is written in groups of four hexadecimal digits.
  string account_fingerprint = 1;
  string device_fingerprint = 2;
  // device_sign_key is the Ed25519 public key of the device, 32 bytes.
  bytes device_sign_key = 3;
  // chain is the signed device chain of the account.
  bytes chain = 4;
}

message SealDataRequest {
  // context is bound into the sealed bytes; the same context opens them. The plugin chooses it.
  bytes context = 1;
  // plain is 0 to 32768 bytes.
  bytes plain = 2;
}

message SealDataResponse {
  bytes sealed = 1;
}

message OpenDataRequest {
  bytes context = 1;
  bytes sealed = 2;
}

message OpenDataResponse {
  bytes plain = 1;
}

message GetPendingRestoreRequest {}

message GetPendingRestoreResponse {
  bool is_pending = 1;
  // root_sign_key is the Ed25519 public key of the recovery signing key, 32 bytes.
  bytes root_sign_key = 2;
  // device_sign_key is the Ed25519 public key of the device that joins, 32 bytes.
  bytes device_sign_key = 3;
}

message SignAsRecoveryRequest {
  // message is 1 to 4096 bytes.
  bytes message = 1;
}

message SignAsRecoveryResponse {
  // signature is an Ed25519 signature of 64 bytes.
  bytes signature = 1;
}

message CompleteRestoreRequest {
  // chain is the signed device chain of the server; empty when the server has no such account.
  bytes chain = 1;
}

message CompleteRestoreResponse {}

message GetEntitlementsRequest {}

message HostEntitlement {
  // product is the slug of the product, such as link.
  string product = 1;
  // valid_until is unix seconds.
  int64 valid_until = 2;
  // phase is "active" or "grace".
  string phase = 3;
  // quota_bytes is 0 for a product without a quota.
  uint64 quota_bytes = 4;
  bool is_trial = 5;
}

message GetEntitlementsResponse {
  repeated HostEntitlement entitlements = 1;
}
