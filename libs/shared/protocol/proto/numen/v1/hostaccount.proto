syntax = "proto3";

package numen.v1;

option go_package = "github.com/jiva-studio/numen/libs/shared/protocol/gen/numen/v1;numenv1";

// HostAccountService serves the identity of this device to the plugins. The host identifies the plugin
// by its token, and every call needs the permission identity. No call returns or accepts a secret key.
//
// A device with no identity answers FAILED_PRECONDITION with an ErrorInfo detail whose reason is
// NO_IDENTITY.
service HostAccountService {
  // SignAsDevice signs the message with the key of this device. The signed bytes are
  // "numen/v1/plugin-sign/", the id of the plugin of the token, a zero byte and the message.
  rpc SignAsDevice(SignAsDeviceRequest) returns (SignAsDeviceResponse);

  // GetPublicIdentity returns what is public of the identity of this device.
  rpc GetPublicIdentity(GetPublicIdentityRequest) returns (GetPublicIdentityResponse);

  // SealData encrypts the data under a key only the plugin of the token can derive from the account keys
  // of this device. The context is bound into the sealed bytes. Plain is at most 32 KiB.
  rpc SealData(SealDataRequest) returns (SealDataResponse);

  // OpenData decrypts bytes that SealData sealed for the plugin of the token and the same context, on any
  // device of the account. Bytes that do not open answer FAILED_PRECONDITION with the reason CANNOT_OPEN.
  rpc OpenData(OpenDataRequest) returns (OpenDataResponse);

  // OpenSealedBox opens a box that identity.SealToAccountBox sealed to the account box key of this device, for the
  // plugin of the token and the same context. The secret key stays in the host. Bytes that do not open answer
  // FAILED_PRECONDITION with the reason CANNOT_OPEN.
  rpc OpenSealedBox(OpenSealedBoxRequest) returns (OpenSealedBoxResponse);

  // GetPendingRestore returns the public keys of a restore that waits for the account chain of the server.
  rpc GetPendingRestore(GetPendingRestoreRequest) returns (GetPendingRestoreResponse);

  // SignAsRecovery signs the message with the recovery key of the pending restore. The signed bytes are
  // "numen/v1/recovery-sign/", the id of the plugin of the token, a zero byte and the message. Nothing
  // pending answers FAILED_PRECONDITION with the reason NO_PENDING_RESTORE.
  rpc SignAsRecovery(SignAsRecoveryRequest) returns (SignAsRecoveryResponse);

  // CompleteRestore finishes the pending restore with the chain the server stores for the account, or
  // with no chain when the server has no such account. A chain that does not verify or does not belong to
  // the words answers INVALID_ARGUMENT with the reason INVALID_CHAIN.
  rpc CompleteRestore(CompleteRestoreRequest) returns (CompleteRestoreResponse);

  // GetLinkWork returns what the courier of a link carries: the channel to make or use, the blobs to post to
  // the other side and whether the link ended. It returns at once when the version differs from since_version,
  // otherwise after wait_seconds (at most 20) or the next change.
  rpc GetLinkWork(GetLinkWorkRequest) returns (GetLinkWorkResponse);

  // SetLinkChannel gives the link the channel the courier made on the relay, 16 bytes.
  rpc SetLinkChannel(SetLinkChannelRequest) returns (SetLinkChannelResponse);

  // PutLinkInbound hands the core a blob the other side posted. No link answers FAILED_PRECONDITION with the
  // reason NO_LINK.
  rpc PutLinkInbound(PutLinkInboundRequest) returns (PutLinkInboundResponse);

  // GetChainPublish returns the chain the core waits to have accepted by the server.
  rpc GetChainPublish(GetChainPublishRequest) returns (GetChainPublishResponse);

  // PutChainPublished tells the core the answer of the server to the chain it published.
  rpc PutChainPublished(PutChainPublishedRequest) returns (PutChainPublishedResponse);

  // AdoptChain gives the core a chain the server holds. A chain that does not parse or does not extend the chain
  // of this device answers INVALID_ARGUMENT with the reason INVALID_CHAIN.
  rpc AdoptChain(AdoptChainRequest) returns (AdoptChainResponse);
}

message SignAsDeviceRequest {
  // message is 1 to 4096 bytes.
  bytes message = 1;
}

message SignAsDeviceResponse {
  // signature is an Ed25519 signature of 64 bytes.
  bytes signature = 1;
}

message GetPublicIdentityRequest {}

message GetPublicIdentityResponse {
  // account_fingerprint is written in groups of four hexadecimal digits.
  string account_fingerprint = 1;
  string device_fingerprint = 2;
  // device_sign_key is the Ed25519 public key of the device, 32 bytes.
  bytes device_sign_key = 3;
  // chain is the signed device chain of the account.
  bytes chain = 4;
  // key_epoch is the epoch of the account keys of this device, 0 until a device is revoked.
  uint32 key_epoch = 5;
  // chain_length is the number of entries of chain.
  uint32 chain_length = 6;
  // is_revoked is true when the account revoked this device.
  bool is_revoked = 7;
}

message SealDataRequest {
  // context is bound into the sealed bytes; the same context opens them. The plugin chooses it.
  bytes context = 1;
  // plain is 0 to 32768 bytes.
  bytes plain = 2;
}

message SealDataResponse {
  bytes sealed = 1;
}

message OpenDataRequest {
  bytes context = 1;
  bytes sealed = 2;
}

message OpenDataResponse {
  bytes plain = 1;
}

message OpenSealedBoxRequest {
  bytes context = 1;
  // sealed is 0 to 1024 bytes.
  bytes sealed = 2;
}

message OpenSealedBoxResponse {
  bytes plain = 1;
}

message GetPendingRestoreRequest {}

message GetPendingRestoreResponse {
  bool is_pending = 1;
  // root_sign_key is the Ed25519 public key of the recovery signing key, 32 bytes.
  bytes root_sign_key = 2;
  // device_sign_key is the Ed25519 public key of the device that joins, 32 bytes.
  bytes device_sign_key = 3;
}

message SignAsRecoveryRequest {
  // message is 1 to 4096 bytes.
  bytes message = 1;
}

message SignAsRecoveryResponse {
  // signature is an Ed25519 signature of 64 bytes.
  bytes signature = 1;
}

message CompleteRestoreRequest {
  // chain is the signed device chain of the server; empty when the server has no such account.
  bytes chain = 1;
}

message CompleteRestoreResponse {}

message GetLinkWorkRequest {
  uint64 since_version = 1;
  // wait_seconds is at most 20.
  uint32 wait_seconds = 2;
}

message GetLinkWorkResponse {
  uint64 version = 1;
  bool is_active = 2;
  // wants_channel is true when the displayer waits for a channel id from the relay.
  bool wants_channel = 3;
  // channel_id is 16 bytes once known.
  bytes channel_id = 4;
  // server is the origin from the QR code, empty for the default server.
  string server = 5;
  // outbound holds the blobs to post to the other side, in order, until a call names a later version.
  repeated bytes outbound = 6;
  // is_closed is true when the link ended: close the channel.
  bool is_closed = 7;
}

message SetLinkChannelRequest {
  bytes channel_id = 1;
}

message SetLinkChannelResponse {}

message PutLinkInboundRequest {
  bytes blob = 1;
}

message PutLinkInboundResponse {}

message GetChainPublishRequest {}

message GetChainPublishResponse {
  bool is_pending = 1;
  bytes chain = 2;
}

message PutChainPublishedRequest {
  bool accepted = 1;
  // latest is the chain the server holds, set when it did not accept the chain because another device appended first.
  bytes latest = 2;
}

message PutChainPublishedResponse {}

message AdoptChainRequest {
  bytes chain = 1;
}

message AdoptChainResponse {}
