syntax = "proto3";

package numen.v1;

option go_package = "github.com/jiva-studio/numen/libs/shared/protocol/gen/numen/v1;numenv1";

// FolderDialogService is this machine's own folder dialog, in front of the person using the window.
service FolderDialogService {
  // ChooseFolder puts this machine's own folder dialog in front of the person
  // and answers with the folder they chose. A person who closes the dialog has
  // chosen nothing, and the answer says so.
  rpc ChooseFolder(ChooseFolderRequest) returns (ChooseFolderResponse);

  // SaveTextFile puts this machine's own save dialog in front of the person and writes the text to
  // the file they chose. A person who closes the dialog has saved nothing, and the answer says so.
  rpc SaveTextFile(SaveTextFileRequest) returns (SaveTextFileResponse);
}

message SaveTextFileRequest {
  // What the dialog is titled. Empty takes the words the application chooses.
  string title = 1;

  // The name the dialog proposes, with its extension.
  string file_name = 2;

  // The extension the dialog offers files of, with its dot, such as ".json". Empty offers every file.
  string extension = 3;

  // What the file holds.
  string content = 4 [debug_redact = true];
}

message SaveTextFileResponse {
  // The file that was written, empty when none was.
  string path = 1;

  // Set when the person chose a file and the text is in it. False is a dialog they closed, which is
  // an ordinary answer.
  bool is_saved = 2;
}

message ChooseFolderRequest {
  // What the dialog is titled. Empty takes the words the application chooses.
  string title = 1;

  // The folder the dialog opens in. Empty opens wherever this machine opens a
  // dialog that received nothing.
  string start_folder = 2;
}

message ChooseFolderResponse {
  // The folder that was chosen, empty when none was.
  string path = 1;

  // Set when the person chose a folder. False is a dialog they closed, which
  // is an ordinary answer.
  bool is_chosen = 2;
}
