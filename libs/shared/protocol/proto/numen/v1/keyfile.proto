syntax = "proto3";

package numen.v1;

option go_package = "github.com/jiva-studio/numen/libs/shared/protocol/gen/numen/v1;numenv1";

// KeyFileService is where this computer keeps the keys of the account when it has no system keychain:
// in a file, protected by a passphrase or left as plain text. The passphrase crosses the wire only in
// the calls that take it; the core keeps it in memory and never writes it down.
service KeyFileService {
  // GetKeyFileState reports whether the keys are kept in a file and how.
  rpc GetKeyFileState(GetKeyFileStateRequest) returns (GetKeyFileStateResponse);

  // ChooseKeyFile sets how the file keeps the keys and remembers the choice for the next start.
  rpc ChooseKeyFile(ChooseKeyFileRequest) returns (ChooseKeyFileResponse);

  // UnlockKeyFile gives the passphrase of the file for this run. It is asked once at each start.
  rpc UnlockKeyFile(UnlockKeyFileRequest) returns (UnlockKeyFileResponse);
}

// KeyFileMode is how the file keeps the keys.
enum KeyFileMode {
  KEY_FILE_MODE_UNSPECIFIED = 0;
  // KEY_FILE_MODE_UNSET is a computer where the person has not chosen yet.
  KEY_FILE_MODE_UNSET = 1;
  KEY_FILE_MODE_PLAINTEXT = 2;
  KEY_FILE_MODE_PASSPHRASE = 3;
}

// KeyFileErrorCode is why a key file call was refused. The zero value is a call that succeeded.
enum KeyFileErrorCode {
  KEY_FILE_ERROR_CODE_UNSPECIFIED = 0;
  // KEY_FILE_ERROR_CODE_WRONG_PASSPHRASE is a passphrase that does not open the file.
  KEY_FILE_ERROR_CODE_WRONG_PASSPHRASE = 1;
  // KEY_FILE_ERROR_CODE_EMPTY_PASSPHRASE is a passphrase of no characters, or a choice of a passphrase
  // that gives none.
  KEY_FILE_ERROR_CODE_EMPTY_PASSPHRASE = 2;
  // KEY_FILE_ERROR_CODE_SAVE_FAILED is a choice the core could not keep for the next start.
  KEY_FILE_ERROR_CODE_SAVE_FAILED = 3;
  // KEY_FILE_ERROR_CODE_INVALID_MODE is a choice of a mode that cannot be chosen.
  KEY_FILE_ERROR_CODE_INVALID_MODE = 4;
}

message GetKeyFileStateRequest {}

message GetKeyFileStateResponse {
  // is_in_use is false where the system keychain works: nothing is asked then.
  bool is_in_use = 1;
  KeyFileMode mode = 2;
  // is_choice_needed is true while the file is in use and the person has not chosen how it keeps keys.
  bool is_choice_needed = 3;
  // is_locked is true while the file is protected by a passphrase this run has not been given.
  bool is_locked = 4;
  // warning is plain text for the person, empty when there is nothing to warn about.
  string warning = 5;
}

message ChooseKeyFileRequest {
  // mode is KEY_FILE_MODE_PLAINTEXT or KEY_FILE_MODE_PASSPHRASE.
  KeyFileMode mode = 1;
  // passphrase is the passphrase of KEY_FILE_MODE_PASSPHRASE and is empty for the other mode.
  string passphrase = 2 [debug_redact = true];
}

message ChooseKeyFileResponse {
  KeyFileErrorCode error = 1;
}

message UnlockKeyFileRequest {
  string passphrase = 1 [debug_redact = true];
}

message UnlockKeyFileResponse {
  KeyFileErrorCode error = 1;
}
