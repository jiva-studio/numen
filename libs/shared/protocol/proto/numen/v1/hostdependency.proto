syntax = "proto3";

package numen.v1;

import "numen/v1/shared.proto";

option go_package = "github.com/jiva-studio/numen/libs/shared/protocol/gen/numen/v1;numenv1";

// HostDependencyService provisions files that a plugin selects while running.
service HostDependencyService {
  // FetchModelFile returns the cached path of the selected file.
  rpc FetchModelFile(FetchModelFileRequest) returns (FetchModelFileResponse);
}

message FetchModelFileRequest {
  string url = 1;
  // An optional pin. An empty value trusts the HTTPS source on the first download.
  string sha256 = 2;
}

message FetchModelFileResponse {
  string path = 1;
  // Error text preserved on wire tag 2 for compatibility with protocol v1 plugin binaries.
  string detail = 2;
  ErrorCode error = 3;
}
