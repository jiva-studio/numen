syntax = "proto3";

// SearchService answers name queries (SearchNames) and text queries (SearchText).
package numen.v1;

import "numen/v1/note.proto";
import "numen/v1/shared.proto";

option go_package = "github.com/jiva-studio/numen/libs/shared/protocol/gen/numen/v1;numenv1";

// SearchService answers what a vault holds that matches what was typed.
service SearchService {
  // SearchNames is the names in a vault that match what was typed: a note's own
  // title, and the headings inside notes. It is asked as a person types, and
  // the last word matches on its prefix.
  //
  // It reads names and nothing else. Searching the text a vault holds is
  // SearchText, and that answers with search results.
  rpc SearchNames(SearchNamesRequest) returns (SearchNamesResponse);

  // SearchText is the text a vault holds that answers what was typed, by
  // the words in it or by what it means or by what a section is called. On the
  // window endpoint the caller names a mode; on the host endpoint it runs the
  // hybrid search and requires index:read.
  rpc SearchText(SearchTextRequest) returns (SearchTextResponse);

  // CancelSearch stops the SearchNames or SearchText call that carries the
  // search id. A client that aborts its request does not stop the call in the
  // core, so it sends this to free the work the call still does. A cancel that
  // arrives before its call is kept for a few seconds and cancels the call if
  // the call arrives in that time.
  rpc CancelSearch(CancelSearchRequest) returns (CancelSearchResponse);
}

message SearchNamesRequest {
  // What was typed, as it was typed. Words are matched together, and the last
  // of them on its prefix.
  string query = 1;

  // How many names to answer with. Zero takes the number the vault chooses.
  int32 limit = 2;

  // The id CancelSearch names this call by, chosen by the client and unique
  // among its calls. Empty when the call cannot be cancelled.
  string search_id = 3;
}

message SearchNamesResponse {
  // The names that matched, best first, with a note's own title before a
  // heading inside one.
  repeated NameMatch matches = 1;
}

// NameMatch is one name that matched, and the note it stands for. When no
// heading is set, the note's own title matched.
message NameMatch {
  Note note = 1;

  // The heading that matched, absent when the note's own title did.
  optional Heading heading = 2;

  // Where in that name the words stand, counted the way a client counts text:
  // in UTF-16 code units.
  // A word reached by its prefix is marked whole.
  repeated Range ranges = 3;

  // The `type` key of the note's frontmatter, so a client draws a note as what it is.
  string type = 4;

  // The kind of tab the note opens in, chosen as FileKind.tab_kind is. Empty
  // where none holds.
  string tab_kind = 5;
}

// SearchMode is how a search is asked. Each mode is an order of its own, and a
// hybrid search fuses them into one.
enum SearchMode {
  SEARCH_MODE_UNSPECIFIED = 0;

  // The words typed, matched as words.
  SEARCH_MODE_WORDS = 1;

  // What the words mean, matched against the vectors the index holds. A vault
  // nothing has embedded answers with nothing.
  SEARCH_MODE_MEANING = 2;

  // The names of the sections a source divides into. A hit is the section, and
  // it answers at its own beginning.
  SEARCH_MODE_NAMES = 3;

  // Every one of them, fused into one ranking.
  SEARCH_MODE_HYBRID = 4;
}

message SearchTextRequest {
  string query = 1;

  // How many search results to answer with. Zero takes the number the vault chooses.
  int32 limit = 2;

  SearchMode mode = 3;

  // The id CancelSearch names this call by, chosen by the client and unique
  // among its calls. Empty when the call cannot be cancelled.
  string search_id = 4;

  // The kinds of source to search, "note" or "file". Empty means every kind.
  repeated string kinds = 5;

  // Limits the search to the sources whose path starts with it, relative to the
  // vault, in either Unicode form (NFC or NFD). The index applies it, so the
  // limit counts search results under the prefix. Empty means the whole vault.
  string path_prefix = 6;

  // Maximum search results of one source. Zero or less takes the endpoint default;
  // above the limit means the limit.
  int32 results_per_source = 7;
}

message CancelSearchRequest {
  string search_id = 1;
}

message CancelSearchResponse {}

message SearchTextResponse {
  // The search results that answer, best first.
  repeated SearchResult results = 1;

  ErrorCode error = 2;
}

// SearchResult is what a search returns: the text around a hit, and where it came
// from.
message SearchResult {
  // The file the text was read out of, as the vault calls it.
  string path = 1;

  // The note the text was read out of, absent for a source that is not one.
  // A window that opens notes offers to open these and no others.
  optional Note note = 2;

  // The stretch of the source that matched, as it reads.
  string text = 3;

  // Where in that text the words typed stand, counted the way a client counts
  // text: in UTF-16 code units. Empty for a hit by meaning, which relies on no
  // word in particular.
  repeated Range match_ranges = 4;

  // What the source's own numbering calls the place, empty when the format
  // offered none.
  string place_label = 5;

  // Byte range of the match in the source. Together with path, it identifies
  // the target location.
  Range byte_range = 6;

  // Where the chunk that matched stands, counted from the first line of the
  // source's prose. It is the line a note opens on, and the caret stands there.
  int32 match_line = 7;

  // The `type` key of the note's frontmatter, so a client draws a note as what it is.
  // Empty for an ordinary note. It says nothing about a source that is not a note.
  string type = 8;

  // The selector of the text version segment the hit is in, as JSON, and empty
  // for a note. It locates the hit in the file; the SDK documents its keys.
  string selector = 10;

  // The kind of tab the note opens in, chosen as FileKind.tab_kind is. Empty
  // where none holds, and for a source that is not a note.
  string tab_kind = 11;


  // note, pdf, epub, audio, video, image or file. Set by HostSearchService.GetSearch.
  string kind = 16;

  // The note title, else the file name without its extension. Set by HostSearchService.GetSearch.
  string title = 17;

  // The score of the result; absent for a file matched by document conditions only. Set by
  // HostSearchService.GetSearch.
  optional double score = 18;

  // The result is a whole file: byte_range is absent and text is the start of the file. Set by
  // HostSearchService.GetSearch.
  bool is_whole_file = 19;
}
