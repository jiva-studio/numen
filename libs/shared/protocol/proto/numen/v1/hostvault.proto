syntax = "proto3";

package numen.v1;

import "numen/v1/shared.proto";

option go_package = "github.com/jiva-studio/numen/libs/shared/protocol/gen/numen/v1;numenv1";

// HostVaultService is the vault itself, as a plugin works it: which vault the
// host shows, the index of a vault, its lock and its checks. The vaults of the
// installation are VaultsService, which the host endpoint serves as well.
//
// The endpoint checks the permission of each call: a call that reads needs
// vault:read and one that changes anything needs vault:write.
//
// Numen-Vault selects the vault by identity; without it a call targets the active vault.
service HostVaultService {
  // GetHostVault names the vault the host is showing. A host showing none answers
  // with the vault unset.
  rpc GetHostVault(GetHostVaultRequest) returns (GetHostVaultResponse);

  // IndexVault starts indexing the vault when it is not indexed yet, and returns the
  // indexing state. Indexing continues after the call returns; the caller calls
  // again after WatchIndexChanges reports a change.
  rpc IndexVault(IndexVaultRequest) returns (IndexVaultResponse);

  // LockVault holds the vault's writers to one caller until UnlockVault, or
  // until the plugin stops. A caller that finds it held waits for it.
  rpc LockVault(LockVaultRequest) returns (LockVaultResponse);

  rpc UnlockVault(UnlockVaultRequest) returns (UnlockVaultResponse);

  // ListParseProblems lists what parsing each file of the vault turned up.
  rpc ListParseProblems(ListParseProblemsRequest) returns (ListParseProblemsResponse);

  // ListVaultProblems runs the named checks of the vault (parse, frontmatter,
  // ambiguous, dangling), or every check that is not opt-in when none is named.
  // It needs vault:read.
  rpc ListVaultProblems(ListVaultProblemsRequest) returns (ListVaultProblemsResponse);

  // WatchIndexChanges streams a message when any vault of the installation changes,
  // until the caller disconnects. A message does not say what changed. The first
  // message is sent at once, to confirm the watch is active.
  rpc WatchIndexChanges(WatchIndexChangesRequest) returns (stream WatchIndexChangesResponse);

  // PutAbsentFiles lists files whose bytes are not on this device, replacing the entry of each path.
  // The tree shows them and a read of one fails with FILE_ABSENT. A path with a file of another
  // content hash is refused. It needs vault:write.
  rpc PutAbsentFiles(PutAbsentFilesRequest) returns (PutAbsentFilesResponse);

  // ListAbsentFiles lists the files put absent in the vault. It needs vault:read.
  rpc ListAbsentFiles(ListAbsentFilesRequest) returns (ListAbsentFilesResponse);

  // FillFile places the bytes of a file of the plugin's store folder at an absent path, once their
  // SHA-256 equals the hash of the entry. It writes no file change event the plugin would upload.
  // It needs vault:write.
  rpc FillFile(FillFileRequest) returns (FillFileResponse);

  // EvictFile deletes the bytes of a file whose SHA-256 equals the expected hash and lists the file as
  // absent. It writes no removal event and no trash entry. A file of another hash is refused with
  // CHANGED. It needs vault:write.
  rpc EvictFile(EvictFileRequest) returns (EvictFileResponse);
}

enum HostIndexState {
  HOST_INDEX_STATE_UNSPECIFIED = 0;
  // The index carries the vault.
  HOST_INDEX_STATE_INDEXED = 1;
  // The vault is being read into the index.
  HOST_INDEX_STATE_INDEXING = 2;
  // Reading the vault into the index failed, and the reason is on the response.
  HOST_INDEX_STATE_FAILED = 3;
}

message IndexVaultRequest {}

message IndexVaultResponse {
  ErrorCode error = 1;
  HostIndexState state = 2;
  string reason = 3;
}

message WatchIndexChangesRequest {}

message WatchIndexChangesResponse {}

message GetHostVaultRequest {}

message GetHostVaultResponse {
  ErrorCode error = 1;
  // The folder the vault is, on this machine.
  string path = 2;
  string id = 3;
  string name = 4;
}

message LockVaultRequest {}

message LockVaultResponse {
  ErrorCode error = 1;
  // The lock to return to UnlockVault.
  string lock = 2;
}

message UnlockVaultRequest {
  string lock = 1;
}

message UnlockVaultResponse {}

message ListParseProblemsRequest {}

message HostParseProblem {
  string path = 1;
  string detail = 2;
}

message ListParseProblemsResponse {
  ErrorCode error = 1;
  repeated HostParseProblem problems = 2;
}

message ListVaultProblemsRequest {
  // The checks to run. Empty runs every check that is not opt-in.
  repeated string checks = 1;
}

// HostVaultProblem is something a check found in a vault.
message HostVaultProblem {
  // The note to open to resolve the problem.
  string path = 1;
  string check = 2;
  string detail = 3;
  // The target of the link the problem is about: its scheme and its value.
  string target_scheme = 4;
  string target_value = 5;
  // The notes an ambiguous link could resolve to.
  repeated string candidates = 6;
}

message ListVaultProblemsResponse {
  ErrorCode error = 1;
  repeated HostVaultProblem problems = 2;
  // The checks this result covers.
  repeated string checks = 3;
}
// HostAbsentFile is a file the vault lists whose bytes are not on this device.
message HostAbsentFile {
  string path = 1;
  int64 size = 2;
  // When the file was last modified, in milliseconds since the Unix epoch.
  int64 modified_unix_ms = 3;
  // The SHA-256 of the content, hex.
  string hash = 4;
}

message PutAbsentFilesRequest {
  repeated HostAbsentFile files = 1;
}

message PutAbsentFilesResponse {
  ErrorCode error = 1;
  // The path that holds a file of another hash, when the call is refused for it.
  string present_path = 2;
}

message ListAbsentFilesRequest {}

message ListAbsentFilesResponse {
  ErrorCode error = 1;
  repeated HostAbsentFile files = 2;
}

message FillFileRequest {
  string path = 1;
  // The file of the plugin's store folder that holds the bytes.
  string store_name = 2;
}

message FillFileResponse {
  ErrorCode error = 1;
}

message EvictFileRequest {
  string path = 1;
  // The SHA-256 the file must have, hex.
  string expected_hash = 2;
}

message EvictFileResponse {
  ErrorCode error = 1;
}
