syntax = "proto3";

// What the vault is and what has changed in it: the questions that are about
// the vault itself and not about anything filed in it. Its files are
// file.proto, its notes note.proto and its text search.proto.
package numen.v1;

import "numen/v1/file.proto";

option go_package = "github.com/jiva-studio/numen/libs/shared/protocol/gen/numen/v1;numenv1";

// VaultService answers what the one vault a client is looking at is, and what
// has changed in it.
service VaultService {
  // GetVaultState is what the vault is and how far indexing it has got.
  rpc GetVaultState(GetVaultStateRequest) returns (GetVaultStateResponse);

  // WatchVaultChanges reports the notes that changed on disk, for as long as
  // the caller listens. It says which notes, and nothing about them: the caller
  // knows what it is showing and asks for what it needs.
  rpc WatchVaultChanges(WatchVaultChangesRequest) returns (stream WatchVaultChangesResponse);
}

message GetVaultStateRequest {}

message GetVaultStateResponse {
  // Id is the identity the folder carries, and how this vault is asked for
  // again. Name is what the person calls it, which is what a window titles
  // itself with. The list says both of a vault the same way.
  string id = 1;
  string name = 2;

  // Absolute path of the vault on disk.
  string path = 3;

  // How far indexing the vault has got.
  Scan scan = 4;
}

// Scan is how far indexing a vault has got, and what stopped it.
message Scan {
  bool is_ready = 1;
  string error = 2;

  // Why the vault is not being followed, when it is not. Changes will only
  // appear when something asks for them again.
  string watch_error = 3;
}

message WatchVaultChangesRequest {}

message WatchVaultChangesResponse {
  // Paths of the files that changed, notes and assets alike. One that was
  // removed is named here too: what changed about it is that it is gone.
  repeated string paths = 1;

  // Set when the vault has to be read again and not followed — more
  // changed at once than could be reported.
  bool is_reload_required = 2;

  // The notes that were renamed by this application, each by where it was and
  // where it now is. A client showing one of them follows it there.
  repeated MoveResult moves = 3;

  // Paths of the files whose text versions changed: a version was made or
  // deleted, or became live or no longer live.
  repeated string version_paths = 4;
}
