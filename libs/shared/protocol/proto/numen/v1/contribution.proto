syntax = "proto3";

package numen.v1;

import "numen/v1/manifest.proto";

option go_package = "github.com/jiva-studio/numen/libs/shared/protocol/gen/numen/v1;numenv1";

// ContributionService is what the enabled plugins contribute to a window besides commands, and what a window
// reads to evaluate the conditions of the contributions.
service ContributionService {
  // ListContributions lists the slot entries, the slot points, the handlers of shared commands and the
  // keybindings of every enabled plugin, each in the order of the plugins' ids and then of each manifest.
  rpc ListContributions(ListContributionsRequest) returns (ListContributionsResponse);

  // ListContentTypes lists the content type of a file by its extension, lowercase and without the dot, for
  // every extension the core knows a type of. The window derives target.contentType from it.
  rpc ListContentTypes(ListContentTypesRequest) returns (ListContentTypesResponse);
}

message ListContributionsRequest {}

message ListContributionsResponse {
  repeated PluginSlotEntry slots = 1;
  repeated PluginHandler handlers = 2;
  repeated PluginKeybinding keybindings = 3;
  repeated PluginSlotPoint slot_points = 4;
}

message ListContentTypesRequest {}

message ListContentTypesResponse {
  map<string, string> content_type_by_extension = 1;
}

// PluginSlotEntry is one entry of contributes.slots of a plugin.
message PluginSlotEntry {
  string plugin_id = 1;
  ManifestSlotEntry entry = 2;
}

// PluginSlotPoint is one entry of contributes.slotPoints of a plugin.
message PluginSlotPoint {
  string plugin_id = 1;
  ManifestSlotPoint point = 2;
}

// PluginKeybinding is one entry of contributes.keybindings of a plugin.
message PluginKeybinding {
  string plugin_id = 1;
  ManifestKeybinding keybinding = 2;
}

// PluginHandler is one entry of contributes.handlers of a plugin. A handler runs with
// RunPluginCommand under the full id of its shared command, and lists its items with
// ListCommandItems.
message PluginHandler {
  string plugin_id = 1;
  ManifestHandler handler = 2;
  // has_items is set for a handler whose when names version.*: it offers the text versions of the
  // file over which it holds.
  bool has_items = 3;
}
