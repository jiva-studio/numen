syntax = "proto3";

package numen.v1;

import "numen/v1/shared.proto";

option go_package = "github.com/jiva-studio/numen/libs/shared/protocol/gen/numen/v1;numenv1";

// HostFileService is the files of the vault, as a plugin reads and writes them
// through the host, so the index, the watcher, the file stats and the trash
// stay up to date with what the plugin did.
//
// The endpoint checks the permission of each call: a call that reads needs
// vault:read and one that changes anything needs vault:write.
//
// Numen-Vault works the vault of that identity instead of the vault the host
// shows.
//
// Every path is relative to the vault root and written with forward slashes.
service HostFileService {
  // StatFile says what a file is now. A file that is not there is
  // returns the error code NOT_FOUND.
  rpc StatFile(StatFileRequest) returns (StatFileResponse);

  // ReadFile reads a whole file, with the file stat it had when it was read.
  rpc ReadFile(ReadFileRequest) returns (ReadFileResponse);

  // WriteFile replaces a file that has not changed since the file stat given.
  // A file changed since returns the error code CONFLICT and
  // nothing is written.
  rpc WriteFile(WriteFileRequest) returns (WriteFileResponse);

  // CreateFile makes a file that is not there yet. A file that is there is
  // answered with the error code ALREADY_EXISTS.
  rpc CreateFile(CreateFileRequest) returns (CreateFileResponse);

  // ScanFiles updates the index for the files named, after the plugin
  // changed them.
  rpc ScanFiles(ScanFilesRequest) returns (ScanFilesResponse);

  // ListFileChanges returns the file change feed of the vault after a cursor:
  // the latest event of each kind of each file, in the order the index stored
  // them. It needs vault:read.
  rpc ListFileChanges(ListFileChangesRequest) returns (ListFileChangesResponse);

  // MoveFile files a file of any kind, or a folder with everything under it,
  // somewhere else in the vault. It needs vault:write.
  rpc MoveFile(HostFileServiceMoveFileRequest) returns (HostFileServiceMoveFileResponse);

  // RemoveFile moves a file, or a folder with everything under it, to the
  // trash of the vault. Nothing is destroyed. It needs vault:write.
  rpc RemoveFile(HostFileServiceRemoveFileRequest) returns (HostFileServiceRemoveFileResponse);

  // ReadFileRange reads bytes of any file as they are. It needs vault:read.
  rpc ReadFileRange(ReadFileRangeRequest) returns (ReadFileRangeResponse);

  // PlaceFile moves a file of the plugin's own store folder to a path of the
  // vault in one atomic rename. It needs vault:write.
  rpc PlaceFile(PlaceFileRequest) returns (PlaceFileResponse);
}

message StatFileRequest {
  string path = 1;
}

message StatFileResponse {
  ErrorCode error = 1;
  FileStat stat = 2;
}

message ReadFileRequest {
  string path = 1;
  // The start of a ranged read, in bytes.
  int64 start = 2;
  // Set: read at most this many bytes from start as text, truncated at whole
  // characters; zero or more than 16000 reads 16000. A range that is not UTF-8
  // returns NOT_TEXT, a folder or a path not in the vault NOT_FOUND.
  // Unset: read the whole file as bytes.
  optional int64 length = 3;
}

message ReadFileResponse {
  ErrorCode error = 1;
  bytes content = 2;
  FileStat stat = 3;
  // The start of content in the file: start moved forward to a whole
  // character. Zero for a whole read.
  int64 start = 4;
}

message WriteFileRequest {
  string path = 1;
  bytes content = 2;
  // What the file was when the caller read it.
  FileStat baseline = 3;
}

message WriteFileResponse {
  ErrorCode error = 1;
  // What the file is now.
  FileStat stat = 2;
}

message CreateFileRequest {
  string path = 1;
  bytes content = 2;
}

message CreateFileResponse {
  ErrorCode error = 1;
}

message ScanFilesRequest {
  repeated string paths = 1;
}

message ScanFilesResponse {
  ErrorCode error = 1;
}

// FileChangeCursor is a place in the file change feed of a vault. The empty
// cursor is before the start of any feed.
message FileChangeCursor {
  // feed_id names the feed. A new index starts a feed of another id.
  string feed_id = 1;
  // seq is the number of the last change read.
  int64 seq = 2;
}

message ListFileChangesRequest {
  // since is the cursor of the last read, empty for the first.
  FileChangeCursor since = 1;
  // events are the events returned: file.added, file.changed, file.moved,
  // file.removed, note.frontmatterChanged. At least one.
  repeated string events = 2;
  // limit is the number of changes of a page: 0 reads 1000, the most.
  int32 limit = 3;
}

message ListFileChangesResponse {
  ErrorCode error = 1;
  repeated FileChange changes = 2;
  // next is the cursor the next read starts from.
  FileChangeCursor next = 3;
  // is_reset is true when the feed cannot continue from since: since is empty,
  // of another feed, or older than the removals the feed keeps. The reader
  // reads the vault again from the start, and changes is empty.
  bool is_reset = 4;
  // has_more is true when more changes follow next.
  bool has_more = 5;
}

// FileChange is the latest event of one kind of one file.
message FileChange {
  // source_id is the number the index keeps the file under.
  int64 source_id = 1;
  // path is where the file is now, or for file.removed where it was.
  string path = 2;
  string event = 3;
  int64 seq = 4;
  // hash is the content hash of the file as the index has it now, empty for file.removed
  // and for a file the index has no hash of.
  string hash = 5;
  // size is the size of the file in bytes as the index has it now, 0 for file.removed.
  int64 size = 6;
  // mtime is the modification time of the file as the index has it now, in nanoseconds
  // since the Unix epoch, 0 for file.removed.
  int64 mtime = 7;
}

// HostFileServiceMoveFileRequest names a file or folder and where it goes. The links to a
// note that moved are repaired as for a move in the window.
message HostFileServiceMoveFileRequest {
  string from = 1;
  string to = 2;
  // baseline is what the file was when the caller last saw it. Set, from names
  // a file and the file changed since: CONFLICT. Not allowed for a folder.
  optional FileStat baseline = 3;
}

message HostFileServiceMoveFileResponse {
  // NOT_FOUND (from), ALREADY_EXISTS (to), OUTSIDE_VAULT, CONFLICT, LOCKED.
  ErrorCode error = 1;
  // The number of files under to now: 1 for a file.
  int32 moved_count = 2;
}

message HostFileServiceRemoveFileRequest {
  string path = 1;
  // baseline is as for MoveFile; not allowed for a folder.
  optional FileStat baseline = 2;
}

message HostFileServiceRemoveFileResponse {
  // NOT_FOUND, OUTSIDE_VAULT, CONFLICT, LOCKED.
  ErrorCode error = 1;
  int32 removed_count = 2;
}

// ReadFileRangeRequest asks for start, then at most length bytes, 1 to
// 4194304. A range past the end returns the bytes that are there; start at or
// past the end returns none.
message ReadFileRangeRequest {
  string path = 1;
  int64 start = 2;
  int64 length = 3;
}

message ReadFileRangeResponse {
  // NOT_FOUND (also a folder), OUTSIDE_VAULT, INVALID_RANGE.
  ErrorCode error = 1;
  bytes content = 2;
  // What the file was when it was read, with its hash.
  FileStat stat = 3;
}

message PlaceFileRequest {
  // A store file name as in HostStoreService.
  string name = 1;
  string path = 2;
  // The SHA-256 of the staged content, lowercase hex. The host hashes the
  // file and refuses another content.
  string expected_hash = 3;
  // baseline is the file at path as the caller last saw it. Unset: the path
  // must be free (ALREADY_EXISTS otherwise). Set: the file must be unchanged
  // (CONFLICT otherwise) and is replaced.
  optional FileStat baseline = 4;
}

message PlaceFileResponse {
  // NOT_FOUND (staged file), ALREADY_EXISTS, CONFLICT, HASH_MISMATCH,
  // OUTSIDE_VAULT, LOCKED.
  ErrorCode error = 1;
  // The placed file, with its hash.
  FileStat stat = 2;
}
