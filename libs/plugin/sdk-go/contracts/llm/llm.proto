syntax = "proto3";

// The operations of language models: llm.complete, llm.chat, llm.embed and llm.profile carry these
// messages as their payloads and frames; llm.models and llm.reasoning are option lists of row fields and
// carry numen.v1.OptionsRequest and numen.v1.Options.
package numen.llm;

option go_package = "github.com/jiva-studio/numen/libs/plugin/sdk-go/contracts/llm;llm";

// Message is one message of a completion. role is system, user or assistant.
message Message {
  string role = 1;
  string text = 2;
}

// CompleteRequest is the payload of llm.complete.
message CompleteRequest {
  repeated Message messages = 1;
  optional double temperature = 2;
  // max_tokens is zero for the limit of the provider.
  int32 max_tokens = 3;
}

// CompleteResult is the done frame of llm.complete. The call has no data frame.
message CompleteResult {
  string text = 1;
}

message ToolCall {
  string id = 1;
  string name = 2;
  // arguments_json is the arguments as one JSON object.
  string arguments_json = 3;
}

message ToolDefinition {
  string name = 1;
  string description = 2;
  // parameters_json is the JSON schema of the arguments.
  string parameters_json = 3;
}

// ChatMessage is one message of a conversation. role is system, user, assistant or tool. An assistant
// message carries the calls it asked for, and a tool message carries the id of the call it answers.
message ChatMessage {
  string role = 1;
  string text = 2;
  repeated ToolCall tool_calls = 3;
  string tool_call_id = 4;
}

// ChatRequest is the payload of llm.chat: one turn, with the history in messages.
message ChatRequest {
  repeated ChatMessage messages = 1;
  repeated ToolDefinition tools = 2;
  optional double temperature = 3;
  int32 max_tokens = 4;
}

// ChatFrame is one data frame of llm.chat: a piece of the answer, never empty, or a complete tool call.
message ChatFrame {
  oneof event {
    string text_delta = 1;
    ToolCall tool_call = 2;
  }
}

// FinishReason is why a turn ended.
enum FinishReason {
  FINISH_REASON_UNSPECIFIED = 0;
  // FINISH_REASON_STOP is an answer the model finished.
  FINISH_REASON_STOP = 1;
  // FINISH_REASON_TOOL_CALLS is a turn that asks for tool calls.
  FINISH_REASON_TOOL_CALLS = 2;
  // FINISH_REASON_LENGTH is an answer cut off at the length limit.
  FINISH_REASON_LENGTH = 3;
}

// ChatFinish is the done frame of llm.chat.
message ChatFinish {
  FinishReason reason = 1;
}

// EmbedRequest is the payload of llm.embed.
message EmbedRequest {
  repeated string texts = 1;
}

message Vector {
  repeated float values = 1;
}

// EmbedResult is the done frame of llm.embed: one vector for each text, in the order of the texts.
message EmbedResult {
  repeated Vector vectors = 1;
}

// ProfileRequest is the payload of llm.profile.
message ProfileRequest {}

// Profile is the done frame of llm.profile: what the provider knows about the embedding model of the row.
message Profile {
  // model is the model of the row.
  string model = 1;
  // source is the type and the address of the connection, never a key.
  string source = 2;
  string pooling = 3;
  string query_prefix = 4;
  string document_prefix = 5;
  // width is the number of values of a vector.
  int32 width = 6;
  // max_tokens is zero when the provider does not know the limit.
  int32 max_tokens = 7;
}
