version: v2

# Generated code is committed, as for libs/core/protocol: the Go messages next to the .proto files and the
# TypeScript ones in libs/plugin/sdk-ts/src/contracts.
plugins:
  - local: protoc-gen-go
    out: .
    opt: paths=source_relative

  - local: ../../../../node_modules/.bin/protoc-gen-es
    out: ../../sdk-ts/src/contracts
    opt:
      - target=ts
      - import_extension=js
