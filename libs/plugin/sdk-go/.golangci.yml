# Rules for every Go file of the plugin SDK, production code and tests alike.
#
# The SDK has a configuration of its own: the linters and their settings are those of the root
# .golangci.yml, and the import rules are the ones that apply to the SDK. tools/checks verifies that
# it enables every linter the root configuration enables. The second configuration,
# .golangci-structure.yml, is a byte-identical copy of the root one and holds the rules for
# production code only.
#
# A rule here has no path exclusion, no exclusion preset and no suppression
# comment. gochecknoglobals keeps its allowances: error values, compiled regular
# expressions, embedded files and blank identifiers.
#
# Run from the directory of the module.

version: "2"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  default: none
  enable:
    - errcheck
    - nilerr
    - forbidigo
    - bodyclose
    - sqlclosecheck
    - rowserrcheck
    - contextcheck
    - noctx
    - importas
    - usetesting
    - gocritic
    - staticcheck
    - unused
    - revive
    - depguard
    - wastedassign
    - gochecknoinits
    - gochecknoglobals
    - reassign
    - govet
    - errorlint
    - nilnesserr
    - copyloopvar
    - modernize
    - intrange
    - usestdlibvars
    - exptostd
    - asasalint
    - durationcheck
    - makezero
    - errchkjson
    - canonicalheader
    - sloglint
    - testifylint
    - bidichk
    - predeclared
    - gocheckcompilerdirectives
    - ineffassign
    - errname
    - recvcheck
    - protogetter
    - musttag
    - thelper
    - misspell
    - gosec

  settings:
    govet:
      enable:
        - nilness

    gosec:
      # G101 matches names, G103 flags the unsafe FFI code, G204 and G702 flag the agent programs the user configures,
      # G602 and the taint rules G703-G705 flag paths and addresses the app opens for the user.
      excludes:
        - G101
        - G103
        - G104
        - G115
        - G204
        - G702
        - G301
        - G302
        - G304
        - G306
        - G404
        - G602
        - G703
        - G704
        - G705

    misspell:
      locale: US

    depguard:
      rules:
        # The SDK and its feature modules import no core package and no application.
        sdk-isolation:
          list-mode: lax
          files:
            - "**/libs/plugin/sdk-go/**"
          deny:
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel"
              desc: "plugin SDK must not import core packages"
            - pkg: "github.com/jiva-studio/numen/apps"
              desc: "plugin SDK must not import host applications"

        # The note types the SDK names (host/domain) reach no application or plugin and perform no I/O.
        domain:
          list-mode: lax
          files:
            - "**/domain/**"
            - "**/domain.go"
            - "!$test"
          allow:
            - "net/url"
            - "net/netip"
          deny:
            - pkg: "github.com/jiva-studio/numen/apps"
              desc: "the domain does not reach applications"
            - pkg: "github.com/jiva-studio/numen/plugins"
              desc: "the domain does not reach plugins"
            - pkg: "os"
              desc: "the domain performs no I/O"
            - pkg: "net"
              desc: "the domain performs no I/O"

    errcheck:
      check-type-assertions: true
      check-blank: true

    gocritic:
      disabled-checks:
        - argOrder

    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^panic$
          msg: return the error of the call instead of panicking
        - pattern: ^fmt\.Print.*$
          pkg: ^fmt$
          msg: write to an injected writer or logger

    importas:
      no-unaliased: true
      alias:
        - pkg: github.com/jiva-studio/numen/libs/core/protocol/gen/numen/v1
          alias: v1

    usetesting:
      context-background: true
      os-temp-dir: true

    staticcheck:
      checks:
        - all
        - -QF*
        - -ST1020
        - -ST1021
        - -ST1022

    revive:
      rules:
        - name: redefines-builtin-id
        - name: unused-parameter
          arguments:
            - allowRegex: '^(_|ctx|t|w|r)$'
        - name: empty-block
        - name: increment-decrement
        - name: receiver-naming
        - name: blank-imports

