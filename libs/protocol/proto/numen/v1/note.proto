syntax = "proto3";

// What a client may ask about a note.
//
// A note is addressed by the path it is filed under, which is what the vault
// calls it. What is here is what a note holds and what it is joined to: its
// prose, its headings, its neighbourhood, the addresses written in it, and
// every way of writing one. Where a note sits among the vault's other files is
// file.proto.
package numen.v1;

import "numen/v1/file.proto";
import "numen/v1/shared.proto";

option go_package = "github.com/jiva-studio/numen/libs/protocol/gen/numen/v1;numenv1";

// NoteService answers what a note of the vault holds, and writes it.
service NoteService {
  // GetOpeningNote is the note to show when nothing else has been chosen. It
  // answers with nothing until a scan has stored something.
  rpc GetOpeningNote(GetOpeningNoteRequest) returns (GetOpeningNoteResponse);

  // GetNeighbourhood is one note and everything joined to it.
  rpc GetNeighbourhood(GetNeighbourhoodRequest) returns (GetNeighbourhoodResponse);

  // ResolveAddresses answers where addresses written in one note land.
  rpc ResolveAddresses(ResolveAddressesRequest) returns (ResolveAddressesResponse);

  // ListHeadings is the headings of the vault's notes, grouped by the note they
  // stand in and in the order they stand there. The paths are the filter: a
  // note it does not name is not in the answer, and neither is one that carries
  // no headings.
  //
  // A path named twice is answered once, and a filter naming more notes than
  // fit.
  rpc ListHeadings(ListHeadingsRequest) returns (ListHeadingsResponse);

  // ReadNote answers with the prose of a note, below its frontmatter.
  rpc ReadNote(ReadNoteRequest) returns (ReadNoteResponse);

  // WriteNote puts prose into a note, keeping the frontmatter the file has when
  // the write lands and creating the file where there is none. A note that no
  // `stale`.
  rpc WriteNote(WriteNoteRequest) returns (WriteNoteResponse);

  // CreateNote makes a note. The file is named after the title, and the links
  // the note carries are written into it as it is made, so it arrives joined.
  // An empty title takes the lowest free "Untitled note N".
  rpc CreateNote(CreateNoteRequest) returns (CreateNoteResponse);

  // WriteLink writes a relationship into one note. The note at the other end is
  // left alone: a link is one end's account of a relationship.
  rpc WriteLink(WriteLinkRequest) returns (WriteLinkResponse);

  // GetConnection is the relationship between two notes as a whole: the record
  // each note writes about the other.
  rpc GetConnection(GetConnectionRequest) returns (GetConnectionResponse);

  // SaveConnection makes the records between two notes exactly the ones given,
  // in both notes or in neither. A connection that would put a note above
  // itself in the hierarchy is not saved.
  rpc SaveConnection(SaveConnectionRequest) returns (SaveConnectionResponse);

  // RemoveSide removes the record one note writes about another. The other note
  // is left alone.
  rpc RemoveSide(RemoveSideRequest) returns (RemoveSideResponse);

  // RemoveConnection removes the records two notes write about each other.
  rpc RemoveConnection(RemoveConnectionRequest) returns (RemoveConnectionResponse);

  // JoinNotes makes one note write a record about another and keeps the record
  // the other note already writes.
  rpc JoinNotes(JoinNotesRequest) returns (JoinNotesResponse);

  // CreateRelatedNote makes a note joined to an existing one. The new note
  // writes the record about the existing note, with the inverse role, and is
  // filed in the folder of the existing note.
  rpc CreateRelatedNote(CreateRelatedNoteRequest) returns (CreateRelatedNoteResponse);

  // ListBacklinks lists the links written in other notes that point at a note.
  rpc ListBacklinks(ListBacklinksRequest) returns (ListBacklinksResponse);

  // RenameNote gives a note a different name. A note is shown by its title,
  // else by its first level-one heading, else by its filename: whichever of the
  // three names it is brought into line, and the file follows it where a title
  // and a filename are kept as one name.
  rpc RenameNote(RenameNoteRequest) returns (RenameNoteResponse);

  // WatchEdits reports a change being made to a note's prose while it is being
  // made, for as long as the caller listens. It is what a person reading that
  // note is shown; the note itself arrives the way every other change does.
  rpc WatchEdits(WatchEditsRequest) returns (stream WatchEditsResponse);
}

// Note is a note as something else refers to it.
message Note {
  // Path is what the vault calls the note, and how it is asked for again.
  string path = 1;
  string title = 2;
  // Identifier is what the file carries, empty for a note made outside the
  // application.
  string identifier = 3;
}

message GetOpeningNoteRequest {}

message GetOpeningNoteResponse {
  // Absent while a scan has stored nothing, and for a vault that holds no
  // notes.
  optional Note note = 1;
}

message GetNeighbourhoodRequest {
  string path = 1;
}

message GetNeighbourhoodResponse {
  Note focus = 1;
  repeated Neighbour related = 2;

  // The `type` key of the frontmatter of the note in focus, so a client draws a note as
  // what it is. Empty for an ordinary note.
  string focus_type = 3;
}

// Relation is where a note sits relative to the one in focus. A sibling is written
// nowhere: it is another child of a shared parent.
enum Relation {
  RELATION_UNSPECIFIED = 0;
  RELATION_PARENT = 1;
  RELATION_CHILD = 2;
  RELATION_JUMP = 3;
  RELATION_SIBLING = 4;
}

// Neighbour is one note joined to the one in focus, and what joins them.
message Neighbour {
  Note note = 1;
  Relation relation = 2;
  // What the person wrote on the link, when they wrote anything.
  string label = 3;

  // The note the relationship runs from, when that is not the one in focus: a
  // sibling is another child of a shared parent, and this is that parent.
  string through = 4;

  // Set when both notes name this relationship, each in its own words. The
  // label is then the one the note in focus wrote.
  bool is_mutual = 5;

  // The `type` key of the note's frontmatter, so a client draws a note as what it is.
  // Empty for an ordinary note.
  string type = 6;

  // What the other note wrote on its link back to this one, when is_mutual is true.
  string reverse_label = 7;

  // What the record written in the note in focus draws at this note. It is
  // MARKER_UNSPECIFIED when that note writes no record or the record draws nothing.
  Marker marker = 8;

  // What the record written in this note draws at the note in focus.
  Marker reverse_marker = 9;
}

message ResolveAddressesRequest {
  // The note the addresses are written in. A name resolves by a path relative
  // to it, so a caller with no note to name gets the priority that is left.
  string from = 1;

  // The addresses to answer about. A scheme written before `://` is read as
  // one — `name://Entropy`, `note://<identifier>` — and everything else is a
  // name, so what a file carries between its brackets is taken currently.
  repeated string written = 2;

  // A text whose wikilinks are answered about beside `written`. Each one is
  // asked about by its address as `scheme://value`, the form `found` carries.
  string text = 3;

  // The id of the vault the addresses are written in. Empty is the vault the
  // window shows; a window that shows no vault needs it.
  string vault = 4;
}

message ResolveAddressesResponse {
  // Where each address lands, in the order they were asked about. One that
  // reaches nothing is absent, and so is one asked about twice.
  repeated ResolvedAddress resolved = 1;

  // The wikilinks in `text`, in the order they are written, each raw form
  // once, whether they reach a note or not.
  repeated TextLink found = 2;
}

// TextLink is one wikilink of a text.
message TextLink {
  // The wikilink as the text holds it, brackets included.
  string raw = 1;

  // Where it points, as `scheme://value`.
  string address = 2;

  // The text it reads as: the alias where one is written.
  string text = 3;
}

// ResolvedAddress is one address and the note it reaches now.
message ResolvedAddress {
  // The address as it was asked about, which is how the caller finds its answer.
  string written = 1;

  // Where the note it reaches is filed.
  string path = 2;

  // The vault holding that note. An identifier names one note in the world, so
  // an address may land outside the vault it was written in.
  string vault = 3;

  // Set where that vault is not the one this call was answered about.
  bool is_crossed = 4;

  // Set where several notes answer to the name. It reaches the nearest of them,
  // which is a fact about where the notes currently sit.
  bool is_ambiguous = 5;
}

message ListHeadingsRequest {
  // Only the notes filed under these paths. A filter naming none passes none,
  repeated string paths = 1;
}

message ListHeadingsResponse {
  repeated NoteHeadings headings = 1;
}

// NoteHeadings is what one note is divided into.
message NoteHeadings {
  string path = 1;

  // In the order they stand in the note.
  repeated Heading headings = 2;
}

// Heading is one line of a note that names what stands below it.
message Heading {
  string text = 1;

  // The line it relies on, counted from the first line of the prose.
  int32 line = 2;

  // How deep it sits, from one for the shallowest a note can carry. Zero where
  // the answer does not say: a name that matched carries the heading's words
  // and at its current position, and nothing about its depth.
  int32 level = 3;
}

message ReadNoteRequest {
  string path = 1;
}

message ReadNoteResponse {
  // The prose below the frontmatter, with line endings as LF. Empty when the
  string body = 1;

  // Set when the note was not read, and why.
  optional ErrorCode error = 2;

  optional FileStat at = 3;
}

// ReadBaseline is what a caller last saw of a note: the prose a read gave it, and
// the file that read came out of. A note still holding either is the note this
// caller read.
message ReadBaseline {
  // The prose below the frontmatter, with line endings as LF, as the read gave
  // it.
  string prose = 1;

  // The file the prose came out of.
  FileStat at = 2;
}

message WriteNoteRequest {
  string path = 1;

  // The prose to put below the frontmatter, with line endings as LF.
  string body = 2;

  // What this caller last saw of the note. Absent for a write that lands on
  // whatever the note now holds.
  optional ReadBaseline baseline = 3;
}

message WriteNoteResponse {
  // Set when nothing was written, and why.
  optional ErrorCode error = 1;

  // The file the write produced, for the caller to present at its next write.
  // Absent when nothing was written.
  optional FileStat at = 2;

  // Set when the prose is on disk and the index would not come level with it.
  // The write happened and `at` stands; search answers about this note as it
  // read it last, until a walk goes past.
  bool is_unlevelled = 3;
}

// Role is what kind of relationship a link is. The list is closed: navigation
// and drawing read it, so a role nobody decided on has no behaviour.
enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_PARENT = 1;
  ROLE_CHILD = 2;
  ROLE_JUMP = 3;
  ROLE_REF = 4;
  ROLE_ATTACHMENT = 5;
}

// Marker is what is drawn at the end of a link that points at its target. The
// list is closed: a value is introduced together with the code that draws it.
// MARKER_UNSPECIFIED draws nothing.
enum Marker {
  MARKER_UNSPECIFIED = 0;
  MARKER_ARROW = 1;
}

// Link is one relationship as the note it is written in declares it: the note
// at the other end, by the path it is filed under, and what kind of
// relationship it is.
message Link {
  string to = 1;
  Role role = 2;

  // What the person calls this relationship, when they call it anything.
  string label = 3;

  // What the link is for, as a feature reads it. Empty for an ordinary link.
  string type = 4;

  // Why the link exists, in the person's words.
  string note = 5;

  Marker marker = 6;
}

message CreateNoteRequest {
  // What the note is called. The file is named after it. Empty takes the
  // lowest free "Untitled note N".
  string title = 1;

  // The folder it goes in, as a path relative to the root. Empty is the root.
  string path = 2;

  // What the note is joined to, written into it as it is made.
  repeated Link links = 3;
}

message CreateNoteResponse {
  // Where the note is filed. Empty when nothing was made.
  string path = 1;

  // Set when nothing was made, and why.
  optional ErrorCode error = 2;

  // Set when the note is on disk and the index would not come level with it.
  // The note was made and `path` stands; search does not answer about it until
  // a walk goes past.
  bool is_unlevelled = 3;

  // Set when no title was given and every numbered untitled name is taken.
  bool is_name_exhausted = 4;
}

message WriteLinkRequest {
  // The note the link is written in.
  string path = 1;
  Link link = 2;
}

message WriteLinkResponse {
  // Set when nothing was written, and why. A note that moved between being
  // read and being written is ERROR_CODE_STALE, and the caller reads it again
  // before asking for this.
  optional ErrorCode error = 1;
}

// ConnectionSide is the record one note writes about the other in a connection.
message ConnectionSide {
  Role role = 1;
  string type = 2;
  string note = 3;
  string label = 4;
  Marker marker = 5;
}

// Connection is the relationship between two notes as a whole. Each note writes
// at most one record about the other; the roles of two records are inverse of
// each other.
message Connection {
  string first = 1;
  string second = 2;
  // What the second note is to the first. A record written without a role takes
  // this role, or its inverse for the record of the second note. A reply always
  // carries it when the connection holds a record.
  Role role = 5;
  // The record written in the first note about the second. Absent when the
  // first note writes none.
  optional ConnectionSide first_side = 3;
  // The record written in the second note about the first.
  optional ConnectionSide second_side = 4;
}

message GetConnectionRequest {
  string first = 1;
  string second = 2;
  // Only the records of this type. Empty names the records that carry none.
  string type = 3;
}

message GetConnectionResponse {
  Connection connection = 1;
  optional ErrorCode error = 2;
}

message SaveConnectionRequest {
  Connection connection = 1;
}

message SaveConnectionResponse {
  optional ErrorCode error = 1;

  // Set when the connection was not saved because it is not one: a role no
  // connection carries, roles that are not inverse of each other, or a note
  // joined to itself.
  bool is_invalid = 2;

  // Set when the connection was not saved because it would put a note above
  // itself in the hierarchy.
  bool is_cycle = 3;
}

message RemoveSideRequest {
  // The note the record is written in.
  string path = 1;
  // The note the record is about.
  string to = 2;
  // The records removed carry this type. Empty names the records that carry none.
  string type = 3;
}

message RemoveSideResponse {
  optional ErrorCode error = 1;
}

message RemoveConnectionRequest {
  string first = 1;
  string second = 2;
  string type = 3;
}

message RemoveConnectionResponse {
  optional ErrorCode error = 1;
}

message JoinNotesRequest {
  // The note that writes the record.
  string from = 1;
  // The note the record is about.
  string to = 2;
  ConnectionSide side = 3;
}

message JoinNotesResponse {
  optional ErrorCode error = 1;

  // Set when the record was not written because the connection is not valid,
  // as in SaveConnectionResponse.
  bool is_invalid = 2;

  // Set when the record was not written because it would close a cycle in the
  // hierarchy.
  bool is_cycle = 3;
}

message CreateRelatedNoteRequest {
  // The existing note the new one is joined to.
  string from = 1;

  // What the new note is to the existing one: its parent, its child, or a jump.
  Role role = 2;

  // What the note is called. Empty takes the lowest free "Untitled note N".
  string title = 3;

  // The type of the record the new note writes. Empty for an ordinary link.
  string type = 4;

  // What the record the new note writes draws at the existing note.
  Marker marker = 5;
}

message CreateRelatedNoteResponse {
  // Where the note is filed. Empty when nothing was made.
  string path = 1;

  // Set when nothing was made, and why.
  optional ErrorCode error = 2;

  // Set when the note is on disk and the index would not come level with it.
  bool is_unlevelled = 3;

  // Set when every numbered untitled name is taken.
  bool is_name_exhausted = 4;
}

message ListBacklinksRequest {
  string path = 1;
}

// Backlink is a link written in another note that points at the note asked about.
message Backlink {
  // The note the link is written in.
  Note from = 1;
  // The role as written, which is relative to the note it is written in.
  Role role = 2;
  // The role of that note relative to the note asked about. ROLE_UNSPECIFIED for
  // a role with no counterpart.
  Role role_from_here = 3;
  string type = 4;
  string note = 5;
  string label = 6;
  Marker marker = 7;
}

message ListBacklinksResponse {
  repeated Backlink backlinks = 1;
}

// NameSource is which of the two a note is shown by, and so which one a rename
// brings into line.
enum NameSource {
  // Nothing named the note.
  NAME_SOURCE_UNSPECIFIED = 0;

  // The `title` key of the frontmatter.
  NAME_SOURCE_FRONTMATTER = 1;

  // The filename, which a rename moves and does not write.
  NAME_SOURCE_FILENAME = 2;
}

message RenameNoteRequest {
  // The note to rename.
  string path = 1;

  // What the note is called from now on. The file is named after it.
  string title = 2;
}

message RenameNoteResponse {
  // Where the note is filed. Empty when the note was never opened. The note is
  // path the note still has.
  string path = 1;

  // What the note is called. Empty when the note was never opened.
  string title = 2;

  // Which of the three names the note, and so which the rename brought into
  // line. NAME_SOURCE_UNSPECIFIED when the note was never opened.
  NameSource name_source = 3;

  // What the file did. Absent when it stayed where it was.
  optional MoveResult moved = 4;

  // Set when the rename did not finish, and why. The note may already have been
  // written: `path`, `title` and `by` say what stands. A note holding prose the
  // caller never saw is ERROR_CODE_STALE, and nothing was written at all.
  optional ErrorCode error = 5;

  // Set when the rename reached the vault and the index would not come level
  // with it. Search answers about these files as it read them last, until a
  // walk goes past.
  bool is_unlevelled = 6;
}

message WatchEditsRequest {}

message WatchEditsResponse {
  // The change this reports on. Every report of one change carries the same
  // name, and no two changes carry one.
  string change = 1;
  // The note being changed.
  string path = 2;
  // The run being replaced, counted the way a client counts text: in UTF-16
  // code units over the prose a read answers with.
  Range range = 3;
  // What is going in where that span stands.
  string text = 4;
  // The last report of this change, which arrives whether the change landed or
  bool is_final = 5;
}
