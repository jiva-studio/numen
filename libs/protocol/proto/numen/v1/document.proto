syntax = "proto3";

// What a client has to know before it can draw a document of the vault: how
// many pages it has and how large each of them is.
//
// The pages themselves are pictures at addresses of their own, because a
// browser's own elements speak bytes and not this.
package numen.v1;

import "numen/v1/shared.proto";

option go_package = "github.com/jiva-studio/numen/libs/protocol/gen/numen/v1;numenv1";

// DocumentService answers what a document is, for whatever opens one.
//
// It is a service apart from the vault's notes for one reason: a window that
// serves the notes to a network need not serve the files, and a service is the
// unit of what a binary answers.
service DocumentService {
  // GetDocument is what a document is: how many pages it has and how large each
  // of them is. A page itself is a picture at an address of its own, drawn to
  // the width it is asked for.
  //
  // Opening a document holds a worker of the library's pool. A caller that
  // could not have one inside the wait is answered unavailable and asks again;
  // a held request is not an answer.
  rpc GetDocument(GetDocumentRequest) returns (GetDocumentResponse);

  // RenderPage draws one page of a document and answers with the drawn image bytes.
  rpc RenderPage(RenderPageRequest) returns (RenderPageResponse);

  // GetHighlights is where runs of the document's live text version stand on
  // its pages, in the order the runs were asked about.
  rpc GetHighlights(GetHighlightsRequest) returns (GetHighlightsResponse);
}

message GetDocumentRequest {
  // The file, as the vault holds it.
  string path = 1;
}

message GetDocumentResponse {
  // Every page of the document in order, each as its size. How many there are
  // nothing, and the page after it is still where it was.
  repeated Page pages = 1;

  // drawn at, so an address names one drawing of one document and answers the
  // same picture for as long as it answers at all.
  Fingerprint fingerprint = 2;
}

// A Page is one page of the document, in the document's own units. A client
// draws it at whatever width it likes and keeps the shape by this.
message Page {
  double width = 1;
  double height = 2;
}

message RenderPageRequest {
  string path = 1;
  int32 page = 2;
  int32 dpi = 3;
  int32 width = 4;
}

message RenderPageResponse {
  bytes image_data = 1;
  string content_type = 2;
  double width = 3;
  double height = 4;
}

message GetHighlightsRequest {
  // The file, as the vault holds it.
  string path = 1;

  // The runs of the live text version to answer about, in bytes of its text.
  repeated Span spans = 2;
}

message GetHighlightsResponse {
  // One answer per run asked about, in that order.
  repeated DocumentRun runs = 1;
}

// A DocumentRun is where one run of the text stands: the rectangles it covers,
// a place a page. A run standing nowhere has no places.
message DocumentRun {
  repeated DocumentPlace places = 1;
}

// DocumentPlace is rectangles on one page of a document. Pages count from zero.
message DocumentPlace {
  int32 page = 1;
  repeated DocumentRect rects = 2;
}

// DocumentRect is a rectangle on a page, in fractions of the page.
message DocumentRect {
  float min_x = 1;
  float min_y = 2;
  float max_x = 3;
  float max_y = 4;
}
