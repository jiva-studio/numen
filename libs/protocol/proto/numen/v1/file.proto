syntax = "proto3";

// What a client may ask about the tree a vault is filed in.
//
// A path is what the vault calls a file or a folder, and what is here is the
// moving one, removing one, making one. What is inside a note is note.proto,
// and the bytes a file of the person's own holds are asset.proto.
package numen.v1;

import "numen/v1/shared.proto";

option go_package = "github.com/jiva-studio/numen/libs/protocol/gen/numen/v1;numenv1";

// FileService answers what the vault holds at a path, and moves it about.
service FileService {
  // ListFiles is what one folder of the vault holds. A tree asks for a folder
  // as it is opened, one folder to a request.
  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse);

  // ListFileKinds returns, for each of the paths, whether a note is there and
  // its type, so a client opens the path in the view made for it. It is read
  // off the vault itself, so a path nothing has scanned is answered too. A path
  // with nothing at it is absent from the answer, and a path named twice is
  // answered once.
  rpc ListFileKinds(ListFileKindsRequest) returns (ListFileKindsResponse);

  // MoveFile puts a file or a folder somewhere else in the vault. Renaming a
  // file is a move within one folder.
  rpc MoveFile(MoveFileRequest) returns (MoveFileResponse);

  // RemoveFile takes a file or a folder out of the vault, into the trash it can
  // be brought back from. The links that pointed at it are left as they were
  // written: a link is not wrong because the note it names is gone.
  rpc RemoveFile(RemoveFileRequest) returns (RemoveFileResponse);

  // CreateFolder makes an empty folder. The folders above it are made with it.
  rpc CreateFolder(CreateFolderRequest) returns (CreateFolderResponse);
}

message ListFilesRequest {
  // The folder to list, as a path relative to the root. Empty is the root.
  string path = 1;
}

message ListFilesResponse {
  // What the folder holds, folders first and then files, each group by name
  // with case ignored. This is the order to draw them in.
  repeated Entry entries = 1;
}

// Entry is one file or folder of a listing.
message Entry {
  // Path is what the vault calls it, relative to the root, with forward
  // slashes.
  string path = 1;

  // The last segment of the path, which is what the row shows.
  string name = 2;

  // Whether the entry holds other entries. A folder carries no source and
  // nothing is made from it.
  bool is_folder = 3;

  reserved 4;

  // Whether the entry is a note. Every other file is opened by the plugin its
  // content type names.
  bool is_note = 6;

  // The `type` key of the note's frontmatter, which says what the note is. Empty for an
  // ordinary note. It says nothing about an entry that is not a note.
  string type = 5;
}

message ListFileKindsRequest {
  // The paths to answer about, as the vault files them. More than the vault
  repeated string paths = 1;
}

message ListFileKindsResponse {
  repeated FileKind kinds = 1;
}

// FileKind is what the vault holds at one path.
message FileKind {
  string path = 1;

  reserved 2, 4;

  // Whether a note is at the path.
  bool is_note = 5;

  // The `type` key of the note's frontmatter, which says what the note is. Empty for an
  // ordinary note. It says nothing about a path holding no note.
  string type = 3;
}

message MoveFileRequest {
  // The file or folder to move, as the vault calls it.
  string from = 1;

  // Where it is filed from now on. The last segment is what it is called.
  string to = 2;
}

message MoveFileResponse {
  // What the file did. Absent when nothing was moved.
  optional MoveResult moved = 1;

  // Set when nothing was moved, and why.
  optional ErrorCode error = 2;

  // Set when the move reached the vault and the index would not come level with
  // it. Search answers about these files as it read them last, until a walk
  // goes past.
  bool is_unlevelled = 3;
}

// MoveResult is a file under a different name, and what that did to the links
// written by the name it had.
message MoveResult {
  // Where the file was.
  string from = 1;

  // Where it is now.
  string to = 2;

  // The notes whose link stopped resolving and was written again, by name.
  repeated string repaired = 3;

  // The notes whose link stopped resolving and could not be written again, by
  // name. Each of them still points at the name the file left, and nothing
  // comes back to it: a move that reports only what it repaired reports a
  // vault it did not leave behind.
  repeated string dangling = 4;
}

message RemoveFileRequest {
  // The file or folder to remove.
  string path = 1;

  // Destroy takes the file off the disk. Nothing brings it back, and only a
  // note is destroyed.
  bool destroy = 2;
}

message RemoveFileResponse {
  // and when nothing was removed.
  string trashed = 1;

  // The notes whose links pointed at what was removed and now reach nothing.
  repeated string dangling = 2;

  // Set when nothing was removed, and why.
  optional ErrorCode error = 3;

  // Set when the file has gone and the index would not come level with it.
  // Search answers about it as it read it last, until a walk goes past.
  bool is_unlevelled = 4;
}

message CreateFolderRequest {
  // Where the folder goes, relative to the root. The folders above it are made
  // with it.
  string path = 1;
}

message CreateFolderResponse {
  // Set when nothing was made, and why.
  optional ErrorCode error = 1;
}
