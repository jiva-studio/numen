syntax = "proto3";

// Speech-to-text model inference and audio segmentation for recording files.
package numen.v1;

option go_package = "github.com/jiva-studio/numen/libs/protocol/gen/numen/v1;numenv1";

// TranscriptionService executes audio/video speech-to-text models.
service TranscriptionService {
  // GetTranscriptionModel returns the identity and configuration of the active transcription model.
  rpc GetTranscriptionModel(GetTranscriptionModelRequest) returns (GetTranscriptionModelResponse);

  // OpenRecording parses audio media bytes, checks duration, and prepares segmentation.
  rpc OpenRecording(OpenRecordingRequest) returns (OpenRecordingResponse);

  // GetSegments returns audio speech segments with 16kHz mono float samples starting from the given millisecond.
  rpc GetSegments(GetSegmentsRequest) returns (GetSegmentsResponse);

  // Transcribe decodes speech audio samples into text.
  rpc Transcribe(TranscribeRequest) returns (TranscribeResponse);

  // CloseRecording frees resources associated with an opened recording.
  rpc CloseRecording(CloseRecordingRequest) returns (CloseRecordingResponse);
}

message GetTranscriptionModelRequest {}

message GetTranscriptionModelResponse {
  string model = 1;
  string segmenter = 2;
  string cutting = 3;
  string from = 4;
}

message OpenRecordingRequest {
  bytes audio_data = 1;
  string path = 2;
}

message OpenRecordingResponse {
  string recording_id = 1;
  int32 duration_ms = 2;
}

message GetSegmentsRequest {
  string recording_id = 1;
  int32 from_ms = 2;
  int32 count = 3;
}

message GetSegmentsResponse {
  repeated AudioSegment segments = 1;
}

message AudioSegment {
  int32 from_ms = 1;
  int32 to_ms = 2;
  repeated float samples = 3;
}

message TranscribeRequest {
  repeated float samples = 1;
  int32 from_ms = 2;
  int32 to_ms = 3;
}

message TranscribeResponse {
  string text = 1;
}

message CloseRecordingRequest {
  string recording_id = 1;
}

message CloseRecordingResponse {
  bool success = 1;
}
