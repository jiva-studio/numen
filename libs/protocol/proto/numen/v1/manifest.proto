syntax = "proto3";

package numen.v1;

import "google/protobuf/struct.proto";

option go_package = "github.com/jiva-studio/numen/libs/protocol/gen/numen/v1;numenv1";

// Manifest is the schema of a plugin's manifest.json. The file is the proto3 JSON
// form of this message: field names are the lowerCamelCase json_name of each field.
// A key the schema does not name is reported as a warning by the reader. A message here only describes the
// shape; the invariants between fields are checked by the manifest reader.
message Manifest {
  reserved 10, 18, 20, 21, 22, 23, 25;
  reserved "runtimes", "note_types", "texts", "playback", "content_types", "readers", "frames";
  string id = 1;
  string name = 2;
  string version = 3;
  // protocol is the plugin protocol the plugin speaks. Absent means 1.
  int32 protocol = 4;
  string description = 5;
  repeated string capabilities = 6;
  // targets are the application windows the plugin runs in. Empty means every target.
  repeated string targets = 7;
  repeated string activation_events = 8;
  repeated string permissions = 9;
  // dependencies are what the host provisions for the plugin: runtimes, models, binaries and datasets.
  repeated ManifestDependency dependencies = 11;
  ManifestBackend backend = 13;
  ManifestFrontend frontend = 14;
  repeated ManifestSetting settings = 15;
  repeated ManifestSecret secrets = 16;
  repeated string services = 17;
  repeated ManifestCommand commands = 19;
  repeated ManifestSettingsView settings_views = 24;
  // contributes is what the plugin adds to the application, known before its
  // frontend is loaded.
  ManifestContributes contributes = 26;
  // app_version is the range of application versions the plugin runs in.
  ManifestAppVersion app_version = 27;
}

// ManifestContributes lists the contributions a plugin makes to the application.
message ManifestContributes {
  // tab_kinds are the kinds of tab the plugin's frontend registers.
  repeated ManifestTabKind tab_kinds = 1;
  // feature names what the plugin provides, in words a person reads in a
  // placeholder for an unavailable tab.
  string feature = 2;
  // category groups the plugin in lists.
  string category = 3;
  // themes are the stylesheets the plugin adds to the list of themes.
  repeated ManifestTheme themes = 5;
  // file_types are the types of file the plugin opens.
  repeated ManifestFileType file_types = 6;
  // status_views are the components of the plugin's frontend the window draws in its status bar.
  repeated ManifestStatusView status_views = 4;
  // handles are the capabilities the plugin takes part in for files and notes of some types.
  repeated ManifestHandle handles = 7;
  // content_types are the types of file the plugin brings that the content type table does not know.
  repeated ManifestContentType content_types = 8;
  // readers are the tabs of the plugin's frontend that open files, each by the id the frontend
  // registers it under.
  repeated ManifestReader readers = 9;
  // note_types are the types of note the plugin gives meaning to, and how the index keeps the notes
  // of each.
  repeated ManifestNoteType note_types = 10;
  // frame_origins are the https origins the plugin's pages frame.
  repeated string frame_origins = 11;
}

// ManifestHandle declares that the plugin takes part in a capability for files of some content
// types and notes of some note types. The purpose is the id of the capability; the part of the
// application that defines the capability owns the id and gives the declaration its meaning.
message ManifestHandle {
  string purpose = 1;
  repeated string content_types = 2;
  repeated string note_types = 3;
}

// ManifestFileType is a type of file the plugin opens in a tab of one of its
// kinds.
message ManifestFileType {
  // tab_kind is the kind of tab that opens the file. It is one of the plugin's
  // tab_kinds.
  string tab_kind = 1;
  // extensions are the extensions, lowercase and without the dot, of the files
  // of the type.
  repeated string extensions = 2;
  // file_names are the names, lowercase, of the files of the type whatever
  // their extension.
  repeated string file_names = 3;
}

// ManifestTheme is a theme a plugin adds to the list of themes.
message ManifestTheme {
  // id is the slug the theme is named by inside the plugin.
  string id = 1;
  // name is the title the theme is listed with.
  string name = 2;
  // appearance is light or dark when the theme sets one color scheme, and empty when it
  // follows the mode.
  string appearance = 3;
  // file is the path of the stylesheet relative to the plugin folder.
  string file = 4;
}

// ManifestStatusView is a component of the plugin's frontend that the window draws in its status
// bar.
message ManifestStatusView {
  // id is the id the frontend registers the component under.
  string id = 1;
}

// ManifestTabKind is a kind of tab the plugin registers.
message ManifestTabKind {
  // kind is the id the frontend registers the kind under.
  string kind = 1;
  string title = 2;
  // icon is the kebab-case name of an icon of the application's icon set.
  string icon = 3;
}

// ManifestAppVersion bounds the application versions a plugin runs in. Both
// bounds are inclusive; an empty bound is open.
message ManifestAppVersion {
  string min = 1;
  string max = 2;
}

message ManifestDependency {
  string id = 1;
  // kind is one of runtime, model, binary and dataset.
  string kind = 2;
  string version = 3;
  string source_url = 4;
  string checksum_sha256 = 5;
  map<string, string> metadata = 6;
}

message ManifestBackend {
  string type = 1;
  string entrypoint = 2;
  string service_name = 3;
}

message ManifestFrontend {
  string entrypoint = 1;
  string styles = 2;
}

// ManifestSettingOption is one value an enum setting holds. A list of options
// in a manifest holds each option as this message, or as a bare string that
// stands for an option with that value.
message ManifestSettingOption {
  string value = 1;
  string title = 2;
  string detail = 3;
  repeated string dependencies = 4;
}

message ManifestOptionsBy {
  string setting = 1;
  // options are the options under each value of the setting named. Each is a
  // JSON list of options.
  map<string, google.protobuf.ListValue> options = 2;
}

message ManifestCondition {
  string setting = 1;
  repeated string is = 2;
}

message ManifestSetting {
  string key = 1;
  string type = 2;
  string title = 3;
  string description = 4;
  google.protobuf.Value default = 5;
  bool palette = 6;
  string icon = 7;
  // options is a JSON list of options.
  google.protobuf.ListValue options = 8;
  double min = 9;
  double max = 10;
  double step = 11;
  reserved 12;
  reserved "models_of";
  repeated string replaces = 13;
  ManifestOptionsBy options_by = 14;
  ManifestCondition when = 15;
  repeated string accept = 16;
}

message ManifestSecret {
  string name = 1;
  string title = 2;
  string description = 3;
  ManifestCondition when = 4;
}

message ManifestNoteType {
  string type = 1;
  optional bool chunks = 2;
  // headings is a JSON list of heading levels. Absent keeps every heading, and
  // an empty list keeps none.
  google.protobuf.ListValue headings = 3;
  repeated int32 id_heading_levels = 4;
  string id_pattern = 5;
}

message ManifestCommandArgument {
  string name = 1;
  string title = 2;
  string type = 3;
  bool is_required = 4 [json_name = "required"];
  bool is_hidden_in_palette = 5 [json_name = "hiddenInPalette"];
}

// ManifestContextCondition holds while the context the window supplies has the key with one of the
// values listed. The value `*` stands for any value of the key.
message ManifestContextCondition {
  string key = 1;
  repeated string is = 2;
}

message ManifestCommand {
  string id = 1;
  string title = 2;
  string icon = 3;
  repeated string content_types = 4;
  repeated string note_types = 5;
  // when are the conditions, all of which hold in the context the command is offered over. A
  // command with conditions is offered over each context that meets them.
  repeated ManifestContextCondition when = 6;
  repeated ManifestCommandArgument arguments = 7;
  bool is_hidden_in_palette = 8 [json_name = "hiddenInPalette"];
}

message ManifestContentType {
  string type = 1;
  repeated string globs = 2;
}

message ManifestReader {
  string id = 1;
  repeated string content_types = 2;
  string rank = 3;
}

message ManifestSettingsView {
  string id = 1;
  string title = 2;
  string after = 3;
}
