syntax = "proto3";

// Media and web page downloading with transcription cue extraction.
package numen.v1;

import "numen/v1/transcript.proto";

option go_package = "github.com/jiva-studio/numen/libs/protocol/gen/numen/v1;numenv1";

// DownloadService downloads web pages and media with transcript cues.
service DownloadService {
  // CanHandle checks whether this downloader supports the given URL.
  rpc CanHandle(CanHandleRequest) returns (CanHandleResponse);

  // GetDownloadModel returns the tool identity and version for a given URL.
  rpc GetDownloadModel(GetDownloadModelRequest) returns (GetDownloadModelResponse);

  // GetMetadata returns media duration, language, and available caption tracks.
  rpc GetMetadata(GetMetadataRequest) returns (GetMetadataResponse);

  // GetText extracts transcripts, cues, or prose text from a URL.
  rpc GetText(GetTextRequest) returns (GetTextResponse);

  // DownloadMedia streams downloaded media bytes for playback or storage.
  rpc DownloadMedia(DownloadMediaRequest) returns (stream DownloadMediaResponse);
}

message CanHandleRequest {
  string url = 1;
}

message CanHandleResponse {
  bool can_handle = 1;
}

message GetDownloadModelRequest {
  string url = 1;
}

message GetDownloadModelResponse {
  string tool = 1;
  string version = 2;
  string producer = 3;
}

message GetMetadataRequest {
  string url = 1;
}

message GetMetadataResponse {
  string title = 1;
  int64 bytes = 2;
  int32 length = 3;
  string language = 4;
  repeated string captions = 5;
  repeated string is_automatic = 6;
}

message PreferredCaptions {
  repeated string languages = 1;
  bool is_automatic = 2;
}

message GetTextRequest {
  string url = 1;
  PreferredCaptions preferred_captions = 2;
}

message GetTextResponse {
  string producer = 1;
  repeated Cue cues = 2;
  string prose = 3;
  string title = 4;
  int32 length = 5;
}

message DownloadMediaRequest {
  string url = 1;
}

message DownloadMediaResponse {
  string media_type = 1;
  string extension = 2;
  bytes chunk = 3;
}
