syntax = "proto3";

package numen.v1;

import "numen/v1/window.proto";

option go_package = "github.com/jiva-studio/numen/libs/protocol/gen/numen/v1;numenv1";

// HostQueueService is the core's shared queue of heavy work and its list of
// tasks, as a plugin uses them. The queue is the one the core's own heavy work
// waits in, and a task a plugin reports is listed by WatchTasks beside the
// core's own. The host removes a plugin's tasks and ends its turns when the
// plugin stops.
service HostQueueService {
  // EnqueueWork puts one piece of the plugin's work in the queue and streams
  // its state. The turn lasts until the plugin closes the stream, and
  // the next work in the queue runs after it.
  rpc EnqueueWork(EnqueueWorkRequest) returns (stream EnqueueWorkResponse);

  // ReportTask puts one of the plugin's tasks in the list, or replaces the one
  // reported under the same id.
  rpc ReportTask(ReportTaskRequest) returns (ReportTaskResponse);

  // FinishTask takes one of the plugin's tasks out of the list. A task that is
  // not there is already finished.
  rpc FinishTask(FinishTaskRequest) returns (FinishTaskResponse);
}

// WorkState is the state of a piece of work in the queue. UNSPECIFIED means
// nothing was said.
enum WorkState {
  WORK_STATE_UNSPECIFIED = 0;

  // Other work holds the queue, and this work waits for it.
  WORK_STATE_WAITING = 1;

  // The work holds the queue and may run.
  WORK_STATE_RUNNING = 2;

  // The work holds the queue, and other work waits for it.
  WORK_STATE_CONTENDED = 3;
}

message EnqueueWorkRequest {
  // Set for work a person started. It runs before work nobody asked for.
  bool is_user_started = 1;
}

message EnqueueWorkResponse {
  WorkState state = 1;
}

message ReportTaskRequest {
  // The id is the plugin's own: two plugins may report the same id.
  Task task = 1;
}

message ReportTaskResponse {}

message FinishTaskRequest {
  string id = 1;
}

message FinishTaskResponse {}
