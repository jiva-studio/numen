syntax = "proto3";

// showing.
//
// The tabs the window has open and the places something else asks to be put in
// front of the person are the window's. What the vault is and what has changed
// in it is vault.proto.
package numen.v1;

import "numen/v1/shared.proto";

option go_package = "github.com/jiva-studio/numen/libs/protocol/gen/numen/v1;numenv1";

// WorkspaceService answers where in the vault the person stands, and takes what
// the window has open.
service WorkspaceService {
  // WatchFocus reports the places something else asked to be put in front of
  // the person — an agent working the vault beside them — for as long as the
  // caller listens. What travelling there looks like is the client's.
  rpc WatchFocus(WatchFocusRequest) returns (stream WatchFocusResponse);

  // WriteOpenTabs says what currently open — every tab of the window, and
  // which of them is in front. The client says so again whenever any of it
  // changes, and an agent working the vault beside them reads what it last
  // said.
  rpc WriteOpenTabs(WriteOpenTabsRequest) returns (WriteOpenTabsResponse);

  // ReadOpenTabs returns the tabs last written for the vault in the window. The
  // core keeps them across restarts, and the window opens them again.
  rpc ReadOpenTabs(ReadOpenTabsRequest) returns (ReadOpenTabsResponse);

  // DetachTab asks that a tab be opened in a new window of its own.
  rpc DetachTab(DetachTabRequest) returns (DetachTabResponse);
}

message DetachTabRequest {
  // The tab to open in a new window.
  string tab_id = 1;

  // The position on screen to open the new window at.
  int32 x = 2;
  int32 y = 3;
}

message DetachTabResponse {}

message WatchFocusRequest {}

message WatchFocusResponse {
  // The source to put in front of the person: a note to see the neighbourhood
  // from, or a document to open.
  string path = 1;

  // The runs of that source's text to open on, counted in bytes. The person is
  // taken to the first and the rest are shown where they fall. None at all
  // names the source and no place inside it, which is what a note arrives with.
  repeated Range ranges = 2;
}

message WriteOpenTabsRequest {
  // Every tab the window has open, in the order the person was last in them.
  repeated Tab tabs = 1;

  // Which of them the person is looking at, by its id. Empty where the window
  // has nothing open.
  string front = 2;
}

message WriteOpenTabsResponse {}

message ReadOpenTabsRequest {}

message ReadOpenTabsResponse {
  // The tabs last written, in the order they were written.
  repeated Tab tabs = 1;

  // The id of the tab that was in front, empty where none was.
  string front = 2;
}

// A Tab is one tab of the window: what kind it is, and what it holds.
//
// The kind is the name a plugin registers the tab kind under. A reader that
// does not know the kind knows a tab of that kind is open and no more.
message Tab {
  // Id is what the window calls this tab, which the front is named by.
  string id = 1;

  // Kind is the registered name of the tab kind.
  string kind = 2;

  // Path is the file it holds, by the path the vault files it under, and empty
  // for a tab holding no file.
  string path = 3;

  // Title is what the tab is called, as the person reads it.
  string title = 4;

  // State is the JSON the plugin owning the kind saved for the tab, such as the
  // place it shows. The core and the window store it unread; empty for a tab
  // whose kind saves none.
  string state = 5;
}
