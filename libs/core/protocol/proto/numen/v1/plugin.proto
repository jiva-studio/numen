syntax = "proto3";

package numen.v1;

import "numen/v1/health.proto";

option go_package = "github.com/jiva-studio/numen/libs/core/protocol/gen/numen/v1;numenv1";

// PluginLifecycleService handles lifecycle, ping, and graceful shutdown for all plugins.
service PluginLifecycleService {
  rpc Ping(PingRequest) returns (PingResponse);
  rpc Shutdown(ShutdownRequest) returns (ShutdownResponse);
  rpc Configure(ConfigureRequest) returns (ConfigureResponse);
}

message PingRequest {}

message PingResponse {
  string status = 1;
  int32 protocol = 2;
}

message ShutdownRequest {
  int32 timeout_seconds = 1;
}

message ShutdownResponse {
  bool success = 1;
}

message ConfigureRequest {
  string plugin_id = 1;
  string configuration_json = 2;
  map<string, string> values = 3;
}

message ConfigureResponse {
  bool success = 1;
  string error = 2;
}

// PluginSetting declares one setting in the plugin's declarative settings schema.
message PluginSetting {
  string key = 1;
  string type = 2;
  string title = 3;
  // The one line the settings row shows under the title.
  string description = 4;
  // The full text the info button beside the title opens. Empty shows no button.
  string details = 25;
  string default_json = 5;
  bool palette = 6;
  repeated PluginSettingOption options = 7;
  optional double min = 8;
  optional double max = 9;
  optional double step = 10;
  // The options of an enum setting under each value of another setting. The first of a list is the
  // default under that value.
  PluginSettingOptionsBy options_by = 12;
  // The condition under which the setting is shown and handed to the plugin.
  PluginSettingCondition when = 13;
  // The file extensions a setting of type file takes, each with its leading dot. Empty takes any file.
  repeated string accept = 14;
  // The icon the setting shows in the palette, by its Lucide name. Empty shows the default setting icon.
  string icon = 15;
  // Whether a setting of type file holds a list of paths, one per line.
  bool multiple = 16;
  // Whether the window applies the value while its control is focused, and restores the saved value
  // on leaving.
  bool preview = 17;
  // The registry the options are listed from, such as the installed themes. Empty where the setting
  // lists its own options.
  string options_from = 18;
  // The options in force under the values in force, resolved by the core. A window draws these and
  // follows no rule of options_by.
  repeated PluginSettingOption active_options = 19;
  // Whether the condition of the setting holds under the values in force, resolved by the core.
  bool is_shown = 20;
  // The value in force as JSON, resolved by the core: the stored value, else the default, else the
  // first of the options in force.
  string value_json = 21;
  // The operations a setting of type connections is used for. max is the number of rows.
  repeated string operations = 23;
  // Whether the manifest lets a setting of type connections that holds no row use every connection
  // whose type serves the operation. The person's choice is in the plugin field "discover".
  bool discover = 24;
  reserved 22;
}

// PluginSettingOption is one value an enum setting can hold.
message PluginSettingOption {
  string value = 1;
  // What a person reads for the value. Empty shows the value.
  string title = 2;
  // What a person reads under the setting while the value is in force.
  string detail = 3;
  // The condition the option is offered under, as in the manifest. The window evaluates it; an
  // option whose condition does not hold is shown and cannot be chosen. Empty offers it always.
  string when = 4;
}

// PluginSettingOptions is one list of options.
message PluginSettingOptions {
  repeated PluginSettingOption options = 1;
}

// PluginSettingOptionsBy gives a setting its options from the value of another setting.
message PluginSettingOptionsBy {
  // The key of the setting the options follow.
  string setting = 1;
  map<string, PluginSettingOptions> options = 2;
}

// PluginSettingCondition holds while a setting holds one of the values listed.
message PluginSettingCondition {
  string setting = 1;
  repeated string is = 2;
}

// PluginInfo describes a discovered plugin and its declarative settings.
message PluginInfo {
  string id = 1;
  string name = 2;
  string version = 3;
  string description = 4;
  repeated string capabilities = 5;
  repeated PluginSetting settings = 6;
  bool is_active = 7;
  // The permissions the manifest declares.
  repeated string permissions = 8;
  // Whether the plugin declares a frontend bundle a window loads.
  bool has_frontend = 11;
  // The readers the manifest declares, with the files each opens.
  repeated PluginReader readers = 12;
  // The components the frontend draws inside the plugin's settings.
  repeated PluginSettingsView settings_views = 13;
  // Whether the plugin declares a backend the host starts.
  bool has_backend = 14;
  // What the manifest declares, one entry per section that declares anything, in the order of
  // PluginContributionKind.
  repeated PluginContribution contributions = 15;
  // Whether the plugin stays off until the person enables it, when its settings hold no enabled value.
  bool is_off_by_default = 16;
  reserved 10;
}

// PluginContribution is one section of a plugin's manifest and the entries it declares, in the
// order the manifest declares them.
message PluginContribution {
  PluginContributionKind kind = 1;
  repeated PluginContributionItem items = 2;
}

// PluginContributionItem is one entry of a section of a manifest.
message PluginContributionItem {
  // The title of the entry, or its id where it declares no title.
  string text = 1;
  // The id or the target of the entry as the manifest writes it. Empty where it has none.
  string detail = 2;
  // The shortcut of a command or a keybinding as the manifest writes it, such as mod+shift+a. Empty
  // for every other entry.
  string keys = 3;
}

// PluginContributionKind is a section of a manifest, named after its key. The zero value means
// nothing. KEYBINDINGS lists only the bindings of commands the plugin does not declare; a binding
// of a command it declares is the keys of that command.
enum PluginContributionKind {
  PLUGIN_CONTRIBUTION_KIND_UNSPECIFIED = 0;
  PLUGIN_CONTRIBUTION_KIND_COMMANDS = 1;
  PLUGIN_CONTRIBUTION_KIND_KEYBINDINGS = 2;
  PLUGIN_CONTRIBUTION_KIND_TAB_KINDS = 3;
  PLUGIN_CONTRIBUTION_KIND_READERS = 4;
  PLUGIN_CONTRIBUTION_KIND_HANDLERS = 5;
  PLUGIN_CONTRIBUTION_KIND_TRIGGERS = 6;
  PLUGIN_CONTRIBUTION_KIND_TEXT_KINDS = 7;
  PLUGIN_CONTRIBUTION_KIND_NOTE_TYPES = 8;
  PLUGIN_CONTRIBUTION_KIND_THEMES = 9;
  PLUGIN_CONTRIBUTION_KIND_SLOTS = 10;
  PLUGIN_CONTRIBUTION_KIND_LISTENERS = 11;
  PLUGIN_CONTRIBUTION_KIND_VIEW_CAPABILITIES = 12;
  PLUGIN_CONTRIBUTION_KIND_DROP_HANDLERS = 13;
  PLUGIN_CONTRIBUTION_KIND_FRAME_ORIGINS = 14;
  PLUGIN_CONTRIBUTION_KIND_CONNECTION_TYPES = 15;
  PLUGIN_CONTRIBUTION_KIND_OPERATIONS = 16;
  PLUGIN_CONTRIBUTION_KIND_PERMISSIONS = 17;
  PLUGIN_CONTRIBUTION_KIND_DEPENDENCIES = 18;
  PLUGIN_CONTRIBUTION_KIND_SERVICES = 19;
  PLUGIN_CONTRIBUTION_KIND_CAPABILITIES = 20;
  PLUGIN_CONTRIBUTION_KIND_ACTIVATION_EVENTS = 21;
}

// PluginSettingsView is a component of a plugin's frontend drawn among its settings.
message PluginSettingsView {
  // The id the frontend registers the component under.
  string id = 1;

  // What the component is called.
  string title = 2;
}

// PluginReader is a tab of a plugin's frontend that opens files.
message PluginReader {
  // The id the frontend registers the reader under.
  string id = 1;

  // The extensions, lowercase and without the dot, of the files the reader
  // opens: those of the content types it declares where it is the default
  // reader among the enabled plugins.
  repeated string extensions = 2;
}

// PluginService allows querying discovered plugins and their settings schemas.
service PluginService {
  rpc GetPlugins(GetPluginsRequest) returns (GetPluginsResponse);

  // WatchPluginProcesses sends the plugin processes that run at once and again
  // on every change, at most once a second, for as long as the caller listens.
  rpc WatchPluginProcesses(WatchPluginProcessesRequest) returns (stream WatchPluginProcessesResponse);

  // ReleaseProcess tells the core that the process of a plugin has finished
  // its work. The core stops a process that holds no lease at once, and one
  // that holds a lease as soon as it returns the last. A lease taken after
  // the call cancels it. A plugin calls it through the host endpoint, which
  // names the plugin by its token; a window calls it for the plugin plugin_id
  // names. A plugin with no process answers success.
  rpc ReleaseProcess(ReleaseProcessRequest) returns (ReleaseProcessResponse);
}

message GetPluginsRequest {}

message GetPluginsResponse {
  repeated PluginInfo plugins = 1;
}

message WatchPluginProcessesRequest {}

message ReleaseProcessRequest {
  // The plugin whose process is released, when a window calls. The host
  // endpoint takes the plugin from the token.
  string plugin_id = 1;
}

message ReleaseProcessResponse {}

message WatchPluginProcessesResponse {
  // The processes that run, in the order of the plugin ids.
  repeated PluginProcess processes = 1;

  // When the core took the list, in milliseconds since the Unix epoch. A
  // list sent again unchanged carries the time it was first taken.
  int64 time_unix_ms = 2;
}

// PluginProcess is the process of one plugin that runs.
message PluginProcess {
  string plugin_id = 1;

  // The name the manifest gives the plugin. Empty for a plugin the core no
  // longer lists.
  string plugin_name = 2;

  // When the process started, in milliseconds since the Unix epoch.
  int64 start_time_unix_ms = 3;

  // When a lease on the process was last taken or returned, in milliseconds
  // since the Unix epoch.
  int64 last_use_time_unix_ms = 4;

  // The leases the process holds: open calls, open streams and reported work.
  int32 lease_count = 5;

  // Whether the plugin is served inside the core rather than by a process of
  // its own.
  bool is_in_process = 6;

  // From when the core stops the process for idleness, in milliseconds since
  // the Unix epoch; the core checks every 30 seconds. Zero while the process
  // holds a lease.
  int64 idle_stop_time_unix_ms = 7;

  // The severity of the worst health item of the plugin: HEALTH_SEVERITY_OK
  // where it has none.
  HealthSeverity health = 8;

  // The text of that item. Empty where it has none.
  string health_text = 9;
}

// PluginEventService hands a running plugin an event its manifest's activationEvents subscribe to.
// A plugin serves it only when it takes events. A plugin that takes the event and refuses it answers
// with error set; a status code means the call was not served or failed.
service PluginEventService {
  rpc DeliverEvent(DeliverEventRequest) returns (DeliverEventResponse);
}

message DeliverEventRequest {
  // The event as the host names it, such as onSearchSourceReady:<vault id>.
  string event = 1;
}

message DeliverEventResponse {
  PluginEventErrorCode error = 1;
  string reason = 2;
}

// value means it did not.
enum PluginEventErrorCode {
  PLUGIN_EVENT_ERROR_CODE_UNSPECIFIED = 0;

  // The plugin's event handler answered an error, which reason carries.
  PLUGIN_EVENT_ERROR_CODE_REFUSED = 1;
}
