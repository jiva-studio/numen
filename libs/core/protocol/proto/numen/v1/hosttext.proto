syntax = "proto3";

package numen.v1;

import "numen/v1/textsegment.proto";

option go_package = "github.com/jiva-studio/numen/libs/core/protocol/gen/numen/v1;numenv1";

// HostTextService serves the text versions of a vault to the plugins. The host
// identifies the plugin by its token; a call that reads needs vault:read and one
// that changes a version vault:write.
//
// Numen-Vault works the vault of that identity; without it a call works the
// vault the host is showing.
//
// A version made by the calling plugin is named by its key; any version is
// named by its id, which is the plugin id and the key joined by "/".
service HostTextService {
  // PutTextVersion records a version of the calling plugin, or replaces the
  // record it has under the key. The plugin writes the version's file into its
  // folder first; the host reads the file and records its hash. Every put
  // reindexes the file.
  rpc PutTextVersion(PutTextVersionRequest) returns (PutTextVersionResponse);

  // ListTextVersions lists the versions of a file and names the live one.
  rpc ListTextVersions(ListTextVersionsRequest) returns (ListTextVersionsResponse);

  // ReadText returns one page of any version's segments, read by the host from
  // the version's file.
  rpc ReadText(ReadTextRequest) returns (ReadTextResponse);
}

// TextSourceProperty is a frontmatter property of a note that a text version
// was made from: the key and its string value.
message TextSourceProperty {
  string key = 1;
  string value = 2;
}

// TextVersion is the host's record of one text of a file.
//
// A version has one root. source_version_id names another version, and
// input_hash is the hash of that version. source_property names a property of
// the note: the version is live while the note's frontmatter holds the key as
// that string, and input_hash is empty. With neither, the version is made from
// the file, and input_hash is the SHA-256, in hex, of the file's bytes. file
// is the name of the version's file in the folder of the plugin that made it;
// text_hash is the SHA-256 of that file's bytes.
// kind is what the text is, as the plugin that made it names it;
// the host compares it as an opaque string.
message TextVersion {
  string id = 1;
  string path = 2;
  string plugin_id = 3;
  string key = 4;
  string source_version_id = 5;
  string kind = 6;
  string input_hash = 7;
  string text_hash = 8;
  int64 create_time_unix_ms = 9;
  string file = 10;
  TextSourceProperty source_property = 11;
}

message PutTextVersionRequest {
  string path = 1;
  string key = 2;
  string source_version_id = 3;
  string kind = 4;
  string input_hash = 5;
  // file is the name of the version's file in the calling plugin's folder.
  string file = 6;
  // source_property is set for a version made from a property of the note,
  // with no source_version_id and no input_hash.
  TextSourceProperty source_property = 7;
}

message PutTextVersionResponse {
  TextVersion version = 1;
  TextErrorCode error = 2;
}

message ListTextVersionsRequest {
  string path = 1;
}

message ListTextVersionsResponse {
  repeated TextVersion versions = 1;
  // live_version_id is the version shown and indexed, and empty where none is live.
  string live_version_id = 2;
  TextErrorCode error = 3;
}

message ReadTextRequest {
  string path = 1;
  string version_id = 2;
  // cursor is the next_cursor of the page before, and empty for the first. Not
  // used with a length.
  string cursor = 3;
  // The start of a ranged read in the whole text, in bytes.
  int64 start = 4;
  // Set: read the range from start of this many bytes, zero to the end,
  // truncated at whole characters, as the segments it covers, each truncated to
  // the range. Unset:
  // read one page by cursor.
  optional int64 length = 5;
}

message ReadTextResponse {
  repeated TextSegment segments = 1;
  // next_cursor is empty on the last page.
  string next_cursor = 2;
  TextErrorCode error = 3;
  // For a ranged read: the start of the first segment returned in the whole
  // text, and the size of the whole text in bytes.
  int64 start = 4;
  int64 size = 5;
}
