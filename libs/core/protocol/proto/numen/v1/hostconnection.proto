syntax = "proto3";

package numen.v1;

import "numen/v1/settings.proto";

option go_package = "github.com/jiva-studio/numen/libs/core/protocol/gen/numen/v1;numenv1";

// HostConnectionService is what a plugin calls to carry out an operation through its connections. The
// core takes the connections from the rows of the settings of the calling plugin, which the token names;
// a plugin that holds connections:use uses every connection that serves an operation none of its settings
// of rows lists. A request names no key. The payload and the frames are bytes of the contract the
// operation belongs to.
service HostConnectionService {
  // Call carries out one operation. The core goes to the next row only when a row fails before its first
  // data frame. The stream holds data frames and ends with one done or one failure.
  rpc Call(HostConnectionServiceCallRequest) returns (stream HostConnectionServiceCallResponse);

  // ListRows returns the rows of the calling plugin for an operation, as ConnectionCallService.ListRows
  // does for a plugin view.
  rpc ListRows(HostConnectionServiceListRowsRequest) returns (HostConnectionServiceListRowsResponse);

  // ListRowOptions returns the values a row field of a connection among the rows of the calling plugin can
  // take, as ConnectionCallService.ListRowOptions does for a plugin view.
  rpc ListRowOptions(HostConnectionServiceListRowOptionsRequest) returns (HostConnectionServiceListRowOptionsResponse);
}

// Priority says whose action a call serves. The zero value is background, so a call that sets none
// waits behind the calls of a person's actions.
enum Priority {
  PRIORITY_UNSPECIFIED = 0;
  // PRIORITY_INTERACTIVE is a call made for a person's action, such as a search or a check of a line.
  PRIORITY_INTERACTIVE = 1;
  // PRIORITY_BACKGROUND is a call made for work that serves no person's action, such as indexing.
  PRIORITY_BACKGROUND = 2;
}

// CallErrorCode is the reason a call did not succeed.
enum CallErrorCode {
  CALL_ERROR_CODE_UNSPECIFIED = 0;
  // CALL_ERROR_CODE_NO_CONNECTION is a plugin with no row that can serve the operation.
  CALL_ERROR_CODE_NO_CONNECTION = 1;
  // CALL_ERROR_CODE_ALL_FAILED is every row set aside or failed; the failures name each one. A row that
  // fails after its first data frame is ALL_FAILED with that one connection.
  CALL_ERROR_CODE_ALL_FAILED = 2;
  // CALL_ERROR_CODE_STOPPED is a request that is wrong in itself, and the failure names the connection.
  CALL_ERROR_CODE_STOPPED = 3;
}

// CallRowFailure is one row that did not answer.
message CallRowFailure {
  string connection_name = 1;
  string reason = 2;
}

// CallFailure ends a call that did not succeed.
message CallFailure {
  CallErrorCode error = 1;
  string detail = 2;
  repeated CallRowFailure failures = 3;
}

message HostConnectionServiceCallRequest {
  // operation is the name of the operation, such as "llm.chat".
  string operation = 1;
  bytes payload = 2;
  Priority priority = 3;
  // preferred is unset for the rows in their order.
  PreferredRow preferred = 4;
}

// HostConnectionServiceCallResponse is one frame of a call.
message HostConnectionServiceCallResponse {
  oneof frame {
    bytes data = 1;
    // done ends the call; it may be empty.
    bytes done = 2;
    CallFailure failure = 3;
  }
}

// PreferredRow is the row a call asks first. connection_id names a connection among the rows of the plugin
// for the operation; the call goes to it with options in place of the values of its row fields, then to
// the other rows in order. A connection that is not among the rows is ignored. is_exclusive asks that row
// alone: the call ends with its failure, and with no_connection where the connection is not among the
// rows.
message PreferredRow {
  string connection_id = 1;
  map<string, string> options = 2;
  bool is_exclusive = 3;
}

// CallRowField is a row field the type of a connection declares. options_from is the operation that lists
// its values, empty for none. is_required is a field a row must hold a value for.
message CallRowField {
  string key = 1;
  string title = 2;
  string options_from = 3;
  bool is_required = 4;
}

// CallRow is one row of a plugin: its connection, the values of its row fields, and the row fields the
// type of the connection declares.
message CallRow {
  string connection_id = 1;
  string connection_name = 2;
  map<string, string> options = 3;
  repeated CallRowField fields = 4;
}

message HostConnectionServiceListRowsRequest {
  string operation = 1;
}

message HostConnectionServiceListRowsResponse {
  repeated CallRow rows = 1;
}

message HostConnectionServiceListRowOptionsRequest {
  string operation = 1;
  string connection_id = 2;
  // field is the key of the row field.
  string field = 3;
  // options are the values of the row fields so far.
  map<string, string> options = 4;
}

message HostConnectionServiceListRowOptionsResponse {
  repeated Option options = 1;
}
