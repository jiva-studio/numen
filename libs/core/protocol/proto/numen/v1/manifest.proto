syntax = "proto3";

package numen.v1;

import "google/protobuf/struct.proto";

option go_package = "github.com/jiva-studio/numen/libs/core/protocol/gen/numen/v1;numenv1";

// Manifest is the schema of a plugin's manifest.json. The file is the proto3 JSON
// form of this message: field names are the lowerCamelCase json_name of each field.
// A key the schema does not name is reported as a warning by the reader. A message here only describes the
// shape; the invariants between fields are checked by the manifest reader.
message Manifest {
  string id = 1;
  string name = 2;
  string version = 3;
  // protocol is the plugin protocol the plugin uses. Absent means 1.
  int32 protocol = 4;
  string description = 5;
  repeated string capabilities = 6;
  // targets are the application windows the plugin runs in. Empty means every target.
  repeated string targets = 7;
  // activation_events are the events that start the plugin's backend and deliver the event to it. The
  // value `*` matches every event the host emits. A plugin with a backend also receives, without
  // declaring it, the event `onFile:<extension>` for a file it opens by a reader or a handle.
  repeated string activation_events = 8;
  repeated string permissions = 9;
  // dependencies are what the host provisions for the plugin: runtimes, models, binaries and datasets.
  repeated ManifestDependency dependencies = 11;
  ManifestBackend backend = 13;
  ManifestFrontend frontend = 14;
  repeated ManifestSetting settings = 15;
  repeated string services = 17;
  repeated ManifestSettingsView settings_views = 24;
  // contributes is what the plugin adds to the application, known before its
  // frontend is loaded.
  ManifestContributes contributes = 26;
  // is_off_by_default keeps the plugin off until the person enables it.
  bool is_off_by_default = 27;
}

// ManifestContributes lists the contributions a plugin makes to the application.
message ManifestContributes {
  // tab_kinds are the kinds of tab the plugin's frontend registers.
  repeated ManifestTabKind tab_kinds = 1;
  // feature names what the plugin provides, in words a person reads in a
  // placeholder for an unavailable tab.
  string feature = 2;
  // category groups the plugin in lists.
  string category = 3;
  // themes are the stylesheets the plugin adds to the list of themes.
  repeated ManifestTheme themes = 5;
  // readers are the tabs of the plugin's frontend that open files, each by the id the frontend
  // registers it under and the content types it opens.
  repeated ManifestReader readers = 9;
  // note_types are the types of note the plugin gives meaning to, and how the index keeps the notes
  // of each.
  repeated ManifestNoteType note_types = 10;
  // frame_origins are the https origins the plugin's pages frame.
  repeated string frame_origins = 11;
  // commands are the commands the plugin declares, whichever part of the plugin runs them. The
  // application learns which part from where the handler is registered.
  repeated ManifestCommand commands = 12;
  // slots place the commands, views and submenus of the plugin in the slots of a window and in
  // submenus, see slots.json for the list of slots.
  repeated ManifestSlotEntry slots = 15;
  // handlers are the plugin's handlers of shared commands, see commands.json for the list of shared
  // commands.
  repeated ManifestHandler handlers = 16;
  // triggers run the plugin's own handlers on events, see events.json for the list of events.
  repeated ManifestTrigger triggers = 17;
  // text_kinds name, in words a person reads, the kinds of text version the plugin makes.
  repeated ManifestTextKind text_kinds = 18;
  // listeners are the ports the host binds for the plugin.
  repeated ManifestListener listeners = 14;
  // connection_types are the kinds of connection the plugin provides.
  repeated ManifestConnectionType connection_types = 22;
  // operations title the operations of connection types, of this plugin or of another, in words a
  // person reads. Each name is declared once in a manifest.
  repeated ManifestOperation operations = 23;
  // keybindings bind keys to commands, see the keybindings list of commands.json for the keys of the
  // application.
  repeated ManifestKeybinding keybindings = 19;
  // view_capabilities are the kinds of view the plugin's frontend draws for other plugins to mount: a
  // kind the application defines (conversation, note-editor, vault-summary) or a kind named after the
  // plugin id. The frontend registers a view only for a kind listed here.
  repeated string view_capabilities = 20;
  // drop_handlers are the kinds of dropped data the plugin's frontend takes. The frontend registers a
  // drop handler only for types listed here.
  repeated ManifestDropHandler drop_handlers = 21;
}

// ManifestDropHandler lists data types of a drag from outside the window, such as text/uri-list, that a
// plugin takes. Dropped data is user content: the plugin needs vault:read to register the handler.
message ManifestDropHandler {
  // types are the data types the handler takes, each declared by one plugin only.
  repeated string types = 1;
}

// ManifestKeybinding binds a key to a command, optionally with values for its arguments, under a
// condition.
message ManifestKeybinding {
  // key is a chord such as "mod+shift+p": the modifiers mod, ctrl, alt, shift and meta, then one key
  // name. A single letter such as "n" is a key without modifiers.
  string key = 1;
  // command is the id the manifest declares the command under, or the full id of a command of
  // another owner, such as app:file.reveal.
  string command = 2;
  // values are the values of the arguments of the command by argument name, as text, checked as
  // the values of a slot entry.
  map<string, string> values = 3;
  // when is a CEL condition over the variables of libs/core/protocol/when.json. Empty is always true.
  string when = 4;
}

// ManifestConnectionType is a kind of connection a plugin provides: a service or a program the core
// sends requests to for the plugin. The id of the type everywhere else is the plugin id, a slash and
// this id.
message ManifestConnectionType {
  // id is the local part of the type id; lowercase words joined by hyphens.
  string id = 1;
  string title = 2;
  string description = 3;
  // operations are the names of the operations the type serves, such as "llm.chat": lowercase words
  // joined by dots. The core knows them as names only.
  repeated string operations = 4;
  // fields are the values a connection of the type holds, in the order the form shows them.
  repeated ManifestConnectionField fields = 5;
  // row_fields are the values a row that names a connection of the type holds besides the connection,
  // such as a model. The core hands them to the provider as the options of the call.
  repeated ManifestConnectionField row_fields = 6;
}

// ManifestOperation titles an operation a connection type serves.
message ManifestOperation {
  // name is the operation, such as "acp.task": lowercase words joined by dots.
  string name = 1;
  // title is a lowercase verb phrase that completes "This type cannot ...", such as "run agent tasks".
  string title = 2;
}

// ManifestConnectionField is one value a connection of a type holds.
message ManifestConnectionField {
  // key is the name the value is stored and sent under; letters and digits, starting with a letter.
  // The key parallelRequests is read by the core as the limit of calls running at once.
  string key = 1;
  // type is string, number, boolean, enum, file or secret. A secret is kept in the key store.
  string type = 2;
  string title = 3;
  string description = 4;
  google.protobuf.Value default = 5;
  // fixed_value is a value every connection of the type has. It is not stored and not edited.
  optional string fixed_value = 6;
  bool is_required = 7 [json_name = "required"];
  // is_address marks the one string field that holds the address of the service. A change of it
  // clears the secret fields of the connection.
  bool is_address = 8;
  // options are the values of an enum field.
  google.protobuf.ListValue options = 9;
  optional double min = 10;
  optional double max = 11;
  optional double step = 12;
  // options_from names an operation of the type whose done frame is a numen.v1.Options message: the
  // values a row field can take. It is called with the options the row holds so far.
  string options_from = 13;
}

// ManifestTextKind is the readable name of one kind of text version a plugin makes. The application
// lists a version by this name and by the raw kind where the plugin declares none.
message ManifestTextKind {
  // kind is the kind the plugin gives its text versions.
  string kind = 1;
  // title is the name a person reads, such as "Recognized text".
  string title = 2;
}

// ManifestListener is a TCP port on 127.0.0.1 the host binds for the plugin while the plugin is
// enabled. The host starts the plugin on a connection and forwards its bytes to the port the
// plugin reports for the listener in its ready line.
message ManifestListener {
  // name identifies the listener within the plugin; lowercase words joined by hyphens.
  string name = 1;
  // port is a fixed port the host binds, 1024 to 65535. Set exactly one of port and port_setting.
  int32 port = 2;
  // protocol is the transport, "tcp".
  string protocol = 3;
  // port_setting is the key of the plugin's number setting that stores the port the host binds; the
  // host binds again when the setting changes. Set exactly one of port and port_setting.
  string port_setting = 4;
}

// ManifestSlotEntry places one thing in a slot of a window, or in a submenu a plugin declares. The
// owner of the slot draws a command, as a button in a bar and as a row in a menu; a view draws
// itself; a submenu becomes a place other entries name as their slot.
message ManifestSlotEntry {
  // slot is a slot of the list in slots.json, or the id of a submenu.
  string slot = 1;
  oneof placed {
    // command is the id the manifest declares the command under, or the full id of a command of
    // another owner, such as app:settings.open.
    string command = 2;
    // view is the id the frontend registers the component under.
    string view = 3;
    // submenu is the id of the submenu the entry declares. It is unique among all plugins.
    string submenu = 4;
  }
  // title is the title of a submenu.
  string title = 5;
  // icon is the kebab-case icon name of a submenu. Empty for none.
  string icon = 6;
  // group names the entries a slot draws together; groups sort alphanumerically, and an entry
  // without one is in the last group. A separator is drawn between groups.
  string group = 7;
  // order sorts the entries of a group, lowest first, then by plugin id. Absent sorts after every
  // order.
  optional int32 order = 8;
  // when is a condition over the target of the place, such as "isFolder && !isMultiple": the keys
  // isRoot, isFolder and isMultiple combined with &&, || and ! and parentheses. The entry is left out
  // while it is false. Empty is always true.
  string when = 9;
  // values are the values of the arguments of the command by argument name, as text, in the form a
  // run of a command takes. The host passes them when the entry is chosen. Only a command entry
  // holds them.
  map<string, string> values = 10;
}

// ManifestHandler is the plugin's handler of a shared command of commands.json. The plugin's code
// registers the handler under the full id of the command.
message ManifestHandler {
  // command is the full id of the shared command, such as app:file.createText.
  string command = 1;
  // title is what a person reads the handler as, such as Extract text layer.
  string title = 2;
  // when is the CEL condition over which targets the handler handles the command. Empty is every
  // target.
  string when = 3;
}

// ManifestTrigger runs the plugin's own handler of a shared command over the file of an event.
message ManifestTrigger {
  // event is the event of events.json, such as file.added.
  string event = 1;
  // command is the full id of the shared command whose handler of this plugin runs.
  string command = 2;
  // when is the CEL condition over the file and the settings under which the trigger runs. Empty is
  // every file.
  string when = 3;
}

// ManifestTheme is a theme a plugin adds to the list of themes.
message ManifestTheme {
  // id is the slug the theme is named by inside the plugin.
  string id = 1;
  // name is the title the theme is listed with.
  string name = 2;
  // appearance is light or dark when the theme sets one color scheme, and empty when it
  // follows the mode.
  string appearance = 3;
  // file is the path of the stylesheet relative to the plugin folder.
  string file = 4;
}

// ManifestTabKind is a kind of tab the plugin registers.
message ManifestTabKind {
  // kind is the id the frontend registers the kind under.
  string kind = 1;
  string title = 2;
  // icon is the kebab-case name of an icon of the application's icon set.
  string icon = 3;
  // when is the CEL condition over a note, such as "target.noteType == 'deck'", under which the note
  // opens in a tab of this kind. Empty opens no note.
  string when = 4;
  // rank is default or alternate, as a reader's: among the kinds whose condition holds over a note,
  // a default kind is chosen before an alternate one. Empty is default.
  string rank = 5;
  // is_note_editor says the kind edits the text of the note its tab opens on: the window gives its
  // tabs the store of open notes, which saves what is typed.
  bool is_note_editor = 6;
}

message ManifestDependency {
  string id = 1;
  // kind is one of runtime, model, binary and dataset.
  string kind = 2;
  string version = 3;
  string source_url = 4;
  string checksum_sha256 = 5;
  map<string, string> metadata = 6;
}

// ManifestBackend declares that the plugin has a backend process.
message ManifestBackend {
  // entrypoint is the path of the executable relative to the plugin folder.
  string entrypoint = 2;
  // idle_stop_seconds is how long the process may run without a lease before the host stops it,
  // from 30 to 3600 seconds. Absent is 180.
  int32 idle_stop_seconds = 3;
}

// ManifestFrontend declares that the plugin has a frontend. The bundle is dist/index.js and the
// stylesheet is dist/styles.css in the plugin folder.
message ManifestFrontend {}

// ManifestSettingOption is one value an enum setting holds. A list of options
// in a manifest holds each option as this message, or as a bare string that
// stands for an option with that value.
message ManifestSettingOption {
  string value = 1;
  string title = 2;
  string detail = 3;
  repeated string dependencies = 4;
  // when is a condition the option is offered under, as a CEL expression over the variables of
  // when.json. Empty offers the option always.
  string when = 5;
}

message ManifestOptionsBy {
  string setting = 1;
  // options are the options under each value of the setting named. Each is a
  // JSON list of options.
  map<string, google.protobuf.ListValue> options = 2;
}

message ManifestCondition {
  string setting = 1;
  repeated string is = 2;
}

message ManifestSetting {
  string key = 1;
  string type = 2;
  string title = 3;
  string description = 4;
  google.protobuf.Value default = 5;
  bool palette = 6;
  string icon = 7;
  // options is a JSON list of options.
  google.protobuf.ListValue options = 8;
  optional double min = 9;
  optional double max = 10;
  optional double step = 11;
  ManifestOptionsBy options_by = 14;
  ManifestCondition when = 15;
  repeated string accept = 16;
  // multiple makes a file setting hold a list of paths, one per line.
  bool multiple = 17;
  // preview makes the window apply the value while its control is focused, and restore the saved
  // value on leaving.
  bool preview = 18;
  // options_from names a registry the options are listed from, such as the installed themes.
  string options_from = 19;
  // generate makes the host fill an empty value; "token" is 32 random bytes in hex.
  string generate = 20;
  // operations are the operations a setting of type connections is used for, such as "llm.chat". A
  // call of the plugin for one of them goes through the rows of the setting, and a plugin calls no
  // operation no setting names. max is the number of rows.
  repeated string operations = 22;
  // discover makes a setting of type connections that holds no row use every connection whose type
  // serves the operation, in the order of the connections, while the person leaves it on.
  bool discover = 23;
  reserved 21;
}

message ManifestNoteType {
  string type = 1;
  optional bool chunks = 2;
  // headings is a JSON list of heading levels. Absent keeps every heading, and
  // an empty list keeps none.
  google.protobuf.ListValue headings = 3;
  repeated int32 id_heading_levels = 4;
  string id_pattern = 5;
}

message ManifestCommandArgument {
  string name = 1;
  string title = 2;
  string type = 3;
  bool is_required = 4 [json_name = "required"];
}

message ManifestCommand {
  string id = 1;
  string title = 2;
  string icon = 3;
  repeated ManifestCommandArgument arguments = 7;
  // when is the CEL condition under which the command is available at all, over the variables of
  // libs/core/protocol/when.json, such as "target.isNote". Empty is always. A command whose condition
  // names version.* offers one item per text version of a file for which it holds.
  string when = 11;
  string permission = 12;
  reserved 10;
}

message ManifestReader {
  string id = 1;
  repeated string content_types = 2;
  string rank = 3;
}

message ManifestSettingsView {
  string id = 1;
  string title = 2;
}
