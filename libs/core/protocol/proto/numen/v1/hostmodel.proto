syntax = "proto3";

package numen.v1;

import "numen/v1/embedding.proto";

option go_package = "github.com/jiva-studio/numen/libs/core/protocol/gen/numen/v1;numenv1";

// HostModelService is what a plugin calls to carry out an operation on a model. The core takes the
// connections from the rows of the settings of the calling plugin, which the token names. A request
// names no connection, no model and no key.
service HostModelService {
  // Complete turns messages into the text of an answer.
  rpc Complete(HostModelServiceCompleteRequest) returns (HostModelServiceCompleteResponse);

  // Chat streams the next turn of a conversation: text, then tool calls, then the end of the turn. The
  // core goes to the next row only when a row fails before its first event. One call is one turn and the
  // history travels with it.
  rpc Chat(HostModelServiceChatRequest) returns (stream HostModelServiceChatResponse);

  // Embed turns texts into vectors, in the order of the texts.
  rpc Embed(HostModelServiceEmbedRequest) returns (HostModelServiceEmbedResponse);

  // GetEmbeddingProfile returns the profile of the embedding model of the first row that answers.
  rpc GetEmbeddingProfile(HostModelServiceGetEmbeddingProfileRequest) returns (HostModelServiceGetEmbeddingProfileResponse);
}

// Priority says whose action a call serves. The zero value is background, so a call that sets none
// waits behind the calls of a person's actions.
enum Priority {
  PRIORITY_UNSPECIFIED = 0;
  // PRIORITY_INTERACTIVE is a call made for a person's action, such as a search or a check of a line.
  PRIORITY_INTERACTIVE = 1;
  // PRIORITY_BACKGROUND is a call made for work that serves no person's action, such as indexing.
  PRIORITY_BACKGROUND = 2;
}

// HostModelErrorCode is the reason a served call did not succeed. The zero value is a call that
// succeeded.
enum HostModelErrorCode {
  HOST_MODEL_ERROR_CODE_UNSPECIFIED = 0;
  // HOST_MODEL_ERROR_CODE_NO_CONNECTION is a plugin with no row that can serve the operation.
  HOST_MODEL_ERROR_CODE_NO_CONNECTION = 1;
  // HOST_MODEL_ERROR_CODE_ALL_FAILED is every row set aside or failed; the failures name each one.
  HOST_MODEL_ERROR_CODE_ALL_FAILED = 2;
  // HOST_MODEL_ERROR_CODE_REJECTED is a request that is wrong in itself, and the failure names the connection.
  HOST_MODEL_ERROR_CODE_REJECTED = 3;
}

// HostModelFailure is one row that did not answer.
message HostModelFailure {
  string connection_name = 1;
  string reason = 2;
}

message HostModelMessage {
  // role is system, user or assistant.
  string role = 1;
  string text = 2;
}

message HostModelServiceCompleteRequest {
  repeated HostModelMessage messages = 1;
  optional double temperature = 2;
  int32 max_tokens = 3;
  Priority priority = 4;
}

message HostModelServiceCompleteResponse {
  string text = 1;
  HostModelErrorCode error = 2;
  string detail = 3;
  repeated HostModelFailure failures = 4;
}

message HostModelChatMessage {
  // role is system, user, assistant or tool.
  string role = 1;
  string text = 2;
  // tool_calls are the calls an assistant message asked for.
  repeated HostModelToolCall tool_calls = 3;
  // tool_call_id is the call a tool message answers.
  string tool_call_id = 4;
}

message HostModelToolDefinition {
  string name = 1;
  string description = 2;
  // parameters_json is the JSON schema of the arguments.
  string parameters_json = 3;
}

message HostModelToolCall {
  string id = 1;
  string name = 2;
  // arguments_json is the arguments as one JSON object.
  string arguments_json = 3;
}

// HostModelChatFinishReason is why a turn ended.
enum HostModelChatFinishReason {
  HOST_MODEL_CHAT_FINISH_REASON_UNSPECIFIED = 0;
  // HOST_MODEL_CHAT_FINISH_REASON_STOP is an answer the model finished.
  HOST_MODEL_CHAT_FINISH_REASON_STOP = 1;
  // HOST_MODEL_CHAT_FINISH_REASON_TOOL_CALLS is a turn that asks for tool calls.
  HOST_MODEL_CHAT_FINISH_REASON_TOOL_CALLS = 2;
  // HOST_MODEL_CHAT_FINISH_REASON_LENGTH is an answer cut off at the length limit.
  HOST_MODEL_CHAT_FINISH_REASON_LENGTH = 3;
}

message HostModelChatFinish {
  HostModelChatFinishReason reason = 1;
}

message HostModelServiceChatRequest {
  repeated HostModelChatMessage messages = 1;
  repeated HostModelToolDefinition tools = 2;
  optional double temperature = 3;
  int32 max_tokens = 4;
  Priority priority = 5;
}

// HostModelChatError is a turn that did not succeed. A failure after the first event is ALL_FAILED with
// the one connection that failed.
message HostModelChatError {
  HostModelErrorCode error = 1;
  string detail = 2;
  repeated HostModelFailure failures = 3;
}

// HostModelServiceChatResponse is one event of a turn. A turn ends with a finish or an error.
message HostModelServiceChatResponse {
  oneof event {
    string text_delta = 1;
    HostModelToolCall tool_call = 2;
    HostModelChatFinish finish = 3;
    HostModelChatError failure = 4;
  }
}

message HostModelServiceEmbedRequest {
  repeated string texts = 1;
  Priority priority = 2;
}

message HostModelServiceEmbedResponse {
  repeated FloatVector vectors = 1;
  HostModelErrorCode error = 2;
  string detail = 3;
  repeated HostModelFailure failures = 4;
}

message HostModelServiceGetEmbeddingProfileRequest {}

message HostModelServiceGetEmbeddingProfileResponse {
  // model is the model of the row that answered.
  string model = 1;
  string source = 2;
  string pooling = 3;
  string query_prefix = 4;
  string document_prefix = 5;
  int32 dimensions = 6;
  // max_tokens is zero when the provider does not know the limit.
  int32 max_tokens = 7;
  HostModelErrorCode error = 8;
  string detail = 9;
  repeated HostModelFailure failures = 10;
}
