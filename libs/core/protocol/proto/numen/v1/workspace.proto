syntax = "proto3";

// showing.
//
// The tabs the window has open and the places something else asks to be put in
// front of the person are the window's. What the vault is and what has changed
// in it is vault.proto.
package numen.v1;

import "numen/v1/shared.proto";

option go_package = "github.com/jiva-studio/numen/libs/core/protocol/gen/numen/v1;numenv1";

// WorkspaceService answers where in the vault the person stands, and takes what
// the window has open.
service WorkspaceService {
  // WatchFocus reports the places something else asked to be put in front of
  // the person — an agent working the vault beside them — for as long as the
  // caller listens. What travelling there looks like is the client's.
  rpc WatchFocus(WatchFocusRequest) returns (stream WatchFocusResponse);

  // WriteOpenTabs says what currently open — every tab of the window, and
  // which of them is active. The client says so again whenever any of it
  // changes, and an agent working the vault beside them reads what it last
  // said.
  rpc WriteOpenTabs(WriteOpenTabsRequest) returns (WriteOpenTabsResponse);

  // ReadOpenTabs returns the tabs last written for the vault in the window. The
  // core keeps them across restarts, and the window opens them again.
  rpc ReadOpenTabs(ReadOpenTabsRequest) returns (ReadOpenTabsResponse);

  // DetachTab asks that a tab be opened in a new window of its own.
  rpc DetachTab(DetachTabRequest) returns (DetachTabResponse);

  // WatchTabLinks streams the link groups of the vault and the linkable tabs of
  // all windows: a snapshot first, a snapshot after each change, and each path
  // sync. A slow stream skips events: a newer snapshot replaces a pending one,
  // and a newer path sync of a group replaces a pending one of that group. Each
  // snapshot carries the current path of each group, so a window that skipped
  // a sync moves its tabs on the next snapshot. When the last stream of a
  // window ends, the tabs of that window are unlinked unless the window watches
  // again within a grace period.
  rpc WatchTabLinks(WatchTabLinksRequest) returns (stream WatchTabLinksResponse);

  // CancelWatchTabLinks cancels the WatchTabLinks stream of a window.
  rpc CancelWatchTabLinks(CancelWatchTabLinksRequest) returns (CancelWatchTabLinksResponse);

  // WriteTabLinks links two tabs, unlinks a tab, or reports the linkable tabs
  // of a window.
  rpc WriteTabLinks(WriteTabLinksRequest) returns (WriteTabLinksResponse);

  // SyncTabPath sends the new path of a linked tab to every window that watches
  // the tab links.
  rpc SyncTabPath(SyncTabPathRequest) returns (SyncTabPathResponse);

  // ReadDetachedTab returns the tab and saved state of a pending DetachTab. The
  // core stores the tab for the detach grace period.
  rpc ReadDetachedTab(ReadDetachedTabRequest) returns (ReadDetachedTabResponse);

  // MoveTab sends a tab to another window that watches the tab links, and
  // responds after that window accepts the tab.
  rpc MoveTab(MoveTabRequest) returns (MoveTabResponse);

  // AcceptTabMove reports that a window opened a moved tab.
  rpc AcceptTabMove(AcceptTabMoveRequest) returns (AcceptTabMoveResponse);

  // HighlightWindow turns the outline of a window on or off.
  rpc HighlightWindow(HighlightWindowRequest) returns (HighlightWindowResponse);
}

message DetachTabRequest {
  // The tab to open in a new window, with its saved state. The new window
  // opens it with the same id, so the tab keeps its links.
  Tab tab = 1;

  // The position on screen to open the new window at.
  int32 x = 2;
  int32 y = 3;

  // The size of the new window in CSS pixels. 0 keeps the default size.
  int32 width = 4;
  int32 height = 5;
}

message DetachTabResponse {
  // Unspecified after the new window accepts the tab. On any other value the
  // source window keeps the tab.
  TabMoveErrorCode error = 1;
}

message WatchFocusRequest {}

message WatchFocusResponse {
  // The source to put in front of the person: a note to see the neighborhood
  // from, or a document to open.
  string path = 1;

  // The runs of that source's text to open on, counted in bytes. The person is
  // taken to the first and the rest are shown where they fall. None at all
  // names the source and no place inside it, which is what a note arrives with.
  repeated Range ranges = 2;

  // The id of an open tab to make active; when set, path and ranges are empty.
  string tab_id = 3;
}

message WriteOpenTabsRequest {
  // Every tab the window has open, in the order the person was last in them.
  repeated Tab tabs = 1;

  // Which of them the person is looking at, by its id. Empty where the window
  // has nothing open.
  string active_id = 2;
}

message WriteOpenTabsResponse {}

message ReadOpenTabsRequest {}

message ReadOpenTabsResponse {
  // The tabs last written, in the order they were written.
  repeated Tab tabs = 1;

  // The id of the tab that was active, empty where none was.
  string active_id = 2;
}

// A Tab is one tab of the window: what kind it is, and its contents.
//
// The kind is the name a plugin registers the tab kind under. A reader that
// does not know the kind knows a tab of that kind is open and no more.
message Tab {
  // Id is what the window calls this tab, which the active id names.
  string id = 1;

  // Kind is the registered name of the tab kind.
  string kind = 2;

  // Path is the file it holds, by the path the vault files it under, and empty
  // for a tab holding no file.
  string path = 3;

  // Title is what the tab is called, as the person reads it.
  string title = 4;

  // State is the JSON the plugin owning the kind saved for the tab, such as the
  // place it shows. The core and the window store it unread; empty for a tab
  // whose kind saves none.
  string state = 5;

  // Place is the JSON of the place the reader of the tab reported, in the shape
  // the reader and the plugins reading it agree on. The core and the window pass
  // it on unread; empty for a tab whose kind reports none.
  string place = 6;
}

message WatchTabLinksRequest {
  // Id of the watching window, chosen by the window.
  string window_id = 1;
}

message WatchTabLinksResponse {
  // A keepalive sets none.
  oneof event {
    TabLinks links = 1;
    TabPathSync sync = 2;

    // A tab sent to the watching window. The window opens it with its id and
    // saved state, and calls AcceptTabMove with the move id.
    MovedTab moved_tab = 3;

    // Whether the watching window shows the highlight outline.
    WindowHighlight highlight = 4;
  }
}

// TabLinks is the set of link groups of the vault, the linkable tabs of all
// windows, and the windows that reported their tabs.
message TabLinks {
  repeated TabLinkGroup groups = 1;
  repeated LinkableTab tabs = 2;

  // The main window first, then the others in the order they first reported.
  repeated TabWindow windows = 3;
}

// A TabWindow is the last report of a window about itself.
message TabWindow {
  // Set by the core; empty in the report of a window.
  string id = 1;

  bool is_main = 2;

  // The active tab of the window; both are empty for a window with no tabs.
  string active_title = 3;
  string active_kind = 4;

  // Every tab the window has open, linkable or not.
  int32 tab_count = 5;
}

message WindowHighlight {
  bool is_on = 1;
}

// A TabLinkGroup is two or more tabs that move to the same path together.
message TabLinkGroup {
  string id = 1;

  // The color the group is marked with, from 1 to 4.
  int32 color_index = 2;

  repeated string tab_ids = 3;

  // The last path synced in the group, and its title. Empty before the first
  // sync.
  string path = 4;
  string title = 5;
}

// A LinkableTab is an open tab whose kind supports navigation to a path.
message LinkableTab {
  string id = 1;
  string kind = 2;
  string title = 3;

  // Id of the window that has the tab open. Set by the core; empty in a tab
  // report from a window.
  string window_id = 4;
}

// A TabPathSync is the new path of a linked tab.
message TabPathSync {
  string group_id = 1;
  string source_tab_id = 2;
  string path = 3;
  string title = 4;
}

message CancelWatchTabLinksRequest {
  string window_id = 1;
}

message CancelWatchTabLinksResponse {}

message WriteTabLinksRequest {
  // Id of the writing window.
  string window_id = 1;

  oneof change {
    // Links two tabs. If a tab is already in a group, the other tab joins it.
    TabLink link = 2;

    // Removes a tab from its group.
    string unlink_tab_id = 3;

    // All linkable tabs of the window. A tab of the window missing from the
    // list is unlinked, unless it has a pending detach.
    WindowTabs tabs = 4;
  }
}

message TabLink {
  string source_tab_id = 1;
  string target_tab_id = 2;
}

message WindowTabs {
  repeated LinkableTab tabs = 1;
  TabWindow window = 2;
}

message WriteTabLinksResponse {}

message SyncTabPathRequest {
  // Id of the linked tab that navigated.
  string source_tab_id = 1;
  string path = 2;
  string title = 3;
}

message SyncTabPathResponse {}

message ReadDetachedTabRequest {
  string tab_id = 1;

  // The window that opens the tab. The first window that reads a detach owns
  // it; other windows read no tab.
  string window_id = 2;
}

message ReadDetachedTabResponse {
  // Unset where no detach of the tab is pending for the window.
  Tab tab = 1;

  // The id the window passes to AcceptTabMove after it opens the tab.
  string move_id = 2;
}

message MoveTabRequest {
  // The window the tab is in.
  string window_id = 1;

  // The window to move the tab into.
  string target_window_id = 2;

  // The tab, with the state its kind saved.
  Tab tab = 3;
}

message MoveTabResponse {
  // Unspecified after the target window accepts the tab. On any other value
  // the source window keeps the tab.
  TabMoveErrorCode error = 1;
}

message AcceptTabMoveRequest {
  // The window that opened the tab.
  string window_id = 1;
  string tab_id = 2;

  // The move_id of the MovedTab event or of ReadDetachedTabResponse.
  string move_id = 3;
}

// MovedTab is a tab sent to a window by MoveTab, and the id of that move.
message MovedTab {
  Tab tab = 1;
  string move_id = 2;
}

message AcceptTabMoveResponse {
  // Unspecified when the move completed. On any other value the source window
  // keeps the tab and the target window closes it.
  TabMoveErrorCode error = 1;
}

// TabMoveErrorCode is why a move of a tab was served and did not complete.
enum TabMoveErrorCode {
  // TAB_MOVE_ERROR_CODE_UNSPECIFIED is a move that completed.
  TAB_MOVE_ERROR_CODE_UNSPECIFIED = 0;

  // TAB_MOVE_ERROR_CODE_WINDOW_CLOSED is a target window that does not watch
  // the tab links, or stopped watching before it opened the tab.
  TAB_MOVE_ERROR_CODE_WINDOW_CLOSED = 1;

  // TAB_MOVE_ERROR_CODE_TIMEOUT is a target window that did not open the tab in
  // time, or an AcceptTabMove for a move no longer pending.
  TAB_MOVE_ERROR_CODE_TIMEOUT = 2;

  // TAB_MOVE_ERROR_CODE_NOT_OWNER is a source window that does not own the tab;
  // another window reported it first.
  TAB_MOVE_ERROR_CODE_NOT_OWNER = 3;

  // TAB_MOVE_ERROR_CODE_CANCELED is a move that a newer move or detach of the
  // tab, a cancelled request, or another window that took the tab ended.
  TAB_MOVE_ERROR_CODE_CANCELED = 4;
}

message HighlightWindowRequest {
  // The window to outline.
  string window_id = 1;
  bool is_on = 2;
}

message HighlightWindowResponse {}
