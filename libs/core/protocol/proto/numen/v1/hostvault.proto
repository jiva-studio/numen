syntax = "proto3";

package numen.v1;

import "numen/v1/file.proto";
import "numen/v1/note.proto";
import "numen/v1/vaults.proto";

option go_package = "github.com/jiva-studio/numen/libs/core/protocol/gen/numen/v1;numenv1";

// HostVaultService is what the host answers for a plugin that works the vault
// call to a permission: a call that reads needs vault:read and one that changes
// anything needs vault:write; a call that changes the list of vaults or the
// vault the window shows needs vault:manage. Every path is relative to the
// vault root and written with forward slashes.
//
// Numen-Vault works the vault of that identity instead, which is how a window
// that shows no vault of its own, or a plugin counting every vault, reaches them.
//
// The vault is the host's own: the plugin reads and writes its files through
// the host, so the index, the watcher, the file stats and the trash all stay// up to date with what the plugin did.
service HostVaultService {
  // GetHostVault names the vault the host is showing. A host showing none answers
  // with the vault unset.
  rpc GetHostVault(GetHostVaultRequest) returns (GetHostVaultResponse);

  // ListHostVaults lists every vault the installation knows.
  rpc ListHostVaults(ListHostVaultsRequest) returns (ListHostVaultsResponse);

  // EnsureVaultIndexed brings the vault into the index when it is not there yet,
  // and says where that stands. The work goes on after the call returns, and the
  // caller asks again once WatchMoves tells it something moved.
  rpc EnsureVaultIndexed(EnsureVaultIndexedRequest) returns (EnsureVaultIndexedResponse);

  // StatFile says what a file is now. A file that is not there is
  // returns the error code NOT_FOUND.
  rpc StatFile(StatFileRequest) returns (StatFileResponse);

  // ReadFile reads a whole file, with the file stat it had when it was read.
  rpc ReadFile(ReadFileRequest) returns (ReadFileResponse);

  // WriteFile replaces a file that has not changed since the file stat given.
  // A file changed since returns the error code CONFLICT and
  // nothing is written.
  rpc WriteFile(WriteFileRequest) returns (WriteFileResponse);

  // CreateFile makes a file that is not there yet. A file that is there is
  // answered with the error code ALREADY_EXISTS.
  rpc CreateFile(CreateFileRequest) returns (CreateFileResponse);

  // LockVault holds the vault's writers to one caller until UnlockVault, or
  // until the plugin stops. A caller that finds it held waits for it.
  rpc LockVault(LockVaultRequest) returns (LockVaultResponse);

  // UnlockVault lets the writers go.
  rpc UnlockVault(UnlockVaultRequest) returns (UnlockVaultResponse);

  // ScanFiles updates the index for the files named, after the plugin
  // changed them.
  rpc ScanFiles(ScanFilesRequest) returns (ScanFilesResponse);

  // GetNoteRefs names the notes at the paths given, and leaves out a path with
  // no note.
  rpc GetNoteRefs(GetNoteRefsRequest) returns (GetNoteRefsResponse);

  // GetNoteTypes says what type each note at the paths given is.
  rpc GetNoteTypes(GetNoteTypesRequest) returns (GetNoteTypesResponse);

  // GetNamedPaths lists the notes filed under a name.
  rpc GetNamedPaths(GetNamedPathsRequest) returns (GetNamedPathsResponse);

  // GetPathsOfType lists the notes of a type.
  rpc GetPathsOfType(GetPathsOfTypeRequest) returns (GetPathsOfTypeResponse);

  // GetLinks lists the links written in a note, with what each reaches now.
  rpc GetLinks(GetLinksRequest) returns (GetLinksResponse);

  // GetBacklinks lists the links that reach a note.
  rpc GetBacklinks(GetBacklinksRequest) returns (GetBacklinksResponse);

  // ResolveLinks says what each link written in a note reaches now.
  rpc ResolveLinks(ResolveLinksRequest) returns (ResolveLinksResponse);

  // GetParseProblems lists what parsing each file of the vault turned up.
  rpc GetParseProblems(GetParseProblemsRequest) returns (GetParseProblemsResponse);

  // GetVaultProblems runs the named checks of the vault (parse, frontmatter,
  // ambiguous, dangling), or every check that is not opt-in when none is named.
  // It needs vault:read.
  rpc GetVaultProblems(GetVaultProblemsRequest) returns (GetVaultProblemsResponse);

  // RenameNote renames a note and moves its file to the filename of
  // that title, repairing the links that stop resolving. It needs vault:write.
  rpc RenameNote(HostVaultServiceRenameNoteRequest) returns (HostVaultServiceRenameNoteResponse);

  // MoveNotes moves notes to another folder, keeping their filenames, and
  // repairs the links that stop resolving. It needs vault:write.
  rpc MoveNotes(HostVaultServiceMoveNotesRequest) returns (HostVaultServiceMoveNotesResponse);

  // RemoveNotes moves notes to the vault's trash. A folder returns
  // NOT_A_NOTE. It needs vault:write.
  rpc RemoveNotes(HostVaultServiceRemoveNotesRequest) returns (HostVaultServiceRemoveNotesResponse);

  // AddLinks writes links into the frontmatter links of notes. The links of one
  // note are one write against one file stat, and succeed or fail together. At
  // most 50 links. It needs vault:write.
  rpc AddLinks(HostVaultServiceAddLinksRequest) returns (HostVaultServiceAddLinksResponse);

  // UpdateLinks changes the role, type, label and note of the links a note has
  // to a target, keeping the target. An empty field is kept. It needs
  // vault:write.
  rpc UpdateLinks(HostVaultServiceUpdateLinksRequest) returns (HostVaultServiceUpdateLinksResponse);

  // RemoveLinks removes the frontmatter links a note has to a target, of every
  // type, or only those of one role. The note at the other end is unchanged. It
  // needs vault:write.
  rpc RemoveLinks(HostVaultServiceRemoveLinksRequest) returns (HostVaultServiceRemoveLinksResponse);

  // AddVault adds a folder to the installation's list of vaults. It needs
  // vault:manage.
  rpc AddVault(HostVaultServiceAddVaultRequest) returns (HostVaultServiceAddVaultResponse);

  // RenameVault changes the name of a vault on the list. It needs vault:manage.
  rpc RenameVault(HostVaultServiceRenameVaultRequest) returns (HostVaultServiceRenameVaultResponse);

  // RemoveVault removes a vault from the list and from the index. The folder
  // stays. It needs vault:manage.
  rpc RemoveVault(HostVaultServiceRemoveVaultRequest) returns (HostVaultServiceRemoveVaultResponse);

  // OpenVault makes the window show another vault. It returns before the window
  // changes vault. It needs vault:manage.
  rpc OpenVault(HostVaultServiceOpenVaultRequest) returns (HostVaultServiceOpenVaultResponse);

  // ReadCache reads what the plugin kept for this vault under a name. The cache
  // belongs to the installation and not to the vault, and can be made again.
  rpc ReadCache(ReadCacheRequest) returns (ReadCacheResponse);

  // WriteCache replaces what the plugin keeps for this vault under a name.
  rpc WriteCache(WriteCacheRequest) returns (WriteCacheResponse);

  // WatchMoves tells that something moved in some vault of the installation,
  // until the caller disconnects. It says nothing of what moved. The first message is
  // sent at once, so that the caller knows the watch is on.
  rpc WatchMoves(WatchMovesRequest) returns (stream WatchMovesResponse);
}

// means it was not.
enum HostVaultErrorCode {
  HOST_VAULT_ERROR_CODE_UNSPECIFIED = 0;

  // The host is showing no vault.
  HOST_VAULT_ERROR_CODE_NO_VAULT = 1;

  // The file or the note is not there.
  HOST_VAULT_ERROR_CODE_NOT_FOUND = 2;

  // The path is outside the vault or names no file.
  HOST_VAULT_ERROR_CODE_OUTSIDE_VAULT = 3;

  // The file changed since the file stat given.
  HOST_VAULT_ERROR_CODE_CONFLICT = 4;

  // A file is already there.
  HOST_VAULT_ERROR_CODE_ALREADY_EXISTS = 5;

  // Another program holds the file.
  HOST_VAULT_ERROR_CODE_LOCKED = 6;

  // The path is not a note this vault holds.
  HOST_VAULT_ERROR_CODE_NOT_A_NOTE = 8;

  // The connection is not one: a role no connection carries, roles that are not
  // inverse of each other, or a note joined to itself.
  HOST_VAULT_ERROR_CODE_INVALID_CONNECTION = 9;

  // The connection would put a note above itself in the hierarchy.
  HOST_VAULT_ERROR_CODE_HIERARCHY_CYCLE = 10;

  // Every numbered "Untitled note N" name is taken.
  HOST_VAULT_ERROR_CODE_NAME_EXHAUSTED = 11;

  // The file is not valid note text.
  HOST_VAULT_ERROR_CODE_NOT_TEXT = 12;

  // The file exceeds the maximum note size.
  HOST_VAULT_ERROR_CODE_TOO_LARGE = 13;

  // The prose opens with a frontmatter delimiter, so writing it would put a
  // second block inside the first.
  HOST_VAULT_ERROR_CODE_BODY_UNWRITABLE = 14;

  // The frontmatter cannot be read, so the note can be neither read nor
  // written.
  HOST_VAULT_ERROR_CODE_UNREADABLE = 15;

  // The title is invalid: it is empty after sanitising, spans lines, or parses
  // as markup.
  HOST_VAULT_ERROR_CODE_INVALID_NAME = 16;

  // The change of a note failed for a reason with no code of its own; the
  // detail of that note contains the core's error text.
  HOST_VAULT_ERROR_CODE_INTERNAL = 17;

  // The call was cancelled before this note was changed: the note is as it was.
  HOST_VAULT_ERROR_CODE_NOT_ATTEMPTED = 18;
}

// HostFileStat is what a file was at a moment: at its current position, how large it
// was and when it last changed.
message HostFileStat {
  string path = 1;
  int64 size = 2;
  // Nanoseconds since the epoch.
  int64 mod_time = 3;
  // Whether the file is a note.
  bool is_note = 5;
}

message ListHostVaultsRequest {}

message HostVaultInfo {
  string id = 1;
  string name = 2;
  string path = 3;
  // Set when nothing is at the path.
  bool is_missing = 4;
}

message ListHostVaultsResponse {
  HostVaultErrorCode error = 1;
  repeated HostVaultInfo vaults = 2;
}

enum HostIndexState {
  HOST_INDEX_STATE_UNSPECIFIED = 0;
  // The index carries the vault.
  HOST_INDEX_STATE_INDEXED = 1;
  // The vault is being read into the index.
  HOST_INDEX_STATE_INDEXING = 2;
  // Reading the vault into the index failed, and the reason is on the response.
  HOST_INDEX_STATE_FAILED = 3;
}

message EnsureVaultIndexedRequest {}

message EnsureVaultIndexedResponse {
  HostVaultErrorCode error = 1;
  HostIndexState state = 2;
  string reason = 3;
}

message WatchMovesRequest {}

message WatchMovesResponse {}

message GetHostVaultRequest {}

message GetHostVaultResponse {
  HostVaultErrorCode error = 1;
  // The folder the vault is, on this machine.
  string path = 2;
  string id = 3;
  string name = 4;
}

message StatFileRequest {
  string path = 1;
}

message StatFileResponse {
  HostVaultErrorCode error = 1;
  HostFileStat stat = 2;
}

message ReadFileRequest {
  string path = 1;
  // The start of a ranged read, in bytes.
  int64 start = 2;
  // Set: read at most this many bytes from start as text, truncated at whole
  // characters; zero or more than 16000 reads 16000. A range that is not UTF-8
  // returns NOT_TEXT, a folder or a path not in the vault NOT_FOUND.
  // Unset: read the whole file as bytes.
  optional int64 length = 3;
}

message ReadFileResponse {
  HostVaultErrorCode error = 1;
  bytes content = 2;
  HostFileStat stat = 3;
  // The start of content in the file: start moved forward to a whole
  // character. Zero for a whole read.
  int64 start = 4;
}

message WriteFileRequest {
  string path = 1;
  bytes content = 2;
  // What the file was when the caller read it.
  HostFileStat baseline = 3;
}

message WriteFileResponse {
  HostVaultErrorCode error = 1;
  // What the file is now.
  HostFileStat stat = 2;
}

message CreateFileRequest {
  string path = 1;
  bytes content = 2;
}

message CreateFileResponse {
  HostVaultErrorCode error = 1;
}

message LockVaultRequest {}

message LockVaultResponse {
  HostVaultErrorCode error = 1;
  // The lock to return to UnlockVault.
  string lock = 2;
}

message UnlockVaultRequest {
  string lock = 1;
}

message UnlockVaultResponse {}

message ScanFilesRequest {
  repeated string paths = 1;
}

message ScanFilesResponse {
  HostVaultErrorCode error = 1;
}

// HostNoteRef is a note: at its current position and what it is called.
message HostNoteRef {
  string path = 1;
  string title = 2;
  // The identifier written in the note's frontmatter, empty when it has none.
  string id = 3;
}

message GetNoteRefsRequest {
  repeated string paths = 1;
}

message GetNoteRefsResponse {
  HostVaultErrorCode error = 1;
  repeated HostNoteRef notes = 2;
}

message GetNoteTypesRequest {
  repeated string paths = 1;
}

message GetNoteTypesResponse {
  HostVaultErrorCode error = 1;
  // The type of each note, by its path. A path with no note is left out.
  map<string, string> types = 2;
}

message GetNamedPathsRequest {
  string name = 1;
}

message GetNamedPathsResponse {
  HostVaultErrorCode error = 1;
  repeated string paths = 2;
}

message GetPathsOfTypeRequest {
  string type = 1;
}

message GetPathsOfTypeResponse {
  HostVaultErrorCode error = 1;
  repeated string paths = 2;
}

// HostLink is a link written in a note, and what it reaches now.
message HostLink {
  // The note the link is written in, and the note it reaches. The second is
  // empty when nothing is there.
  string from = 1;
  string to = 2;
  // The vault the target is in, which is the vault the link is written in for
  // an ordinary link.
  string to_vault = 3;
  // What the author calls the kind of link.
  string link_type = 4;
  // How the target is written: its scheme and its value.
  string target_scheme = 5;
  string target_value = 6;
  string label = 7;
  // Set when several notes answer to the name.
  bool is_ambiguous = 8;
  // What kind of relationship the link is, as written in the note it is written
  // in.
  Role role = 9;
  // Why the link exists, in the author's words.
  string note = 10;
  // What the link draws at the end that points at its target.
  Marker marker = 11;
  // For a backlink, the role of the note the link is written in, relative to the
  // note asked about. ROLE_UNSPECIFIED where the role has no counterpart.
  Role source_role = 12;
}

message GetLinksRequest {
  string path = 1;
}

message GetLinksResponse {
  HostVaultErrorCode error = 1;
  repeated HostLink links = 2;
}

message GetBacklinksRequest {
  string path = 1;
}

message GetBacklinksResponse {
  HostVaultErrorCode error = 1;
  repeated HostLink links = 2;
}

message ResolveLinksRequest {
  // The note the links are written in.
  string path = 1;
  // How each link is written between its brackets.
  repeated string addresses = 2;
}

message ResolveLinksResponse {
  HostVaultErrorCode error = 1;
  // What each link reaches, by how it was written.
  map<string, HostLink> links = 2;
}

message GetParseProblemsRequest {}

// HostParseProblem is something parsing a file turned up.
message HostParseProblem {
  string path = 1;
  string detail = 2;
}

message GetParseProblemsResponse {
  HostVaultErrorCode error = 1;
  repeated HostParseProblem problems = 2;
}

message GetVaultProblemsRequest {
  // The checks to run. Empty runs every check that is not opt-in.
  repeated string checks = 1;
}

// HostVaultProblem is something a check found in a vault.
message HostVaultProblem {
  // The note to open to resolve the problem.
  string path = 1;
  // The check that found it.
  string check = 2;
  string detail = 3;
  // The target of the link the problem is about: its scheme and its value.
  string target_scheme = 4;
  string target_value = 5;
  // The notes an ambiguous link could resolve to.
  repeated string candidates = 6;
}

message GetVaultProblemsResponse {
  HostVaultErrorCode error = 1;
  repeated HostVaultProblem problems = 2;
  // The checks this result covers.
  repeated string checks = 3;
}

message HostVaultServiceRenameNoteRequest {
  string path = 1;
  string title = 2;
}

message HostVaultServiceRenameNoteResponse {
  // Why the note was not renamed: NOT_FOUND, NOT_A_NOTE, INVALID_NAME,
  // ALREADY_EXISTS, CONFLICT and the other per-note codes.
  HostVaultErrorCode error = 1;
  // The path of the note after the rename.
  string path = 2;
  string title = 3;
  // Where the title is kept: the frontmatter or the filename.
  NameSource name_source = 4;
  // Unset when the file kept its path.
  optional MoveResult move = 5;
  // The core's error text where the note was not renamed, empty on success.
  string detail = 6;
}

message HostVaultServiceMoveNotesRequest {
  // At most 50 paths.
  repeated string paths = 1;
  // Relative to the vault root. Empty is the root.
  string folder = 2;
}

// HostNoteMove is the outcome of moving one note.
message HostNoteMove {
  // From is always set; to only when the note moved.
  MoveResult move = 1;
  // Why this note did not move.
  HostVaultErrorCode error = 2;
  // The core's error text where this note did not move, empty on success.
  string detail = 3;
}

message HostVaultServiceMoveNotesResponse {
  HostVaultErrorCode error = 1;
  // One per path, in the order of the request.
  repeated HostNoteMove moves = 2;
}

message HostVaultServiceRemoveNotesRequest {
  // At most 50 paths.
  repeated string paths = 1;
}

// HostNoteRemoval is the outcome of removing one note.
message HostNoteRemoval {
  string path = 1;
  // The path of the file in the trash.
  string trash_path = 2;
  // The notes whose links are now broken.
  repeated string broken_links = 3;
  // Why this note was not removed: NOT_FOUND, NOT_A_NOTE for a folder or a
  // file that is not a note, or INTERNAL.
  HostVaultErrorCode error = 4;
  // The core's error text where this note was not removed, empty on success.
  string detail = 5;
}

message HostVaultServiceRemoveNotesResponse {
  HostVaultErrorCode error = 1;
  // One per path, in the order of the request.
  repeated HostNoteRemoval removals = 2;
}

// HostLinkAddition is one link to write into a note.
message HostLinkAddition {
  // The note the link is written in.
  string from = 1;
  // The note as the caller read it.
  HostFileStat baseline = 2;
  // The target as written, e.g. "Rivers" or "note://01H...".
  string to = 3;
  Role role = 4;
  string type = 5;
  string label = 6;
  // Why the link exists.
  string note = 7;
}

message HostVaultServiceAddLinksRequest {
  // At most 50 links.
  repeated HostLinkAddition links = 1;
}

// HostLinkAdded is the outcome of writing one link.
message HostLinkAdded {
  // The note after the write; unset when nothing was written.
  HostFileStat stat = 1;
  // Why the link was not written: CONFLICT for a stale baseline, NOT_FOUND,
  // NOT_A_NOTE, UNREADABLE, INTERNAL and the other per-note codes.
  HostVaultErrorCode error = 2;
  // The core's error text where the link was not written, empty on success.
  string detail = 3;
}

message HostVaultServiceAddLinksResponse {
  HostVaultErrorCode error = 1;
  // One per link, in the order of the request.
  repeated HostLinkAdded results = 2;
}

message HostVaultServiceUpdateLinksRequest {
  // The note the links are written in.
  string from = 1;
  // The target as written.
  string to = 2;
  // The note as the caller read it.
  HostFileStat baseline = 3;
  Role role = 4;
  string type = 5;
  string label = 6;
  string note = 7;
}

message HostVaultServiceUpdateLinksResponse {
  HostVaultErrorCode error = 1;
  // The note after the write.
  HostFileStat stat = 2;
  // The core's error text where nothing was written, empty on success.
  string detail = 3;
}

message HostVaultServiceRemoveLinksRequest {
  // The note the links are written in.
  string from = 1;
  // The target as written.
  string to = 2;
  // The note as the caller read it.
  HostFileStat baseline = 3;
  // Only the links of this role. ROLE_UNSPECIFIED removes the links of every
  // role.
  Role role = 4;
}

message HostVaultServiceRemoveLinksResponse {
  HostVaultErrorCode error = 1;
  // The note after the write.
  HostFileStat stat = 2;
  // The core's error text where nothing was written, empty on success.
  string detail = 3;
}

message HostVaultServiceAddVaultRequest {
  // The folder, absolute on this machine.
  string root = 1;
  // Empty means the name of the folder.
  string name = 2;
}

message HostVaultServiceAddVaultResponse {
  VaultsErrorCode error = 1;
  Vault vault = 2;
  // The core's error text of a rejected call; empty on success.
  string detail = 3;
}

message HostVaultServiceRenameVaultRequest {
  string id = 1;
  string name = 2;
}

message HostVaultServiceRenameVaultResponse {
  VaultsErrorCode error = 1;
  Vault vault = 2;
  // The core's error text of a rejected call; empty on success.
  string detail = 3;
}

message HostVaultServiceRemoveVaultRequest {
  string id = 1;
}

message HostVaultServiceRemoveVaultResponse {
  VaultsErrorCode error = 1;
  // The folder of the vault, which stays on the disk.
  string path = 2;
  // The core's error text of a rejected call; empty on success.
  string detail = 3;
}

message HostVaultServiceOpenVaultRequest {
  string id = 1;
}

message HostVaultServiceOpenVaultResponse {
  VaultsErrorCode error = 1;
  // The core's error text of a rejected call; empty on success.
  string detail = 2;
}

message ReadCacheRequest {
  string name = 1;
}

message ReadCacheResponse {
  HostVaultErrorCode error = 1;
  // Whether anything is kept under the name. A cache with nothing in it is the
  // answer that nothing has been worked out yet.
  bool is_found = 2;
  bytes content = 3;
}

message WriteCacheRequest {
  string name = 1;
  bytes content = 2;
}

message WriteCacheResponse {
  HostVaultErrorCode error = 1;
}
