syntax = "proto3";

package numen.v1;

import "numen/v1/manifest.proto";

option go_package = "github.com/jiva-studio/numen/libs/core/protocol/gen/numen/v1;numenv1";

// PluginCommandService is what the backend of a plugin that declares commands
// in its manifest serves. The host checks a call against the declaration before
// it forwards it: the command is declared, every required argument is given,
// every argument is declared and holds a value of its type, and a command over
// files is given a file of a declared content type.
service PluginCommandService {
  // RunCommand runs one command the manifest declares.
  rpc RunCommand(RunCommandRequest) returns (RunCommandResponse);
}

message RunCommandRequest {
  // The id the manifest declares the command under.
  string command = 1;

  // The file the command runs over, as a path relative to the vault folder.
  // Empty for a command that declares no content types.
  string path = 2;

  // The arguments by their declared names, each written as text: a number in
  // decimal, a boolean as true or false. An optional argument left out is
  // absent.
  map<string, string> arguments = 3;

  // The id of the item a person picked, for a command that offers its own
  // items; empty for a run without a pick.
  string item_id = 4;
}

message RunCommandResponse {
  // Set when the command was served and did not run, or ran and failed. The
  // message then says why.
  CommandErrorCode error = 1;

  // What a person reads about the outcome.
  string message = 2;

  // The file a window opens once the command ran, as a path relative to the
  // vault folder. Empty for a command that leaves nothing to open.
  string opened_path = 3;
}

// CommandErrorCode is why a command was served and did not succeed.
enum CommandErrorCode {
  COMMAND_ERROR_CODE_UNSPECIFIED = 0;

  // No plugin declares a command of that id.
  COMMAND_ERROR_CODE_UNKNOWN_COMMAND = 1;

  // The arguments or the file do not meet the declaration.
  COMMAND_ERROR_CODE_BAD_ARGUMENTS = 2;

  // The command ran and failed.
  COMMAND_ERROR_CODE_FAILED = 3;

  // The plugin that declares the command cannot be started or reached.
  COMMAND_ERROR_CODE_UNAVAILABLE = 4;
}

// CommandService is what a window asks the host about the commands the enabled
// plugins declare.
service CommandService {
  // ListCommands lists the commands of every enabled plugin, in the order of
  // the plugins' ids and then the order each manifest declares them in.
  rpc ListCommands(ListCommandsRequest) returns (ListCommandsResponse);

  // RunPluginCommand runs one of them in the backend of the plugin that
  // declares it.
  rpc RunPluginCommand(RunPluginCommandRequest) returns (RunPluginCommandResponse);

  // ListCommandItems lists the items each of the commands offers over a path:
  // for a command whose when names version.*, the text versions of the file
  // over which it holds. A command without items offers none.
  rpc ListCommandItems(ListCommandItemsRequest) returns (ListCommandItemsResponse);
}

message ListCommandsRequest {}

message ListCommandsResponse {
  repeated PluginCommand commands = 1;
  // The slot entries of every enabled plugin, in the order of the plugins' ids and then of each
  // manifest.
  repeated PluginSlotEntry slots = 2;
  // The content type of a file by its extension, lowercase and without the dot, for every extension
  // the core knows a type of. The window derives target.contentType from it.
  map<string, string> content_type_by_extension = 3;
  // The handlers of shared commands of every enabled plugin, in the order of the plugins' ids and
  // then of each manifest.
  repeated PluginHandler handlers = 4;
  // The keybindings of every enabled plugin, in the order of the plugins' ids and then of each
  // manifest. They work before a plugin starts.
  repeated PluginKeybinding keybindings = 5;
}

// PluginKeybinding is one entry of contributes.keybindings of a plugin.
message PluginKeybinding {
  string plugin_id = 1;
  ManifestKeybinding keybinding = 2;
}

// PluginHandler is one entry of contributes.handlers of a plugin. A handler runs with
// RunPluginCommand under the full id of its shared command, and lists its items with
// ListCommandItems.
message PluginHandler {
  string plugin_id = 1;
  ManifestHandler handler = 2;
  // has_items is set for a handler whose when names version.*: it offers the text versions of the
  // file over which it holds.
  bool has_items = 3;
}

// PluginSlotEntry is one entry of contributes.slots of a plugin.
message PluginSlotEntry {
  string plugin_id = 1;
  ManifestSlotEntry entry = 2;
}

// PluginCommand is one command as a manifest declares it.
message PluginCommand {
  string plugin_id = 1;

  // The id the manifest declares the command under, unique within the plugin.
  string id = 2;

  // What a person reads the command as.
  string title = 3;

  // The arguments, in the order a person is asked for them.
  repeated CommandArgument arguments = 5;

  // The icon the command shows in the palette, by its Lucide name. Empty shows
  // the default plugin command icon.
  string icon = 7;

  // when is the CEL condition under which the command is available, as the manifest declares it.
  string when = 10;

  reserved 9;

  // has_items is set for a command that offers items, which a place reads
  // with ListCommandItems and runs with the id of the one picked as the
  // item_id of RunPluginCommand.
  bool has_items = 11;
}

// CommandArgument is one argument a command takes.
message CommandArgument {
  string name = 1;

  // What a person is asked for.
  string title = 2;

  bool is_required = 3;
}

// RunPluginCommandRequest runs a command of a plugin or a plugin's handler of a
// shared command. With no plugin_id it runs the application command
// app:version.delete, which the core serves: it deletes the text version
// item_id names, its record and its file, and reports the file in
// WatchVaultChangesResponse.version_paths.
message RunPluginCommandRequest {
  string plugin_id = 1;

  string command = 2;

  // The file the command runs over, relative to the vault the window shows.
  string path = 3;

  map<string, string> arguments = 4;

  // The id of the item picked, for a command that offers items; empty for a
  // run without a pick.
  string item_id = 5;
}

message ListCommandItemsRequest {
  // The file the items are listed over, relative to the vault the window
  // shows.
  string path = 1;

  repeated PluginCommandId commands = 2;
}

// PluginCommandId is one command of a plugin: a command it declares, or its
// handler of a shared command. With no plugin_id it is the application command
// app:version.delete, whose items are every text version of the file.
message PluginCommandId {
  string plugin_id = 1;

  string command = 2;
}

message ListCommandItemsResponse {
  // One list for each command of the request, in the order of the request.
  repeated CommandItemList lists = 1;
}

// CommandItemList is the items one command offers over the path of the
// request.
message CommandItemList {
  string plugin_id = 1;

  string command = 2;

  repeated CommandItem items = 3;

  // Set when the items could not be listed; the message then says why.
  CommandErrorCode error = 4;

  string message = 5;
}

// CommandItem is one item a command offers: the id the run takes as its
// item_id, and what a person reads.
message CommandItem {
  string id = 1;

  string title = 2;

  // detail is a second, smaller line under the title. Empty for none.
  string detail = 3;
}

message RunPluginCommandResponse {
  CommandErrorCode error = 1;

  // What a person reads about the outcome.
  string message = 2;

  // The file the window opens once the command ran. Empty for none.
  string opened_path = 3;
}
