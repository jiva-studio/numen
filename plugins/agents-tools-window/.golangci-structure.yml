# Structure rules for production code: complexity, function size, enum switches
# and struct literals.
#
# This file is the second of two Go lint configurations; both always run together.
# It sets `run.tests: false` because these rules do not fit test code (long table
# tests and setup helpers), and golangci-lint offers no way to scope a linter to
# non-test files other than a separate configuration or a path exclusion, which this
# repository does not use. .golangci.yml checks production code and tests.
#
# exhaustruct applies to the core identity types and to every struct of a plugin
# (matched by the plugin module path, which holds wherever the plugin is checked
# out). Plugin directories and libs/plugin-sdk-go carry byte-identical copies of
# this file; tools/lint-layers verifies the copies.
#
# Run from the directory of a module: golangci-lint run -c <path to this file> ./...

version: "2"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

run:
  tests: false

linters:
  default: none
  enable:
    - exhaustive
    - exhaustruct
    - cyclop
    - gocognit
    - nestif
    - funlen
    - nakedret
    - maintidx
    - interfacebloat
    - goconst
    - containedctx

  settings:
    maintidx:
      under: 20

    interfacebloat:
      max: 5

    goconst:
      min-len: 3
      min-occurrences: 3

    cyclop:
      max-complexity: 15

    gocognit:
      min-complexity: 15

    nestif:
      min-complexity: 4

    funlen:
      lines: 80
      statements: 50

    nakedret:
      max-func-lines: 5

    exhaustive:
      default-signifies-exhaustive: true
      ignore-enum-types: ^(golang\.org/x/net/html/atom\.Atom|gopkg\.in/yaml\.v3\.Kind|time\.Weekday)$

    exhaustruct:
      include:
        - .*/core/port/\w+port\.(\w+Model|Vector)$
        - .*/notes/domain\.Address$
        - github\.com/jiva-studio/numen/plugins/.*
      allow-empty-returns: true
      allow-empty-declarations: true

