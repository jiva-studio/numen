syntax = "proto3";

// What the PDF reader's tab asks of the plugin's backend: how many pages a
// document has, how large each is, and where runs of its text stand on them.
//
// The pages themselves are images on the plugin route,
// /plugin/md.numen.readers.pdf/pages/<index>?path=<path>. Every call works the
// vault its Numen-Vault header names, which the window sets on each request it
// forwards.
package numen.pdf.v1;

import "numen/v1/shared.proto";

option go_package = "github.com/jiva-studio/numen/plugins/readers-pdf/gen/numen/pdf/v1;pdfv1";

// DocumentService returns the layout of a PDF file and the places of its text.
service DocumentService {
  // GetDocument returns how many pages a document has and how large each of
  // them is.
  //
  // Opening a document holds a worker of the library's pool. A caller that
  // could not have one inside the wait gets unavailable and asks again.
  rpc GetDocument(GetDocumentRequest) returns (GetDocumentResponse);

  // GetHighlights returns where runs of the document's live text version stand
  // on its pages, in the order the runs were asked about.
  rpc GetHighlights(GetHighlightsRequest) returns (GetHighlightsResponse);
}

message GetDocumentRequest {
  // The file, as the vault holds it.
  string path = 1;
}

message GetDocumentResponse {
  // Every page of the document in order, each as its size.
  repeated Page pages = 1;

  // The bytes the layout was read from. A page image is asked for with it, so
  // one address names one drawing of one file.
  numen.v1.Fingerprint fingerprint = 2;
}

// Page is one page of the document, in the document's own units. A client
// draws it at any width and keeps its shape by these.
message Page {
  double width = 1;
  double height = 2;
}

message GetHighlightsRequest {
  // The file, as the vault holds it.
  string path = 1;

  // The runs of the live text version to return places of, in bytes of its text.
  repeated numen.v1.Span spans = 2;
}

message GetHighlightsResponse {
  // One run per run asked about, in that order.
  repeated DocumentRun runs = 1;
}

// DocumentRun is where one run of the text stands: the rectangles it covers,
// one place a page. A run with no places stands nowhere.
message DocumentRun {
  repeated DocumentPlace places = 1;
}

// DocumentPlace is rectangles on one page of a document. Pages count from zero.
message DocumentPlace {
  int32 page = 1;
  repeated DocumentRect rects = 2;
}

// DocumentRect is a rectangle on a page, in fractions of the page.
message DocumentRect {
  float min_x = 1;
  float min_y = 2;
  float max_x = 3;
  float max_y = 4;
}
