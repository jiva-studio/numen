syntax = "proto3";

// What the EPUB reader's tab asks of the plugin's backend about a book: the
// documents it is read in, what it names inside them, and how far its text
// runs.
//
// Such a book has no pages of its own. It is set in columns against the room
// the reader has, so a place in it is an offset into its one text stream, and
// every number here is counted in bytes of that text. The bytes of one picture
// are on the plugin route,
// /plugin/md.numen.readers.epub/entries/<entry>?path=<path>, because a
// browser's own elements read bytes and not this. Every call works the vault
// its Numen-Vault header names, which the window sets on each request it
// forwards.
package numen.epub.v1;

import "numen/v1/shared.proto";

option go_package = "github.com/jiva-studio/numen/plugins/readers-epub/gen/numen/epub/v1;epubv1";

service BookService {
  // GetBook is what the book is: what it is called, the documents it is read
  // in, what it names inside them, and how far its text runs. A window lays a
  // document out itself, so it takes the whole of this and then asks for one
  // document at a time.
  rpc GetBook(GetBookRequest) returns (GetBookResponse);

  // ReadBookMarkup returns one document of the book as the markup a window
  // lays a page out from. It refuses a file that is no longer the bytes the
  // request names, so one response is one reading of one file.
  rpc ReadBookMarkup(ReadBookMarkupRequest) returns (ReadBookMarkupResponse);

  // ReadBookEntry is the bytes of one entry of a book's archive, while the
  // file is still the bytes the request names. The entries route of the
  // plugin serves a picture of the book through it.
  rpc ReadBookEntry(ReadBookEntryRequest) returns (ReadBookEntryResponse);

  // GetCfi is the EPUB CFI of the place at an offset of the book's text,
  // which a place in the book is saved by. It is not found for a book with no
  // text.
  rpc GetCfi(GetCfiRequest) returns (GetCfiResponse);

  // FindOffset is the offset of the book's text an EPUB CFI names: a saved
  // place or a search hit. It is not found for a CFI naming no document of
  // the book's spine, and invalid for a string that is no CFI.
  rpc FindOffset(FindOffsetRequest) returns (FindOffsetResponse);
}

message GetBookRequest {
  // The file, as the vault holds it.
  string path = 1;
}

message GetBookResponse {
  // What the package document calls the book.
  string title = 1;

  // The documents of the spine, in reading order.
  repeated SpineDocument documents = 2;

  // What the book names, ascending by offset.
  repeated BookPart parts = 3;

  // The pages of the printed book this file was made from, ascending by
  // offset. A book naming nothing is reached by these, and most books carry
  // none.
  repeated PrintedPage printed_pages = 4;

  // How many pages the book has. A book has no pages of its own, so they are
  // counted over its text and not over anything drawn.
  int32 page_count = 5;

  // How many bytes the book's text is, and how many of them make one page.
  // A page is a number of letters and a letter is several bytes in most of the
  // scripts a book is written in, so the size is measured in this book's own.
  //
  // The page an offset falls on is counted from these, and evaluates to the same
  // page wherever it is counted.
  int32 text_bytes = 6;
  int32 page_bytes = 7;

  // The bytes the book was read from. It is passed back in the request for a
  // document and in the address of a picture, so both name one reading of one
  // file.
  numen.v1.Fingerprint fingerprint = 8;
}

message GetCfiRequest {
  // The file, as the vault holds it.
  string path = 1;

  // The offset in the book's text.
  int32 offset = 2;
}

message GetCfiResponse {
  // The EPUB CFI of the character at the offset, such as
  // `epubcfi(/6/4!/4/2/1:12)`: the first character written at or after it.
  string cfi = 1;
}

message FindOffsetRequest {
  // The file, as the vault holds it.
  string path = 1;

  // An EPUB CFI into the book.
  string cfi = 2;
}

message FindOffsetResponse {
  // The offset in the book's text of what the CFI names.
  int32 offset = 1;
}

message ReadBookMarkupRequest {
  // The file, as the vault holds it.
  string path = 1;

  // The document of the spine, as the archive names it.
  string document = 2;

  // Which bytes the request was given out for. A file that is other bytes now
  // is refused: the window reads the book again and asks with what that
  // returns.
  optional numen.v1.Fingerprint baseline = 3;
}

message ReadBookMarkupResponse {
  // The markup of the document, carrying the offsets of the book's text.
  string markup = 1;
}

message ReadBookEntryRequest {
  // The file, as the vault holds it.
  string path = 1;

  // The entry, as the archive names it.
  string entry = 2;

  // Which bytes the request was given out for. A file that is other bytes now
  // is refused.
  numen.v1.Fingerprint baseline = 3;
}

message ReadBookEntryResponse {
  // The bytes of the entry.
  bytes body = 1;
}

// SpineDocument is one document of the spine and where it is in the book's
// text.
message SpineDocument {
  // Path is the document's name inside the archive, which the markup of it is
  // asked for by.
  string path = 1;

  // Where the document's text begins in the book's text, and how many bytes of
  // it the document is.
  int32 offset = 2;
  int32 length = 3;
}

// BookPart is a named division of the book, at the offset its text begins.
message BookPart {
  string title = 1;
  int32 offset = 2;

  // Level is the depth of the heading the part came from, and zero for one the
  // book's own navigation document named.
  int32 level = 3;
}

// PrintedPage is one page of the printed book, at the offset it starts.
message PrintedPage {
  string label = 1;
  int32 offset = 2;
}
