syntax = "proto3";

// A link is a note of type `link` whose frontmatter holds one web address under
// `url`. The plugin fetches what is published there into a text version of the
// note, and copies a video there to be played from this disk.
package numen.links.v1;

option go_package = "github.com/jiva-studio/numen/plugins/tools-media-importer/gen/numen/links/v1;linksv1";

// LinkService reads a link and starts the work on it, for the link's tab.
service LinkService {
  // GetLink returns the address a link holds and the copy kept of it.
  rpc GetLink(GetLinkRequest) returns (GetLinkResponse);

  // ReadArticle returns the live text of a link.
  rpc ReadArticle(ReadArticleRequest) returns (ReadArticleResponse);

  // FetchText starts fetching the text published at a link's address and
  // returns before it ends. The work shows as a task of the plugin.
  rpc FetchText(FetchTextRequest) returns (FetchTextResponse);

  // CopyVideo starts copying the video published at a link's address and
  // returns before it ends. The work shows as a task of the plugin.
  rpc CopyVideo(CopyVideoRequest) returns (CopyVideoResponse);

  // DeleteCopy deletes the copy kept of a link's video.
  rpc DeleteCopy(DeleteCopyRequest) returns (DeleteCopyResponse);
}

// LinkErrorCode is why a call about a link was refused. The zero value means it
// was not.
enum LinkErrorCode {
  LINK_ERROR_CODE_UNSPECIFIED = 0;

  // The file is not a link note, or its `url` is no web address.
  LINK_ERROR_CODE_NOT_A_LINK = 1;

  // The host shows no vault.
  LINK_ERROR_CODE_NO_VAULT = 2;
}

message GetLinkRequest {
  // The note, as the vault holds it.
  string path = 1;
}

message GetLinkResponse {
  LinkErrorCode error = 1;

  // The address the note holds.
  string url = 2;

  // Whether a video is published at the address, so a copy of it can be made.
  bool is_copyable = 3;

  // The size of the copy kept of the video in bytes, and zero where none is
  // kept. numen.v1.MediaService returns where it is loaded from.
  int64 copy_size = 4;

  // Whether the text was fetched once and its version deleted since. Such a
  // link is fetched again only when the person asks.
  bool is_text_deleted = 5;
}

message ReadArticleRequest {
  // The note, as the vault holds it.
  string path = 1;
}

message ReadArticleResponse {
  LinkErrorCode error = 1;

  // The text of the note's live version, and empty where it has none.
  string text = 2;
}

message FetchTextRequest {
  // The note, as the vault holds it.
  string path = 1;

  // Whether the person asked. A fetch nobody asked for leaves alone an address
  // that publishes no text and a text the person deleted.
  bool is_user_started = 2;
}

message FetchTextResponse {
  LinkErrorCode error = 1;
}

message CopyVideoRequest {
  // The note, as the vault holds it.
  string path = 1;
}

message CopyVideoResponse {
  LinkErrorCode error = 1;
}

message DeleteCopyRequest {
  // The note, as the vault holds it.
  string path = 1;
}

message DeleteCopyResponse {
  LinkErrorCode error = 1;
}
