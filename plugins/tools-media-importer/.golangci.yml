# Rules for every Go file, production code and tests alike.
#
# This file is one of two Go lint configurations, and both always run together
# (make lint targets and CI). The second one,
# .golangci-structure.yml, holds the rules that apply to production code only:
# complexity, function length, struct completeness and enum switches. golangci-lint
# scopes a linter to non-test files only through `run.tests: false` for a whole
# configuration or through path exclusions; exclusions are not used, so those rules
# live in a configuration that does not load tests.
#
# A rule here has no path exclusion, no exclusion preset and no suppression
# comment. gochecknoglobals keeps its allowances: error values, compiled regular
# expressions, embedded files and blank identifiers. Reads of the machine clock are not
# a forbidigo rule: a type-aware test in
# libs/core/kernel/container (clock_port_test.go) permits them only inside the Now method
# of a clock port implementation. Plugin directories carry byte-identical copies of both
# files; libs/plugin/sdk-go has a .golangci.yml of its own and a copy of
# .golangci-structure.yml. tools/checks verifies the copies.
#
# Run from the directory of a module.

version: "2"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  default: none
  enable:
    - errcheck
    - nilerr
    - forbidigo
    - bodyclose
    - sqlclosecheck
    - rowserrcheck
    - contextcheck
    - noctx
    - importas
    - usetesting
    - gocritic
    - staticcheck
    - unused
    - revive
    - depguard
    - wastedassign
    - gochecknoinits
    - gochecknoglobals
    - reassign
    - govet
    - errorlint
    - nilnesserr
    - copyloopvar
    - modernize
    - intrange
    - usestdlibvars
    - exptostd
    - asasalint
    - durationcheck
    - makezero
    - errchkjson
    - canonicalheader
    - sloglint
    - testifylint
    - bidichk
    - predeclared
    - gocheckcompilerdirectives
    - ineffassign
    - errname
    - recvcheck
    - protogetter
    - musttag
    - thelper
    - misspell
    - gosec

  settings:
    govet:
      enable:
        - nilness

    gosec:
      # G101 matches names, G103 flags the unsafe FFI code, G204 and G702 flag the agent programs the user configures,
      # G602 and the taint rules G703-G705 flag paths and addresses the app opens for the user.
      excludes:
        - G101
        - G103
        - G104
        - G115
        - G204
        - G702
        - G301
        - G302
        - G304
        - G306
        - G404
        - G602
        - G703
        - G704
        - G705

    misspell:
      locale: US

    depguard:
      rules:
        domain:
          list-mode: lax
          files:
            - "**/domain/**"
            - "**/domain.go"
            - "!$test"
          allow:
            - "net/url"
            - "net/netip"
          deny:
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/adapter"
              desc: "the domain does not reach adapters"
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/internal/adapter"
              desc: "the domain does not reach adapters"
            - pkg: "github.com/jiva-studio/numen/apps/desktop/internal/adapter"
              desc: "the domain does not reach adapters"
            - pkg: "github.com/jiva-studio/numen/apps"
              desc: "the domain does not reach applications"
            - pkg: "github.com/jiva-studio/numen/plugins"
              desc: "the domain does not reach plugins"
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/usecase"
              desc: "the domain does not reach use cases"
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/port"
              desc: "the domain does not reach ports"
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/container"
              desc: "the domain does not reach the composition root"
            - pkg: "os"
              desc: "the domain performs no I/O"
            - pkg: "net"
              desc: "the domain performs no I/O"

        # Every module of the plugin SDK, the base and each feature module under it.
        # Only plugins and applications may import the plugin SDK.
        plugin-sdk:
          list-mode: lax
          files:
            - "**/libs/core/kernel/**"
            - "**/libs/note/**"
            - "**/libs/core/protocol/**"
          deny:
            - pkg: "github.com/jiva-studio/numen/libs/plugin/sdk-go"
              desc: "only plugins and applications may import the plugin SDK"

        usecase:
          list-mode: lax
          files:
            - "**/usecase/**"
            - "!$test"
          deny:
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/adapter"
              desc: "a use case does not reach concrete adapters"
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/internal/adapter"
              desc: "a use case does not reach concrete adapters"
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/container"
              desc: "a use case does not reach the composition root"
            - pkg: "encoding/json"
              desc: "a use case does not parse wire or storage formats"
            - pkg: "path/filepath"
              desc: "a use case uses slash-separated vault paths (path), not OS filepath"
            - pkg: "io/fs"
              desc: "a use case uses domain/port error sentinels, not io/fs"

        port:
          list-mode: lax
          files:
            - "**/port/**"
            - "!$test"
          deny:
            - pkg: "encoding/json"
              desc: "a port defines pure contracts without serialization formats"
            - pkg: "net/url"
              desc: "a port uses domain value objects instead of net/url"
            - pkg: "path/filepath"
              desc: "a port does not depend on OS filepath"
            - pkg: "io/fs"
              desc: "a port defines its own sentinels and does not leak io/fs"
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/port/"
              desc: "a port package is an independent contract and imports no sibling port package"

        driven-adapter:
          list-mode: lax
          files:
            - "**/adapter/index/**"
            - "**/adapter/settings/**"
            - "**/internal/adapter/appstate/**"
            - "**/internal/adapter/clock/**"
            - "**/internal/adapter/filesystem/**"
            - "**/internal/adapter/models/**"
            - "**/internal/adapter/onnxruntime/**"
            - "**/internal/adapter/plugin/*.go"
            - "**/internal/adapter/plugin/agentbridge/**"
            - "**/internal/adapter/plugin/agenttoolsbridge/**"
            - "**/internal/adapter/plugin/bridge/**"
            - "**/internal/adapter/plugin/commandbridge/**"
            - "**/internal/adapter/plugin/delivery/**"
            - "**/internal/adapter/plugin/embedderbridge/**"
            - "**/internal/adapter/plugin/lifecycle/**"
            - "**/internal/adapter/plugin/portproxy/**"
            - "**/internal/adapter/plugin/providerbridge/**"
            - "**/internal/adapter/plugin/process/**"
            - "**/internal/adapter/plugin/security/**"
            - "**/internal/adapter/plugin/servicebridge/**"
            - "**/internal/adapter/plugin/storage/**"
            - "**/internal/adapter/plugin/transport/**"
            - "**/internal/adapter/provision/**"
            - "**/internal/adapter/settingevents/**"
            - "**/internal/adapter/themefiles/**"
            - "**/internal/adapter/trash/**"
            - "**/internal/adapter/windowview/**"
            - "!$test"
          deny:
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/usecase"
              desc: "a driven adapter stands behind a port and runs no scenario"
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/container"
              desc: "an adapter is given what it needs and assembles nothing"

        driving-adapter:
          list-mode: lax
          files:
            - "**/adapter/window/**"
            - "**/adapter/mcp/**"
            - "**/adapter/cli/**"
            - "**/adapter/plugin/hostendpoint/**"
            - "**/adapter/plugin/hostsearch/**"
            - "**/adapter/plugin/hosttext/**"
            - "**/adapter/plugin/hostvault/**"
            - "**/adapter/window/theme/**"
            - "**/internal/adapterlib/wire/**"
            - "**/apps/desktop/**"
            - "!$test"
          deny:
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/port"
              desc: "a driving adapter calls the use case layer and imports no port directly"

        # The plugin adapter reaches the vault, files, models and windows through use case
        # contracts, never through another adapter.
        plugin-adapter-isolation:
          list-mode: lax
          files:
            - "**/internal/adapter/plugin/**"
            - "!$test"
          deny:
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/adapter/cli"
              desc: "the plugin adapter reaches the world through use case contracts, not through another adapter"
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/adapter/index"
              desc: "the plugin adapter reaches the world through use case contracts, not through another adapter"
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/adapter/settings"
              desc: "the plugin adapter reaches the world through use case contracts, not through another adapter"
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/adapter/window"
              desc: "the plugin adapter reaches the world through use case contracts, not through another adapter"
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/internal/adapter/appstate"
              desc: "the plugin adapter reaches the world through use case contracts, not through another adapter"
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/internal/adapter/clock"
              desc: "the plugin adapter reaches the world through use case contracts, not through another adapter"
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/internal/adapter/connectionlog"
              desc: "the plugin adapter reaches the world through use case contracts, not through another adapter"
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/internal/adapter/filesystem"
              desc: "the plugin adapter reaches the world through use case contracts, not through another adapter"
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/internal/adapter/models"
              desc: "the plugin adapter reaches the world through use case contracts, not through another adapter"
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/internal/adapter/onnxruntime"
              desc: "the plugin adapter reaches the world through use case contracts, not through another adapter"
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/internal/adapter/provision"
              desc: "the plugin adapter reaches the world through use case contracts, not through another adapter"
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/internal/adapter/settingevents"
              desc: "the plugin adapter reaches the world through use case contracts, not through another adapter"
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/adapter/window/theme"
              desc: "the plugin adapter reaches the world through use case contracts, not through another adapter"
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/internal/adapter/themefiles"
              desc: "the plugin adapter reaches the world through use case contracts, not through another adapter"
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/internal/adapter/trash"
              desc: "the plugin adapter reaches the world through use case contracts, not through another adapter"
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/internal/adapter/windowfocus"
              desc: "the plugin adapter reaches the world through use case contracts, not through another adapter"
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/internal/adapter/windowvaults"
              desc: "the plugin adapter reaches the world through use case contracts, not through another adapter"
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/internal/adapter/windowview"
              desc: "the plugin adapter reaches the world through use case contracts, not through another adapter"

        # A bridge calls a plugin for the core. It uses the shared bridge package and no other
        # bridge, and nothing of the host side that serves plugin calls.
        plugin-agentbridge:
          list-mode: lax
          files:
            - "**/internal/adapter/plugin/agentbridge/**"
            - "!$test"
          deny:
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/internal/adapter/plugin/commandbridge"
              desc: "a bridge to a plugin does not use another bridge"
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/internal/adapter/plugin/embedderbridge"
              desc: "a bridge to a plugin does not use another bridge"
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/internal/adapter/plugin/providerbridge"
              desc: "a bridge to a plugin does not use another bridge"
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/internal/adapter/plugin/servicebridge"
              desc: "a bridge to a plugin does not use another bridge"
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/internal/adapter/plugin/agenttoolsbridge"
              desc: "a bridge to a plugin does not use another bridge"
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/adapter/plugin/hostendpoint"
              desc: "a bridge to a plugin does not use the host side that serves plugin calls"
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/adapter/plugin/hosttext"
              desc: "a bridge to a plugin does not use the host side that serves plugin calls"
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/adapter/plugin/hostsearch"
              desc: "a bridge to a plugin does not use the host side that serves plugin calls"
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/adapter/plugin/hostvault"
              desc: "a bridge to a plugin does not use the host side that serves plugin calls"
        plugin-commandbridge:
          list-mode: lax
          files:
            - "**/internal/adapter/plugin/commandbridge/**"
            - "!$test"
          deny:
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/internal/adapter/plugin/agentbridge"
              desc: "a bridge to a plugin does not use another bridge"
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/internal/adapter/plugin/embedderbridge"
              desc: "a bridge to a plugin does not use another bridge"
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/internal/adapter/plugin/providerbridge"
              desc: "a bridge to a plugin does not use another bridge"
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/internal/adapter/plugin/servicebridge"
              desc: "a bridge to a plugin does not use another bridge"
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/internal/adapter/plugin/agenttoolsbridge"
              desc: "a bridge to a plugin does not use another bridge"
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/adapter/plugin/hostendpoint"
              desc: "a bridge to a plugin does not use the host side that serves plugin calls"
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/adapter/plugin/hosttext"
              desc: "a bridge to a plugin does not use the host side that serves plugin calls"
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/adapter/plugin/hostsearch"
              desc: "a bridge to a plugin does not use the host side that serves plugin calls"
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/adapter/plugin/hostvault"
              desc: "a bridge to a plugin does not use the host side that serves plugin calls"
        plugin-embedderbridge:
          list-mode: lax
          files:
            - "**/internal/adapter/plugin/embedderbridge/**"
            - "!$test"
          deny:
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/internal/adapter/plugin/providerbridge"
              desc: "a bridge to a plugin does not use another bridge"
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/internal/adapter/plugin/agentbridge"
              desc: "a bridge to a plugin does not use another bridge"
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/internal/adapter/plugin/commandbridge"
              desc: "a bridge to a plugin does not use another bridge"
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/internal/adapter/plugin/servicebridge"
              desc: "a bridge to a plugin does not use another bridge"
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/internal/adapter/plugin/agenttoolsbridge"
              desc: "a bridge to a plugin does not use another bridge"
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/adapter/plugin/hostendpoint"
              desc: "a bridge to a plugin does not use the host side that serves plugin calls"
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/adapter/plugin/hosttext"
              desc: "a bridge to a plugin does not use the host side that serves plugin calls"
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/adapter/plugin/hostsearch"
              desc: "a bridge to a plugin does not use the host side that serves plugin calls"
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/adapter/plugin/hostvault"
              desc: "a bridge to a plugin does not use the host side that serves plugin calls"
        plugin-providerbridge:
          list-mode: lax
          files:
            - "**/internal/adapter/plugin/providerbridge/**"
            - "!$test"
          deny:
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/internal/adapter/plugin/embedderbridge"
              desc: "a bridge to a plugin does not use another bridge"
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/internal/adapter/plugin/agentbridge"
              desc: "a bridge to a plugin does not use another bridge"
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/internal/adapter/plugin/commandbridge"
              desc: "a bridge to a plugin does not use another bridge"
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/internal/adapter/plugin/servicebridge"
              desc: "a bridge to a plugin does not use another bridge"
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/internal/adapter/plugin/agenttoolsbridge"
              desc: "a bridge to a plugin does not use another bridge"
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/adapter/plugin/hostendpoint"
              desc: "a bridge to a plugin does not use the host side that serves plugin calls"
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/adapter/plugin/hosttext"
              desc: "a bridge to a plugin does not use the host side that serves plugin calls"
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/adapter/plugin/hostsearch"
              desc: "a bridge to a plugin does not use the host side that serves plugin calls"
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/adapter/plugin/hostvault"
              desc: "a bridge to a plugin does not use the host side that serves plugin calls"
        plugin-servicebridge:
          list-mode: lax
          files:
            - "**/internal/adapter/plugin/servicebridge/**"
            - "!$test"
          deny:
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/internal/adapter/plugin/agentbridge"
              desc: "a bridge to a plugin does not use another bridge"
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/internal/adapter/plugin/commandbridge"
              desc: "a bridge to a plugin does not use another bridge"
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/internal/adapter/plugin/embedderbridge"
              desc: "a bridge to a plugin does not use another bridge"
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/internal/adapter/plugin/providerbridge"
              desc: "a bridge to a plugin does not use another bridge"
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/internal/adapter/plugin/agenttoolsbridge"
              desc: "a bridge to a plugin does not use another bridge"
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/adapter/plugin/hostendpoint"
              desc: "a bridge to a plugin does not use the host side that serves plugin calls"
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/adapter/plugin/hosttext"
              desc: "a bridge to a plugin does not use the host side that serves plugin calls"
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/adapter/plugin/hostsearch"
              desc: "a bridge to a plugin does not use the host side that serves plugin calls"
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/adapter/plugin/hostvault"
              desc: "a bridge to a plugin does not use the host side that serves plugin calls"

        plugin-agenttoolsbridge:
          list-mode: lax
          files:
            - "**/internal/adapter/plugin/agenttoolsbridge/**"
            - "!$test"
          deny:
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/internal/adapter/plugin/agentbridge"
              desc: "a bridge to a plugin does not use another bridge"
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/internal/adapter/plugin/commandbridge"
              desc: "a bridge to a plugin does not use another bridge"
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/internal/adapter/plugin/embedderbridge"
              desc: "a bridge to a plugin does not use another bridge"
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/internal/adapter/plugin/providerbridge"
              desc: "a bridge to a plugin does not use another bridge"
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/internal/adapter/plugin/servicebridge"
              desc: "a bridge to a plugin does not use another bridge"
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/adapter/plugin/hostendpoint"
              desc: "a bridge to a plugin does not use the host side that serves plugin calls"
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/adapter/plugin/hosttext"
              desc: "a bridge to a plugin does not use the host side that serves plugin calls"
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/adapter/plugin/hostsearch"
              desc: "a bridge to a plugin does not use the host side that serves plugin calls"
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/adapter/plugin/hostvault"
              desc: "a bridge to a plugin does not use the host side that serves plugin calls"

        # A host package answers what a plugin calls on the core. It uses no bridge to a plugin.
        plugin-host-side:
          list-mode: lax
          files:
            - "**/adapter/plugin/hostendpoint/**"
            - "**/adapter/plugin/hosttext/**"
            - "**/adapter/plugin/hostsearch/**"
            - "**/adapter/plugin/hostvault/**"
            - "!$test"
          deny:
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/internal/adapter/plugin/bridge"
              desc: "the host side that serves plugin calls does not use the bridges to a plugin"
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/internal/adapter/plugin/agentbridge"
              desc: "the host side that serves plugin calls does not use the bridges to a plugin"
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/internal/adapter/plugin/commandbridge"
              desc: "the host side that serves plugin calls does not use the bridges to a plugin"
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/internal/adapter/plugin/embedderbridge"
              desc: "the host side that serves plugin calls does not use the bridges to a plugin"
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/internal/adapter/plugin/providerbridge"
              desc: "the host side that serves plugin calls does not use the bridges to a plugin"
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/internal/adapter/plugin/servicebridge"
              desc: "the host side that serves plugin calls does not use the bridges to a plugin"
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel/internal/adapter/plugin/agenttoolsbridge"
              desc: "the host side that serves plugin calls does not use the bridges to a plugin"

        # A plugin reaches the host through the plugin SDK. The rule covers every
        # file outside libs/, apps/ and tools/, which includes a plugin checked out alone.
        # The longer match wins, so the SDK is allowed under the denied libs/.
        plugin-isolation:
          list-mode: lax
          files:
            - "$all"
            - "!**/libs/**"
            - "!**/apps/**"
            - "!**/tools/**"
          allow:
            - "github.com/jiva-studio/numen/libs/plugin/sdk-go"
          deny:
            - pkg: "github.com/jiva-studio/numen/libs"
              desc: "a plugin depends on the plugin SDK and on no other library of this repository"
            - pkg: "github.com/jiva-studio/numen/apps"
              desc: "a plugin reaches no application"
            - pkg: "connectrpc.com/connect"
              desc: "a plugin calls and answers the core through the plugin SDK"
            - pkg: "google.golang.org/protobuf"
              desc: "a plugin calls and answers the core through the plugin SDK"

        # The plugin catalog: manifest is the model, catalog the service over it, and
        # every other package an adapter that depends inward.
        plugin-catalog-manifest:
          list-mode: lax
          files:
            - "**/libs/plugin/catalog/manifest/**"
            - "!$test"
          allow:
            # The manifest checks the when clauses of its slot entries with package when.
            - "github.com/jiva-studio/numen/libs/plugin/catalog/when"
          deny:
            - pkg: "github.com/jiva-studio/numen/libs/plugin/catalog"
              desc: "the manifest model depends on no other package of the catalog"
            - pkg: "github.com/jiva-studio/numen/libs/core/protocol"
              desc: "the manifest model knows no wire format"
            - pkg: "google.golang.org/protobuf"
              desc: "the manifest model knows no wire format"
            - pkg: "encoding/json"
              desc: "the manifest model knows no wire format"
            - pkg: "os"
              desc: "the manifest model performs no I/O"
            - pkg: "io/fs"
              desc: "the manifest model performs no I/O"
            - pkg: "path/filepath"
              desc: "the manifest model uses slash-separated paths and performs no I/O"
            - pkg: "net"
              desc: "the manifest model performs no I/O"
        plugin-catalog-service:
          list-mode: lax
          files:
            - "**/libs/plugin/catalog/catalog/**"
            - "!$test"
          allow:
            - "github.com/jiva-studio/numen/libs/plugin/catalog/manifest$"
          deny:
            - pkg: "github.com/jiva-studio/numen/libs"
              desc: "the catalog service depends on the manifest model only"
            - pkg: "google.golang.org/protobuf"
              desc: "the catalog service knows no wire format"
            - pkg: "os"
              desc: "the catalog service reaches files through its ports"
            - pkg: "net"
              desc: "the catalog service reaches the network through its ports"
        plugin-catalog-format:
          list-mode: lax
          files:
            - "**/libs/plugin/catalog/manifestjson/**"
            - "!$test"
          deny:
            - pkg: "github.com/jiva-studio/numen/libs/plugin/catalog/catalog"
              desc: "the manifest format depends on the manifest model only"
            - pkg: "github.com/jiva-studio/numen/libs/plugin/catalog/localsource"
              desc: "an adapter does not use another adapter"
            - pkg: "github.com/jiva-studio/numen/libs/plugin/catalog/indexsource"
              desc: "an adapter does not use another adapter"
            - pkg: "github.com/jiva-studio/numen/libs/plugin/catalog/packagecache"
              desc: "an adapter does not use another adapter"
            - pkg: "github.com/jiva-studio/numen/libs/plugin/catalog/snapshotcache"
              desc: "an adapter does not use another adapter"
        plugin-catalog-adapter:
          list-mode: lax
          files:
            - "**/libs/plugin/catalog/localsource/**"
            - "**/libs/plugin/catalog/indexsource/**"
            - "**/libs/plugin/catalog/packagecache/**"
            - "**/libs/plugin/catalog/snapshotcache/**"
            - "!$test"
          deny:
            - pkg: "github.com/jiva-studio/numen/libs/plugin/catalog/localsource"
              desc: "an adapter does not use another adapter"
            - pkg: "github.com/jiva-studio/numen/libs/plugin/catalog/indexsource"
              desc: "an adapter does not use another adapter"
            - pkg: "github.com/jiva-studio/numen/libs/plugin/catalog/packagecache"
              desc: "an adapter does not use another adapter"
            - pkg: "github.com/jiva-studio/numen/libs/plugin/catalog/snapshotcache"
              desc: "an adapter does not use another adapter"
            - pkg: "github.com/jiva-studio/numen/libs/plugin/catalog/catalogtest"
              desc: "production code does not use the test doubles"

        # The plugin SDK and its feature modules import no core package and no application.
        sdk-isolation:
          list-mode: lax
          files:
            - "**/libs/plugin/sdk-go/**"
          deny:
            - pkg: "github.com/jiva-studio/numen/libs/core/kernel"
              desc: "plugin SDK must not import core packages"
            - pkg: "github.com/jiva-studio/numen/apps"
              desc: "plugin SDK must not import host applications"

    errcheck:
      check-type-assertions: true
      check-blank: true

    gocritic:
      disabled-checks:
        - argOrder

    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^panic$
          msg: return the error of the call instead of panicking
        - pattern: ^fmt\.Print.*$
          pkg: ^fmt$
          msg: write to an injected writer or logger

    importas:
      no-unaliased: true
      alias:
        - pkg: github.com/jiva-studio/numen/libs/core/protocol/gen/numen/v1
          alias: v1
        - pkg: github.com/modelcontextprotocol/go-sdk/mcp
          alias: sdk
        - pkg: github.com/getcharzp/onnxruntime_purego
          alias: ort
        - pkg: github.com/getcharzp/go-ocr
          alias: read
        - pkg: github.com/open-spaced-repetition/go-fsrs/v3
          alias: fsrs

    usetesting:
      context-background: true
      os-temp-dir: true

    staticcheck:
      checks:
        - all
        - -QF*
        - -ST1020
        - -ST1021
        - -ST1022

    revive:
      rules:
        - name: redefines-builtin-id
        - name: unused-parameter
          arguments:
            - allowRegex: '^(_|ctx|t|w|r)$'
        - name: empty-block
        - name: increment-decrement
        - name: receiver-naming
        - name: blank-imports

