version: v2

# Generated code is committed, as in libs/protocol. Run `buf generate` here.
plugins:
  - local: protoc-gen-go
    out: gen
    opt: paths=source_relative

  - local: protoc-gen-connect-go
    out: gen
    opt: paths=source_relative

  - local: ../../node_modules/.bin/protoc-gen-es
    out: frontend/gen
    opt:
      - target=ts
      - import_extension=js
      - rewrite_imports=./numen/v1/*_pb.js:@numen/protocol
