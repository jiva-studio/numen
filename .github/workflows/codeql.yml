name: CodeQL

on:
  schedule:
    - cron: "30 1 * * 1"
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: codeql-${{ (github.event_name == 'pull_request' || github.event_name == 'push') && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

permissions:
  contents: read

jobs:
  # Which languages a pull request or a push touches, by the go and js filters of
  # .github/filters.yml; any other event analyses both. The analyses always start and report under
  # their own names; an analysis whose language did not change runs no step.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ (github.event_name != 'pull_request' && github.event_name != 'push') || steps.filter.outputs.go == 'true' }}
      js: ${{ (github.event_name != 'pull_request' && github.event_name != 'push') || steps.filter.outputs.js == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        with:
          sparse-checkout: .github
          persist-credentials: false

      - id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: .github/filters.yml
          predicate-quantifier: some-with-excludes

  # The steps carry the condition: a matrix job skipped whole reports under its
  # unexpanded name, which no required check holds.
  analyze:
    needs: [changes]
    if: ${{ !cancelled() }}
    name: Analyze (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ts
            language: javascript-typescript
            build-mode: none
            area: js
          - label: go
            language: go
            build-mode: autobuild
            area: go

    env:
      CHANGED: ${{ needs.changes.result != 'success' || needs.changes.outputs[matrix.area] == 'true' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.CHANGED == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: env.CHANGED == 'true' && matrix.language == 'go'
        with:
          go-version-file: libs/core/kernel/go.mod
          cache: false

      - name: Initialize CodeQL
        if: env.CHANGED == 'true'
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        if: env.CHANGED == 'true'
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
