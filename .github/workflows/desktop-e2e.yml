name: End-to-End

# The caller chooses the scope from the change: `git diff --name-only base...head |
# node tests/e2e/desktop/scripts/select-tests.mjs scope` prints `scope=<scope>`.
on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      scope:
        description: 'all, none, or folders under tests/e2e/desktop/tests/plugins/ (with tests/shell/), flashcards for the flashcards window, and acceptance for the scenarios of features/, separated by spaces'
        type: string
        default: all
      engines:
        description: 'chromium, webkit, or both separated by a space'
        type: string
        default: chromium webkit
  workflow_dispatch:
    inputs:
      scope:
        description: 'all, none, or folders under tests/e2e/desktop/tests/plugins/ (with tests/shell/), flashcards for the flashcards window, and acceptance for the scenarios of features/, separated by spaces'
        type: string
        default: all
      engines:
        description: 'chromium, webkit, or both separated by a space'
        type: string
        default: chromium webkit

env:
  SCOPE: ${{ inputs.scope || 'all' }}
  ENGINES: ${{ inputs.engines || 'chromium webkit' }}

permissions:
  contents: read

jobs:
  # The jobs the scope needs: each engine split into shards of about five minutes by shards.json.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      desktop: ${{ steps.plan.outputs.desktop }}
      flashcards: ${{ steps.plan.outputs.flashcards }}
      acceptance: ${{ steps.plan.outputs.acceptance }}
      paths: ${{ steps.plan.outputs.paths }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Test the selection of tests
        run: node --test tests/e2e/desktop/scripts/select-tests.test.mjs

      - id: plan
        name: Plan the jobs
        run: |
          node tests/e2e/desktop/scripts/select-tests.mjs plan "$SCOPE" > "$RUNNER_TEMP/plan.txt"
          while IFS= read -r line; do
            case "$line" in
              matrix=*)
                jq -c --arg engines "$ENGINES" \
                  '{include: [.include[] | select(.engine as $engine | $engines | split(" ") | index($engine))]}' \
                  <<< "${line#matrix=}" | sed 's/^/matrix=/'
                ;;
              *) echo "$line" ;;
            esac
          done < "$RUNNER_TEMP/plan.txt" | tee -a "$GITHUB_OUTPUT"

  # Builds the window, its plugins and the debug binaries once; the test jobs download them.
  build:
    name: Build
    needs: [plan]
    if: needs.plan.outputs.desktop == 'true' || needs.plan.outputs.flashcards == 'true' || needs.plan.outputs.acceptance == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/desktop/go.mod
          cache: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-mod-e2e-${{ hashFiles('go.work.sum', 'apps/desktop/go.sum', 'libs/**/go.sum', 'plugins/*/go.sum') }}
          restore-keys: go-mod-e2e-

      # What the newest build left behind: the binaries and plugin backends compile what changed.
      # The prefix restores the newest build when the Go version or a go.sum differs.
      - id: go-build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-build-e2e-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.work.sum', 'apps/desktop/go.sum', 'libs/**/go.sum', 'plugins/*/go.sum') }}
          restore-keys: go-build-e2e-

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        uses: ./.github/actions/install-node-modules

      - uses: ./.github/actions/setup-webkit

      - name: Build UI library
        uses: ./.github/actions/build-ui
        with:
          shell: 'true'

      # The plugins build beside the windows and the binaries, which embed the windows. The log of
      # the plugins is printed once both are done.
      - name: Build the plugins, the windows and the debug binaries
        run: |
          make plugins_build SKIP_UI_BUILD=1 > "$RUNNER_TEMP/plugins.log" 2>&1 &
          plugins=$!
          npm run build --prefix apps/desktop/editor
          npm run build --prefix apps/desktop/flashcards
          (
            cd apps/desktop
            go build -tags numen_debug -o numen-debug ./cmd/numen
            go build -tags numen_debug -o numen-flashcards-debug ./cmd/numen-flashcards
          )
          status=0
          wait "$plugins" || status=$?
          cat "$RUNNER_TEMP/plugins.log"
          # The fake OpenAI server of the connection specs; the test jobs have no Go toolchain.
          if [ "$status" -eq 0 ]; then
            (cd plugins/connections-llm && go build -o bin/fakeopenai ./backend/cmd/fakeopenai) || status=$?
          fi
          exit "$status"

      # Saves the build cache when the exact key was not restored.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.go-build-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/go-build
          key: go-build-e2e-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.work.sum', 'apps/desktop/go.sum', 'libs/**/go.sum', 'plugins/*/go.sum') }}

      # An artifact drops the mode bits of its files, and the binaries must stay executable.
      - name: Pack what the tests run
        run: |
          shopt -s nullglob
          tar -cf "$RUNNER_TEMP/e2e-build.tar" \
            apps/desktop/numen-debug apps/desktop/numen-flashcards-debug \
            plugins/plugins-index.json plugins/*/bin plugins/*/dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-build
          path: ${{ runner.temp }}/e2e-build.tar
          compression-level: 1
          retention-days: 1

  # One Playwright process with one server on each runner: the specs of a shard, in one engine.
  desktop:
    name: ${{ matrix.engine }} ${{ matrix.shard }}/${{ matrix.shards }}
    needs: [plan, build]
    if: needs.plan.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        uses: ./.github/actions/install-node-modules

      # The shard's engine and the GTK and WebKitGTK runtime libraries the window links against.
      - uses: ./.github/actions/setup-playwright
        with:
          browsers: ${{ matrix.engine }}
          packages: libgtk-4-1 libwebkitgtk-6.0-4

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-build
          path: ${{ runner.temp }}

      - name: Unpack the build
        run: |
          tar -xf "$RUNNER_TEMP/e2e-build.tar"
          if ldd apps/desktop/numen-debug | grep 'not found'; then exit 1; fi

      - name: Allow user namespaces, where the suite cuts the network
        run: |
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns > /dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Run the shard
        working-directory: tests/e2e/desktop
        env:
          ENGINE: ${{ matrix.engine }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.shards }}
          NUMEN_E2E_PATHS: ${{ needs.plan.outputs.paths }}
          NUMEN_E2E_JSON_DIR: ${{ runner.temp }}/e2e-json
          PLAYWRIGHT_BLOB_OUTPUT_DIR: ${{ runner.temp }}/e2e-blob
          PLAYWRIGHT_BLOB_OUTPUT_NAME: ${{ matrix.engine }}-${{ matrix.shard }}.zip
        run: |
          export NUMEN_E2E_SHARD="$((SHARD - 1))/$SHARDS"
          node scripts/run-offline.mjs --project="$ENGINE" --shards=1

      # The report job merges the blob reports of every shard into one HTML report.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: e2e-blob-${{ matrix.engine }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/e2e-blob/
          retention-days: 1

      # The seconds of each spec file, for `npm run shards:measure`.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: e2e-json-${{ matrix.engine }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/e2e-json/
          retention-days: 7

  flashcards:
    name: Flashcards
    needs: [plan, build]
    if: needs.plan.outputs.flashcards == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        uses: ./.github/actions/install-node-modules

      - uses: ./.github/actions/setup-playwright
        with:
          browsers: ${{ env.ENGINES }}
          packages: libgtk-4-1 libwebkitgtk-6.0-4

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-build
          path: ${{ runner.temp }}

      - name: Unpack the build
        run: |
          tar -xf "$RUNNER_TEMP/e2e-build.tar"
          if ldd apps/desktop/numen-flashcards-debug | grep 'not found'; then exit 1; fi

      - name: Allow user namespaces, where the suite cuts the network
        run: |
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns > /dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Run flashcards E2E tests
        working-directory: tests/e2e/desktop
        run: |
          read -ra engines <<< "$ENGINES"
          args=()
          if [ "${#engines[@]}" -eq 1 ]; then args=(-- "--project=${engines[0]}"); fi
          npm run test:flashcards "${args[@]}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-flashcards
          path: |
            tests/e2e/desktop/playwright-report/
            tests/e2e/desktop/test-results/
          retention-days: 7

  acceptance:
    name: Acceptance
    needs: [plan, build]
    if: needs.plan.outputs.acceptance == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        uses: ./.github/actions/install-node-modules

      - uses: ./.github/actions/setup-playwright
        with:
          browsers: ${{ env.ENGINES }}
          packages: libgtk-4-1 libwebkitgtk-6.0-4

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-build
          path: ${{ runner.temp }}

      - name: Unpack the build
        run: |
          tar -xf "$RUNNER_TEMP/e2e-build.tar"
          if ldd apps/desktop/numen-debug | grep 'not found'; then exit 1; fi

      - name: Allow user namespaces, where the suite cuts the network
        run: |
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns > /dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Run the scenarios
        working-directory: tests/acceptance/desktop
        run: |
          read -ra engines <<< "$ENGINES"
          args=()
          if [ "${#engines[@]}" -eq 1 ]; then args=(-- "--project=${engines[0]}"); fi
          npm run acceptance:test "${args[@]}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-acceptance
          path: |
            tests/e2e/desktop/playwright-report/
            tests/e2e/desktop/test-results/
          retention-days: 7

  report:
    name: Report
    needs: [desktop]
    if: ${{ !cancelled() && needs.desktop.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/
            /.node-version
            /package-lock.json
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - uses: ./.github/actions/install-lock-packages
        with:
          packages: playwright playwright-core

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: e2e-blob-*
          merge-multiple: true
          path: ${{ runner.temp }}/e2e-blob

      - name: Merge the shard reports
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: ${{ runner.temp }}/playwright-report
        run: node node_modules/playwright/cli.js merge-reports --reporter html "$RUNNER_TEMP/e2e-blob"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: ${{ runner.temp }}/playwright-report/
          retention-days: 7

  # The required check. A skipped matrix job reports under its unexpanded name, so this job reports
  # for all of them: it passes when every job passed or was skipped because the scope left it out.
  e2e:
    name: End-to-End
    needs: [plan, build, desktop, flashcards, acceptance, report]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the results of the jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
