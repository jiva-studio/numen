name: End-to-End

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: desktop-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Whether the change is more than documentation. The checks below always start
  # and report under their own names; a job skipped on this result reports as
  # skipped, which a required check accepts.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: detect
        uses: ./.github/actions/detect-code

  e2e:
    name: End-to-End
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: modules/apps/desktop/go.mod
          cache-dependency-path: |
            modules/apps/desktop/go.sum
            modules/libs/core/go.sum

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: modules/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix modules

      - uses: ./.github/actions/setup-webkit

      - uses: ./.github/actions/setup-playwright
        with:
          browsers: "chromium"

      - name: Build UI library
        run: npm run build --prefix modules/libs/ui

      - name: Build modular plugins
        run: make plugins_build

      - name: Build desktop editor
        run: npm run build --prefix modules/apps/desktop/editor

      - name: Build debug desktop binary
        run: |
          cd modules/apps/desktop
          go build -tags debug -o numen-debug ./cmd/numen

      - name: Run desktop E2E tests
        run: cd modules/tests/e2e/desktop && npx playwright test

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: |
            modules/tests/e2e/desktop/playwright-report/
            modules/tests/e2e/desktop/test-results/
          retention-days: 7
