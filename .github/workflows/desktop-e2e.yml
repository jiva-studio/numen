name: End-to-End

# The caller chooses the scope from the change: `git diff --name-only base...head |
# node tests/e2e/desktop/scripts/select-tests.mjs scope` prints `scope=<scope>`. A
# pull request asks for `smoke`: the tests tagged @smoke, in Chromium, from every folder.
on:
  workflow_call:
    inputs:
      scope:
        description: 'all, none, or folders under tests/e2e/desktop/tests/plugins/ (with tests/shell/), flashcards for the flashcards window, and acceptance for the scenarios of features/, separated by spaces'
        type: string
        default: all
      engines:
        description: 'chromium, webkit, or both separated by a space'
        type: string
        default: chromium webkit
      video:
        description: 'record the scenarios of features/ and keep their blobs for the report'
        type: boolean
        default: false
      features:
        description: 'feature files under features/ the scenarios run from, separated by spaces; empty is all'
        type: string
        default: ''
      smoke:
        description: 'run the tests tagged @smoke in Chromium alone, the main journeys of the product; engines and the selection of paths are ignored'
        type: boolean
        default: false
      artifact-name:
        description: existing desktop build artifact in the same run
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      scope:
        description: 'all, none, or folders under tests/e2e/desktop/tests/plugins/ (with tests/shell/), flashcards for the flashcards window, and acceptance for the scenarios of features/, separated by spaces'
        type: string
        default: all
      engines:
        description: 'chromium, webkit, or both separated by a space'
        type: string
        default: chromium webkit
      video:
        description: 'record the scenarios of features/ and keep their blobs for the report'
        type: boolean
        default: false
      features:
        description: 'feature files under features/ the scenarios run from, separated by spaces; empty is all'
        type: string
        default: ''
      smoke:
        description: 'run the tests tagged @smoke in Chromium alone, the main journeys of the product; engines and the selection of paths are ignored'
        type: boolean
        default: false

env:
  ENGINES: ${{ inputs.smoke && 'chromium' || inputs.engines || 'chromium webkit' }}
  SMOKE: ${{ inputs.smoke && 'true' || 'false' }}

permissions:
  contents: read

jobs:
  build:
    name: Build
    uses: ./.github/workflows/desktop-e2e-build.yml
    with:
      scope: ${{ inputs.scope || 'all' }}
      engines: ${{ inputs.engines || 'chromium webkit' }}
      smoke: ${{ inputs.smoke }}
      artifact-name: ${{ inputs.artifact-name || '' }}

  # One Playwright process with one server on each runner: the specs of a shard, in one engine.
  desktop:
    name: ${{ matrix.engine }} ${{ matrix.shard }}/${{ matrix.shards }}
    needs: [build]
    if: needs.build.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        uses: ./.github/actions/install-node-modules

      # The shard's engine and the GTK and WebKitGTK runtime libraries the window links against.
      - uses: ./.github/actions/setup-playwright
        with:
          browsers: ${{ matrix.engine }}
          packages: libgtk-4-1 libwebkitgtk-6.0-4

      - uses: ./.github/actions/fetch-e2e-build
        with:
          artifact-name: ${{ needs.build.outputs.artifact-name }}

      - name: Unpack the build
        run: |
          tar -xf "$RUNNER_TEMP/e2e-build.tar"
          if ldd apps/desktop/numen-debug | grep 'not found'; then exit 1; fi

      - name: Allow user namespaces, where the suite cuts the network
        run: |
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns > /dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Run the shard
        working-directory: tests/e2e/desktop
        env:
          ENGINE: ${{ matrix.engine }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.shards }}
          NUMEN_E2E_PATHS: ${{ needs.build.outputs.paths }}
          NUMEN_E2E_JSON_DIR: ${{ runner.temp }}/e2e-json
          PLAYWRIGHT_BLOB_OUTPUT_DIR: ${{ runner.temp }}/e2e-blob
          PLAYWRIGHT_BLOB_OUTPUT_NAME: ${{ matrix.engine }}-${{ matrix.shard }}.zip
        run: |
          export NUMEN_E2E_SHARD="$((SHARD - 1))/$SHARDS"
          args=()
          if [ "$SMOKE" = true ]; then args=(--grep @smoke); fi
          node scripts/run-offline.mjs --project="$ENGINE" --shards=1 "${args[@]}"

      # The report job merges the blob reports of every shard into one HTML report.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: e2e-blob-${{ matrix.engine }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/e2e-blob/
          retention-days: 1

      # The seconds of each spec file, for `npm run shards:measure`.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: e2e-json-${{ matrix.engine }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/e2e-json/
          retention-days: 7

  flashcards:
    name: Flashcards
    needs: [build]
    if: needs.build.outputs.flashcards == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        uses: ./.github/actions/install-node-modules

      - uses: ./.github/actions/setup-playwright
        with:
          browsers: ${{ env.ENGINES }}
          packages: libgtk-4-1 libwebkitgtk-6.0-4

      - uses: ./.github/actions/fetch-e2e-build
        with:
          artifact-name: ${{ needs.build.outputs.artifact-name }}

      - name: Unpack the build
        run: |
          tar -xf "$RUNNER_TEMP/e2e-build.tar"
          if ldd apps/desktop/numen-flashcards-debug | grep 'not found'; then exit 1; fi

      - name: Allow user namespaces, where the suite cuts the network
        run: |
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns > /dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Run flashcards E2E tests
        working-directory: tests/e2e/desktop
        run: |
          read -ra engines <<< "$ENGINES"
          args=()
          if [ "${#engines[@]}" -eq 1 ]; then args=(-- "--project=${engines[0]}"); fi
          npm run test:flashcards "${args[@]}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-flashcards
          path: |
            tests/e2e/desktop/playwright-report/
            tests/e2e/desktop/test-results/
          retention-days: 7

  acceptance:
    name: Acceptance
    needs: [build]
    if: needs.build.outputs.acceptance == 'true'
    uses: ./.github/workflows/desktop-acceptance.yml
    with:
      artifact-name: ${{ needs.build.outputs.artifact-name }}
      engines: ${{ inputs.engines || 'chromium webkit' }}
      smoke: ${{ inputs.smoke }}
      features: ${{ inputs.features }}
      video: ${{ inputs.video }}

  report:
    name: Report
    needs: [desktop]
    if: ${{ !cancelled() && needs.desktop.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/
            /.node-version
            /package-lock.json
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - uses: ./.github/actions/install-lock-packages
        with:
          packages: playwright playwright-core

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: e2e-blob-*
          merge-multiple: true
          path: ${{ runner.temp }}/e2e-blob

      - name: Merge the shard reports
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: ${{ runner.temp }}/playwright-report
        run: node node_modules/playwright/cli.js merge-reports --reporter html "$RUNNER_TEMP/e2e-blob"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: ${{ runner.temp }}/playwright-report/
          retention-days: 7

  # The required check. A skipped matrix job reports under its unexpanded name, so this job reports
  # for all of them: it passes when every job passed or was skipped because the scope left it out.
  e2e:
    name: End-to-End
    needs: [build, desktop, flashcards, acceptance, report]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the results of the jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
