name: End-to-End

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: desktop-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Whether the change is more than documentation. The checks below always start
  # and report under their own names; a job skipped on this result reports as
  # skipped, which a required check accepts.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: detect
        uses: ./.github/actions/detect-code

  e2e:
    name: End-to-End
    needs: [changes]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/desktop/go.mod
          cache-dependency-path: |
            apps/desktop/go.sum
            libs/core/go.sum

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        uses: ./.github/actions/install-node-modules

      - uses: ./.github/actions/setup-webkit

      - uses: ./.github/actions/setup-playwright
        with:
          browsers: "chromium webkit"

      - name: Build UI library
        run: |
          npm run build --prefix libs/ui/core
          npm run build --prefix libs/ui/shell

      - name: Build modular plugins
        run: make plugins_build

      - name: Build desktop editor
        run: npm run build --prefix apps/desktop/editor

      - name: Build debug desktop binary
        run: |
          cd apps/desktop
          go build -tags numen_debug -o numen-debug ./cmd/numen

      - name: Allow user namespaces, where the suite cuts the network
        run: |
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns > /dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Run desktop E2E tests in Chromium, then WebKit
        run: cd tests/e2e/desktop && npm test

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            tests/e2e/desktop/playwright-report/
            tests/e2e/desktop/test-results/
          retention-days: 7
