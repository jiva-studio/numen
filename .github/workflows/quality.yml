name: Quality

# Verification of code quality metrics (duplication, complexity, dead code, interfaces)
# and narrative naming across Go and TypeScript/Vue modules.
on:
  pull_request:
    paths:
      - "{apps,libs,plugins,tools,tests}/**"
      - "!**/*.md"
      - "!docs/**"
      - "Makefile"
      - ".github/workflows/quality.yml"
  push:
    branches: [main]
    paths:
      - "{apps,libs,plugins,tools,tests}/**"
      - "!**/*.md"
      - "!docs/**"
      - "Makefile"
      - ".github/workflows/quality.yml"

concurrency:
  group: quality-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  metrics:
    name: Code Quality & Metrics
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: libs/core/go.mod
          cache-dependency-path: |
            libs/core/go.sum
            libs/notes/go.sum
            libs/plugin-sdk-go/go.sum

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        uses: ./.github/actions/install-node-modules

      - name: Install golangci-lint
        uses: ./.github/actions/install-golangci-lint

      - name: Check narrative identifiers, test names and comments
        run: make lint_narrative

      - name: Run code quality suite
        run: make check_quality opts="--github-summary"
