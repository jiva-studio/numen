name: Caches

# A pull request reads the caches of main and of itself, and its own are deleted when it closes, so
# a cache only a pull request saved is cold for the next one. This saves, on main, the caches that
# follow from the install actions alone: the system packages of the jobs that install them.
on:
  push:
    branches: [main]
    paths:
      - .github/actions/cache-apt/**
      - .github/actions/setup-webkit/**
      - .github/workflows/caches.yml
  workflow_dispatch:

concurrency:
  group: caches
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  webkit:
    name: WebKit packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-webkit
