name: Numen Desktop

on:
  pull_request:
    paths:
      - "modules/apps/desktop/**"
      - "modules/libs/core/**"
      - "modules/libs/ui/**"
      - "modules/libs/wire/**"
      - "modules/libs/protocol/**"
      - "modules/tools/depgraph/**"
      - ".github/workflows/numen-desktop.yml"
  push:
    branches: [main]
    paths:
      - "modules/apps/desktop/**"
      - "modules/libs/core/**"
      - "modules/libs/ui/**"
      - "modules/libs/wire/**"
      - "modules/libs/protocol/**"
      - "modules/tools/depgraph/**"
      - ".github/workflows/numen-desktop.yml"

# One run at a time per branch, and on a pull request the newest is the one that
# matters. A run on main is left to finish: it fills the cache the branches read.
concurrency:
  group: numen-desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  go:
    name: "Test :: Go"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: modules/apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The two caches are keyed apart: the modules answer to go.sum, the build
      # answers to the commit.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: false

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/go/pkg/mod
          key: go-mod-modules/apps/desktop-${{ hashFiles('modules/apps/desktop/go.sum') }}
          restore-keys: go-mod-modules/apps/desktop-

      # What the last compile and test run left behind: a run compiles what
      # changed and re-runs the tests that changed. The key carries the commit,
      # so the newest cache the branch can see is the one restored.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/go-build
          key: go-build-modules/apps/desktop-${{ github.sha }}
          restore-keys: go-build-modules/apps/desktop-

      # The window links against the system's own browser, so the machine that
      # compiles it needs that browser's headers. The command line tool needs
      # none of this, which is why it is a separate binary.
      - name: Webview
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            -o Dpkg::Options::=--force-unsafe-io \
            libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Formatting
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "not gofmt-ed:"; echo "$unformatted"; exit 1
          fi

      - run: go vet ./...

      # What .golangci.yml asks for, beyond gofmt and go vet. It runs inside
      # this job because the window's packages only compile on a machine that
      # already has the webview's headers, and this is the machine that does.
      #
      # It reports and does not fail: the check arrived after the code did, and
      # the backlog it names is triaged one finding at a time. The flag comes
      # off when that list is empty; `make lint-go` carries the same one.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          working-directory: modules/apps/desktop
          args: --timeout 15m --issues-exit-code=0

      # The vulnerability list is kept elsewhere and read at the time of the
      # run, so this step can find something on a branch that changed nothing.
      # It answers for the standard library of the Go above as well as for what
      # is required, which is why nothing here is pinned.
      - name: Vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      # A test builds its vault in a temporary folder, and there is memory here
      # to hold every one of them.
      - run: go test -race ./...
        env:
          TMPDIR: /dev/shm

      # Every run writes what it built. A branch reads its own back on the next
      # push to it and main's before that.
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/go-build
          key: go-build-modules/apps/desktop-${{ github.sha }}

  # The other half of the promise the two binaries make: this one is built for
  # a machine it is not being built on.
  cli:
    name: "Cross-compile :: Command line tool"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: modules/apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache-dependency-path: |
            modules/apps/desktop/go.sum
            modules/libs/core/go.sum
      - name: Cross-compile
        run: |
          for target in darwin/arm64 windows/amd64 linux/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -o /dev/null ./cmd/numen-cli
          done

  # The two screens the desktop draws, and the wire they read their answers
  # through. All three are typed against the schema and against the components,
  # so a change to either fails here rather than on screen.
  screens:
    name: "Test :: Screens"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            modules/libs/protocol/package-lock.json
            modules/libs/ui/package-lock.json
            modules/libs/wire/package-lock.json
            modules/apps/desktop/ui/package-lock.json
            modules/apps/desktop/flashcards/package-lock.json

      # A window reaches the components through their build, and the wire
      # through its own dependencies: both windows import @numen/wire, which
      # resolves @numen/protocol and @numen/ui out of its own node_modules.
      - name: Install
        run: |
          npm ci --prefix modules/libs/protocol
          npm ci --prefix modules/libs/ui
          npm ci --prefix modules/libs/wire
          npm ci --prefix modules/apps/desktop/ui
          npm ci --prefix modules/apps/desktop/flashcards

      # The engines are a download of their own and answer to the version in
      # the lockfile. Whatever the cache does not hold is fetched below.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('modules/libs/ui/package-lock.json') }}
          restore-keys: playwright-

      - name: The browsers the stories run in
        run: npx --prefix modules/libs/ui playwright install chromium webkit --with-deps

      - name: Build the components
        run: npm run build --prefix modules/libs/ui

      # Which way the interface modules are allowed to point, and the drawing
      # of which way they do. The drawing is committed, so a change that moves
      # an edge has to redraw it: a map that is out of date is worse than none.
      - name: Boundaries
        run: |
          npm ci --prefix modules/tools/depgraph
          npm run check --prefix modules/tools/depgraph
          npm run graph --prefix modules/tools/depgraph
          git diff --exit-code -- docs/dependencies.md

      - name: Lint
        run: |
          npm run lint --prefix modules/apps/desktop/ui
          npm run lint --prefix modules/apps/desktop/flashcards

      - name: Typecheck
        run: |
          npm run typecheck --prefix modules/libs/wire
          npm run typecheck --prefix modules/apps/desktop/ui
          npm run typecheck --prefix modules/apps/desktop/flashcards

      - name: Test
        run: |
          npm test --prefix modules/libs/wire
          npm run test:unit --prefix modules/apps/desktop/ui -- --coverage
          npm run test:stories --prefix modules/apps/desktop/ui
          npm test --prefix modules/apps/desktop/flashcards
