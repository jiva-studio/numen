name: commitlint

on:
  pull_request:
  push:
    branches: [main]

defaults:
  run:
    working-directory: modules/tools/git-hooks

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: modules/tools/git-hooks/package-lock.json

      - run: npm ci

      # PR: validate every commit in the range. Push: validate the last one.
      - name: Validate commit messages
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npx commitlint \
              --from "${{ github.event.pull_request.base.sha }}" \
              --to   "${{ github.event.pull_request.head.sha }}" \
              --verbose
          else
            npx commitlint --last --verbose
          fi
