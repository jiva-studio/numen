name: Desktop Backend

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "!apps/desktop/editor/**"
      - "!apps/desktop/flashcards/**"
      - "!apps/desktop/**/*.md"
      - "libs/core/**"
      - "!libs/core/**/*.md"
      - "libs/notes/**"
      - "!libs/notes/**/*.md"
      - "libs/plugin-sdk-go/**"
      - "!libs/plugin-sdk-go/**/*.md"
      - "libs/protocol/**"
      - "!libs/protocol/**/*.md"
      - "apps/desktop-monolith/**"
      - "plugins/**"
      - "!plugins/**/*.md"
      - "!docs/**"
      - ".github/workflows/desktop-backend.yml"
      # The rules the linter is held to, and the ones written here in Go.
      - ".golangci.yml"
      - "plugins/.golangci.yml"
      - "**/gorules/**"

# One run at a time per branch, and on a pull request the newest is the one that
# matters. A run on main is left to finish: it fills the cache the branches read.
concurrency:
  group: desktop-backend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Whether the change is more than documentation. The checks below always start
  # and report under their own names; a job skipped on this result reports as
  # skipped, which a required check accepts.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: detect
        uses: ./.github/actions/detect-code

  lint:
    name: Lint
    needs: [changes]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/desktop/go.mod
          cache-dependency-path: |
            apps/desktop/go.sum
            libs/core/go.sum

      # The window links against the system's own browser, so the machine that
      # compiles and checks it needs that browser's headers.
      - uses: ./.github/actions/setup-webkit

      - name: Verify Go formatting
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "not gofmt-ed:"; echo "$unformatted"; exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      # What .golangci.yml asks for, beyond gofmt and go vet.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: apps/desktop
          args: --timeout 15m

      - name: Run plugin linters
        working-directory: .
        run: make plugins_lint

      # The vulnerability list is kept elsewhere and read at the time of the
      # run, so this step can find something on a branch that changed nothing.
      # It answers for the standard library of the Go above as well as for what
      # is required.
      - uses: ./.github/actions/govulncheck
        with:
          working-directory: apps/desktop

  test:
    name: Tests
    needs: [changes]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The modules answer to go.sum, the build to the Go version and go.sum.
      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/desktop/go.mod
          cache: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-mod-apps/desktop-${{ hashFiles('apps/desktop/go.sum') }}
          restore-keys: go-mod-apps/desktop-

      # What main's last compile and test run left behind: a run compiles what
      # changed and re-runs the tests that changed. The prefix restores main's
      # newest build when the Go version or go.sum differs.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-build-apps/desktop-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('apps/desktop/go.sum') }}
          restore-keys: go-build-apps/desktop-

      # The window links against the system's own browser, so the machine that
      # compiles it needs that browser's headers. The command line tool needs
      # none of this, which is why it is a separate binary.
      - uses: ./.github/actions/setup-webkit

      # A test builds its vault in a temporary folder, and there is memory here
      # to hold every one of them.
      - name: Run Go tests
        run: go test -race ./...
        env:
          TMPDIR: /dev/shm

      - name: Verify dual-mode builds
        run: |
          go build -tags plugins_monolith -o /dev/null ./cmd/numen
          go build -o /dev/null ./cmd/numen

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Node dependencies
        uses: ./.github/actions/install-node-modules

      - name: Build UI components
        working-directory: libs/ui
        run: npm run build

      - name: Build and test modular plugins
        working-directory: .
        run: |
          make plugins_build
          make plugins_test

      # A push to main writes what it built, and every other run only reads it.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: ~/.cache/go-build
          key: go-build-apps/desktop-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('apps/desktop/go.sum') }}

  # The library every native plugin backend is built on: a base module and a
  # feature module in each folder of it that has a go.mod.
  plugin-sdk-go:
    name: Plugin SDK
    needs: [changes]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: libs/plugin-sdk-go/go.mod
          cache-dependency-path: libs/plugin-sdk-go/**/go.sum

      # The linter the make target runs, at the version the other modules use.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          install-only: true

      - name: Run linters
        run: make lib_plugin_sdk_go_lint

      - name: Run Go tests
        run: make lib_plugin_sdk_go_test

  # The other half of the promise the two binaries make: this one is built for
  # a machine it is not being built on.
  cli:
    name: CLI
    needs: [changes]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/desktop/go.mod
          cache-dependency-path: |
            apps/desktop/go.sum
            libs/core/go.sum
      - name: Cross-compile CLI binaries
        run: |
          for target in darwin/arm64 windows/amd64 linux/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -o /dev/null ./cmd/numen-cli
          done
      # The tool that strips machine paths from the build profile is a module
      # of its own under the desktop one.
      - name: Build the profile normaliser
        working-directory: apps/desktop/build/pgonorm
        run: |
          go vet ./...
          go build -o /dev/null .

  # The composition root that runs the plugins in-process is a module of its
  # own, and this is the job that compiles it.
  monolith:
    name: Monolith
    needs: [changes]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/desktop-monolith
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/desktop-monolith/go.mod
          cache-dependency-path: apps/desktop-monolith/go.sum

      # It links the window, and the window links against the system's own
      # browser.
      - uses: ./.github/actions/setup-webkit

      - name: Run go vet
        run: go vet -tags plugins_monolith ./...

      - name: Build the monolith
        run: go build -tags plugins_monolith -o /dev/null .

      - name: Run Go tests
        run: go test -tags plugins_monolith -short ./...

      # Both builds are put the same chat, single answer and document: the monolith serves the
      # plugins from its own process and the other build launches them as processes. The answers
      # are compared.
      - name: Smoke test both builds
        run: go test -tags plugins_monolith -run TestBothBuildsAnswerAlike ./...
