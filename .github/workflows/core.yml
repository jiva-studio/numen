name: Core

on:
  pull_request:
    paths:
      - "modules/libs/core/**"
      - "modules/libs/protocol/**"
      - "tests/**"
      - ".github/workflows/core.yml"
  push:
    branches: [main]
    paths:
      - "modules/libs/core/**"
      - "modules/libs/protocol/**"
      - "tests/**"
      - ".github/workflows/core.yml"
  # A platform can be asked for after the checks have already run, without
  # rewriting a commit to carry the trailer.
  workflow_dispatch:
    inputs:
      windows:
        description: Windows
        type: boolean
        default: false
      macos:
        description: macOS
        type: boolean
        default: false

# One run at a time per branch, and on a pull request the newest is the one that
# matters. A run on main is left to finish: it fills the cache the branches read.
concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Which machines this run is for. Linux always; a Windows or a mac runner
  # costs two and ten times a Linux one, and is asked for by name.
  asked:
    name: Platforms
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.said.outputs.matrix }}
    steps:
      # The trailer is looked for in every commit the branch adds, so the whole
      # range has to be here to be read.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: said
        env:
          EVENT: ${{ github.event_name }}
          ASKED_WINDOWS: ${{ inputs.windows }}
          ASKED_MACOS: ${{ inputs.macos }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          windows=false
          macos=false

          if [ "$EVENT" = workflow_dispatch ]; then
            windows=$ASKED_WINDOWS
            macos=$ASKED_MACOS
          elif [ -n "$BASE" ] && [ "$BASE" != 0000000000000000000000000000000000000000 ]; then
            # Every commit the range adds, not the last of it: the trailer goes
            # on the commit that needed the platform.
            asked=$(git log --format=%B "$BASE..$HEAD" \
              | grep -i '^Run-On:' \
              | cut -d: -f2- \
              | tr 'A-Z' 'a-z' | tr -d ' \t\r' | tr '\n' ',' || true)
            echo "asked: ${asked:-nothing}"
            case ",$asked," in *,all,*) windows=true; macos=true ;; esac
            case ",$asked," in *,windows,*) windows=true ;; esac
            case ",$asked," in *,macos,*) macos=true ;; esac
          fi

          # A platform whose failures are not yet settled is run and reported,
          # and does not hold the pull request. What stands open on macOS:
          # adapter/cli and adapter/mcp compare a vault's folder against the
          # path a test made it at, and a mac resolves /tmp to /private/tmp;
          # flashcards parts from the library on a card face a day ahead of its
          # own last answer, which the test names as the machine's arithmetic.
          #
          # race is the detector, and a race is the program's and not the
          # machine's: Linux runs it on every push, and Windows runs the same
          # tests without paying for it a second time on the slowest runner.
          #
          # minutes is what the suite is given. Every machine runs every test,
          # so a machine that no longer fits says so instead of passing slowly.
          entries='{"name":"Linux","runner":"ubuntu-latest","optional":false,"race":true,"minutes":45}'
          if [ "$windows" = true ]; then
            entries="$entries,"'{"name":"Windows","runner":"windows-latest","optional":true,"race":false,"minutes":15}'
          fi
          if [ "$macos" = true ]; then
            entries="$entries,"'{"name":"macOS","runner":"macos-latest","optional":true,"race":true,"minutes":45}'
          fi
          echo "matrix=[$entries]" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  # What .golangci.yml asks for, beyond the gofmt and go vet the test job runs.
  # Once, on the cheapest machine: a rule about the shape of the code answers
  # the same on all three.
  #
  # The core reports and does not fail. The check arrived after the code did,
  # and the backlog it names is triaged one finding at a time. The flag comes
  # off when that list is empty; `make lint-go` carries the same one.
  lint:
    name: "Lint :: Go"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache-dependency-path: modules/libs/core/go.sum

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          working-directory: modules/libs/core
          args: --timeout 15m --issues-exit-code=0

      # The schema's Go is generated and holds the set clean, so here the
      # linter is allowed to say no.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          working-directory: modules/libs/protocol
          args: --timeout 10m

  go:
    name: "Test :: Go :: ${{ matrix.name }}"
    needs: [asked]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.asked.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.optional }}
    # A suite that stops answering is billed for six hours by default, and on
    # these machines at twice and ten times the rate.
    timeout-minutes: ${{ matrix.minutes }}
    defaults:
      run:
        # One shell on all three, so a step is read the same wherever it runs.
        shell: bash
        working-directory: modules/libs/core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The two caches are keyed apart: the modules answer to go.sum, the build
      # answers to the commit. Both carry the machine, because what a compiler
      # leaves behind is that machine's.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: false

      # Where the compiler keeps what it built is the machine's own answer.
      - id: paths
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.paths.outputs.modules }}
          key: go-mod-core-${{ matrix.runner }}-${{ hashFiles('modules/libs/core/go.sum') }}
          restore-keys: go-mod-core-${{ matrix.runner }}-

      # What the last compile and test run left behind: a run compiles what
      # changed and re-runs the tests that changed. The key carries the commit,
      # so the newest cache the branch can see is the one restored.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.paths.outputs.build }}
          key: go-build-core-${{ matrix.runner }}-${{ github.sha }}
          restore-keys: go-build-core-${{ matrix.runner }}-

      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt-ed:"; echo "$unformatted"; exit 1
          fi

      - run: go vet ./...

      # A test builds its vault in a temporary folder, and there is memory here
      # to hold every one of them.
      - name: Temporary folder
        if: matrix.runner == 'ubuntu-latest'
        run: echo "TMPDIR=/dev/shm" >> "$GITHUB_ENV"

      # A Windows runner hands out a temporary folder on the system drive and
      # checks the repository out on another. The folder a test builds its vault
      # in moves to the drive the runner keeps for its own work, and what this
      # machine offers is written into the log beside the timings it produces.
      - name: Temporary folder
        if: matrix.runner == 'windows-latest'
        run: |
          powershell -NoProfile -Command "Get-PSDrive -PSProvider FileSystem | Format-Table -AutoSize Name,Used,Free" || true
          powershell -NoProfile -Command "Get-MpComputerStatus | Format-List RealTimeProtectionEnabled,AntivirusEnabled" || true
          echo "RUNNER_TEMP=$RUNNER_TEMP  TEMP=${TEMP:-unset}  TMP=${TMP:-unset}"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"

      # -race because a scan will grow concurrent, and the cheapest time to find
      # that out is before it does. Every machine runs every test.
      - run: go test ${{ matrix.race && '-race' || '' }} ./...

      # Every run writes what it built. A branch reads its own back on the next
      # push to it and main's before that.
      # A run that found something still built most of it, and the next one is
      # the one that reads this back.
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: ${{ !cancelled() }}
        with:
          path: ${{ steps.paths.outputs.build }}
          key: go-build-core-${{ matrix.runner }}-${{ github.sha }}
