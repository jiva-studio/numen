name: Boundaries

# Which way the modules are allowed to point, and the house rules read off
# their own source. Both tools walk every module there is, so this runs on any
# change under modules/: a rule that covers a module from a workflow that
# module's own change never triggers covers nothing.
on:
  pull_request:
    paths:
      - "modules/**"
      - ".github/workflows/boundaries.yml"
  push:
    branches: [main]
    paths:
      - "modules/**"
      - ".github/workflows/boundaries.yml"

concurrency:
  group: boundaries-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  boundaries:
    name: "Check :: Boundaries"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            modules/libs/protocol/package-lock.json
            modules/libs/ui/package-lock.json
            modules/libs/wire/package-lock.json
            modules/apps/desktop/editor/package-lock.json
            modules/apps/desktop/flashcards/package-lock.json
            modules/apps/mobile/package-lock.json
            modules/tools/depgraph/package-lock.json

      # A cruise resolves what a module imports out of that module's own
      # node_modules, so every module the list names is installed. One that is
      # not would read as a module importing nothing.
      - name: Install
        run: |
          npm ci --prefix modules/libs/protocol
          npm ci --prefix modules/libs/ui
          npm ci --prefix modules/libs/wire
          npm ci --prefix modules/apps/desktop/editor
          npm ci --prefix modules/apps/desktop/flashcards
          npm ci --prefix modules/apps/mobile
          npm ci --prefix modules/tools/depgraph

      # A window reaches the components through their build.
      - name: Build the components
        run: npm run build --prefix modules/libs/ui

      - name: Which way the modules point
        run: npm run check --prefix modules/tools/depgraph

      # The drawing is committed, so a change that moves an edge has to redraw
      # it: a map that is out of date is worse than none.
      - name: The drawing
        run: |
          npm run graph --prefix modules/tools/depgraph
          git diff --exit-code -- docs/dependencies.md

      # The house rules of the interface modules and the names on the files of
      # every module, Go included. It installs nothing.
      - name: The house rules
        run: npm run check --prefix modules/tools/lint
