name: Coverage

on:
  push:
    branches: [main]
    paths:
      - "{apps,libs,plugins,tools,tests}/**"
      - "!docs/**"
      - "!**.md"
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: coverage
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: libs/core/go.mod
          cache: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Node dependencies
        uses: ./.github/actions/install-node-modules

      - name: Build UI components
        run: npm run build --prefix libs/ui/core

      - name: Measure unified coverage and update badge
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN || github.token }}
          GH_TOKEN: ${{ secrets.GIST_TOKEN || github.token }}
        run: node tools/ci-coverage/collect.mjs
