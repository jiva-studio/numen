name: Site

# A run answers for the page and for nothing else, so what starts it is a change
# to the page, on a branch and on main alike. The two lists are written out
# twice: a workflow file takes no anchor. The plugin registry workflow starts it
# by hand when the published registry changes: the code is the code main was
# checked with, so that run only builds and deploys.
on:
  pull_request:
    paths:
      - "apps/landing/**"
      - "tools/plugin-registry/**"
      - ".github/workflows/site.yml"
  push:
    branches: [main]
    paths:
      - "apps/landing/**"
      - "tools/plugin-registry/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

# One run at a time per branch, and the newest is the one that matters. Two
# deploys share one storage zone, and the second takes down what the first has
# not finished putting up. A deploy that is overtaken is stopped: every deploy
# writes the whole site and then removes what it did not write, so the one that
# follows leaves the zone whole.
concurrency:
  group: landing-${{ github.ref }}
  cancel-in-progress: true

# The deploy goes to storage with a key of its own; nothing here writes to the
# repository.
permissions:
  contents: read

jobs:
  # The page is static and carries no framework, so what there is to check is
  # that its markup typechecks and that the site builds — pictures included,
  # which is where a missing asset turns up.
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # A pull request builds its catalog from its own tree, whose changelogs read
      # the history of the plugin folders.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        uses: ./.github/actions/install-node-modules

      # Main and a dispatched run read the published registry (the typecheck
      # loads it too); a pull request collects one from its tree, without the
      # network.
      - name: Collect the plugin registry of the pull request
        if: github.event_name == 'pull_request'
        run: |
          node tools/plugin-registry/collect.mjs --out "$RUNNER_TEMP/registry" --offline
          echo "NUMEN_PLUGIN_REGISTRY_FILE=$RUNNER_TEMP/registry/latest.json" >> "$GITHUB_ENV"

      - name: Typecheck landing page
        if: github.event_name != 'workflow_dispatch'
        run: npm run typecheck --prefix apps/landing

      - name: Lint landing page
        if: github.event_name != 'workflow_dispatch'
        run: npm run lint --prefix apps/landing

      - name: Test the plugin registry
        if: github.event_name != 'workflow_dispatch'
        run: node --test tools/plugin-registry/*.test.mjs apps/landing/tools/plugin-registry.test.mjs

      # Astro keeps the images it has resized here, keyed by their content.
      - name: Restore the image cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/landing/node_modules/.astro
          key: landing-astro-${{ github.run_id }}
          restore-keys: landing-astro-

      - name: Build landing page
        env:
          PUBLIC_NUMEN_DOWNLOADS_BASE: ${{ vars.PUBLIC_NUMEN_DOWNLOADS_BASE }}
        run: npm run build --prefix apps/landing

      - name: Save the image cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/landing/node_modules/.astro
          key: landing-astro-${{ github.run_id }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: landing
          path: apps/landing/dist
          if-no-files-found: error

  # What is on the default branch is what is on the web. Storage is never
  # readable without its password: the pull zone in front of it is what serves
  # the page, and the page has a storage zone of its own.
  deploy:
    name: Deploy
    environment: production
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: landing
          path: dist

      - uses: ./.github/actions/deploy-bunny
        with:
          endpoint: ${{ vars.BUNNY_STORAGE_ENDPOINT }}
          storage-zone: ${{ vars.BUNNY_SITE_STORAGE_ZONE }}
          served-from: ${{ vars.BUNNY_SITE_SERVED_FROM }}
          storage-key: ${{ secrets.BUNNY_SITE_STORAGE_KEY }}
          api-key: ${{ secrets.BUNNY_API_KEY }}
          dist-path: dist
