name: Site

# A run answers for the page and for nothing else, so what starts it is a change
# to the page, on a branch and on main alike. The two lists are written out
# twice: a workflow file takes no anchor.
on:
  pull_request:
    paths:
      - "apps/landing/**"
      - ".github/workflows/site.yml"
  push:
    branches: [main]
    paths:
      - "apps/landing/**"
      - ".github/workflows/site.yml"

# One run at a time per branch, and the newest is the one that matters. Two
# deploys share one storage zone, and the second takes down what the first has
# not finished putting up. A deploy that is overtaken is stopped: every deploy
# writes the whole site and then removes what it did not write, so the one that
# follows leaves the zone whole.
concurrency:
  group: landing-${{ github.ref }}
  cancel-in-progress: true

# The deploy goes to storage with a key of its own; nothing here writes to the
# repository.
permissions:
  contents: read

jobs:
  # The page is static and carries no framework, so what there is to check is
  # that its markup typechecks and that the site builds — pictures included,
  # which is where a missing asset turns up.
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        uses: ./.github/actions/install-node-modules

      - name: Typecheck landing page
        run: npm run typecheck --prefix apps/landing

      - name: Lint landing page
        run: npm run lint --prefix apps/landing

      - name: Build landing page
        env:
          PUBLIC_NUMEN_DOWNLOADS_BASE: ${{ vars.PUBLIC_NUMEN_DOWNLOADS_BASE }}
        run: npm run build --prefix apps/landing

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: landing
          path: apps/landing/dist
          if-no-files-found: error

  # What is on the default branch is what is on the web. Storage is never
  # readable without its password: the pull zone in front of it is what serves
  # the page, and the page has a storage zone of its own.
  deploy:
    name: Deploy
    environment: production
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: landing
          path: dist

      - uses: ./.github/actions/deploy-bunny
        with:
          endpoint: ${{ vars.BUNNY_STORAGE_ENDPOINT }}
          storage-zone: ${{ vars.BUNNY_SITE_STORAGE_ZONE }}
          pull-zone-id: ${{ vars.BUNNY_SITE_PULL_ZONE_ID }}
          served-from: ${{ vars.BUNNY_SITE_SERVED_FROM }}
          storage-key: ${{ secrets.BUNNY_SITE_STORAGE_KEY }}
          api-key: ${{ secrets.BUNNY_API_KEY }}
          dist-path: dist
