name: Stories

# Every picture the manual and the page show is a story named as a string, and
# a string is not a reference: renaming a story leaves the name pointing at
# nothing. The manual's own build would catch its half, but only on a change to
# the manual — and nothing at all ran over the page's half, so a renamed story
# surfaced there as a missing screenshot at a release.
#
# So the two lists are held against the tree here, on every pull request and on a push
# to main that changes either side. Both checks read files and nothing else, so nothing is installed
# and the run costs seconds.
#
# A shot names the theme it is taken in, and the manual holds that name against
# the presets folder.
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
    paths:
      - "libs/ui/src/**"
      - "!libs/ui/src/**/*.md"
      - "apps/desktop/editor/src/**"
      - "!apps/desktop/editor/src/**/*.md"
      - "apps/desktop/flashcards/src/**"
      - "!apps/desktop/flashcards/src/**/*.md"
      - "plugins/*/frontend/**"
      - "!plugins/*/frontend/**/*.md"
      - "tools/ci-stories/**"
      - "tools/ci-commands/**"
      - "apps/docs/tools/**"
      - "apps/docs/src/content/**"
      - "apps/landing/tools/**"
      - "libs/core/internal/adapter/theme/presets/**"
      - ".github/workflows/stories.yml"

concurrency:
  group: stories-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Whether the change is more than documentation. The checks below always start
  # and report under their own names; a job skipped on this result reports as
  # skipped, which a required check accepts.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The manual's pages and tools are what the reference check reads, so a
      # change to them is not documentation here.
      - id: detect
        uses: ./.github/actions/detect-code
        with:
          except: '(^|/)testdata/|^apps/docs/src/.*\.(astro|js|jsx|mjs|ts|tsx)$|^apps/docs/(src/content|tools)/'

  named:
    name: References
    needs: [changes]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # The manual writes its pages from the window's own source as well, so
      # this answers for every name it holds and not for the pictures alone.
      - name: Verify documentation story references
        run: node apps/docs/tools/manual.mjs --check

      - name: Verify landing page story references
        run: node apps/landing/tools/stories.mjs
