name: Docs

on:
  pull_request:
    paths:
      - "apps/docs/**"
      # What the manual writes itself from.
      - "apps/desktop/editor/src/features/command-palette/lib/**"
      - "apps/desktop/editor/src/features/command-palette/model/palette/shortcuts.ts"
      - "apps/desktop/editor/src/shared/words.ts"
      - "apps/desktop/editor/src/app/commands/fileMenuCommands.ts"
      - "apps/desktop/editor/src/app/window/useSettings.ts"
      - "plugins/*/manifest.json"
      - "plugins/*/frontend/index.ts"
      - "plugins/*/frontend/**/words.ts"
      - "tools/ci-commands/**"
      - "apps/desktop/cmd/numen/main.go"
      - "libs/core/adapter/cli/cli.go"
      - "libs/core/container/settings.go"
      - "libs/core/container/indexing.go"
      - "libs/core/adapter/settings/**"
      - "libs/core/usecase/completion/**"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      # What the manual writes itself from.
      - "apps/desktop/editor/src/features/command-palette/lib/**"
      - "apps/desktop/editor/src/features/command-palette/model/palette/shortcuts.ts"
      - "apps/desktop/editor/src/shared/words.ts"
      - "apps/desktop/editor/src/app/commands/fileMenuCommands.ts"
      - "apps/desktop/editor/src/app/window/useSettings.ts"
      - "plugins/*/manifest.json"
      - "plugins/*/frontend/index.ts"
      - "plugins/*/frontend/**/words.ts"
      - "tools/ci-commands/**"
      - "apps/desktop/cmd/numen/main.go"
      - "libs/core/adapter/cli/cli.go"
      - "libs/core/container/settings.go"
      - "libs/core/container/indexing.go"
      - "libs/core/adapter/settings/**"
      - "libs/core/usecase/completion/**"
      - ".github/workflows/docs.yml"

# Two deploys share one storage zone, and the second takes down what the first
# has not finished putting up. A deploy that is overtaken is stopped: every
# deploy writes the whole manual and then removes what it did not write, so the
# one that follows leaves the zone whole.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

# The deploy goes to storage with a key of its own; nothing here writes to the
# repository.
permissions:
  contents: read

jobs:
  # The manual is markdown and carries no framework, so what there is to check
  # is that the site builds and that the keyboard page still says what the
  # window does.
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        uses: ./.github/actions/install-node-modules

      - name: Check plugin command reader
        run: npm run check --prefix tools/ci-commands

      - name: Verify manual references
        run: npm run manual:check --prefix apps/docs

      - name: Typecheck documentation site
        run: npm run typecheck --prefix apps/docs

      - name: Lint documentation site
        run: npm run lint --prefix apps/docs

      - name: Build documentation site
        run: npm run build --prefix apps/docs

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs
          path: apps/docs/dist
          if-no-files-found: error

  # What is on the default branch is what is on the web. Storage is never
  # readable without its password: the pull zone in front of it is what serves
  # the manual, and the manual has a storage zone of its own.
  deploy:
    name: Deploy
    environment: production
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs
          path: dist

      - uses: ./.github/actions/deploy-bunny
        with:
          endpoint: ${{ vars.BUNNY_STORAGE_ENDPOINT }}
          storage-zone: ${{ vars.BUNNY_DOCS_STORAGE_ZONE }}
          pull-zone-id: ${{ vars.BUNNY_DOCS_PULL_ZONE_ID }}
          served-from: ${{ vars.BUNNY_DOCS_SERVED_FROM }}
          storage-key: ${{ secrets.BUNNY_DOCS_STORAGE_KEY }}
          api-key: ${{ secrets.BUNNY_API_KEY }}
          dist-path: dist
