name: Docs

# The manual, called by ci.yml on a pull request when its sources change, and built and deployed on
# a push to main that changes them.
on:
  workflow_call:
    secrets:
      BUNNY_DOCS_STORAGE_KEY:
        required: false
      BUNNY_API_KEY:
        required: false
    inputs:
      docs:
        type: boolean
        required: true
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      - "apps/desktop/editor/src/**"
      - "apps/desktop/cmd/numen/**"
      - "docs/**"
      - "libs/core/kernel/adapter/cli/**"
      - "libs/core/kernel/adapter/settings/**"
      - "libs/core/kernel/container/**"
      - "libs/core/kernel/usecase/completion/**"
      - "plugins/*/manifest.json"
      - "plugins/*/frontend/**"
      - "tools/ci-commands/**"
      - "tools/shared/**"
      - "package.json"
      - "package-lock.json"
      - ".node-version"
      - ".github/actions/deploy-bunny/**"
      - ".github/actions/install-node-modules/**"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

jobs:

  # The manual is markdown and carries no framework: the site builds, and the keyboard page still
  # says what the window does. The page references are the job above.
  docs:
    name: Docs
    if: github.event_name == 'push' || inputs.docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: ./.github/actions/install-node-modules

      - name: Check plugin command reader
        run: npm run check --prefix tools/ci-commands

      - name: Typecheck documentation site
        run: npm run typecheck --prefix apps/docs

      - name: Lint documentation site
        run: npm run lint --prefix apps/docs

      - name: Build documentation site
        run: npm run build --prefix apps/docs

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push'
        with:
          name: docs
          path: apps/docs/dist
          if-no-files-found: error

  # What is on main is what is on the web. Two deploys share one storage zone, and the second takes
  # down what the first has not finished putting up, so an overtaken deploy is cancelled: every
  # deploy writes the whole manual and then removes what it did not write.
  docs-deploy:
    name: Docs Deploy
    needs: [docs]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    concurrency:
      group: docs-deploy
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs
          path: dist

      - uses: ./.github/actions/deploy-bunny
        with:
          endpoint: ${{ vars.BUNNY_STORAGE_ENDPOINT }}
          storage-zone: ${{ vars.BUNNY_DOCS_STORAGE_ZONE }}
          pull-zone-id: ${{ vars.BUNNY_DOCS_PULL_ZONE_ID }}
          served-from: ${{ vars.BUNNY_DOCS_SERVED_FROM }}
          storage-key: ${{ secrets.BUNNY_DOCS_STORAGE_KEY }}
          api-key: ${{ secrets.BUNNY_API_KEY }}
          dist-path: dist
