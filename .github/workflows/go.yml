name: Go

# The Go libraries, the desktop and mobile binaries, and the protocol schema, called by ci.yml
# with the areas a change touches.
on:
  workflow_call:
    inputs:
      core:
        type: boolean
        required: true
      atomicfile:
        type: boolean
        required: true
      protocol:
        type: boolean
        required: true
      sdk_go:
        type: boolean
        required: true
      desktop:
        type: boolean
        required: true
      mobile:
        type: boolean
        required: true
      platforms:
        type: string
        required: true

permissions:
  contents: read

jobs:

  # gofmt, go vet, both golangci-lint configurations and govulncheck of every Go module but the
  # plugins, the migration rule and the protocol schema, once, on the cheapest machine: a rule about
  # the shape of the code answers the same on every machine. A part runs when its area changed, and
  # after a failed part.
  lint:
    name: Go Lint
    if: inputs.core || inputs.desktop || inputs.mobile || inputs.sdk_go || inputs.protocol
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - id: go
        uses: ./.github/actions/setup-go
        with:
          go-version-file: libs/core/kernel/go.mod
          cache-key: lint

      - uses: ./.github/actions/install-golangci-lint

      - name: Lint the core libraries
        if: ${{ !cancelled() && inputs.core }}
        run: |
          set -euo pipefail
          for module in libs/core/kernel libs/atomicfile libs/note libs/plugin/catalog libs/core/protocol tools/checks/structure/go; do
            echo "::group::$module"
            (
              cd "$module"
              unformatted=$(gofmt -l .)
              if [ -n "$unformatted" ]; then echo "not gofmt-ed:"; echo "$unformatted"; exit 1; fi
              go vet ./...
              golangci-lint run --timeout 15m ./...
              golangci-lint run --timeout 15m -c "$GITHUB_WORKSPACE/.golangci-structure.yml" ./...
            )
            echo "::endgroup::"
          done

      # The vulnerability list is read at the time of the run, so this step can find something on a
      # branch that changed nothing.
      - if: ${{ !cancelled() && inputs.core }}
        uses: ./.github/actions/govulncheck
        with:
          working-directory: libs/core/kernel

      - if: ${{ !cancelled() && inputs.core }}
        uses: ./.github/actions/govulncheck
        with:
          working-directory: libs/core/protocol

      # A numbered migration a released build has run cannot change or disappear: the schema goes
      # forward by another number. The base is the first parent of the merge commit.
      - name: Self-test migration rule
        if: ${{ !cancelled() && inputs.core }}
        run: libs/core/kernel/adapter/index/migration-forward-only.sh --self-test

      - name: Verify migrations are forward-only
        if: ${{ !cancelled() && inputs.core && github.event_name == 'pull_request' }}
        run: libs/core/kernel/adapter/index/migration-forward-only.sh HEAD^1

      # The base module of the Go plugin SDK and each feature module under it.
      - name: Lint the plugin SDK
        if: ${{ !cancelled() && inputs.sdk_go }}
        run: |
          unformatted=$(cd libs/plugin/sdk-go && gofmt -l .)
          if [ -n "$unformatted" ]; then echo "not gofmt-ed:"; echo "$unformatted"; exit 1; fi
          make lib_plugin_sdk_go_lint

      # The window links against the system's own browser, so vet and the linters need its headers.
      - if: ${{ !cancelled() && inputs.desktop }}
        uses: ./.github/actions/setup-webkit

      # The tool that strips machine paths from the build profile is a module of its own.
      - name: Lint the desktop app
        if: ${{ !cancelled() && inputs.desktop }}
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          unformatted=$(gofmt -l ./cmd ./internal ./build/pgonorm)
          if [ -n "$unformatted" ]; then echo "not gofmt-ed:"; echo "$unformatted"; exit 1; fi
          for module in . build/pgonorm; do
            echo "::group::apps/desktop/$module"
            (
              cd "$module"
              go vet ./...
              golangci-lint run --timeout 15m ./...
              golangci-lint run --timeout 15m -c "$GITHUB_WORKSPACE/.golangci-structure.yml" ./...
            )
            echo "::endgroup::"
          done

      - if: ${{ !cancelled() && inputs.desktop }}
        uses: ./.github/actions/govulncheck
        with:
          working-directory: apps/desktop

      - name: Lint the mobile app
        if: ${{ !cancelled() && inputs.mobile }}
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          unformatted=$(gofmt -l ./bind tools.go)
          if [ -n "$unformatted" ]; then echo "not gofmt-ed:"; echo "$unformatted"; exit 1; fi
          go vet ./...
          golangci-lint run --timeout 15m ./...
          golangci-lint run --timeout 15m -c "$GITHUB_WORKSPACE/.golangci-structure.yml" ./...

      - if: ${{ !cancelled() && inputs.mobile }}
        uses: ./.github/actions/govulncheck
        with:
          working-directory: apps/mobile

      - if: ${{ !cancelled() && inputs.protocol }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - if: ${{ !cancelled() && inputs.protocol }}
        uses: bufbuild/buf-action@37ac33d8960807670a6e9719080e885197b09cc6 # v1.7.0
        with:
          version: 1.72.0
          setup_only: true

      - if: ${{ !cancelled() && inputs.protocol }}
        uses: ./.github/actions/install-node-modules

      # The Go plugins of buf are the tools of the module, pinned by its go.sum. The generated code
      # is committed so that an ordinary build needs none of these tools.
      - name: Lint the protocol schema and verify the generated code
        if: ${{ !cancelled() && inputs.protocol }}
        working-directory: libs/core/protocol
        run: |
          set -euo pipefail
          go install tool
          buf lint
          buf generate
          git add -AN -- gen src
          git diff --exit-code -- gen src || {
            echo "::error::the schema changed and the generated code was not regenerated — run: make generate"
            exit 1
          }

      - if: ${{ !cancelled() }}
        uses: ./.github/actions/save-go-cache
        with:
          cache-key: ${{ steps.go.outputs.cache-key }}

  core-test:
    name: Core Tests (${{ matrix.name }})
    if: inputs.core
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.platforms) }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.optional }}
    timeout-minutes: ${{ matrix.minutes }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: go
        uses: ./.github/actions/setup-go
        with:
          go-version-file: libs/core/kernel/go.mod
          cache-key: core-test-${{ matrix.race && 'race' || 'plain' }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      # A test compares the plugin index with the manifests it was written from.
      - uses: ./.github/actions/install-lock-packages
        with:
          packages: "@bufbuild/protobuf"

      - name: Write the plugin index
        run: node tools/build-plugin-index/build.mjs

      # A test builds its vault in a temporary folder, and there is memory here to hold every one.
      - name: Configure Linux temporary directory
        if: runner.os == 'Linux'
        run: echo "TMPDIR=/dev/shm" >> "$GITHUB_ENV"

      # A Windows runner checks the repository out on another drive than its temporary folder.
      - name: Configure Windows temporary directory
        if: runner.os == 'Windows'
        run: |
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Run Go tests
        env:
          RACE: ${{ matrix.race && '-race' || '' }}
        run: |
          set -euo pipefail
          for module in libs/core/kernel libs/atomicfile libs/note libs/plugin/catalog; do
            echo "::group::$module"
            (cd "$module" && go test ${RACE:+"$RACE"} ./...)
            echo "::endgroup::"
          done

      - if: ${{ !cancelled() }}
        uses: ./.github/actions/save-go-cache
        with:
          cache-key: ${{ steps.go.outputs.cache-key }}

  # libs/atomicfile replaces files with a different call on Windows, and the platforms of core-test run there only on request.
  atomicfile-windows:
    name: Atomic File (Windows)
    if: inputs.atomicfile
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: libs/atomicfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: go
        uses: ./.github/actions/setup-go
        with:
          go-version-file: libs/atomicfile/go.mod
          cache-key: atomicfile-windows

      # A Windows runner checks the repository out on another drive than its temporary folder.
      - name: Configure temporary directory
        run: |
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Run Go tests
        run: go test ./...

      - if: ${{ !cancelled() }}
        uses: ./.github/actions/save-go-cache
        with:
          cache-key: ${{ steps.go.outputs.cache-key }}

  # The structural checks of the Go code type-check every module of the workspace, so they run once, on
  # one machine, and not on each platform of the core tests.
  structure:
    name: Structure Checks
    if: inputs.core
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BASE_REF: HEAD^1
      CHANGED: ${{ github.event_name == 'pull_request' && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - id: go
        uses: ./.github/actions/setup-go
        with:
          go-version-file: libs/core/kernel/go.mod
          cache-key: structure-checks

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      # go/dead-exports parses the TypeScript and Vue consumers of the SDK.
      - uses: ./.github/actions/install-node-modules

      - name: Run the Go checks
        run: make checks TAGS=go CHANGED="$CHANGED"

      - if: ${{ !cancelled() }}
        uses: ./.github/actions/save-go-cache
        with:
          cache-key: ${{ steps.go.outputs.cache-key }}

  # The tests of the desktop app, its command line binary, the mobile app and the Go plugin SDK. A
  # part runs when its area changed, and after a failed part.
  test:
    name: Go Tests
    if: inputs.desktop || inputs.mobile || inputs.sdk_go
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: go
        uses: ./.github/actions/setup-go
        with:
          go-version-file: apps/desktop/go.mod
          cache-key: test

      - if: ${{ !cancelled() && inputs.desktop }}
        uses: ./.github/actions/setup-webkit

      # The debug servers build only with numen_debug, so the first run skips their files. With
      # -race the link reuses every package the tests compiled.
      - name: Test the desktop app
        if: ${{ !cancelled() && inputs.desktop }}
        working-directory: apps/desktop
        env:
          TMPDIR: /dev/shm
        run: |
          set -euo pipefail
          go test -race ./...
          go test -race -tags numen_debug ./internal/debugserve ./app ./cmd/numen-flashcards
          go build -race -o /dev/null ./cmd/numen

      # The command line binary is built for machines it is not built on.
      - name: Build and test the command line binary
        if: ${{ !cancelled() && inputs.desktop }}
        run: |
          set -euo pipefail
          for target in darwin/arm64 windows/amd64 linux/arm64; do
            (cd apps/desktop && GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -o /dev/null ./cmd/numen-cli)
          done
          (cd apps/desktop/build/pgonorm && go build -o /dev/null .)
          tests/e2e/cli/plugin-commands.sh

      - name: Test the mobile app
        if: ${{ !cancelled() && inputs.mobile }}
        working-directory: apps/mobile
        env:
          TMPDIR: /dev/shm
        run: go test -race ./...

      - name: Test the plugin SDK
        if: ${{ !cancelled() && inputs.sdk_go }}
        run: make lib_plugin_sdk_go_test GO_RACE=1

      - if: ${{ !cancelled() }}
        uses: ./.github/actions/save-go-cache
        with:
          cache-key: ${{ steps.go.outputs.cache-key }}
