name: Go

# The Go libraries, the desktop and mobile binaries, and the protocol schema, called by ci.yml
# with the areas a change touches.
on:
  workflow_call:
    inputs:
      core:
        type: boolean
        required: true
      atomicfile:
        type: boolean
        required: true
      protocol:
        type: boolean
        required: true
      sdk_go:
        type: boolean
        required: true
      desktop:
        type: boolean
        required: true
      mobile:
        type: boolean
        required: true
      platforms:
        type: string
        required: true

permissions:
  contents: read

jobs:

  # gofmt, go vet and both golangci-lint configurations of the core libraries, once, on the cheapest
  # machine: a rule about the shape of the code answers the same on every machine.
  core-lint:
    name: Core Lint
    if: inputs.core
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: go
        uses: ./.github/actions/setup-go
        with:
          go-version-file: libs/core/kernel/go.mod
          cache-key: core-lint

      - uses: ./.github/actions/install-golangci-lint

      - name: Lint the core libraries
        run: |
          set -euo pipefail
          for module in libs/core/kernel libs/atomicfile libs/note libs/plugin/catalog libs/core/protocol tools/checks/structure/go; do
            echo "::group::$module"
            (
              cd "$module"
              unformatted=$(gofmt -l .)
              if [ -n "$unformatted" ]; then echo "not gofmt-ed:"; echo "$unformatted"; exit 1; fi
              go vet ./...
              golangci-lint run --timeout 15m ./...
              golangci-lint run --timeout 15m -c "$GITHUB_WORKSPACE/.golangci-structure.yml" ./...
            )
            echo "::endgroup::"
          done

      # The vulnerability list is read at the time of the run, so this step can find something on a
      # branch that changed nothing.
      - uses: ./.github/actions/govulncheck
        with:
          working-directory: libs/core/kernel

      - uses: ./.github/actions/govulncheck
        with:
          working-directory: libs/core/protocol

      - if: ${{ !cancelled() }}
        uses: ./.github/actions/save-go-cache
        with:
          cache-key: ${{ steps.go.outputs.cache-key }}

  core-test:
    name: Core Tests (${{ matrix.name }})
    if: inputs.core
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.platforms) }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.optional }}
    timeout-minutes: ${{ matrix.minutes }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: go
        uses: ./.github/actions/setup-go
        with:
          go-version-file: libs/core/kernel/go.mod
          cache-key: core-test-${{ matrix.race && 'race' || 'plain' }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      # A test compares the plugin index with the manifests it was written from.
      - uses: ./.github/actions/install-lock-packages
        with:
          packages: "@bufbuild/protobuf"

      - name: Write the plugin index
        run: node tools/build-plugin-index/build.mjs

      # A test builds its vault in a temporary folder, and there is memory here to hold every one.
      - name: Configure Linux temporary directory
        if: runner.os == 'Linux'
        run: echo "TMPDIR=/dev/shm" >> "$GITHUB_ENV"

      # A Windows runner checks the repository out on another drive than its temporary folder.
      - name: Configure Windows temporary directory
        if: runner.os == 'Windows'
        run: |
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Run Go tests
        env:
          RACE: ${{ matrix.race && '-race' || '' }}
        run: |
          set -euo pipefail
          for module in libs/core/kernel libs/atomicfile libs/note libs/plugin/catalog; do
            echo "::group::$module"
            (cd "$module" && go test ${RACE:+"$RACE"} ./...)
            echo "::endgroup::"
          done

      - if: ${{ !cancelled() }}
        uses: ./.github/actions/save-go-cache
        with:
          cache-key: ${{ steps.go.outputs.cache-key }}

  # libs/atomicfile replaces files with a different call on Windows, and the platforms of core-test run there only on request.
  atomicfile-windows:
    name: Atomic File (Windows)
    if: inputs.atomicfile
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: libs/atomicfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: go
        uses: ./.github/actions/setup-go
        with:
          go-version-file: libs/atomicfile/go.mod
          cache-key: atomicfile-windows

      # A Windows runner checks the repository out on another drive than its temporary folder.
      - name: Configure temporary directory
        run: |
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Run Go tests
        run: go test ./...

      - if: ${{ !cancelled() }}
        uses: ./.github/actions/save-go-cache
        with:
          cache-key: ${{ steps.go.outputs.cache-key }}

  # The structural checks of the Go code type-check every module of the workspace, so they run once, on
  # one machine, and not on each platform of the core tests.
  structure:
    name: Structure Checks
    if: inputs.core
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BASE_REF: HEAD^1
      CHANGED: ${{ github.event_name == 'pull_request' && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - id: go
        uses: ./.github/actions/setup-go
        with:
          go-version-file: libs/core/kernel/go.mod
          cache-key: structure-checks

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      # go/dead-exports parses the TypeScript and Vue consumers of the SDK, go/api-types the calls of the plugin frontends.
      - uses: ./.github/actions/install-node-modules

      - name: Run the Go checks
        run: make checks TAGS=go CHANGED="$CHANGED"

      - if: ${{ !cancelled() }}
        uses: ./.github/actions/save-go-cache
        with:
          cache-key: ${{ steps.go.outputs.cache-key }}

  # A numbered migration a released build has run cannot change or disappear: the schema goes
  # forward by another number. The base is the first parent of the merge commit.
  migrations:
    name: Migrations
    if: inputs.core
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Self-test migration rule
        run: libs/core/kernel/adapter/index/migration-forward-only.sh --self-test

      - name: Verify migrations are forward-only
        if: github.event_name == 'pull_request'
        run: libs/core/kernel/adapter/index/migration-forward-only.sh HEAD^1

  schema:
    name: Protocol Schema
    if: inputs.protocol
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: libs/core/protocol
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: go
        uses: ./.github/actions/setup-go
        with:
          go-version-file: libs/core/protocol/go.mod
          cache-key: schema

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: bufbuild/buf-action@37ac33d8960807670a6e9719080e885197b09cc6 # v1.7.0
        with:
          version: 1.72.0
          setup_only: true

      # The Go plugins are the tools of this module; go.sum pins them.
      - name: Install protobuf plugins
        run: go install tool

      - uses: ./.github/actions/install-node-modules

      - name: Lint Protobuf schema
        run: buf lint

      # The generated code is committed so that an ordinary build needs none of the tools above.
      - name: Verify generated code
        run: |
          buf generate
          git add -AN -- gen src
          git diff --exit-code -- gen src || {
            echo "::error::the schema changed and the generated code was not regenerated — run: make generate"
            exit 1
          }

      - if: ${{ !cancelled() }}
        uses: ./.github/actions/save-go-cache
        with:
          cache-key: ${{ steps.go.outputs.cache-key }}

  # The base module of the Go plugin SDK and each feature module under it.
  sdk:
    name: Plugin SDK
    if: inputs.sdk_go
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: go
        uses: ./.github/actions/setup-go
        with:
          go-version-file: libs/plugin/sdk-go/go.mod
          cache-key: sdk

      - uses: ./.github/actions/install-golangci-lint

      - name: Verify Go formatting
        working-directory: libs/plugin/sdk-go
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "not gofmt-ed:"; echo "$unformatted"; exit 1; fi

      - name: Run linters
        run: make lib_plugin_sdk_go_lint

      - name: Run Go tests
        run: make lib_plugin_sdk_go_test GO_RACE=1

      - if: ${{ !cancelled() }}
        uses: ./.github/actions/save-go-cache
        with:
          cache-key: ${{ steps.go.outputs.cache-key }}

  desktop-lint:
    name: Desktop Lint
    if: inputs.desktop
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: go
        uses: ./.github/actions/setup-go
        with:
          go-version-file: apps/desktop/go.mod
          cache-key: desktop-lint

      # The window links against the system's own browser, so vet and the linters need its headers.
      - uses: ./.github/actions/setup-webkit

      - uses: ./.github/actions/install-golangci-lint

      - name: Verify Go formatting
        run: |
          unformatted=$(gofmt -l ./cmd ./internal ./build/pgonorm)
          if [ -n "$unformatted" ]; then echo "not gofmt-ed:"; echo "$unformatted"; exit 1; fi

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        run: |
          golangci-lint run --timeout 15m ./...
          golangci-lint run --timeout 15m -c "$GITHUB_WORKSPACE/.golangci-structure.yml" ./...

      # The tool that strips machine paths from the build profile is a module of its own.
      - name: Lint the profile normaliser
        working-directory: apps/desktop/build/pgonorm
        run: |
          go vet ./...
          golangci-lint run --timeout 5m ./...
          golangci-lint run --timeout 5m -c "$GITHUB_WORKSPACE/.golangci-structure.yml" ./...

      - uses: ./.github/actions/govulncheck
        with:
          working-directory: apps/desktop

      - if: ${{ !cancelled() }}
        uses: ./.github/actions/save-go-cache
        with:
          cache-key: ${{ steps.go.outputs.cache-key }}

  desktop-test:
    name: Desktop Tests
    if: inputs.desktop
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: go
        uses: ./.github/actions/setup-go
        with:
          go-version-file: apps/desktop/go.mod
          cache-key: desktop-test

      - uses: ./.github/actions/setup-webkit

      - name: Run Go tests
        run: go test -race ./...
        env:
          TMPDIR: /dev/shm

      # The debug servers build only with numen_debug, so the run above skips their files.
      - name: Run Go tests of the debug build
        run: go test -race -tags numen_debug ./internal/debugserve ./app ./cmd/numen-flashcards
        env:
          TMPDIR: /dev/shm

      # With -race the link reuses every package the tests compiled.
      - name: Link the desktop binary
        run: go build -race -o /dev/null ./cmd/numen

      - if: ${{ !cancelled() }}
        uses: ./.github/actions/save-go-cache
        with:
          cache-key: ${{ steps.go.outputs.cache-key }}

  # The command line binary is built for machines it is not built on.
  cli:
    name: CLI
    if: inputs.desktop
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: go
        uses: ./.github/actions/setup-go
        with:
          go-version-file: apps/desktop/go.mod
          cache-key: cli

      - name: Cross-compile CLI binaries
        run: |
          for target in darwin/arm64 windows/amd64 linux/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -o /dev/null ./cmd/numen-cli
          done

      - name: Build the profile normaliser
        working-directory: apps/desktop/build/pgonorm
        run: go build -o /dev/null .

      - name: Run CLI end-to-end tests
        working-directory: .
        run: tests/e2e/cli/plugin-commands.sh

      - if: ${{ !cancelled() }}
        uses: ./.github/actions/save-go-cache
        with:
          cache-key: ${{ steps.go.outputs.cache-key }}

  mobile-lint:
    name: Mobile Lint
    if: inputs.mobile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: go
        uses: ./.github/actions/setup-go
        with:
          go-version-file: apps/mobile/go.mod
          cache-key: mobile-lint

      - uses: ./.github/actions/install-golangci-lint

      - name: Verify Go formatting
        run: |
          unformatted=$(gofmt -l ./bind tools.go)
          if [ -n "$unformatted" ]; then echo "not gofmt-ed:"; echo "$unformatted"; exit 1; fi

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        run: |
          golangci-lint run --timeout 15m ./...
          golangci-lint run --timeout 15m -c "$GITHUB_WORKSPACE/.golangci-structure.yml" ./...

      - uses: ./.github/actions/govulncheck
        with:
          working-directory: apps/mobile

      - if: ${{ !cancelled() }}
        uses: ./.github/actions/save-go-cache
        with:
          cache-key: ${{ steps.go.outputs.cache-key }}

  mobile-test:
    name: Mobile Tests
    if: inputs.mobile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: go
        uses: ./.github/actions/setup-go
        with:
          go-version-file: apps/mobile/go.mod
          cache-key: mobile-test

      - name: Run Go tests
        run: go test -race ./...
        env:
          TMPDIR: /dev/shm

      - if: ${{ !cancelled() }}
        uses: ./.github/actions/save-go-cache
        with:
          cache-key: ${{ steps.go.outputs.cache-key }}
