name: Mobile Frontend

on:
  pull_request:
    paths:
      - "apps/mobile/src/**"
      - "apps/mobile/*.vue"
      - "apps/mobile/package.json"
      - "apps/mobile/vite.config.ts"
      - "libs/ui/**"
      - "!libs/ui/**/*.md"
      - "libs/protocol/**"
      - "!libs/protocol/**/*.md"
      - "!docs/**"
      - ".github/workflows/mobile-frontend.yml"
  push:
    branches: [main]
    paths:
      - "apps/mobile/src/**"
      - "apps/mobile/*.vue"
      - "apps/mobile/package.json"
      - "apps/mobile/vite.config.ts"
      - "libs/ui/**"
      - "!libs/ui/**/*.md"
      - "libs/protocol/**"
      - "!libs/protocol/**/*.md"
      - "!docs/**"
      - ".github/workflows/mobile-frontend.yml"

# One run at a time per branch, and on a pull request the newest is the one that
# matters. A run on main is left to finish: it fills the cache the branches read.
concurrency:
  group: mobile-frontend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  screens:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      # A screen reaches the components through their build.
      - name: Install dependencies
        uses: ./.github/actions/install-node-modules

      # A screen reaches the components through their build.
      - name: Build the components
        run: npm run build --prefix libs/ui

      - name: Typecheck screens
        run: npm run typecheck --prefix apps/mobile

      - name: Lint screens
        run: npm run lint --prefix apps/mobile

      - name: Run screen tests
        run: npm test --prefix apps/mobile
