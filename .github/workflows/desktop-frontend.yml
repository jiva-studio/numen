name: Desktop Frontend

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "apps/desktop/editor/**"
      - "!apps/desktop/editor/**/*.md"
      - "apps/desktop/flashcards/**"
      - "!apps/desktop/flashcards/**/*.md"
      - "libs/ui/core/**"
      - "!libs/ui/core/**/*.md"
      - "libs/plugin-sdk-ts/**"
      - "!libs/plugin-sdk-ts/**/*.md"
      - "libs/ui/shell/**"
      - "!libs/ui/shell/**/*.md"
      - "libs/core-client/**"
      - "!libs/core-client/**/*.md"
      - "libs/plugin-host-ts/**"
      - "!libs/plugin-host-ts/**/*.md"
      - "libs/plugin-manager/**"
      - "!libs/plugin-manager/**/*.md"
      - "libs/protocol/**"
      - "!libs/protocol/**/*.md"
      - "tools/ci-stories/**"
      - "tests/e2e/desktop/**"
      - "!tests/e2e/desktop/**/*.md"
      - "!docs/**"
      - ".github/workflows/desktop-frontend.yml"

# A pull request keeps only its newest run. Each push to main has a group of its
# own: a later push neither cancels it nor replaces it while it waits.
concurrency:
  group: desktop-frontend-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Whether the change is more than documentation. The checks below always start
  # and report under their own names; a job skipped on this result reports as
  # skipped, which a required check accepts.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: detect
        uses: ./.github/actions/detect-code
        with:
          include: '^apps/desktop/(editor|flashcards)/|^libs/(ui|plugin-sdk-ts|core-client|plugin-host-ts|plugin-manager|protocol)/|^tools/ci-stories/|^tests/e2e/desktop/|^(package\.json|package-lock\.json|\.node-version)$'

  screens:
    name: Frontend
    needs: [changes]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      # A window reaches the components through their build; everything else it
      # names is linked or fetched by the one install at the source root.
      - name: Install dependencies
        uses: ./.github/actions/install-node-modules

      - uses: ./.github/actions/setup-playwright

      - name: Build the components and the shell
        uses: ./.github/actions/build-ui
        with:
          shell: "true"

      - name: Verify story references
        run: npm run check --prefix tools/ci-stories

      - name: Lint editor and flashcards
        run: |
          npm run lint --prefix apps/desktop/editor
          npm run lint --prefix apps/desktop/flashcards
          npm run lint --prefix libs/ui/shell
          npm run lint --prefix libs/core-client
          npm run lint --prefix libs/plugin-host-ts
          npm run lint --prefix libs/plugin-manager
          npm run lint --prefix tests/e2e/desktop

      - name: Typecheck screens and SDK
        run: |
          npm run typecheck --prefix libs/plugin-sdk-ts
          npm run typecheck --prefix libs/core-client
          npm run typecheck --prefix libs/ui/shell
          npm run typecheck --prefix libs/plugin-host-ts
          npm run typecheck --prefix libs/plugin-manager
          npm run typecheck --prefix apps/desktop/editor
          npm run typecheck --prefix apps/desktop/flashcards

      - name: Run frontend tests
        run: |
          npm test --prefix libs/plugin-sdk-ts
          npm test --prefix libs/core-client
          npm run test:unit --prefix libs/ui/shell -- --coverage
          npm run test:stories --prefix libs/ui/shell
          npm test --prefix libs/plugin-host-ts
          npm test --prefix libs/plugin-manager
          npm run test:unit --prefix apps/desktop/editor -- --coverage
          npm run test:stories --prefix apps/desktop/editor
          npm run test:unit --prefix apps/desktop/flashcards -- --coverage
