name: Desktop Frontend

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
    paths:
      - "modules/apps/desktop/editor/**"
      - "!modules/apps/desktop/editor/**/*.md"
      - "modules/apps/desktop/flashcards/**"
      - "!modules/apps/desktop/flashcards/**/*.md"
      - "modules/libs/ui/**"
      - "!modules/libs/ui/**/*.md"
      - "modules/libs/wire/**"
      - "!modules/libs/wire/**/*.md"
      - "modules/libs/protocol/**"
      - "!modules/libs/protocol/**/*.md"
      - "modules/tools/ci-stories/**"
      - "!docs/**"
      - ".github/workflows/desktop-frontend.yml"

# One run at a time per branch, and on a pull request the newest is the one that
# matters. A run on main is left to finish: it fills the cache the branches read.
concurrency:
  group: desktop-frontend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Whether the change is more than documentation. The checks below always start
  # and report under their own names; a job skipped on this result reports as
  # skipped, which a required check accepts.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: detect
        uses: ./.github/actions/detect-code

  screens:
    name: Frontend
    needs: [changes]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: modules/package-lock.json

      # A window reaches the components through their build; everything else it
      # names is linked or fetched by the one install at the source root.
      - name: Install dependencies
        uses: ./.github/actions/install-node-modules

      - uses: ./.github/actions/setup-playwright

      - name: Build the components
        run: npm run build --prefix modules/libs/ui

      - name: Verify story references
        run: npm run check --prefix modules/tools/ci-stories

      - name: Lint editor and flashcards
        run: |
          npm run lint --prefix modules/apps/desktop/editor
          npm run lint --prefix modules/apps/desktop/flashcards

      - name: Typecheck screens and wire
        run: |
          npm run typecheck --prefix modules/libs/wire
          npm run typecheck --prefix modules/apps/desktop/editor
          npm run typecheck --prefix modules/apps/desktop/flashcards

      - name: Run frontend tests
        run: |
          npm test --prefix modules/libs/wire
          npm run test:unit --prefix modules/apps/desktop/editor -- --coverage
          npm run test:stories --prefix modules/apps/desktop/editor
          npm run test:unit --prefix modules/apps/desktop/flashcards -- --coverage
          npm run test:stories --prefix modules/apps/desktop/flashcards
