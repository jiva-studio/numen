name: Sync Server

# The tests that need the real sync server, started from its private images (tests/server): the Go
# tests of plugins/tools-sync and the acceptance scenarios tagged @live. Called by ci.yml with the
# area a change touches. GitHub gives a pull request from a fork no access to the private packages,
# and tests/server/stack.lock holds no digests until numen-cloud publishes the images: the job then
# runs no test and says so in its summary. It never uploads the images or prints the server log
# unfiltered.
on:
  workflow_call:
    inputs:
      sync_server:
        type: boolean
        required: true

permissions:
  contents: read

jobs:
  sync-server:
    name: Sync Server
    if: inputs.sync_server
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          reason=
          if [ "$EVENT" = pull_request ] && [ "$HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]; then
            reason="the pull request is from a fork, which has no access to the private server images"
          elif ! grep -qE '^NUMEN_SYNC_IMAGE=.+' tests/server/stack.lock || ! grep -qE '^NUMEN_SYNC_DEVTOOLS_IMAGE=.+' tests/server/stack.lock; then
            reason="tests/server/stack.lock holds no image digests"
          fi
          if [ -n "$reason" ]; then
            echo "::warning title=Real server tests did not run::$reason"
            echo "real server tests did not run: $reason" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.plan.outputs.run == 'true'
        uses: ./.github/actions/setup-go
        with:
          go-version-file: plugins/tools-sync/go.mod
          cache-key: sync-server

      - name: Log in to the registry
        if: steps.plan.outputs.run == 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<< "$TOKEN"

      - name: Check the pinned images
        if: steps.plan.outputs.run == 'true'
        run: tests/server/check-pin.sh

      - name: Start the server
        if: steps.plan.outputs.run == 'true'
        run: make sync_stack_up

      - name: Run the Go tests of the sync plugin
        if: steps.plan.outputs.run == 'true'
        env:
          NUMEN_SYNC_TEST_REQUIRED: "1"
        run: |
          eval "$(make -s sync_stack_env)"
          status=0
          (cd plugins/tools-sync && go test -json ./...) > "$RUNNER_TEMP/go-test.json" || status=$?
          skipped=$(jq -s '[.[] | select(.Action == "skip" and .Test != null)] | length' "$RUNNER_TEMP/go-test.json")
          passed=$(jq -s '[.[] | select(.Action == "pass" and .Test != null)] | length' "$RUNNER_TEMP/go-test.json")
          failed=$(jq -s '[.[] | select(.Action == "fail" and .Test != null)] | length' "$RUNNER_TEMP/go-test.json")
          echo "Go tests of plugins/tools-sync against the real server: $passed passed, $failed failed, $skipped skipped" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            jq -r 'select(.Action == "output") | .Output' "$RUNNER_TEMP/go-test.json" | grep -vE '^(=== |\s*--- (PASS|SKIP)|PASS$|ok )' || true
          fi
          exit "$status"

      # The acceptance task wires the scenarios tagged @live here: the debug binaries and the plugins
      # built, then `npm run acceptance:live` in tests/acceptance/desktop with the settings of
      # `make sync_stack_env`, and the skipped count printed as in the step above.
      - name: Run the @live acceptance scenarios
        if: steps.plan.outputs.run == 'true'
        run: |
          echo "::warning title=@live scenarios did not run::the step that runs them is not wired yet"
          echo "@live acceptance scenarios did not run: the step that runs them is not wired yet" | tee -a "$GITHUB_STEP_SUMMARY"

      # Only the lines of the rpc log, never the raw log: the log of a public job is public.
      - name: Print the rpc lines of the server log
        if: ${{ failure() && steps.plan.outputs.run == 'true' }}
        run: |
          container=$(docker ps -aq --filter label=com.docker.compose.project=numen-sync-test --filter label=com.docker.compose.service=sync)
          if [ -n "$container" ]; then
            docker logs --tail 5000 "$container" 2>&1 | grep -iE '\brpc\b' | tail -n 200 || true
          fi

      - name: Stop the server
        if: ${{ always() && steps.plan.outputs.run == 'true' }}
        run: make sync_stack_down
