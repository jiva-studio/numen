name: Go :: Build and test

on:
  pull_request:
    paths:
      - "modules/libs/core/**"
      - "modules/apps/desktop/**"
      - "modules/apps/mobile/**"
      - "modules/libs/protocol/**"
      - "tests/**"
      - ".github/workflows/go-build-test.yml"
  push:
    branches: [main]
    paths:
      - "modules/libs/core/**"
      - "modules/apps/desktop/**"
      - "modules/apps/mobile/**"
      - "modules/libs/protocol/**"
      - "tests/**"
      - ".github/workflows/go-build-test.yml"

# One run at a time per branch, and on a pull request the newest is the one that
# matters. A run on main is left to finish: it fills the cache the branches read.
concurrency:
  group: go-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Three Go modules, checked the same way. The desktop module holds its Go
  # under cmd and internal, the phone's under bind; the core module is Go
  # throughout.
  build-and-test:
    name: ${{ matrix.title }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - title: Core
            module: modules/libs/core
            sources: "."
          - title: Desktop
            module: modules/apps/desktop
            sources: "./cmd ./internal"
            webview: true
          - title: Mobile
            module: modules/apps/mobile
            sources: "./bind"
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7

      # The two caches are keyed apart: the modules answer to go.sum, the build
      # answers to the commit.
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: false

      - uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ matrix.module }}-${{ hashFiles(format('{0}/go.sum', matrix.module)) }}
          restore-keys: go-mod-${{ matrix.module }}-

      # What the last compile and test run left behind: a run compiles what
      # changed and re-runs the tests that changed. The key carries the commit,
      # so the newest cache the branch can see is the one restored.
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/go-build
          key: go-build-${{ matrix.module }}-${{ github.sha }}
          restore-keys: go-build-${{ matrix.module }}-

      # The window links against the system's own browser, so the machine that
      # compiles it needs that browser's headers. The command line tool needs
      # none of this, which is why it is a separate binary.
      - name: Webview
        if: matrix.webview
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            -o Dpkg::Options::=--force-unsafe-io \
            libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Formatting
        run: |
          unformatted=$(gofmt -l ${{ matrix.sources }})
          if [ -n "$unformatted" ]; then
            echo "not gofmt-ed:"; echo "$unformatted"; exit 1
          fi

      - run: go vet ./...

      # -race because a scan will grow concurrent, and the cheapest time to find
      # that out is before it does.
      #
      # A test builds its vault in a temporary folder, and there is memory here
      # to hold every one of them.
      - run: go test -race ./...
        env:
          TMPDIR: /dev/shm

      # Every run writes what it built. A branch reads its own back on the next
      # push to it and main's before that.
      - uses: actions/cache/save@v4
        with:
          path: ~/.cache/go-build
          key: go-build-${{ matrix.module }}-${{ github.sha }}

  # The other half of the promise the two binaries make: this one is built for
  # a machine it is not being built on.
  cross-compile:
    name: Command line tool
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/apps/desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache-dependency-path: |
            modules/apps/desktop/go.sum
            modules/libs/core/go.sum
      - name: Cross-compile
        run: |
          for target in darwin/arm64 windows/amd64 linux/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -o /dev/null ./cmd/numen-cli
          done
