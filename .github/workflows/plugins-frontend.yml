name: Plugins Frontend

on:
  pull_request:
    paths:
      - "plugins/*/frontend/**"
      - "plugins/*/package.json"
      - "plugins/*/vite.config.ts"
      - "plugins/*/vitest.config.ts"
      - "plugins/eslint.config.js"
      - "plugins/*/tsconfig.json"
      - "plugins/*/manifest.json"
      - "libs/ui/core/**"
      - "libs/plugin-sdk-ts/**"
      - "libs/protocol/**"
      - "package.json"
      - "package-lock.json"
      - "prettier.config.mjs"
      - ".prettierignore"
      - ".github/actions/**"
      - "!**/*.md"
      - "!docs/**"
      - "Makefile"
      - ".github/workflows/plugins-frontend.yml"
  push:
    branches: [main]
    paths:
      - "plugins/*/frontend/**"
      - "plugins/*/package.json"
      - "plugins/*/vite.config.ts"
      - "plugins/*/vitest.config.ts"
      - "plugins/eslint.config.js"
      - "plugins/*/tsconfig.json"
      - "plugins/*/manifest.json"
      - "libs/ui/core/**"
      - "libs/plugin-sdk-ts/**"
      - "libs/protocol/**"
      - "package.json"
      - "package-lock.json"
      - "prettier.config.mjs"
      - ".prettierignore"
      - ".github/actions/**"
      - "!**/*.md"
      - "!docs/**"
      - "Makefile"
      - ".github/workflows/plugins-frontend.yml"

# One run at a time per branch, and the newest is the one that matters.
concurrency:
  group: plugins-frontend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The frontends of every plugin in the Prettier style of the modules. Each
  # plugin's own lint, typecheck and tests run under make plugins_lint and
  # make plugins_test in the backend workflow, where Go is set up beside Node.
  format:
    name: Plugin Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        uses: ./.github/actions/install-node-modules

      - name: Check plugin formatting
        run: node_modules/.bin/prettier --check "plugins/**/*.{ts,vue,json,css,js}"

  # The stories of every plugin, drawn in both engines the window is drawn in.
  stories:
    name: Plugin Stories
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        uses: ./.github/actions/install-node-modules

      - uses: ./.github/actions/setup-playwright

      - name: Run plugin stories
        run: make plugins_stories
