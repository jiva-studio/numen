name: Plugins Frontend

on:
  pull_request:
    paths:
      - "modules/plugins/*/frontend/**"
      - "modules/plugins/*/package.json"
      - "modules/plugins/*/vite.config.ts"
      - "modules/plugins/*/vitest.config.ts"
      - "modules/plugins/vitest.config.ts"
      - "modules/plugins/eslint.config.js"
      - "modules/plugins/vite.shared.ts"
      - "modules/plugins/*/manifest.json"
      - "modules/plugins/.storybook/**"
      - "modules/libs/ui/**"
      - "modules/libs/plugin-sdk-ts/**"
      - "modules/libs/wire/**"
      - "modules/libs/protocol/**"
      - "modules/package.json"
      - "modules/package-lock.json"
      - "modules/prettier.config.mjs"
      - "modules/.prettierignore"
      - ".github/actions/**"
      - "!**/*.md"
      - "!docs/**"
      - "Makefile"
      - ".github/workflows/plugins-frontend.yml"
  push:
    branches: [main]
    paths:
      - "modules/plugins/*/frontend/**"
      - "modules/plugins/*/package.json"
      - "modules/plugins/*/vite.config.ts"
      - "modules/plugins/*/vitest.config.ts"
      - "modules/plugins/vitest.config.ts"
      - "modules/plugins/eslint.config.js"
      - "modules/plugins/vite.shared.ts"
      - "modules/plugins/*/manifest.json"
      - "modules/plugins/.storybook/**"
      - "modules/libs/ui/**"
      - "modules/libs/plugin-sdk-ts/**"
      - "modules/libs/wire/**"
      - "modules/libs/protocol/**"
      - "modules/package.json"
      - "modules/package-lock.json"
      - "modules/prettier.config.mjs"
      - "modules/.prettierignore"
      - ".github/actions/**"
      - "!**/*.md"
      - "!docs/**"
      - "Makefile"
      - ".github/workflows/plugins-frontend.yml"

# One run at a time per branch, and the newest is the one that matters.
concurrency:
  group: plugins-frontend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The frontends of every plugin under the one ESLint configuration in
  # modules/plugins, and in the Prettier style of the modules.
  lint:
    name: Plugin Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: modules/package-lock.json

      - name: Install dependencies
        uses: ./.github/actions/install-node-modules

      - name: Lint plugin frontends
        working-directory: modules/plugins
        run: ../node_modules/.bin/eslint .

      - name: Check plugin formatting
        working-directory: modules
        run: node_modules/.bin/prettier --check "plugins/**/*.{ts,vue,json,css,js}"

  # Every plugin's own suite, under its own configuration. The make target
  # builds the components first: a plugin reaches them through their build, as
  # it does in the window.
  tests:
    name: Plugin Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: modules/package-lock.json

      - name: Install dependencies
        uses: ./.github/actions/install-node-modules

      - name: Run plugin tests
        run: make plugins_frontend_test

  # The stories of every plugin, drawn in both engines the window is drawn in.
  stories:
    name: Plugin Stories
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: modules/package-lock.json

      - name: Install dependencies
        uses: ./.github/actions/install-node-modules

      - uses: ./.github/actions/setup-playwright

      - name: Run plugin stories
        run: make plugins_stories
