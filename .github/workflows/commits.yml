name: Commits

on:
  pull_request:
    # `edited` is not a default type. Without it, renaming a pull request after
    # the check has passed slips a bad title past the gate — and the title is
    # what the squash merge writes into main.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    working-directory: modules/tools/git-hooks

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: modules/tools/git-hooks/package-lock.json

      - run: npm ci

      # PR: validate every commit in the range. Push: validate the last one.
      - name: Validate commit messages
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            npx commitlint --from "$BASE" --to "$HEAD" --verbose
          else
            npx commitlint --last --verbose
          fi

      # Merges are squash-only and take their subject from the pull request
      # title, so the title is what actually lands in main's history — it has to
      # pass the same check as any commit message.
      #
      # The title goes through an environment variable rather than straight into
      # the script: it is attacker-controlled text on a fork pull request, and
      # inlining it would splice it into the shell.
      - name: Validate pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | npx commitlint --verbose
