name: Mutation

# Mutation testing of the Go core and the interface packages, every night.
#
# Each target is split into shards that run side by side. Every shard reads the
# target's one cache and reuses its results wherever the code and its covering
# tests are unchanged. After the shards, each file's results are taken from the
# shard that holds it, or kept from the cache where that shard wrote nothing, and
# saved as the target's next cache; a shard that runs out of time contributes
# what it measured, so a shard too long for one night finishes over several.
#
# On Sunday the shards start without the cache and measure every mutant again.
#
# The mutants the tests do not notice are kept in one issue per target,
# labelled `mutation`: its body is rewritten each night, a comment names the
# survivors that are new, and it closes when none is left.
#
# The targets and their shards are found in the tree by
# `modules/tools/mutation/shards.mjs`: every Go module with tests and every
# workspace package with a Vitest config.
on:
  schedule:
    - cron: "23 1 * * 1-6"
    - cron: "23 1 * * 0"
  workflow_dispatch:
    inputs:
      target:
        description: "Target, as `node modules/tools/mutation/shards.mjs` names it, or all"
        type: string
        default: all

concurrency:
  group: mutation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  shards:
    name: Shards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: list
        env:
          TARGET: ${{ inputs.target || 'all' }}
        run: node modules/tools/mutation/shards.mjs "$TARGET" >> "$GITHUB_OUTPUT"

  mutate:
    name: Mutate ${{ matrix.name }}
    needs: shards
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.shards.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.kind == 'go'
        with:
          go-version-file: ${{ matrix.at }}/go.mod
          cache: false

      - id: go-cache-path
        if: matrix.kind == 'go'
        run: echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"

      # The build cache the module's own CI saves, read and never written.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.kind == 'go'
        with:
          path: ${{ steps.go-cache-path.outputs.build }}
          key: ${{ matrix.target == 'libs-core' && 'go-build-core-ubuntu-latest-' || format('go-build-{0}-', matrix.at) }}${{ github.sha }}
          restore-keys: ${{ matrix.target == 'libs-core' && 'go-build-core-ubuntu-latest-' || format('go-build-{0}-', matrix.at) }}

      # A Go module that links the window needs the system browser's headers.
      - uses: ./.github/actions/setup-webkit
        if: matrix.kind == 'go'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: ${{ matrix.kind == 'ts' && 'npm' || '' }}
          cache-dependency-path: modules/package-lock.json

      - name: Install dependencies
        if: matrix.kind == 'ts'
        uses: ./.github/actions/install-node-modules

      # The windows reach the shared components through their build.
      - name: Build the components
        if: matrix.kind == 'ts'
        run: npm run build --prefix modules/libs/ui

      # `-run-` ends the target's name in the key, so `apps-desktop` matches no key of `apps-desktop-editor`.
      - name: Restore the target's cache
        if: github.event.schedule != '23 1 * * 0'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: modules/.mutation/cache
          key: mutation-${{ matrix.target }}-run-${{ github.run_id }}
          restore-keys: mutation-${{ matrix.target }}-run-

      # Every 30 seconds a `probe:` line records the runner's available memory,
      # used swap, free disk and the five processes with the largest RSS.
      #
      # The shard runs in a systemd scope capped at 12G with no swap. Past the
      # cap the kernel kills the scope's largest process, the test binary, and
      # the shard goes on: gomutants records that mutant as an infra error.
      # `--preserve-env` and `env` carry the step's environment into the scope.
      - name: Mutate
        timeout-minutes: 330
        env:
          TARGET: ${{ matrix.target }}
          SHARD: ${{ matrix.shard }}
          VITE_CONFIG_NATIVE_IGNORE_WARNING: "true"
        run: |
          while sleep 30; do
            memory=$(free -m | awk '/^Mem:/ {printf "mem_avail=%s/%sM", $7, $2} /^Swap:/ {printf " swap_used=%s/%sM", $3, $2}')
            disk="disk_root=$(df -h --output=avail / | tail -1 | tr -d ' ') disk_workspace=$(df -h --output=avail . | tail -1 | tr -d ' ')"
            top=$(ps -eo rss=,comm= --sort=-rss | head -5 | awk '{printf " %s=%dM", $2, $1 / 1024}')
            echo "probe: $memory $disk rss:$top"
          done &
          probe=$!
          trap 'kill "$probe"' EXIT
          sudo --preserve-env systemd-run --scope --quiet \
            --uid="$(id -u)" --gid="$(id -g)" \
            -p MemoryMax=12G -p MemorySwapMax=0 -p OOMPolicy=continue \
            -- env "PATH=$PATH" "HOME=$HOME" \
            node modules/tools/mutation/mutate.mjs "$TARGET" --shard "$SHARD"

      - name: Upload the cache
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cache-${{ matrix.name }}
          path: |
            modules/.mutation/cache/${{ matrix.target }}.gomutants.json
            modules/.mutation/cache/${{ matrix.target }}.stryker.json
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-${{ matrix.name }}
          path: modules/.mutation/reports/
          if-no-files-found: ignore
          retention-days: 14

  cache:
    name: Cache ${{ matrix.target }}
    needs: [shards, mutate]
    if: always() && needs.shards.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.shards.outputs.targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore the target's cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: modules/.mutation/cache
          key: mutation-${{ matrix.target }}-run-${{ github.run_id }}
          restore-keys: mutation-${{ matrix.target }}-run-

      # One folder per shard; the pattern also matches targets whose name extends this one, which the merge ignores.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cache-${{ matrix.target }}*
          path: modules/.mutation/shards

      - name: Merge the shards
        env:
          TARGET: ${{ matrix.target }}
        run: node modules/tools/mutation/cache.mjs "$TARGET" modules/.mutation/shards

      - name: Save the target's cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: modules/.mutation/cache
          key: mutation-${{ matrix.target }}-run-${{ github.run_id }}

  issues:
    name: Issues
    needs: [shards, mutate]
    if: always() && needs.shards.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutation-*
          path: modules/.mutation/reports
          merge-multiple: true

      # A target with a shard that did not finish keeps its issue as it was,
      # and fails this step.
      - name: Update the issues
        env:
          GH_TOKEN: ${{ github.token }}
          TARGETS: ${{ needs.shards.outputs.targets }}
        run: |
          failed=0
          for target in $(echo "$TARGETS" | jq -r '.[]'); do
            node modules/tools/mutation/issue.mjs "$target" || failed=1
          done
          exit "$failed"

      - name: Update mutation score badge
        if: always()
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN || github.token }}
          GH_TOKEN: ${{ secrets.GIST_TOKEN || github.token }}
        run: node modules/tools/mutation/badge.mjs
