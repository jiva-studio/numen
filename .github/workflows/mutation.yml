name: Mutation

# Mutation testing of the Go core and the interface packages, every night.
#
# Each target is split into shards that run side by side. A shard reuses the
# results its previous run left in the cache wherever the code and its covering
# tests are unchanged, and saves the cache even when it runs out of time, so a
# shard too long for one night finishes over several.
#
# The mutants the tests do not notice are kept in one issue per target,
# labelled `mutation`: its body is rewritten each night, a comment names the
# survivors that are new, and it closes when none is left.
#
# A pull request that changes the tool runs the tool's own tests and nothing else.
on:
  pull_request:
    paths:
      - "modules/tools/mutation/**"
      - ".github/workflows/mutation.yml"
  schedule:
    - cron: "23 1 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: Target
        type: choice
        options: [all, core, ui, editor, flashcards]
        default: all

# One night at a time; a pull request only cancels its own older runs.
concurrency:
  group: mutation-${{ github.event_name == 'pull_request' && github.ref || 'nightly' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  tool:
    name: Tool
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test the tool
        run: node --test modules/tools/mutation/*.test.mjs

  shards:
    name: Shards
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: list
        env:
          TARGET: ${{ inputs.target || 'all' }}
        run: node modules/tools/mutation/shards.mjs "$TARGET" >> "$GITHUB_OUTPUT"

  mutate:
    name: ${{ matrix.name }}
    needs: shards
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.shards.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.kind == 'go'
        with:
          go-version-file: modules/libs/core/go.mod
          cache-dependency-path: modules/libs/core/go.sum

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: ${{ matrix.kind == 'ts' && 'npm' || '' }}
          cache-dependency-path: modules/package-lock.json

      - name: Install dependencies
        if: matrix.kind == 'ts'
        run: npm ci --prefix modules

      # The windows reach the shared components through their build.
      - name: Build the components
        if: matrix.kind == 'ts' && matrix.target != 'ui'
        run: npm run build --prefix modules/libs/ui

      - name: Restore the previous run
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: modules/.mutation/cache
          key: mutation-${{ matrix.name }}-${{ github.run_id }}
          restore-keys: mutation-${{ matrix.name }}-

      - name: Mutate
        timeout-minutes: 330
        env:
          TARGET: ${{ matrix.target }}
          SHARD: ${{ matrix.shard }}
          VITE_CONFIG_NATIVE_IGNORE_WARNING: "true"
        run: node modules/tools/mutation/mutate.mjs "$TARGET" --shard "$SHARD"

      - name: Save the run
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: modules/.mutation/cache
          key: mutation-${{ matrix.name }}-${{ github.run_id }}

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-${{ matrix.name }}
          path: modules/.mutation/reports/
          if-no-files-found: ignore
          retention-days: 14

  issues:
    name: Issues
    needs: [shards, mutate]
    if: always() && needs.shards.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutation-*
          path: modules/.mutation/reports
          merge-multiple: true

      # A target with a shard that did not finish keeps its issue as it was,
      # and fails this step.
      - name: Update the issues
        env:
          GH_TOKEN: ${{ github.token }}
          TARGETS: ${{ needs.shards.outputs.targets }}
        run: |
          failed=0
          for target in $(echo "$TARGETS" | jq -r '.[]'); do
            node modules/tools/mutation/issue.mjs "$target" || failed=1
          done
          exit "$failed"
