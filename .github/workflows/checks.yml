name: Checks

# Checks over the whole repository, called by ci.yml with the areas a change touches.
on:
  workflow_call:
    secrets:
      GITLEAKS_LICENSE:
        required: false
    inputs:
      workflows:
        type: boolean
        required: true
      staging:
        type: boolean
        required: true
      mutation_tool:
        type: boolean
        required: true
      narrative:
        type: boolean
        required: true
      code:
        type: boolean
        required: true
      references:
        type: boolean
        required: true

permissions:
  contents: read

jobs:
  # Checks of a few seconds each: a job of their own would wait minutes in the queue. A part runs
  # when its area changed, and after a failed part.
  repository:
    name: Repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The scan reads every commit of the change.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE || 'free' }}

      - if: ${{ !cancelled() }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      # The title becomes the squash commit header; the scopes come from the folders of the tree.
      - name: Check the pull request title
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node tools/git-hooks/check-commit.mjs

      - id: go
        if: ${{ !cancelled() && inputs.workflows }}
        uses: ./.github/actions/setup-go
        with:
          go-version-file: libs/core/kernel/go.mod
          cache-key: workflows

      - name: Verify GitHub Actions workflows
        if: ${{ !cancelled() && inputs.workflows }}
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - if: inputs.workflows
        uses: ./.github/actions/install-lock-packages
        with:
          packages: js-yaml picomatch

      - name: Test the area filters
        if: ${{ !cancelled() && inputs.workflows }}
        run: node --test .github/scripts/*.test.mjs

      # A plugin with a backend has a bin folder after the build, a plugin with a frontend has a
      # dist folder and a theme plugin carries its themes folder; the release stages that tree.
      - name: Stage the plugins as the release does
        if: ${{ !cancelled() && inputs.staging }}
        run: |
          set -euo pipefail
          built="$RUNNER_TEMP/built"
          mkdir -p "$built"
          for p in plugins/*; do
            if [ -f "$p/manifest.json" ]; then
              name=$(basename "$p")
              mkdir -p "$built/$name"
              cp "$p/manifest.json" "$built/$name/"
              if [ -d "$p/backend" ]; then mkdir -p "$built/$name/bin"; touch "$built/$name/bin/$name"; fi
              if [ -d "$p/frontend" ]; then mkdir -p "$built/$name/dist"; touch "$built/$name/dist/index.js"; fi
              if [ -d "$p/themes" ]; then cp -r "$p/themes" "$built/$name/"; fi
            fi
          done
          echo '{"plugins":[]}' > "$built/plugins-index.json"
          .github/scripts/check-staged-plugins-test.sh
          .github/scripts/stage-plugins.sh "$built" "$RUNNER_TEMP/staged"
          .github/scripts/check-staged-plugins.sh plugins "$RUNNER_TEMP/staged"
          test -f "$RUNNER_TEMP/staged/plugins-index.json"

      # The tool behind the nightly mutation workflow; it reads files and nothing else.
      - name: Test the mutation tool
        if: ${{ !cancelled() && inputs.mutation_tool }}
        run: node --test tools/ci-mutation/*.test.mjs

      # Every picture the manual and the landing page show is a story named as a string, and
      # renaming a story leaves the name pointing at nothing. Both lists are held against the tree.
      - if: inputs.references
        uses: ./.github/actions/install-lock-packages
        with:
          packages: "@bufbuild/protobuf typescript"

      - name: Verify documentation story references
        if: ${{ !cancelled() && inputs.references }}
        run: node apps/docs/tools/manual.mjs --check

      - name: Test the settings reference
        if: ${{ !cancelled() && inputs.references }}
        run: node --test apps/docs/tools/reference.test.mjs apps/docs/tools/cell.test.mjs

      - name: Verify landing page story references
        if: ${{ !cancelled() && inputs.references }}
        run: node apps/landing/tools/stories.mjs

      - if: ${{ !cancelled() && steps.go.outcome == 'success' }}
        uses: ./.github/actions/save-go-cache
        with:
          cache-key: ${{ steps.go.outputs.cache-key }}

  quality:
    name: Quality
    if: inputs.narrative
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # The phrase check diffs against the base, the first parent of the merge commit.
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      # The scan reads files and needs nothing installed.
      - name: Check narrative identifiers, test names, comments, documents and phrases
        run: make lint_narrative

      - if: inputs.code
        uses: ./.github/actions/install-node-modules

      - name: Check duplication, unused code and directory size
        if: inputs.code
        run: make check_quality opts="--github-summary"

  architecture:
    name: Architecture
    if: inputs.code
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BASE_REF: HEAD^1
      CHANGED: ${{ github.event_name == 'pull_request' && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: ./.github/actions/install-node-modules

      - name: Test the checks and the lint rules
        run: |
          if [ -z "$CHANGED" ]; then npm test --prefix tools/checks; fi
          if [ -n "$CHANGED" ] && git diff --quiet "$BASE_REF" HEAD -- tools/lint-layers tools/shared; then
            echo "tools/lint-layers and tools/shared did not change"
          else
            npm test --prefix tools/lint-layers
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/checks/style/comments/go.mod
          cache: false

      # The lint of each package and the Go tests of libs/core/kernel and libs/note run in their own jobs,
      # and the Go checks of tools/checks/structure/go in the job Structure Checks of go.yml.
      - name: Run the structural, style and documentation checks
        run: make checks EXCLUDE=go CHANGED="$CHANGED"
