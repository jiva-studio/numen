name: CI

# Every check of a pull request and of a push to main. The changes job says which areas a pull
# request touches (.github/scripts/changes.mjs), and each job runs only for its areas; a push to main
# and a manual run take every area. The CI job at the end is the one required check: a job that
# failed or was cancelled fails it, and a job skipped for its areas passes it.
on:
  pull_request:
  push:
    branches: [main]
  # Windows and macOS are asked for by name: their runners cost two and ten times a Linux one.
  workflow_dispatch:
    inputs:
      windows:
        description: Windows
        type: boolean
        default: false
      macos:
        description: macOS
        type: boolean
        default: false

# A pull request keeps only its newest run. Each push to main has a group of its own: a later push
# neither cancels it nor replaces it while it waits.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      core: ${{ steps.areas.outputs.core }}
      protocol: ${{ steps.areas.outputs.protocol }}
      desktop: ${{ steps.areas.outputs.desktop }}
      desktop_fe: ${{ steps.areas.outputs.desktop_fe }}
      ui: ${{ steps.areas.outputs.ui }}
      sdk_go: ${{ steps.areas.outputs.sdk_go }}
      mobile: ${{ steps.areas.outputs.mobile }}
      mobile_fe: ${{ steps.areas.outputs.mobile_fe }}
      plugins: ${{ steps.areas.outputs.plugins }}
      plugin_dirs: ${{ steps.areas.outputs.plugin_dirs }}
      plugin_stories: ${{ steps.areas.outputs.plugin_stories }}
      plugin_versions: ${{ steps.areas.outputs.plugin_versions }}
      docs: ${{ steps.areas.outputs.docs }}
      docs_deploy: ${{ steps.areas.outputs.docs_deploy }}
      references: ${{ steps.areas.outputs.references }}
      code: ${{ steps.areas.outputs.code }}
      narrative: ${{ steps.areas.outputs.narrative }}
      workflows: ${{ steps.areas.outputs.workflows }}
      gradle: ${{ steps.areas.outputs.gradle }}
      staging: ${{ steps.areas.outputs.staging }}
      mutation_tool: ${{ steps.areas.outputs.mutation_tool }}
      e2e: ${{ steps.areas.outputs.e2e }}
      platforms: ${{ steps.platforms.outputs.matrix }}
    steps:
      # The merge commit and its first parent, the base, without file contents: the diff of two
      # trees names the changed files.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: .github
          persist-credentials: false

      - id: areas
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
        run: node .github/scripts/changes.mjs "$EVENT" "$BASE" HEAD | tee -a "$GITHUB_OUTPUT"

      # Linux always. Windows and macOS when a commit of the change carries a `Run-On:` trailer
      # naming them (or `all`), or when a manual run asks for them.
      - id: platforms
        env:
          EVENT: ${{ github.event_name }}
          ASKED_WINDOWS: ${{ inputs.windows }}
          ASKED_MACOS: ${{ inputs.macos }}
          PULL: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          windows=false
          macos=false
          case "$EVENT" in
            workflow_dispatch) windows=$ASKED_WINDOWS; macos=$ASKED_MACOS; messages= ;;
            pull_request) messages=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PULL/commits" --jq '.[].commit.message') ;;
            *) messages=$(jq -r '.commits[]?.message' "$GITHUB_EVENT_PATH") ;;
          esac
          asked=$(printf '%s\n' "$messages" | grep -i '^Run-On:' | cut -d: -f2- \
            | tr '[:upper:]' '[:lower:]' | tr -d ' \t\r' | tr '\n' ',' || true)
          echo "asked: ${asked:-nothing}"
          case ",$asked," in *,all,*) windows=true; macos=true ;; esac
          case ",$asked," in *,windows,*) windows=true ;; esac
          case ",$asked," in *,macos,*) macos=true ;; esac

          # Windows and macOS are reported and do not hold the change. What stands open on macOS:
          # adapter/cli and adapter/mcp compare a vault's folder against the path a test made it
          # at, and a mac resolves /tmp to /private/tmp; flashcards parts from the library on a card
          # face a day ahead of its own last answer.
          #
          # race is the detector: Linux runs it, and Windows runs the same tests without it on the
          # slowest runner. minutes is what the suite is given.
          entries='{"name":"Linux","runner":"ubuntu-latest","optional":false,"race":true,"minutes":45}'
          if [ "$windows" = true ]; then
            entries="$entries,"'{"name":"Windows","runner":"windows-latest","optional":true,"race":false,"minutes":15}'
          fi
          if [ "$macos" = true ]; then
            entries="$entries,"'{"name":"macOS","runner":"macos-latest","optional":true,"race":true,"minutes":45}'
          fi
          echo "matrix=[$entries]" | tee -a "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------ Repository

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The scan reads every commit of the change.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE || 'free' }}

  workflows:
    name: Workflows
    needs: [changes]
    if: needs.changes.outputs.workflows == 'true' || needs.changes.outputs.gradle == 'true' || needs.changes.outputs.staging == 'true' || needs.changes.outputs.mutation_tool == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: go
        if: needs.changes.outputs.workflows == 'true'
        uses: ./.github/actions/setup-go
        with:
          go-version-file: libs/core/go.mod
          cache-key: workflows

      - name: Verify GitHub Actions workflows
        if: needs.changes.outputs.workflows == 'true'
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Test the area detection
        if: needs.changes.outputs.workflows == 'true'
        run: node --test .github/scripts/*.test.mjs

      - name: Validate Gradle wrapper
        if: needs.changes.outputs.gradle == 'true'
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # A plugin with a backend has a bin folder after the build, a plugin with a frontend has a
      # dist folder and a theme plugin carries its themes folder; the release stages that tree.
      - name: Stage the plugins as the release does
        if: needs.changes.outputs.staging == 'true'
        run: |
          set -euo pipefail
          built="$RUNNER_TEMP/built"
          mkdir -p "$built"
          for p in plugins/*; do
            if [ -f "$p/manifest.json" ]; then
              name=$(basename "$p")
              mkdir -p "$built/$name"
              cp "$p/manifest.json" "$built/$name/"
              if [ -d "$p/backend" ]; then mkdir -p "$built/$name/bin"; touch "$built/$name/bin/$name"; fi
              if [ -d "$p/frontend" ]; then mkdir -p "$built/$name/dist"; touch "$built/$name/dist/index.js"; fi
              if [ -d "$p/themes" ]; then cp -r "$p/themes" "$built/$name/"; fi
            fi
          done
          echo '{"plugins":[]}' > "$built/plugins-index.json"
          .github/scripts/check-staged-plugins-test.sh
          .github/scripts/stage-plugins.sh "$built" "$RUNNER_TEMP/staged"
          .github/scripts/check-staged-plugins.sh plugins "$RUNNER_TEMP/staged"
          test -f "$RUNNER_TEMP/staged/plugins-index.json"

      # The tool behind the nightly mutation workflow; it reads files and nothing else.
      - name: Test the mutation tool
        if: needs.changes.outputs.mutation_tool == 'true'
        run: node --test tools/ci-mutation/*.test.mjs

      - if: ${{ !cancelled() && steps.go.outcome == 'success' }}
        uses: ./.github/actions/save-go-cache
        with:
          cache-key: ${{ steps.go.outputs.cache-key }}

  quality:
    name: Quality
    needs: [changes]
    if: needs.changes.outputs.narrative == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      # The scan reads files and needs nothing installed.
      - name: Check narrative identifiers, test names, comments and documents
        run: make lint_narrative

      - if: needs.changes.outputs.code == 'true'
        uses: ./.github/actions/install-node-modules

      - name: Check duplication, unused code and directory size
        if: needs.changes.outputs.code == 'true'
        run: make check_quality opts="--github-summary"

  architecture:
    name: Architecture
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: ./.github/actions/install-node-modules

      - name: Test the checks against violation fixtures
        run: npm test --prefix tools/lint-layers

      # The lint of each package and the Go tests of libs/core and libs/notes run in their own jobs.
      - name: Validate architectural layer boundaries
        run: make check_layers LAYERS_FLAGS="--without-lint --without-go-tests"

  # ------------------------------------------------------------------ Go libraries

  # gofmt, go vet and both golangci-lint configurations of the core libraries, once, on the cheapest
  # machine: a rule about the shape of the code answers the same on every machine.
  core-lint:
    name: Core Lint
    needs: [changes]
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: go
        uses: ./.github/actions/setup-go
        with:
          go-version-file: libs/core/go.mod
          cache-key: core-lint

      - uses: ./.github/actions/install-golangci-lint

      - name: Lint the core libraries
        run: |
          set -euo pipefail
          for module in libs/core libs/notes libs/plugin-catalog libs/protocol; do
            echo "::group::$module"
            (
              cd "$module"
              unformatted=$(gofmt -l .)
              if [ -n "$unformatted" ]; then echo "not gofmt-ed:"; echo "$unformatted"; exit 1; fi
              go vet ./...
              golangci-lint run --timeout 15m ./...
              golangci-lint run --timeout 15m -c "$GITHUB_WORKSPACE/.golangci-structure.yml" ./...
            )
            echo "::endgroup::"
          done

      # The vulnerability list is read at the time of the run, so this step can find something on a
      # branch that changed nothing.
      - uses: ./.github/actions/govulncheck
        with:
          working-directory: libs/core

      - uses: ./.github/actions/govulncheck
        with:
          working-directory: libs/protocol

      - if: ${{ !cancelled() }}
        uses: ./.github/actions/save-go-cache
        with:
          cache-key: ${{ steps.go.outputs.cache-key }}

  core-test:
    name: Core Tests (${{ matrix.name }})
    needs: [changes]
    if: needs.changes.outputs.core == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.platforms) }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.optional }}
    timeout-minutes: ${{ matrix.minutes }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: go
        uses: ./.github/actions/setup-go
        with:
          go-version-file: libs/core/go.mod
          cache-key: core-test-${{ matrix.race && 'race' || 'plain' }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      # A test compares the plugin index with the manifests it was written from.
      - uses: ./.github/actions/install-protobuf-runtime

      - name: Write the plugin index
        run: node tools/build-plugin-index/build.mjs

      # A test builds its vault in a temporary folder, and there is memory here to hold every one.
      - name: Configure Linux temporary directory
        if: runner.os == 'Linux'
        run: echo "TMPDIR=/dev/shm" >> "$GITHUB_ENV"

      # A Windows runner checks the repository out on another drive than its temporary folder.
      - name: Configure Windows temporary directory
        if: runner.os == 'Windows'
        run: |
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Run Go tests
        env:
          RACE: ${{ matrix.race && '-race' || '' }}
        run: |
          set -euo pipefail
          for module in libs/core libs/notes libs/plugin-catalog; do
            echo "::group::$module"
            (cd "$module" && go test $RACE ./...)
            echo "::endgroup::"
          done

      - if: ${{ !cancelled() }}
        uses: ./.github/actions/save-go-cache
        with:
          cache-key: ${{ steps.go.outputs.cache-key }}

  # A numbered migration a released build has run cannot change or disappear: the schema goes
  # forward by another number. The base is the first parent of the merge commit.
  migrations:
    name: Migrations
    needs: [changes]
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Self-test migration rule
        run: libs/core/adapter/index/migration-forward-only.sh --self-test

      - name: Verify migrations are forward-only
        if: github.event_name == 'pull_request'
        run: libs/core/adapter/index/migration-forward-only.sh HEAD^1

  schema:
    name: Protocol Schema
    needs: [changes]
    if: needs.changes.outputs.protocol == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: libs/protocol
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: go
        uses: ./.github/actions/setup-go
        with:
          go-version-file: libs/protocol/go.mod
          cache-key: schema

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          version: 1.72.0
          setup_only: true

      # The Go plugins are the tools of this module; go.sum pins them.
      - name: Install protobuf plugins
        run: go install tool

      - uses: ./.github/actions/install-node-modules

      - name: Lint Protobuf schema
        run: buf lint

      # The generated code is committed so that an ordinary build needs none of the tools above.
      - name: Verify generated code
        run: |
          buf generate
          git add -AN -- gen src
          git diff --exit-code -- gen src || {
            echo "::error::the schema changed and the generated code was not regenerated — run: make generate"
            exit 1
          }

      - if: ${{ !cancelled() }}
        uses: ./.github/actions/save-go-cache
        with:
          cache-key: ${{ steps.go.outputs.cache-key }}

  # The base module of the Go plugin SDK and each feature module under it.
  sdk:
    name: Plugin SDK
    needs: [changes]
    if: needs.changes.outputs.sdk_go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: go
        uses: ./.github/actions/setup-go
        with:
          go-version-file: libs/plugin-sdk-go/go.mod
          cache-key: sdk

      - uses: ./.github/actions/install-golangci-lint

      - name: Verify Go formatting
        working-directory: libs/plugin-sdk-go
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "not gofmt-ed:"; echo "$unformatted"; exit 1; fi

      - name: Run linters
        run: make lib_plugin_sdk_go_lint

      - name: Run Go tests
        run: make lib_plugin_sdk_go_test GO_RACE=1

      - if: ${{ !cancelled() }}
        uses: ./.github/actions/save-go-cache
        with:
          cache-key: ${{ steps.go.outputs.cache-key }}

  # ------------------------------------------------------------------ Desktop

  desktop-lint:
    name: Desktop Lint
    needs: [changes]
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: go
        uses: ./.github/actions/setup-go
        with:
          go-version-file: apps/desktop/go.mod
          cache-key: desktop-lint

      # The window links against the system's own browser, so vet and the linters need its headers.
      - uses: ./.github/actions/setup-webkit

      - uses: ./.github/actions/install-golangci-lint

      - name: Verify Go formatting
        run: |
          unformatted=$(gofmt -l ./cmd ./internal ./build/pgonorm)
          if [ -n "$unformatted" ]; then echo "not gofmt-ed:"; echo "$unformatted"; exit 1; fi

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        run: |
          golangci-lint run --timeout 15m ./...
          golangci-lint run --timeout 15m -c "$GITHUB_WORKSPACE/.golangci-structure.yml" ./...

      # The tool that strips machine paths from the build profile is a module of its own.
      - name: Lint the profile normaliser
        working-directory: apps/desktop/build/pgonorm
        run: |
          go vet ./...
          golangci-lint run --timeout 5m ./...
          golangci-lint run --timeout 5m -c "$GITHUB_WORKSPACE/.golangci-structure.yml" ./...

      - uses: ./.github/actions/govulncheck
        with:
          working-directory: apps/desktop

      - if: ${{ !cancelled() }}
        uses: ./.github/actions/save-go-cache
        with:
          cache-key: ${{ steps.go.outputs.cache-key }}

  desktop-test:
    name: Desktop Tests
    needs: [changes]
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: go
        uses: ./.github/actions/setup-go
        with:
          go-version-file: apps/desktop/go.mod
          cache-key: desktop-test

      - uses: ./.github/actions/setup-webkit

      - name: Run Go tests
        run: go test -race ./...
        env:
          TMPDIR: /dev/shm

      # With -race the link reuses every package the tests compiled.
      - name: Link the desktop binary
        run: go build -race -o /dev/null ./cmd/numen

      - if: ${{ !cancelled() }}
        uses: ./.github/actions/save-go-cache
        with:
          cache-key: ${{ steps.go.outputs.cache-key }}

  # The command line binary is built for machines it is not built on.
  cli:
    name: CLI
    needs: [changes]
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: go
        uses: ./.github/actions/setup-go
        with:
          go-version-file: apps/desktop/go.mod
          cache-key: cli

      - name: Cross-compile CLI binaries
        run: |
          for target in darwin/arm64 windows/amd64 linux/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -o /dev/null ./cmd/numen-cli
          done

      - name: Build the profile normaliser
        working-directory: apps/desktop/build/pgonorm
        run: go build -o /dev/null .

      - if: ${{ !cancelled() }}
        uses: ./.github/actions/save-go-cache
        with:
          cache-key: ${{ steps.go.outputs.cache-key }}

  frontend:
    name: Desktop Frontend
    needs: [changes]
    if: needs.changes.outputs.desktop_fe == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: ./.github/actions/install-node-modules

      - uses: ./.github/actions/setup-playwright

      # A window reaches the components and the shell through their build.
      - uses: ./.github/actions/build-ui
        with:
          shell: "true"

      - name: Verify story references
        run: npm run check --prefix tools/ci-stories

      # The plugin SDK has an ESLint configuration and no lint script.
      - name: Lint editor, flashcards and libraries
        run: |
          npm run lint --prefix apps/desktop/editor
          npm run lint --prefix apps/desktop/flashcards
          npm run lint --prefix libs/ui/shell
          npm run lint --prefix libs/core-client
          npm run lint --prefix libs/plugin-host-ts
          npm run lint --prefix libs/plugin-manager
          npm run lint --prefix tests/e2e/desktop
          (cd libs/plugin-sdk-ts && ../../node_modules/.bin/eslint .)

      - name: Typecheck screens and SDK
        run: |
          npm run typecheck --prefix libs/plugin-sdk-ts
          npm run typecheck --prefix libs/core-client
          npm run typecheck --prefix libs/ui/shell
          npm run typecheck --prefix libs/plugin-host-ts
          npm run typecheck --prefix libs/plugin-manager
          npm run typecheck --prefix apps/desktop/editor
          npm run typecheck --prefix apps/desktop/flashcards

      - name: Run frontend tests
        run: |
          npm test --prefix libs/plugin-sdk-ts
          npm test --prefix libs/core-client
          npm run test:unit --prefix libs/ui/shell -- --coverage
          npm run test:stories --prefix libs/ui/shell
          npm test --prefix libs/plugin-host-ts
          npm test --prefix libs/plugin-manager
          npm run test:unit --prefix apps/desktop/editor -- --coverage
          npm run test:stories --prefix apps/desktop/editor
          npm run test:unit --prefix apps/desktop/flashcards -- --coverage

  e2e:
    name: End-to-End
    needs: [changes]
    if: needs.changes.outputs.e2e != 'none'
    uses: ./.github/workflows/desktop-e2e.yml
    with:
      scope: ${{ needs.changes.outputs.e2e }}

  # ------------------------------------------------------------------ Components

  ui:
    name: UI Components
    needs: [changes]
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: ./.github/actions/install-node-modules

      - name: Lint components
        run: npm run lint --prefix libs/ui/core

      - uses: ./.github/actions/build-ui

      - name: Run unit tests
        run: npm run test:unit --prefix libs/ui/core -- --coverage

  # A story runs in a real browser, and several are the only test of what a browser decides: what
  # an overflow clips, where a scroll lands, whether a key reaches an SVG group. The window is WebKit
  # on a mac and on Linux and Chromium on Windows, so both run.
  ui-stories:
    name: UI Stories
    needs: [changes]
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: ./.github/actions/install-node-modules

      - uses: ./.github/actions/setup-playwright

      - name: Run story tests
        run: npm run test:stories --prefix libs/ui/core

  # ------------------------------------------------------------------ Plugins

  # Each plugin's own `make lint` (go vet, both golangci-lint configurations, ESLint, vue-tsc), the
  # Prettier style of its files, and its manifest read by the plugin CLI.
  plugins-lint:
    name: Plugins Lint
    needs: [changes]
    if: needs.changes.outputs.plugins == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLUGIN_DIRS: ${{ needs.changes.outputs.plugin_dirs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: go
        uses: ./.github/actions/setup-go
        with:
          go-version-file: apps/desktop/go.mod
          cache-key: plugins-lint

      - uses: ./.github/actions/install-golangci-lint

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: ./.github/actions/install-node-modules

      - uses: ./.github/actions/build-ui

      - name: Run plugin linters
        run: make plugins_lint SKIP_UI_BUILD=1 PLUGIN_DIRS="$PLUGIN_DIRS"

      - name: Check plugin formatting
        run: |
          set -euo pipefail
          globs=()
          for dir in $PLUGIN_DIRS; do globs+=("$dir/**/*.{ts,vue,json,css,js}"); done
          node_modules/.bin/prettier --check "${globs[@]}"

      - name: Validate each plugin's manifest with the plugin CLI
        run: |
          set -euo pipefail
          (cd apps/desktop && go build -o "$RUNNER_TEMP/numen-plugin" ./cmd/numen-plugin)
          for dir in $PLUGIN_DIRS; do "$RUNNER_TEMP/numen-plugin" validate "$dir"; done

      - if: ${{ !cancelled() }}
        uses: ./.github/actions/save-go-cache
        with:
          cache-key: ${{ steps.go.outputs.cache-key }}

  plugins-test:
    name: Plugins Tests
    needs: [changes]
    if: needs.changes.outputs.plugins == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLUGIN_DIRS: ${{ needs.changes.outputs.plugin_dirs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: go
        uses: ./.github/actions/setup-go
        with:
          go-version-file: libs/plugin-sdk-go/go.mod
          cache-key: plugins-test

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: ./.github/actions/install-node-modules

      - uses: ./.github/actions/build-ui

      - name: Build and test the plugins
        run: |
          make plugins_build SKIP_UI_BUILD=1 PLUGIN_DIRS="$PLUGIN_DIRS"
          make plugins_test SKIP_UI_BUILD=1 PLUGIN_DIRS="$PLUGIN_DIRS"

      - if: ${{ !cancelled() }}
        uses: ./.github/actions/save-go-cache
        with:
          cache-key: ${{ steps.go.outputs.cache-key }}

  # The stories of every plugin, drawn in both engines the window is drawn in.
  plugin-stories:
    name: Plugin Stories
    needs: [changes]
    if: needs.changes.outputs.plugin_stories == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: ./.github/actions/install-node-modules

      - uses: ./.github/actions/setup-playwright

      - uses: ./.github/actions/build-ui

      - name: Run plugin stories
        run: make plugins_stories SKIP_UI_BUILD=1

  # A plugin that changed carries a higher <year>.<month>.<build> version than on the base, the
  # first parent of the merge commit.
  plugin-versions:
    name: Plugin Versions
    needs: [changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.plugin_versions == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - uses: ./.github/actions/install-protobuf-runtime

      - name: Test the check and the plugin index build
        run: node --test tools/plugin-versions/check.test.mjs tools/build-plugin-index/build.test.mjs

      - name: Check the versions of changed plugins
        run: node tools/plugin-versions/check.mjs --base HEAD^1

  # ------------------------------------------------------------------ Mobile

  mobile-lint:
    name: Mobile Lint
    needs: [changes]
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: go
        uses: ./.github/actions/setup-go
        with:
          go-version-file: apps/mobile/go.mod
          cache-key: mobile-lint

      - uses: ./.github/actions/install-golangci-lint

      - name: Verify Go formatting
        run: |
          unformatted=$(gofmt -l ./bind tools.go)
          if [ -n "$unformatted" ]; then echo "not gofmt-ed:"; echo "$unformatted"; exit 1; fi

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        run: |
          golangci-lint run --timeout 15m ./...
          golangci-lint run --timeout 15m -c "$GITHUB_WORKSPACE/.golangci-structure.yml" ./...

      - uses: ./.github/actions/govulncheck
        with:
          working-directory: apps/mobile

      - if: ${{ !cancelled() }}
        uses: ./.github/actions/save-go-cache
        with:
          cache-key: ${{ steps.go.outputs.cache-key }}

  mobile-test:
    name: Mobile Tests
    needs: [changes]
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: go
        uses: ./.github/actions/setup-go
        with:
          go-version-file: apps/mobile/go.mod
          cache-key: mobile-test

      - name: Run Go tests
        run: go test -race ./...
        env:
          TMPDIR: /dev/shm

      - if: ${{ !cancelled() }}
        uses: ./.github/actions/save-go-cache
        with:
          cache-key: ${{ steps.go.outputs.cache-key }}

  mobile-frontend:
    name: Mobile Frontend
    needs: [changes]
    if: needs.changes.outputs.mobile_fe == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: ./.github/actions/install-node-modules

      # A screen reaches the components through their build.
      - uses: ./.github/actions/build-ui

      - name: Typecheck screens
        run: npm run typecheck --prefix apps/mobile

      - name: Lint screens
        run: npm run lint --prefix apps/mobile

      - name: Run screen tests
        run: npm test --prefix apps/mobile

  # ------------------------------------------------------------------ Manual and stories

  # Every picture the manual and the landing page show is a story named as a string, and renaming a
  # story leaves the name pointing at nothing. Both lists are held against the tree here. The checks
  # read files and the plugin manifests, which is all they need installed.
  references:
    name: Story References
    needs: [changes]
    if: needs.changes.outputs.references == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - uses: ./.github/actions/install-protobuf-runtime

      - name: Verify documentation story references
        run: node apps/docs/tools/manual.mjs --check

      - name: Verify landing page story references
        run: node apps/landing/tools/stories.mjs

  # The manual is markdown and carries no framework: the site builds, and the keyboard page still
  # says what the window does. The page references are the job above.
  docs:
    name: Docs
    needs: [changes]
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: ./.github/actions/install-node-modules

      - name: Check plugin command reader
        run: npm run check --prefix tools/ci-commands

      - name: Typecheck documentation site
        run: npm run typecheck --prefix apps/docs

      - name: Lint documentation site
        run: npm run lint --prefix apps/docs

      - name: Build documentation site
        run: npm run build --prefix apps/docs

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.changes.outputs.docs_deploy == 'true'
        with:
          name: docs
          path: apps/docs/dist
          if-no-files-found: error

  # What is on main is what is on the web. Two deploys share one storage zone, and the second takes
  # down what the first has not finished putting up, so an overtaken deploy is cancelled: every
  # deploy writes the whole manual and then removes what it did not write.
  docs-deploy:
    name: Docs Deploy
    needs: [changes, docs]
    if: needs.changes.outputs.docs_deploy == 'true'
    environment: production
    concurrency:
      group: docs-deploy
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs
          path: dist

      - uses: ./.github/actions/deploy-bunny
        with:
          endpoint: ${{ vars.BUNNY_STORAGE_ENDPOINT }}
          storage-zone: ${{ vars.BUNNY_DOCS_STORAGE_ZONE }}
          pull-zone-id: ${{ vars.BUNNY_DOCS_PULL_ZONE_ID }}
          served-from: ${{ vars.BUNNY_DOCS_SERVED_FROM }}
          storage-key: ${{ secrets.BUNNY_DOCS_STORAGE_KEY }}
          api-key: ${{ secrets.BUNNY_API_KEY }}
          dist-path: dist

  # ------------------------------------------------------------------ Gate

  ci:
    name: CI
    if: always()
    needs:
      - changes
      - gitleaks
      - workflows
      - quality
      - architecture
      - core-lint
      - core-test
      - migrations
      - schema
      - sdk
      - desktop-lint
      - desktop-test
      - cli
      - frontend
      - e2e
      - ui
      - ui-stories
      - plugins-lint
      - plugins-test
      - plugin-stories
      - plugin-versions
      - mobile-lint
      - mobile-test
      - mobile-frontend
      - references
      - docs
      - docs-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$RESULTS" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"' | sort
          if printf '%s' "$RESULTS" | jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' > /dev/null; then
            echo "::error::a job failed or was cancelled"
            exit 1
          fi
