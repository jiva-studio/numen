name: Plugins Lint

on:
  pull_request:
    paths:
      - "modules/plugins/**"
      - "!modules/plugins/**/*.md"
      - "modules/package.json"
      - "modules/package-lock.json"
      - "modules/prettier.config.mjs"
      - "modules/.prettierignore"
      - ".github/actions/install-node-modules/**"
      - ".github/workflows/plugins-lint.yml"
  push:
    branches: [main]
    paths:
      - "modules/plugins/**"
      - "!modules/plugins/**/*.md"
      - "modules/package.json"
      - "modules/package-lock.json"
      - "modules/prettier.config.mjs"
      - "modules/.prettierignore"
      - ".github/actions/install-node-modules/**"
      - ".github/workflows/plugins-lint.yml"

# One run at a time per branch, and the newest is the one that matters.
concurrency:
  group: plugins-lint-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The frontends of every plugin under the one ESLint configuration in
  # modules/plugins, and in the Prettier style of the modules.
  lint:
    name: Plugin Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: modules
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: modules/package-lock.json

      - name: Install dependencies
        uses: ./.github/actions/install-node-modules

      - name: Lint plugin frontends
        working-directory: modules/plugins
        run: ../node_modules/.bin/eslint .

      - name: Check plugin formatting
        run: node_modules/.bin/prettier --check "plugins/**/*.{ts,vue,json,css,js}"
