name: Reports

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: reports
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  acceptance:
    name: Acceptance
    uses: ./.github/workflows/desktop-e2e.yml
    with:
      scope: acceptance
      engines: chromium webkit
      video: true

  pages:
    name: Pages
    needs: [acceptance]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: acceptance-report
          path: site/acceptance

      - name: Write the start page
        run: |
          cat > site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=acceptance/">
          <title>Numen reports</title>
          <a href="acceptance/">Acceptance scenarios</a>
          HTML

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
