name: Reports

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      features:
        description: 'feature files under features/, separated by spaces; empty is all'
        type: string
        default: ''
      specs:
        description: 'also run the end-to-end specs'
        type: boolean
        default: false
      engines:
        description: 'chromium, webkit, or both separated by a space'
        type: string
        default: chromium webkit
      environments:
        description: 'linux for GitHub runners or live for a manual macOS run'
        type: string
        default: linux
      live-guests:
        description: 'JSON list of the guests the live scenarios run in: the name of the system, the label of its runners and the artifact of its build'
        type: string
        default: '[{"os":"macOS","runner":"numen-macos-26","build":"e2e-build-darwin-arm64"}]'
      publish:
        description: 'publish the report to Pages'
        type: boolean
        default: false
  workflow_call:
    inputs:
      features:
        type: string
        default: ''
      specs:
        type: boolean
        default: false
      engines:
        type: string
        default: chromium webkit
      environments:
        type: string
        default: linux
      live-guests:
        type: string
        default: '[{"os":"macOS","runner":"numen-macos-26","build":"e2e-build-darwin-arm64"}]'
      publish:
        type: boolean
        default: false
    secrets:
      NUMEN_ACCEPTANCE_TESTS_OPENROUTER_KEY:
        required: false
    outputs:
      linux:
        description: result of the acceptance run on the GitHub runners
        value: ${{ jobs.summary.outputs.linux }}
      e2e:
        description: result of the end-to-end specs
        value: ${{ jobs.summary.outputs.e2e }}
      live:
        description: result of shared real-server acceptance
        value: ${{ jobs.summary.outputs.live }}
      stand:
        description: result of acceptance on the isolated stand
        value: ${{ jobs.summary.outputs.stand }}

env:
  ENGINES: ${{ inputs.engines || 'chromium webkit' }}
  FEATURES: ${{ inputs.features }}

permissions:
  contents: read

jobs:
  build:
    name: Build
    if: ${{ github.event_name == 'push' || inputs.environments != 'live' }}
    uses: ./.github/workflows/desktop-e2e-build.yml
    with:
      scope: all
      engines: ${{ inputs.engines || 'chromium webkit' }}

  acceptance:
    name: Acceptance
    needs: [build]
    uses: ./.github/workflows/desktop-acceptance.yml
    with:
      artifact-name: ${{ needs.build.outputs.artifact-name }}
      engines: ${{ inputs.engines || 'chromium webkit' }}
      features: ${{ inputs.features }}
      video: true

  live-sync:
    name: Real server
    needs: [build]
    if: ${{ github.event_name != 'push' && github.repository == 'jiva-studio/numen' && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    uses: ./.github/workflows/live.yml
    permissions:
      contents: read
      packages: read
    with:
      artifact-name: ${{ needs.build.outputs.artifact-name }}
      features: ${{ inputs.features }}
    secrets:
      NUMEN_ACCEPTANCE_TESTS_OPENROUTER_KEY: ${{ secrets.NUMEN_ACCEPTANCE_TESTS_OPENROUTER_KEY }}

  stand:
    name: Isolated stand
    needs: [build]
    if: ${{ github.event_name != 'push' && github.repository == 'jiva-studio/numen' && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    uses: ./.github/workflows/stand.yml
    permissions:
      contents: read
      packages: read
    with:
      artifact-name: ${{ needs.build.outputs.artifact-name }}
      features: ${{ inputs.features }}

  e2e:
    name: End-to-End
    needs: [build]
    if: inputs.specs
    uses: ./.github/workflows/desktop-e2e.yml
    with:
      scope: specs
      artifact-name: ${{ needs.build.outputs.artifact-name }}
      engines: ${{ inputs.engines || 'chromium webkit' }}

  build-macos:
    name: Build / macOS
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.environments == 'live' }}
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - id: go
        uses: ./.github/actions/setup-go
        with:
          go-version-file: apps/desktop/go.mod
          cache-key: e2e-macos

      - name: Install dependencies
        uses: ./.github/actions/install-node-modules

      - name: Build UI library
        uses: ./.github/actions/build-ui
        with:
          shell: 'true'

      - name: Build the plugins, the windows and the debug binaries
        run: |
          make plugins_build SKIP_UI_BUILD=1 > "$RUNNER_TEMP/plugins.log" 2>&1 &
          plugins=$!
          npm run build --prefix apps/desktop/editor
          npm run build --prefix apps/desktop/flashcards
          (
            cd apps/desktop
            go build -tags numen_debug -o numen-debug ./cmd/numen
            go build -tags numen_debug -o numen-flashcards-debug ./cmd/numen-flashcards
          )
          status=0
          wait "$plugins" || status=$?
          cat "$RUNNER_TEMP/plugins.log"
          if [ "$status" -eq 0 ]; then
            (cd plugins/connections-llm && go build -o bin/fakeopenai ./backend/cmd/fakeopenai) || status=$?
          fi
          exit "$status"

      - name: Pack what the tests run
        run: |
          tar -cf "$RUNNER_TEMP/e2e-build.tar" \
            apps/desktop/numen-debug apps/desktop/numen-flashcards-debug \
            plugins/plugins-index.json plugins/*/bin plugins/*/dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-build-darwin-arm64
          path: ${{ runner.temp }}/e2e-build.tar
          compression-level: 1
          retention-days: 1

      - if: ${{ !cancelled() }}
        uses: ./.github/actions/save-go-cache
        with:
          cache-key: ${{ steps.go.outputs.cache-key }}

  acceptance-live:
    name: Acceptance / Live / ${{ matrix.os }}
    needs: [build-macos]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.environments == 'live' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.live-guests || '[{"os":"macOS","runner":"numen-macos-26","build":"e2e-build-darwin-arm64"}]') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/install-node-modules

      - name: Install the browsers
        run: npx playwright install chromium webkit

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.build }}
          path: ${{ runner.temp }}

      - name: Unpack the build
        run: tar -xf "$RUNNER_TEMP/e2e-build.tar"

      - name: Run the live scenarios
        working-directory: tests/acceptance/desktop
        env:
          PLAYWRIGHT_VIDEO: '1'
          PWTEST_BLOB_DO_NOT_REMOVE: '1'
          NUMEN_ACCEPTANCE_TESTS_OPENROUTER_KEY: ${{ secrets.NUMEN_ACCEPTANCE_TESTS_OPENROUTER_KEY }}
        run: |
          read -ra engines <<< "$ENGINES"
          read -ra features <<< "$FEATURES"
          projects=()
          for engine in "${engines[@]}"; do projects+=("--project=$engine"); done
          npm run acceptance:live -- --workers=1 "${projects[@]}" "${features[@]}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: acceptance-blobs-live-${{ matrix.os }}
          path: tests/acceptance/desktop/acceptance-blobs/
          retention-days: 7

  report:
    name: Report
    needs: [acceptance, acceptance-live, live-sync, stand]
    if: ${{ !cancelled() && (needs.acceptance.result != 'skipped' || needs.acceptance-live.result != 'skipped' || needs.live-sync.result != 'skipped' || needs.stand.result != 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      available: ${{ steps.merge.outputs.available }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        uses: ./.github/actions/install-node-modules

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: acceptance-blobs-*
          merge-multiple: true
          path: tests/acceptance/desktop/acceptance-blobs

      - id: merge
        name: Merge the runs into the report
        working-directory: tests/acceptance/desktop
        run: |
          shopt -s nullglob
          blobs=(acceptance-blobs/*.zip)
          if [ "${#blobs[@]}" -eq 0 ]; then
            echo "No acceptance reports were uploaded." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npm run acceptance:gen
          npm run acceptance:merge
          echo "available=true" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.merge.outputs.available == 'true'
        with:
          name: acceptance-report
          path: tests/acceptance/desktop/acceptance-report/
          retention-days: 7

  pages:
    name: Publish to Pages
    needs: [report]
    concurrency:
      group: pages
      cancel-in-progress: false
    if: ${{ !cancelled() && needs.report.result == 'success' && needs.report.outputs.available == 'true' && inputs.publish && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: acceptance-report
          path: site/acceptance

      - name: Write the start page
        run: |
          cat > site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=acceptance/">
          <title>Numen reports</title>
          <a href="acceptance/">Acceptance scenarios</a>
          HTML

      - name: Delete the pages artifact of an earlier attempt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[] | select(.name=="github-pages") | .id' |
            while read -r id; do
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
            done

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  summary:
    name: Result
    needs: [acceptance, e2e, live-sync, stand]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      linux: ${{ needs.acceptance.result }}
      e2e: ${{ needs.e2e.result }}
      live: ${{ needs.live-sync.result }}
      stand: ${{ needs.stand.result }}
    steps:
      - name: Summarize the test jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: echo "$RESULTS" | jq -r 'to_entries[] | "(.key): (.value.result)"' >> "$GITHUB_STEP_SUMMARY"
