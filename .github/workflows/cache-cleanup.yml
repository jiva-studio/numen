name: Cache Cleanup

on:
  pull_request:
    types: [closed]

permissions:
  actions: write

jobs:
  cleanup:
    name: "Clean :: Pull Request Cache"
    runs-on: ubuntu-latest
    steps:
      - name: Delete pull request caches
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          gh cache delete --ref "refs/pull/${PR_NUMBER}/merge" || true
          gh cache delete --ref "refs/heads/${HEAD_REF}" || true
