name: Task
description: A feature, a change or a cleanup
labels: ["task"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or wrong, in plain words.
    validations:
      required: true

  - type: textarea
    id: cause
    attributes:
      label: Cause
      description: Why it is so, if that is known. A feature may leave this empty.

  - type: textarea
    id: change
    attributes:
      label: Change
      description: What should happen instead. One piece of work per issue.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: Observable results that mean the issue is done, as a list.
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Related issues, order, open questions.
