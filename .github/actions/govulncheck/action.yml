name: "Run Govulncheck"
description: "Runs govulncheck vulnerability scanner"
inputs:
  working-directory:
    description: "Working directory for govulncheck"
    required: true
runs:
  using: "composite"
  steps:
    - name: Check vulnerabilities
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
