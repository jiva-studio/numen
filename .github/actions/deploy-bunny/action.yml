name: "Deploy to Bunny CDN"
description: "Uploads the changed build artifacts to Bunny Storage, prunes removed files, purges their URLs from the CDN cache, and verifies propagation"
inputs:
  endpoint:
    description: "Bunny Storage Endpoint"
    required: true
  storage-zone:
    description: "Bunny Storage Zone Name"
    required: true
  storage-key:
    description: "Bunny Storage Access Key"
    required: true
  api-key:
    description: "Bunny Account API Key"
    required: true
  served-from:
    description: "Base URL where content is served"
    required: true
  dist-path:
    description: "Path to local directory with files to upload"
    required: false
    default: "dist"
  prune:
    description: "Whether to remove files on CDN not present in dist"
    required: false
    default: "true"
runs:
  using: "composite"
  steps:
    - name: Validate environment variables
      shell: bash
      env:
        ENDPOINT: ${{ inputs.endpoint }}
        ZONE: ${{ inputs.storage-zone }}
        SERVED_FROM: ${{ inputs.served-from }}
        KEY: ${{ inputs.storage-key }}
        API_KEY: ${{ inputs.api-key }}
      run: |
        missing=
        for name in ENDPOINT ZONE SERVED_FROM KEY API_KEY; do
          [ -n "${!name}" ] || missing="$missing $name"
        done
        if [ -n "$missing" ]; then
          echo "::error::missing required deployment variables:$missing"
          exit 1
        fi

    # The listing gives the SHA-256 of every stored file, so a file whose
    # content is already there is neither uploaded again nor purged.
    - name: List files on Bunny Storage
      shell: bash
      env:
        ENDPOINT: ${{ inputs.endpoint }}
        ZONE: ${{ inputs.storage-zone }}
        KEY: ${{ inputs.storage-key }}
      run: |
        set -euo pipefail
        export LC_ALL=C
        umask 077
        printf 'AccessKey: %s\n' "$KEY" > "$RUNNER_TEMP/storage.header"

        walk() {
          local under="$1"
          curl -fsS "https://$ENDPOINT/$ZONE/$under" \
            -H @"$RUNNER_TEMP/storage.header" \
            | jq -r '.[] | [.IsDirectory, .ObjectName, (.Checksum // "")] | @tsv' \
            | while IFS=$'\t' read -r directory name checksum; do
                if [ "$directory" = true ]; then
                  walk "$under$name/"
                else
                  printf '%s\t%s\n' "$under$name" "${checksum,,}"
                fi
              done
        }

        walk "" | sort > "$RUNNER_TEMP/stored.tsv"
        : > "$RUNNER_TEMP/changed"
        echo "$(wc -l < "$RUNNER_TEMP/stored.tsv") files in storage"

    - name: Upload changed files to Bunny CDN
      shell: bash
      env:
        ENDPOINT: ${{ inputs.endpoint }}
        ZONE: ${{ inputs.storage-zone }}
        DIST: ${{ inputs.dist-path }}
      run: |
        set -euo pipefail
        declare -A stored
        while IFS=$'\t' read -r path checksum; do
          stored["$path"]=$checksum
        done < "$RUNNER_TEMP/stored.tsv"

        cd "$DIST"
        uploaded=0
        kept=0
        while read -r path; do
          checksum=$(sha256sum "$path" | cut -d' ' -f1)
          if [ "${stored[$path]:-}" = "$checksum" ]; then
            kept=$((kept + 1))
            continue
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -X PUT "https://$ENDPOINT/$ZONE/$path" \
            -H @"$RUNNER_TEMP/storage.header" \
            -H 'Content-Type: application/octet-stream' \
            -H "Checksum: ${checksum^^}" \
            --data-binary "@$path")
          echo "$code  $path"
          case "$code" in 20*) ;; *) echo "::error::$path was refused with $code"; exit 1 ;; esac
          echo "$path" >> "$RUNNER_TEMP/changed"
          uploaded=$((uploaded + 1))
        done < <(find . -type f | sed 's|^\./||' | sort)
        echo "uploaded $uploaded, unchanged $kept"

    - name: Remove stale files from Bunny CDN
      if: inputs.prune == 'true'
      shell: bash
      env:
        ENDPOINT: ${{ inputs.endpoint }}
        ZONE: ${{ inputs.storage-zone }}
        DIST: ${{ inputs.dist-path }}
      run: |
        set -euo pipefail
        export LC_ALL=C
        built=$(cd "$DIST" && find . -type f | sed 's|^\./||' | sort)

        comm -23 <(cut -f1 "$RUNNER_TEMP/stored.tsv") <(printf '%s\n' "$built") | while read -r stale; do
          [ -n "$stale" ] || continue
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -X DELETE "https://$ENDPOINT/$ZONE/$stale" \
            -H @"$RUNNER_TEMP/storage.header")
          echo "removed $code  $stale"
          echo "$stale" >> "$RUNNER_TEMP/changed"
        done

    # Only the URLs of uploaded and removed files are purged. A page is also
    # served without its .html and a folder's index.html at the folder.
    - name: Purge changed URLs from Bunny CDN
      shell: bash
      env:
        API_KEY: ${{ inputs.api-key }}
        SERVED_FROM: ${{ inputs.served-from }}
      run: |
        set -euo pipefail
        umask 077
        printf 'AccessKey: %s\n' "$API_KEY" > "$RUNNER_TEMP/api.header"

        list_urls() {
          local path="$1"
          echo "$SERVED_FROM/$path"
          case "$path" in
            index.html) echo "$SERVED_FROM/" ;;
            */index.html) echo "$SERVED_FROM/${path%index.html}" ;;
            *.html) echo "$SERVED_FROM/${path%.html}" ;;
          esac
        }

        count=0
        while read -r path; do
          [ -n "$path" ] || continue
          while read -r url; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' -G \
              -X POST "https://api.bunny.net/purge" \
              --data-urlencode "url=$url" \
              -H @"$RUNNER_TEMP/api.header" -H 'Content-Length: 0')
            echo "purge $code  $url"
            case "$code" in 20*) ;; *) echo "::error::$url was not purged: $code"; exit 1 ;; esac
            count=$((count + 1))
          done < <(list_urls "$path")
        done < "$RUNNER_TEMP/changed"
        echo "purged $count URLs"

    - name: Verify CDN deployment
      shell: bash
      env:
        SERVED_FROM: ${{ inputs.served-from }}
      run: |
        set -euo pipefail
        code=$(curl -sS -o /dev/null -L -f \
          --retry 6 --retry-delay 5 --retry-all-errors \
          -w '%{http_code}' "$SERVED_FROM/" || true)
        echo "${code:-—}  $SERVED_FROM/"
        [ "$code" = 200 ] || { echo "::error::the deployment endpoint did not respond with 200"; exit 1; }
