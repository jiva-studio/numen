name: "Build the UI libraries"
description: "Builds libs/ui/core, and libs/ui/shell when asked, or restores the build that an earlier job made from the same sources"
inputs:
  shell:
    description: "Also build libs/ui/shell"
    required: false
    default: "false"
runs:
  using: "composite"
  steps:
    # A build is a function of the sources of the library, the lock file and the Node release, so
    # every job of every workflow that reads the same sources takes the first one's result.
    - name: Restore the build of libs/ui/core
      id: core
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: libs/ui/core/dist
        key: ui-core-dist-${{ runner.os }}-${{ hashFiles('.node-version', 'package-lock.json', 'tsconfig.base.json', 'libs/ui/core/package.json', 'libs/ui/core/tsconfig*.json', 'libs/ui/core/vite.config.ts', 'libs/ui/core/src/**') }}

    - name: Build libs/ui/core
      if: steps.core.outputs.cache-hit != 'true'
      shell: bash
      run: npm run build --prefix libs/ui/core

    - name: Restore the build of libs/ui/shell
      id: shell
      if: inputs.shell == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: libs/ui/shell/dist
        key: ui-shell-dist-${{ runner.os }}-${{ hashFiles('.node-version', 'package-lock.json', 'tsconfig.base.json', 'libs/ui/core/package.json', 'libs/ui/core/vite.config.ts', 'libs/ui/core/src/**', 'libs/ui/shell/package.json', 'libs/ui/shell/tsconfig*.json', 'libs/ui/shell/vite.config.ts', 'libs/ui/shell/src/**') }}

    - name: Build libs/ui/shell
      if: inputs.shell == 'true' && steps.shell.outputs.cache-hit != 'true'
      shell: bash
      run: npm run build --prefix libs/ui/shell
