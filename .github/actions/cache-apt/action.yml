name: "Cache apt packages"
description: "Keeps the .deb files apt downloads in a cache keyed on what the packages are chosen by, so a run on an unchanged key downloads nothing"
inputs:
  key:
    description: "The name and the inputs the package set follows from; the runner image is added"
    required: true
outputs:
  cache-hit:
    description: "true when the exact key was restored"
    value: ${{ steps.cache.outputs.cache-hit }}
runs:
  using: "composite"
  steps:
    # apt writes to this folder as root; the cache reads the .deb files back as the runner user.
    - name: Point apt at the cache folder
      shell: bash
      run: |
        mkdir -p "$HOME/.cache/apt-archives/partial"
        echo "Dir::Cache::archives \"$HOME/.cache/apt-archives\";" | sudo tee /etc/apt/apt.conf.d/99-numen-archives > /dev/null

    - id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/apt-archives/*.deb
        key: apt-${{ inputs.key }}-${{ runner.os }}-${{ env.ImageVersion }}
