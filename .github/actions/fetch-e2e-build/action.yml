name: "Fetch the end-to-end build"
description: "Downloads the archive published by the build job into the runner temp folder"
inputs:
  artifact-name:
    description: "Name of the archive artifact published by the build job"
    required: true
runs:
  using: "composite"
  steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}
