name: "Setup WebKit & GTK"
description: "Installs GTK4 and WebKitGTK dev packages for webview compilation"
runs:
  using: "composite"
  steps:
    - id: apt
      uses: ./.github/actions/cache-apt
      with:
        key: webkit-${{ hashFiles('.github/actions/setup-webkit/action.yml') }}

    # With the .deb files restored the package lists of the runner image are enough; a list that
    # has moved on from them is refreshed and the install tried again.
    - name: Install WebKit & GTK dependencies
      shell: bash
      env:
        DEBIAN_FRONTEND: noninteractive
        RESTORED: ${{ steps.apt.outputs.cache-hit }}
      run: |
        sudo rm -f /var/lib/man-db/auto-update
        install() {
          sudo apt-get install -y --no-install-recommends \
            -o Dpkg::Options::=--force-unsafe-io \
            libgtk-4-dev libwebkitgtk-6.0-dev
        }
        if [ "$RESTORED" = true ] && install; then
          exit 0
        fi
        sudo apt-get update -qq
        install
