name: "Detect code changes"
description: "Says whether a pull request or merge group changes paths this workflow answers for."
inputs:
  documentation:
    description: "Extended regular expression; a changed path that matches it is documentation"
    required: false
    default: '^docs/|^apps/docs/(src|public)/|^apps/landing/|^\.github/|\.mdx?$'
  except:
    description: "Extended regular expression; a changed path that matches it is code even when it matches the documentation expression"
    required: false
    default: '(^|/)testdata/|^apps/docs/src/.*\.(astro|js|jsx|mjs|ts|tsx)$'
  include:
    description: "Extended regular expression; when set, only changed paths matching it count for this workflow"
    required: false
    default: ''
outputs:
  code:
    description: "true when the change touches code this workflow answers for, false otherwise"
    value: ${{ steps.detect.outputs.code }}
runs:
  using: "composite"
  steps:
    - id: detect
      shell: bash
      env:
        EVENT: ${{ github.event_name }}
        BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        DOCUMENTATION: ${{ inputs.documentation }}
        EXCEPT: ${{ inputs.except }}
        INCLUDE: ${{ inputs.include }}
      run: |
        set -euo pipefail

        code=true
        if [ "$EVENT" = pull_request ] || [ "$EVENT" = merge_group ]; then
          files=$(git diff --name-only --no-renames "$BASE...$HEAD")
          if [ -n "$files" ]; then
            code=false
            while IFS= read -r file; do
              if [ -n "$INCLUDE" ] && ! printf '%s\n' "$file" | grep -Eq "$INCLUDE"; then
                continue
              fi
              if ! printf '%s\n' "$file" | grep -Eq "$DOCUMENTATION" \
                || printf '%s\n' "$file" | grep -Eq "$EXCEPT"; then
                code=true
                echo "code: $file"
                break
              fi
            done <<< "$files"
          fi
        fi
        echo "code=$code" >> "$GITHUB_OUTPUT"
        echo "code=$code"
