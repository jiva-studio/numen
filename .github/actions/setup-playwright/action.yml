name: "Setup Playwright Browsers"
description: "Caches and installs Playwright browser engines"
inputs:
  browsers:
    description: "Browsers to install"
    required: false
    default: "chromium webkit"
runs:
  using: "composite"
  steps:
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ hashFiles('modules/package-lock.json') }}
        restore-keys: playwright-

    - name: Install Playwright browsers
      shell: bash
      run: npx --prefix modules playwright install ${{ inputs.browsers }} --with-deps
