name: "Setup Playwright Browsers"
description: "Restores or installs Playwright browser engines; a run on main saves them"
inputs:
  browsers:
    description: "Browsers to install"
    required: false
    default: "chromium webkit"
  packages:
    description: "Extra apt packages to install"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - id: cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ inputs.browsers }}-${{ hashFiles('package-lock.json') }}

    - name: Download Playwright browsers
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        BROWSERS: ${{ inputs.browsers }}
      run: npx playwright install $BROWSERS

    # The system libraries follow from the Playwright release, the engines and the extra packages.
    - id: apt
      uses: ./.github/actions/cache-apt
      with:
        key: playwright-${{ inputs.browsers }}-${{ inputs.packages }}-${{ hashFiles('package-lock.json') }}

    # The restored .deb files are the packages the install needs, so apt installs them without
    # asking the mirrors, whose newer versions have replaced the ones the cache holds. A set that
    # does not install together, or a miss, takes the apt path, which refreshes the package lists.
    - name: Install browser system dependencies
      shell: bash
      env:
        DEBIAN_FRONTEND: noninteractive
        BROWSERS: ${{ inputs.browsers }}
        PACKAGES: ${{ inputs.packages }}
        RESTORED: ${{ steps.apt.outputs.cache-matched-key != '' }}
      run: |
        sudo rm -f /var/lib/man-db/auto-update
        installed=false
        if [ "$RESTORED" = true ] && .github/actions/cache-apt/archives.sh install; then
          installed=true
          for pkg in $PACKAGES; do
            if [ "$(dpkg-query -W -f='${Status}' "$pkg" 2>/dev/null)" != "install ok installed" ]; then
              installed=false
              break
            fi
          done
        fi
        if [ "$installed" = false ]; then
          .github/scripts/apt-retry.sh npx playwright install-deps $BROWSERS
          if [ -n "$PACKAGES" ]; then
            .github/scripts/apt-retry.sh sudo apt-get install -y --no-install-recommends \
              -o Dpkg::Options::=--force-unsafe-io \
              $PACKAGES
          fi
        fi
        .github/actions/cache-apt/archives.sh prune

    # A pull request's cache is visible only to that pull request; main's to all.
    - if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: ${{ steps.cache.outputs.cache-primary-key }}

    - if: github.ref == 'refs/heads/main' && steps.apt.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/apt-archives/*.deb
        key: ${{ steps.apt.outputs.key }}
