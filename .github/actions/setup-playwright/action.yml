name: "Setup Playwright Browsers"
description: "Caches and installs Playwright browser engines"
inputs:
  browsers:
    description: "Browsers to install"
    required: false
    default: "chromium webkit"
  packages:
    description: "Extra apt packages to install"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ inputs.browsers }}-${{ hashFiles('package-lock.json') }}

    - name: Download Playwright browsers
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: npx playwright install ${{ inputs.browsers }}

    - name: Install browser system dependencies
      shell: bash
      run: |
        sudo rm -f /var/lib/man-db/auto-update
        npx playwright install-deps ${{ inputs.browsers }}
        if [ -n "${{ inputs.packages }}" ]; then
          sudo apt-get install -y --no-install-recommends \
            -o Dpkg::Options::=--force-unsafe-io \
            ${{ inputs.packages }}
        fi
