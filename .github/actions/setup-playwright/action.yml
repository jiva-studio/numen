name: "Setup Playwright Browsers"
description: "Restores or installs Playwright browser engines; a run on main saves them"
inputs:
  browsers:
    description: "Browsers to install"
    required: false
    default: "chromium webkit"
  packages:
    description: "Extra apt packages to install"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - id: cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ inputs.browsers }}-${{ hashFiles('package-lock.json') }}

    - name: Download Playwright browsers
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        BROWSERS: ${{ inputs.browsers }}
      run: npx playwright install $BROWSERS

    # The system libraries follow from the Playwright release, the engines and the extra packages.
    - id: apt
      uses: ./.github/actions/cache-apt
      with:
        key: playwright-${{ inputs.browsers }}-${{ inputs.packages }}-${{ hashFiles('package-lock.json') }}

    - name: Install browser system dependencies
      shell: bash
      env:
        BROWSERS: ${{ inputs.browsers }}
        PACKAGES: ${{ inputs.packages }}
      run: |
        sudo rm -f /var/lib/man-db/auto-update
        .github/scripts/apt-retry.sh npx playwright install-deps $BROWSERS
        if [ -n "$PACKAGES" ]; then
          .github/scripts/apt-retry.sh sudo apt-get install -y --no-install-recommends \
            -o Dpkg::Options::=--force-unsafe-io \
            $PACKAGES
        fi

    # A pull request's cache is visible only to that pull request; main's to all.
    - if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: ${{ steps.cache.outputs.cache-primary-key }}

    - if: github.ref == 'refs/heads/main' && steps.apt.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/apt-archives/*.deb
        key: ${{ steps.apt.outputs.key }}
