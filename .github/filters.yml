# The areas of the repository a pull request touches, read by dorny/paths-filter in ci.yml and
# codeql.yml with `predicate-quantifier: some-with-excludes`: a filter is true when a changed file
# matches one of its globs and none of its `!` globs. Globs are picomatch globs with `dot: true`.
#
# An area lists the paths of what it builds on through their anchors, so a change to a library
# runs every area that depends on it. `ci_router` is in every area.

ci_router: &ci_router
  - Makefile
  - tools/shared/**
  - .github/filters.yml
  - .github/workflows/ci.yml
  - .github/scripts/areas.sh
  - .github/scripts/platforms.sh

go_workspace: &go_workspace
  - go.work
  - go.work.sum

node_lock: &node_lock
  - package.json
  - package-lock.json
  - .node-version
  - .github/actions/install-node-modules/**
  - .github/actions/install-lock-packages/**

ts_config: &ts_config
  - tsconfig.base.json
  - prettier.config.mjs
  - .prettierignore
  - stylelint.config.mjs
  - tools/lint-layers/base-eslint.mjs

# ---------------------------------------------------------------- Libraries

go_rules: &go_rules
  - .golangci.yml
  - .golangci-structure.yml
  - '**/gorules/**'
  - .github/actions/setup-go/**
  - .github/actions/save-go-cache/**
  - .github/actions/install-golangci-lint/**
  - .github/actions/govulncheck/**
protocol_lib: &protocol_lib
  - libs/core/protocol/**
atomicfile_lib: &atomicfile_lib
  - libs/atomicfile/**
notes_lib: &notes_lib
  - libs/note/**
core_lib: &core_lib
  - libs/core/kernel/**
  - libs/plugin/catalog/**
sdk_go_lib: &sdk_go_lib
  - libs/plugin/sdk-go/**
sdk_ts_lib: &sdk_ts_lib
  - libs/plugin/sdk-ts/**
ui_lib: &ui_lib
  - libs/ui/components/**
shell_lib: &shell_lib
  - libs/ui/workbench/**
client_lib: &client_lib
  - libs/core/client/**
host_lib: &host_lib
  - libs/plugin/loader/**
  - libs/plugin/manager/**

# What every Go module of the window and the phone builds on.
go_base: &go_base
  - *ci_router
  - *go_workspace
  - *go_rules
  - *protocol_lib
  - *atomicfile_lib
  - *notes_lib
  - *core_lib
  - .github/workflows/go.yml

# What every plugin builds on: a change here lints, builds and tests all of them.
plugins_all: &plugins_all
  - *ci_router
  - *go_workspace
  - *node_lock
  - *ts_config
  - *go_rules
  - *protocol_lib
  - *atomicfile_lib
  - *notes_lib
  - *sdk_go_lib
  - *sdk_ts_lib
  - *ui_lib
  - .github/actions/build-ui/**
  - .github/workflows/plugins.yml
  - plugins/*
  - plugins/.example/**
  - '!**/*.md'

# ---------------------------------------------------------------- Go

core:
  - *go_base
  - *node_lock
  - tests/vault/**
  - plugins/*/manifest.json
  - tools/build-plugin-index/**
  - tools/checks/structure/go/**
  - '!**/*.md'
protocol:
  - *ci_router
  - *go_workspace
  - *node_lock
  - *protocol_lib
  - .github/workflows/go.yml
  - '!**/*.md'
sdk_go:
  - *ci_router
  - *go_workspace
  - *go_rules
  - *protocol_lib
  - *atomicfile_lib
  - *notes_lib
  - *sdk_go_lib
  - .github/workflows/go.yml
  - '!**/*.md'
desktop:
  - *go_base
  - .github/actions/setup-webkit/**
  - .github/actions/cache-apt/**
  - .github/scripts/apt-retry.sh
  - apps/desktop/**
  - tests/e2e/cli/**
  - '!apps/desktop/editor/**'
  - '!apps/desktop/flashcards/**'
  - '!**/*.md'
mobile:
  - *go_base
  - apps/mobile/bind/**
  - apps/mobile/*.go
  - apps/mobile/go.mod
  - apps/mobile/go.sum
  - '!**/*.md'

# ---------------------------------------------------------------- Frontend

ui:
  - *ci_router
  - *node_lock
  - *ts_config
  - *ui_lib
  - .github/actions/build-ui/**
  - .github/actions/setup-playwright/**
  - .github/actions/cache-apt/**
  - .github/scripts/apt-retry.sh
  - .github/workflows/frontend.yml
  - '!**/*.md'
desktop_fe:
  - *ci_router
  - *node_lock
  - *ts_config
  - *protocol_lib
  - *sdk_ts_lib
  - *ui_lib
  - *shell_lib
  - *client_lib
  - *host_lib
  - .github/actions/build-ui/**
  - .github/actions/setup-playwright/**
  - .github/actions/cache-apt/**
  - .github/scripts/apt-retry.sh
  - .github/workflows/frontend.yml
  - apps/desktop/editor/**
  - apps/desktop/flashcards/**
  - tests/e2e/desktop/**
  - tools/ci-stories/**
  - '!**/*.md'
mobile_fe:
  - *ci_router
  - *node_lock
  - *ts_config
  - *protocol_lib
  - *ui_lib
  - *client_lib
  - .github/actions/build-ui/**
  - .github/workflows/frontend.yml
  - apps/mobile/**
  - '!apps/mobile/bind/**'
  - '!apps/mobile/*.go'
  - '!apps/mobile/go.mod'
  - '!apps/mobile/go.sum'
  - '!**/*.md'

# ---------------------------------------------------------------- Plugins

# A changed file under plugins/; ci.yml lists the plugin folders from these files.
plugin_files:
  - plugins/*/**
  - '!plugins/.example/**'
plugin_stories:
  - *ci_router
  - *node_lock
  - tsconfig.base.json
  - *protocol_lib
  - *sdk_ts_lib
  - *ui_lib
  - .github/actions/build-ui/**
  - .github/actions/setup-playwright/**
  - .github/actions/cache-apt/**
  - .github/scripts/apt-retry.sh
  - .github/workflows/plugins.yml
  - plugins/*/frontend/**
  - tools/ci-stories/**
  - '!**/*.md'
plugin_versions:
  - *ci_router
  - *node_lock
  - .github/workflows/plugins.yml
  - plugins/**
  - tools/plugin-versions/**
  - tools/build-plugin-index/**
  - tools/bundle-plugins/**

# ---------------------------------------------------------------- Manual

# The manual, and the sources it writes its pages from.
docs_sources: &docs_sources
  - apps/docs/**
  - apps/desktop/editor/src/**
  - apps/desktop/cmd/numen/**
  - libs/core/kernel/adapter/cli/**
  - libs/core/kernel/adapter/settings/**
  - libs/core/kernel/container/**
  - libs/core/kernel/usecase/completion/**
  - plugins/*/manifest.json
  - plugins/*/frontend/**
  - tools/ci-commands/**
docs:
  - *ci_router
  - *node_lock
  - *ts_config
  - *docs_sources
  - .github/actions/deploy-bunny/**
  - .github/workflows/docs.yml
# The story names the manual and the landing page hold, and the trees they are held against.
references:
  - *ci_router
  - *node_lock
  - *docs_sources
  - .github/workflows/checks.yml
  - libs/ui/components/src/**
  - libs/ui/workbench/src/**
  - apps/desktop/flashcards/src/**
  - plugins/themes-presets/themes/**
  - tools/ci-stories/**
  - apps/landing/tools/**

# ---------------------------------------------------------------- Repository

code:
  - *ci_router
  - *go_workspace
  - *node_lock
  - *ts_config
  - .github/workflows/checks.yml
  - apps/**
  - libs/**
  - plugins/**
  - tools/**
  - tests/**
  - knip.json
  - '!apps/landing/**'
  - '!**/*.md'
# The narrative scan reads code and Markdown.
narrative:
  - *ci_router
  - .github/workflows/checks.yml
  - apps/**
  - libs/**
  - plugins/**
  - tools/**
  - tests/**
  - knip.json
  - '**/*.md'
  - '**/*.mdx'
  - '!apps/landing/**'
go:
  - *ci_router
  - *go_workspace
  - .github/workflows/codeql.yml
  - '**/*.go'
  - '**/go.mod'
  - '**/go.sum'
js:
  - *ci_router
  - *node_lock
  - *ts_config
  - .github/workflows/codeql.yml
  - '**/*.{ts,tsx,js,jsx,mjs,cjs,vue}'
  - '**/*.{html,htm}'
workflows:
  - *ci_router
  - *node_lock
  - .github/**
gradle:
  - *ci_router
  - .github/workflows/checks.yml
  - '**/gradle/wrapper/**'
  - '**/gradlew'
  - '**/gradlew.bat'
staging:
  - *ci_router
  - .github/workflows/checks.yml
  - plugins/**
  - .github/scripts/stage-plugins.sh
  - .github/scripts/check-staged-plugins*.sh
mutation_tool:
  - *ci_router
  - .github/workflows/checks.yml
  - tools/ci-mutation/**
  - .github/workflows/mutation.yml

# Every changed file, for the end-to-end selection.
files:
  - '**'
