version: 2

# Every module the product ships, and the two that gate it. Each manifest is
# its own project — there is no module at the repository root — so
# each directory, or a pattern for a family of them, is written out.
#
# Grouped, because a dependency raised one pull request at a time is a
# dependency nobody reads. What arrives is one branch per ecosystem per month,
# with the majors kept apart: a major is a change to think about, and it should
# not travel with fourteen patches.

updates:
  # The Go modules: the core, the applications that carry it, the schema's
  # generated Go, the plugin SDK with each of its feature modules, the plugins,
  # and the tools the release is built with. A module that replaces another
  # local module is listed beside it, so one group bump moves them together.
  - package-ecosystem: gomod
    directories:
      - /libs/core/kernel
      - /libs/core/protocol
      - /libs/plugin/sdk-go
      - /libs/plugin/sdk-go/wasm
      - /libs/plugin/sdk-go/models
      - /apps/desktop
      - /apps/mobile
      - /apps/desktop/build/tools
      - /plugins/agents-acp
      - /plugins/agents-antigravity
      - /plugins/agents-claude
      - /plugins/agents-codex
      - /plugins/agents-mcp-server
      - /plugins/agents-numen
      - /plugins/agents-tools-vault
      - /plugins/agents-tools-window
      - /plugins/connections-llm
      - /plugins/engines-embeddings
      - /plugins/engines-ocr
      - /plugins/engines-transcription
      - /plugins/readers-epub
      - /plugins/readers-pdf
      - /plugins/tools-index-stats
      - /plugins/tools-media-importer
      - /plugins/tools-proofreading
      - /plugins/tools-search-relevance
      - /plugins/tools-templates
      - /plugins/tools-updater
      - /plugins/views-flashcards-studio
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build(deps)"
    groups:
      go:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      go-major:
        patterns: ["*"]
        update-types: ["major"]
    # go-huggingface 0.4.4 and later require Go 1.27. go-ocr calls the
    # EnableCUDA of onnxruntime_purego 1.25, and the OCR plugin builds both.
    ignore:
      - dependency-name: github.com/gomlx/go-huggingface
        versions: [">= 0.4.4"]
      - dependency-name: github.com/getcharzp/onnxruntime_purego
        versions: [">= 1.26.0"]

  # The interface, sites and tools packages managed by npm workspaces at the repository root.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      npm-major:
        patterns: ["*"]
        update-types: ["major"]
    # TypeScript 7 has no JavaScript API, and vue-tsc and @vue/compiler-sfc
    # call that API.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  # The Android project of the mobile app.
  - package-ecosystem: gradle
    directory: /apps/mobile/android
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build(deps)"
    groups:
      gradle:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      gradle-major:
        patterns: ["*"]
        update-types: ["major"]
    # Android Gradle Plugin 8.13 runs on Gradle 8 only; the wrapper stays on 8.x
    # until the plugin moves to 9.
    ignore:
      - dependency-name: gradle-wrapper
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
