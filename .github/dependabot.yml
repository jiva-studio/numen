version: 2

# Every module the product ships, and the two that gate it. Each manifest is
# its own project — there is no module at the repository root — so
# the list has to be written out; nothing here discovers a directory it was not
# told about.
#
# Grouped, because a dependency raised one pull request at a time is a
# dependency nobody reads. What arrives is one branch per ecosystem per month,
# with the majors kept apart: a major is a change to think about, and it should
# not travel with fourteen patches.

updates:
  # The Go modules: the core, the two applications that carry it, and the
  # schema's generated Go.
  - package-ecosystem: gomod
    directories:
      - /modules/libs/core
      - /modules/libs/protocol
      - /modules/apps/desktop
      - /modules/apps/mobile
    schedule:
      interval: monthly
    commit-message:
      prefix: "build(deps)"
    groups:
      go:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      go-major:
        patterns: ["*"]
        update-types: ["major"]

  # The interface, sites and tools packages managed by npm workspaces at /modules
  - package-ecosystem: npm
    directory: /modules
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      npm-major:
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
