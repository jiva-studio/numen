version: 2

# Every module the product ships, and the two that gate it. Each manifest is
# its own project — there is no module at the repository root — so
# each directory, or a pattern for a family of them, is written out.
#
# Grouped, because a dependency raised one pull request at a time is a
# dependency nobody reads. What arrives is one branch per ecosystem per month,
# with the majors kept apart: a major is a change to think about, and it should
# not travel with fourteen patches.

updates:
  # The Go modules: the core, the applications that carry it, the schema's
  # generated Go, the plugin SDK with each of its feature modules, the plugins,
  # and the tools the release is built with. A module that replaces another
  # local module is listed beside it, so one group bump moves them together.
  - package-ecosystem: gomod
    directories:
      - /modules/libs/core
      - /modules/libs/protocol
      - /modules/libs/plugin-sdk-go
      - /modules/libs/plugin-sdk-go/agent
      - /modules/libs/plugin-sdk-go/models
      - /modules/libs/plugin-sdk-go/onnx
      - /modules/libs/plugin-sdk-go/vault
      - /modules/apps/desktop
      - /modules/apps/desktop-monolith
      - /modules/apps/mobile
      - /modules/apps/desktop/build/tools
      - /modules/plugins/*
    schedule:
      interval: monthly
    commit-message:
      prefix: "build(deps)"
    groups:
      go:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      go-major:
        patterns: ["*"]
        update-types: ["major"]

  # The interface, sites and tools packages managed by npm workspaces at /modules
  - package-ecosystem: npm
    directory: /modules
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      npm-major:
        patterns: ["*"]
        update-types: ["major"]
    # TypeScript 7 has no JavaScript API, and vue-tsc and @vue/compiler-sfc
    # call that API.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
