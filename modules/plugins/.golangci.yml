    rules:
      - text: "SA1019.*h2c"
        linters: [staticcheck]
      - source: ^\s*(defer )?.*\.Close\(\)$
        linters: [errcheck]
      - source: ^\s*os\.Stdout\.Sync\(\)$
        linters: [errcheck]
      - path: _test\.go$
        text: "QF1001"
        linters: [staticcheck]
