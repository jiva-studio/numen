version: "2"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  default: none
  enable:
    - errcheck
    - nilerr
    - bodyclose
    - contextcheck
    - staticcheck
    - unused
    - depguard
    - cyclop
    - gocognit
    - nestif
    - funlen

  settings:
    cyclop:
      max-complexity: 15

    gocognit:
      min-complexity: 15

    nestif:
      min-complexity: 4

    funlen:
      lines: 80
      statements: 50

    depguard:
      rules:
        agents_acp:
          list-mode: lax
          files:
            - "**/modules/plugins/agents-acp/**"
