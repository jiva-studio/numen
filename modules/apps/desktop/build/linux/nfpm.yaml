# What a Debian or Redhat machine is handed. The packaging workflow gathers the
# binary and this file's neighbours into one directory and packages from there.
name: numen
arch: amd64
platform: linux
version: ${VERSION}
section: utils
maintainer: Jiva Studio <contact@akdasa.studio>
description: |
  A knowledge tool: markdown notes linked into a graph, a typed hierarchy with
  several parents, spaced repetition, and a source layer over PDF and audio.
homepage: https://github.com/jiva-studio/numen
license: Proprietary

contents:
  - src: ./numen
    dst: /usr/bin/numen
  - src: ./numen.desktop
    dst: /usr/share/applications/numen.desktop
  # The two windows ship together, one version, one package: flashcards with no
  # editor has nothing to run. They wear one icon, because they are one
  # application to the person using them.
  - src: ./numen-flashcards
    dst: /usr/bin/numen-flashcards
  - src: ./numen-flashcards.desktop
    dst: /usr/share/applications/numen-flashcards.desktop
  # The drawing itself, which a desktop scales to whatever it needs, and the
  # rasters for the ones that will not scale it.
  - src: ./numen.svg
    dst: /usr/share/icons/hicolor/scalable/apps/numen.svg
  - src: ./icons/16.png
    dst: /usr/share/icons/hicolor/16x16/apps/numen.png
  - src: ./icons/24.png
    dst: /usr/share/icons/hicolor/24x24/apps/numen.png
  - src: ./icons/32.png
    dst: /usr/share/icons/hicolor/32x32/apps/numen.png
  - src: ./icons/48.png
    dst: /usr/share/icons/hicolor/48x48/apps/numen.png
  - src: ./icons/64.png
    dst: /usr/share/icons/hicolor/64x64/apps/numen.png
  - src: ./icons/128.png
    dst: /usr/share/icons/hicolor/128x128/apps/numen.png
  - src: ./icons/256.png
    dst: /usr/share/icons/hicolor/256x256/apps/numen.png
  - src: ./icons/512.png
    dst: /usr/share/icons/hicolor/512x512/apps/numen.png

# The window draws through the system's own browser, and the machine has to
# carry it.
overrides:
  deb:
    depends:
      - libgtk-4-1
      - libwebkitgtk-6.0-4
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0
