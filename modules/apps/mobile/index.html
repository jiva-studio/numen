<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- What this page may load: what the application carries, and the core on
         the loopback. The platform serves the page from the package and sets no
         header, so the policy is written here; `frame-ancestors` is not, being
         one of the directives a page may not give itself. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self' http://127.0.0.1:*; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>numen</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
