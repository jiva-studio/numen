syntax = "proto3";

package numen.v1;

option go_package = "github.com/jiva-studio/numen/modules/libs/protocol/gen/numen/v1;numenv1";

// PluginToolService is what a plugin that declares the tools capability serves
// so that an agent can work through it. The host lists the tools of every
// running plugin that declares it and offers them on the agent servers it
// builds; a call an agent makes is handed to the plugin that listed the tool.
// The host holds a tool to the permission its effect needs, so a plugin that
// lacks it is offered nowhere.
service PluginToolService {
  // ListTools lists the tools the plugin offers. A tool is named by the plugin
  // alone; a name another plugin or the host already serves is not offered.
  rpc ListTools(ListToolsRequest) returns (ListToolsResponse);

  // CallTool runs one tool the plugin listed.
  rpc CallTool(CallToolRequest) returns (CallToolResponse);
}

message ListToolsRequest {}

message ListToolsResponse {
  repeated PluginTool tools = 1;
}

// PluginTool is one tool as an agent is told of it.
message PluginTool {
  // The name an agent calls the tool by.
  string name = 1;

  // What a person reads the tool as.
  string title = 2;

  // What the tool is for and when an agent reaches for it.
  string description = 3;

  // The JSON schema of the arguments, as a JSON object.
  bytes input_schema = 4;

  // The JSON schema of the structured result, as a JSON object. Empty where the
  // tool answers with text alone.
  bytes output_schema = 5;

  // What the tool does to the vault. It decides the permission the plugin must
  // hold and whether the tool is offered where nothing may be changed.
  ToolEffect effect = 6;

  // The agent servers the tool is offered on. None is the full server alone.
  repeated ToolServer servers = 7;

  ToolStep step = 8;
}

// ToolEffect is what a tool does to the vault. The zero value means no effect
// was named, and a tool of it is not offered.
enum ToolEffect {
  TOOL_EFFECT_UNSPECIFIED = 0;

  // The tool reads and changes nothing. The plugin needs vault:read.
  TOOL_EFFECT_READS = 1;

  // The tool changes the vault. The plugin needs vault:write.
  TOOL_EFFECT_WRITES = 2;
}

// ToolStep is how a call is shown to a person: as what it does. The zero value
// leaves it to the tool's effect, a look for a tool that reads and an edit for
// one that writes.
enum ToolStep {
  TOOL_STEP_UNSPECIFIED = 0;

  // The call looks for notes.
  TOOL_STEP_SEARCH = 1;

  // The call takes something out of the vault.
  TOOL_STEP_REMOVE = 2;

  // The call files something elsewhere or under another name.
  TOOL_STEP_MOVE = 3;
}

// ToolServer is one of the servers the host builds for an agent. The zero value
// means none was named.
enum ToolServer {
  TOOL_SERVER_UNSPECIFIED = 0;

  // The server an agent works the whole vault through.
  TOOL_SERVER_FULL = 1;

  // The server an agent answers from, whose every tool reads.
  TOOL_SERVER_READING = 2;

  // The server of the window a person reviews cards in.
  TOOL_SERVER_REVIEW = 3;
}

message CallToolRequest {
  // The name the plugin listed the tool under.
  string name = 1;

  // The arguments, as a JSON object that meets the tool's input schema.
  bytes arguments = 2;

  // What the person is looking at in the window the agent was started from, as
  // that window names it: focus, mark and face for the window cards are reviewed
  // in. It is data about the call and no part of the arguments, and it is empty
  // for a call made from a window that shows the person nothing in particular.
  map<string, string> context = 3;
}

message CallToolResponse {
  // Set when the call could not be served: the tool is not one the plugin
  // lists, or its arguments are not a JSON object. The result is then unset.
  ToolErrorCode error = 1;

  // What the tool answered, for an agent to read.
  ToolResult result = 2;
}

// ToolResult is what a tool answered.
message ToolResult {
  // The words an agent reads.
  string text = 1;

  // The structured result as JSON, meeting the output schema. Empty where the
  // tool listed none.
  bytes structured = 2;

  // True where the tool ran and refused, and text says why.
  bool is_refusal = 3;
}

// ToolErrorCode is why a call was served and not run.
enum ToolErrorCode {
  TOOL_ERROR_CODE_UNSPECIFIED = 0;

  // The plugin lists no tool of that name.
  TOOL_ERROR_CODE_UNKNOWN_TOOL = 1;

  // The arguments are not a JSON object.
  TOOL_ERROR_CODE_BAD_ARGUMENTS = 2;
}
