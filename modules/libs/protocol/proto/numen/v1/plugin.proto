syntax = "proto3";

package numen.v1;

option go_package = "github.com/jiva-studio/numen/modules/libs/protocol/gen/numen/v1;numenv1";

// PluginLifecycleService handles lifecycle, ping, and graceful shutdown for all plugins.
service PluginLifecycleService {
  rpc Ping(PingRequest) returns (PingResponse);
  rpc Shutdown(ShutdownRequest) returns (ShutdownResponse);
  rpc Configure(ConfigureRequest) returns (ConfigureResponse);
}

message PingRequest {}

message PingResponse {
  string status = 1;
  // The plugin protocol version the plugin speaks. Zero means the plugin did not report one.
  int32 protocol = 2;
}

message ShutdownRequest {
  int32 timeout_seconds = 1;
}

message ShutdownResponse {
  bool success = 1;
}

message ConfigureRequest {
  string plugin_id = 1;
  string configuration_json = 2;
  map<string, string> values = 3;
}

message ConfigureResponse {
  bool success = 1;
  string error = 2;
}

// PluginSetting declares one setting in the plugin's declarative settings schema.
message PluginSetting {
  string key = 1;
  string type = 2;
  string title = 3;
  string description = 4;
  string default_json = 5;
  bool palette = 6;
  repeated string options = 7;
  optional double min = 8;
  optional double max = 9;
  optional double step = 10;
}

// PluginInfo describes a discovered plugin and its declarative settings.
message PluginInfo {
  string id = 1;
  string name = 2;
  string version = 3;
  string description = 4;
  repeated string capabilities = 5;
  repeated PluginSetting settings = 6;
  bool is_active = 7;
  // The permissions the manifest declares.
  repeated string permissions = 8;
  // The names of the secrets the manifest declares.
  repeated string secrets = 9;
  // The names of the secrets that have a key stored. A key never travels here.
  repeated string stored_secrets = 10;
  // The models the plugin answers completions with, as its
  // CompletionService.ListCompletionModels lists them. Empty where it lists none.
  repeated PluginModel models = 11;
  // Whether the person lets the plugin ask for model completions.
  CompletionConsent completion_consent = 12;
}

// PluginModel is one model a plugin that answers completions offers.
message PluginModel {
  // What a setting names the model by.
  string name = 1;
  // What the model is called when shown to a person.
  string title = 2;
  // Set on the model the plugin answers with when it is named none.
  bool is_default = 3;
}

// CompletionConsent is whether the person lets a plugin ask for model
// completions. The zero value is a plugin that does not hold the ai:complete
// permission.
enum CompletionConsent {
  COMPLETION_CONSENT_UNSPECIFIED = 0;

  // The person has not answered, and the plugin has not asked since the host
  // started.
  COMPLETION_CONSENT_UNANSWERED = 1;

  // The plugin has asked since the host started, was refused for it, and the
  // person has not answered.
  COMPLETION_CONSENT_ASKED = 2;

  // The person lets the plugin ask.
  COMPLETION_CONSENT_ALLOWED = 3;

  // The person refused it.
  COMPLETION_CONSENT_REFUSED = 4;
}

// PluginService allows querying discovered plugins and their settings schemas.
service PluginService {
  rpc GetPlugins(GetPluginsRequest) returns (GetPluginsResponse);
}

message GetPluginsRequest {}

message GetPluginsResponse {
  repeated PluginInfo plugins = 1;
}

// PluginEventService hands a running plugin an event its manifest's activationEvents subscribe to.
// A plugin serves it only when it takes events. A plugin that takes the event and refuses it answers
// with error set; a status code means the call was not served or failed.
service PluginEventService {
  rpc DeliverEvent(DeliverEventRequest) returns (DeliverEventResponse);
}

message DeliverEventRequest {
  // The event as the host names it, such as onFile:pdf or onCommand:proofread.
  string event = 1;
}

message DeliverEventResponse {
  // Set when the plugin took the event and refused it.
  PluginEventErrorCode error = 1;
  // The plugin's words for the refusal. Empty when error is unset.
  string reason = 2;
}

// PluginEventErrorCode is why a plugin that took an event refused it. The zero
// value means it did not.
enum PluginEventErrorCode {
  PLUGIN_EVENT_ERROR_CODE_UNSPECIFIED = 0;

  // The plugin's event handler answered an error, which reason carries.
  PLUGIN_EVENT_ERROR_CODE_REFUSED = 1;
}
