syntax = "proto3";

// What a client running a person's cards may ask.
//
// Flashcards is an application of its own, beside the editor and over the same
// core, so this service stands beside the editor's and shares nothing with it.
// It reaches every vault the installation knows, because what a person owes
// today is owed across all of them.
//
// A card is laid out here, unlike the cards service, which hands a face over as
// it was written: what a person is shown is the face filled with one card's
// values, and nothing above this has the two halves to fill it with.
package numen.v1;

import "numen/v1/presets.proto";
import "numen/v1/vault.proto";

option go_package = "github.com/jiva-studio/numen/modules/libs/protocol/gen/numen/v1;numenv1";

// FlashcardsService is the front door, a session, and the answers given in it.
service FlashcardsService {
  // Owing is what every vault the installation knows comes to today: how much
  // it holds, how much is due, and how much has never been asked. It is what
  // the application opens on.
  //
  // The first message is every vault as the registry holds it, with nothing
  // counted, and one message follows for each vault as it is worked out.
  // Counting a vault reads every deck in it and replays its whole answer log,
  // so the list stands while that runs.
  //
  // A vault the index does not carry yet arrives with nothing counted and says
  // so: the list of its decks is the index's answer, and this application
  // builds none.
  rpc Owing(OwingRequest) returns (stream OwingResponse);

  // Start opens a run and hands over what to ask, in order. A run writes one
  // file of its own in the vault and nothing else ever appends to it.
  //
  // Naming a deck asks that deck alone. Naming a preset asks the cards of every
  // deck pointing at it, held to that preset's own budget. Naming neither asks
  // the whole vault, which is the ordinary way to sit down to this.
  //
  // Naming both is refused. A preset with nothing to ask today is refused with
  // the reason, so a person pressing it is told why and not shown an empty
  // sitting.
  rpc Start(StartRequest) returns (StartResponse);

  // Answer writes down how a card came back. What comes back is the identifier
  // of the line, which is what taking that answer back names.
  rpc Answer(AnswerRequest) returns (AnswerResponse);

  // TakeBack writes down that an answer was taken back. Both lines stay in the
  // file: nothing in a log is ever rewritten or removed.
  rpc TakeBack(TakeBackRequest) returns (TakeBackResponse);

  // Moving says a vault moved underneath the window, for as long as the caller
  // listens. Which files moved is not carried: what this application shows is
  // counts, and they are asked for again whatever changed.
  rpc Moving(MovingRequest) returns (stream MovingResponse);

  // Reviewed is how much of a vault was answered on each day it was reviewed,
  // and how many days up to now were reviewed without a gap.
  rpc Reviewed(ReviewedRequest) returns (ReviewedResponse);

  // Asking is whether a card can be asked about here at all. The way in stands
  // on every card, so nothing else has to be said about which.
  rpc Asking(AskingRequest) returns (AskingResponse);

  // Around is what the deck a person is sitting to is joined to: the notes it
  // points at and the notes that point at it, with the text of each. A card is
  // a line out of something longer, and what it was cut from is what a person
  // reaches for when it will not come back to them.
  rpc Around(AroundRequest) returns (AroundResponse);

  // Scheduling is the preset a deck of the named vault is scheduled by. A deck
  // naming none is answered with the defaults under no path, and a deck whose
  // link reaches something that is not a preset is answered with the defaults
  // and told so.
  rpc Scheduling(FlashcardsServiceSchedulingRequest) returns (FlashcardsServiceSchedulingResponse);

  // Curve is what the settings come to over the whole range of the goal they
  // name. Nothing is written: a curve is asked for the value a person is
  // moving and has not settled.
  rpc Curve(FlashcardsServiceCurveRequest) returns (FlashcardsServiceCurveResponse);
}

// Rating is how well a card came back. A person says which of the four, and
// nothing decides it for them.
enum Rating {
  RATING_UNSPECIFIED = 0;
  // RATING_AGAIN is a card that did not come back at all.
  RATING_AGAIN = 1;
  // RATING_HARD is a card that came back, slowly and with effort.
  RATING_HARD = 2;
  // RATING_GOOD is a card that came back.
  RATING_GOOD = 3;
  // RATING_EASY is a card that came back with none.
  RATING_EASY = 4;
}

// VaultOwing is one vault, and what its cards come to today.
message VaultOwing {
  string vault_id = 1;
  string name = 2;
  string path = 3;

  // Faces is every card the vault holds, counted once for each face it is shown
  // through. Due is what was answered before and is owed today; New is what
  // nobody has answered.
  int32 faces = 4;
  int32 due = 5;
  int32 new = 6;

  // Decks is the same three numbers for each deck, by the path of its file.
  repeated DeckOwing decks = 7;

  // Presets is what the day comes to under each preset the vault's decks are
  // scheduled by.
  repeated PresetOwing presets = 9;

  // Set when the vault could not be counted: it has never been read by the
  // editor, or its files could not be reached. The three numbers are then zero
  // and this says why, in the person's own words.
  string unread = 8;
}

message DeckOwing {
  string deck = 1;
  int32 faces = 2;
  int32 due = 3;
  int32 new = 4;

  // How many of this deck's cards were answered since the day opened, counted
  // the way its preset counts. A deck holding nothing more today and answered
  // nothing today was not studied.
  int32 answered = 5;

  // How many of the deck's card faces stand learned now, under the rule the
  // preset scheduling the deck counts by. It is a share of faces, and it is
  // not what a preset has got through of its day.
  int32 learned = 6;
}

// PresetOwing is one preset of a vault, and what the day comes to under it.
message PresetOwing {
  // The note the settings were read from, and empty for the decks naming no
  // preset.
  string preset = 1;

  // What the preset is called. Empty where nothing names the note.
  string title = 7;

  // How many decks point at it. Nothing points at a preset of no decks, and
  // the day stands at nothing under it.
  int32 decks = 8;

  // How many card faces stand in those decks. A deck holding none points at
  // its preset all the same, so a preset of decks and no cards is its own
  // state.
  int32 cards = 9;

  // What the day leaves under it: the card faces owed and the ones nobody has
  // answered, held to its budget. Their sum is what a sitting over this preset
  // asks, because a preset is the whole scope of its own budget, so it is the
  // figure to print against it rather than one worked out from the budget.
  int32 owed_due = 10;
  int32 owed_new = 11;

  // How many of its cards were answered since the day opened, and how long
  // those answers took. The two beside the total divide it the way a budget
  // does, so each is weighed against the budget of its own kind.
  int32 answered = 2;
  int64 took_ms = 3;
  int32 answered_new = 17;
  int32 answered_reviews = 18;

  // What the preset keeps for this day of the week: how many cards of each
  // kind, and how long the day runs, at the share of the load that day of the
  // week carries.
  //
  // A budget the preset's goal does not name stands here as the person left it
  // and closes nothing. `owed_due` and `owed_new` are already held to the ones
  // that do, so holding them to these again is capping a number twice.
  int32 new = 4;
  int32 reviews = 5;
  double minutes = 6;

  // Which of the three closes the day, each written as the preset writes the
  // key — minutes_a_day, new_a_day, reviews_a_day, by_date — and empty where
  // that budget takes no part.
  string closes_new = 12;
  string closes_reviews = 13;
  string closes_minutes = 14;
  string closes_backlog = 15;

  // Why the preset schedules nothing on this day: whatever stops it at all, and
  // a day of the week carrying none of the load. It is the core's own verdict,
  // so a window says of a preset what the sitting hands its cards out by.
  Stopped stops_on = 16;
}

// Ahead is how long each of the four answers would leave this card, in seconds
// from the moment it was asked. A person choosing between them is choosing
// between these.
message Ahead {
  int64 again = 1;
  int64 hard = 2;
  int64 good = 3;
  int64 easy = 4;
}

// Asked is one card face as it is put to a person.
message Asked {
  // Deck is the path of the file the card stands in, and section the name of
  // the section it stands under. A card standing before the first section
  // carries none.
  string deck = 1;
  string section = 2;

  // Card is the mark the card is known by, and face the name of the face it is
  // shown through. The two together are what an answer is recorded against.
  string card = 3;
  string face = 4;

  // Heading is what the card's heading shows, which is the first line of its
  // first field.
  string heading = 5;

  // Front and back are the face laid out with this card's values, as HTML.
  string front = 6;
  string back = 7;

  // Seen is false for a card nobody has answered, which is what a person means
  // by a new card. Due is when it comes round, and stands only where it has
  // been answered.
  bool seen = 8;
  string due = 9;

  // Where each of the four would leave it.
  Ahead ahead = 10;
}

message OwingRequest {}

message OwingResponse {
  // Vaults is every vault the installation holds, by name and by where it is,
  // with nothing counted. It stands in the first message and in no other, and
  // it is what the list is drawn from.
  repeated VaultOwing vaults = 1;

  // Day is the review day these counts stand in, written as the year, the month
  // and the day. A day of review begins at the hour the settings name, so an
  // hour past midnight is still the day before. It stands in the first message
  // beside the vaults.
  string day = 2;

  // Counted is one vault worked out, and stands in every message after the
  // first. Until one arrives for a vault, nothing is known about what that
  // vault owes.
  VaultOwing counted = 3;
}

message StartRequest {
  string vault_id = 1;
  // Deck is the path of one deck, or empty for every deck the vault holds.
  string deck = 2;

  // Preset is the note one preset stands in, and the empty path is the preset
  // that schedules the decks naming none. Set it to sit to the cards of every
  // deck pointing at that preset, held to its budget. Naming a deck and a
  // preset at once is refused.
  optional string preset = 3;
}

message StartResponse {
  // Run is what an answer given in this sitting is written to, and it is what
  // an Answer names.
  string run = 1;
  repeated Asked asked = 2;

  // Unwritten are the decks holding a card with no mark that could not be given
  // one. Their cards are not in this sitting and are asked for at the next.
  repeated string unwritten = 3;

  // Skipped is how many lines of the vault's answers could not be read: a run
  // that stopped partway, or a line of a version this build does not know.
  int32 skipped = 4;
}

message AnswerRequest {
  string vault_id = 1;
  string run = 2;
  string card = 3;
  string face = 4;
  Rating rating = 5;
  // Took is how long the card stood on the screen, in milliseconds. It is the
  // one thing about an answer that cannot be measured later.
  int64 took_ms = 6;
}

message AnswerResponse {
  // Answer is the identifier of the line written, which is what taking it back
  // names.
  string answer = 1;
}

message TakeBackRequest {
  string vault_id = 1;
  string run = 2;
  // Answer is the identifier a previous Answer came back with.
  string answer = 3;
}

message TakeBackResponse {}

message ReviewedRequest {
  string vault_id = 1;
}

message ReviewedResponse {
  // Days is what each day a person answered on came to. A day nobody answered
  // on is not in it.
  repeated Reviewing days = 1;

  // Due is how many card faces fall on each day still to come. A card owed
  // today, or owed and late, is not in it: what a person owes now is what the
  // front door counts, and this is what is after it.
  repeated Reviewing due = 4;

  // Streak is how many days up to now were reviewed without a gap. A day
  // nobody has answered on yet does not end one.
  int32 streak = 2;

  // Answered is how many answers the vault holds altogether.
  int32 answered = 3;
}

// Reviewing is one day, and what was answered on it.
message Reviewing {
  // Day is the day it began on, as the year, the month and the day: an answer
  // given in the small hours belongs to the day before, and is named for it.
  string day = 1;
  int32 answered = 2;

  // How each of the four was said, for a day that is behind. A day of fifty
  // cards a person could not recall is a different day from fifty they could,
  // and the two are the same number without these.
  int32 again = 3;
  int32 hard = 4;
  int32 good = 5;
  int32 easy = 6;

  // How much of what came round in days came back: `asked` is the answers
  // given to card faces the scheduler sends days away, `recalled` the ones
  // among them that were not Again. A card face still coming round in minutes
  // is in neither — what is asked of one is whether it comes back after ten
  // minutes, which says nothing about memory.
  int32 asked = 7;
  int32 recalled = 8;
}

message AskingRequest {}

message AskingResponse {
  // Set when no agent can be reached, and then nothing can be asked here. It
  // says why, in the person's own words.
  string unreachable = 1;
}

message AroundRequest {
  string vault_id = 1;
  // Deck is the path of the deck being sat to. One deck is asked about at a
  // time, because what a person is reading around is the deck in front of them.
  string deck = 2;
}

message AroundResponse {
  repeated Neighbour notes = 1;

  // Unread is how many at the end of the list came without their text. Reading
  // stops once a sitting's worth has been gathered, so a deck at the centre of
  // a vault is still answered promptly and says how much it left.
  int32 unread = 2;
}

// Neighbour is one note the deck stands next to.
message Neighbour {
  // Written is the address as the deck wrote it, and all a link resolving to
  // nothing ever has. It is empty for a note that points at the deck, which
  // wrote the deck's name and not its own. Path is where the link landed, and
  // is empty where it landed nowhere.
  string written = 1;
  string path = 2;

  // Title is what the note is called and body its prose, as it was written.
  // Both are empty for a link that reached no note, and for one whose note
  // could not be read.
  string title = 3;
  string body = 4;

  // Label is what the link was shown as, where the person gave it words of
  // their own instead of the note's name.
  string label = 5;

  // Points says the deck points at this note; otherwise this note points at the
  // deck. A person reads the two differently: one is what the deck was made
  // from, the other is what has since been hung off it.
  bool points = 6;

  // Ambiguous says more than one note answers to the name written, and the one
  // here is only the first of them.
  bool ambiguous = 7;

  // Set when the note is there and its text could not be had, and says why.
  optional Refusal refusal = 8;
}

message MovingRequest {}

message MovingResponse {
  // Reload says the vaults are to be counted again. It is false in the first
  // message, which says the window is listening and nothing has moved yet.
  bool reload = 1;
}

// The presets a window over many vaults asks about. Each request names the
// vault it is about, the same way an answer names the vault it is written to.
// The settings themselves, the curve and the refusals are presets.proto, which
// the editor asks over the one vault its window shows.

message FlashcardsServiceSchedulingRequest {
  string vault_id = 1;

  // The deck whose preset this is, by the path it is filed under.
  string deck = 2;
}

message FlashcardsServiceSchedulingResponse {
  // Absent when the preset was refused.
  optional Preset preset = 1;

  // Set when the preset was not read, and why.
  optional Refusal refusal = 2;
}

message FlashcardsServiceCurveRequest {
  string vault_id = 1;

  // The note the preset stands in, which names the decks it schedules. Empty
  // is the preset that schedules the decks naming none.
  string path = 2;

  // The settings a curve is wanted for. They need not be what the file holds.
  Settings settings = 3;
}

message FlashcardsServiceCurveResponse {
  Curve curve = 1;
}
