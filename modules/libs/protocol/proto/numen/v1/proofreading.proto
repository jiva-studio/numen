syntax = "proto3";

package numen.v1;

option go_package = "github.com/jiva-studio/numen/modules/libs/protocol/gen/numen/v1;numenv1";

// ProofreadingService puts numbered lines of text right with a model. The
// proofreader owns the prompts, the batches and the rules a reply must meet;
// the caller owns the lines and what is done with the corrections.
service ProofreadingService {
  // GetProofreaderInfo returns the name the proofreader goes under.
  rpc GetProofreaderInfo(GetProofreaderInfoRequest) returns (GetProofreaderInfoResponse);

  // ProofreadText proofreads numbered lines of one kind of text and returns the
  // corrections the proofreader stands behind. It fails with code unavailable
  // where nothing is routed to answer for the proofreading.
  rpc ProofreadText(ProofreadTextRequest) returns (ProofreadTextResponse);
}

message GetProofreaderInfoRequest {}

message GetProofreaderInfoResponse {
  string name = 1;
}

// ProofreadKind is what is being proofread. The proofreader chooses its own
// instructions, batching and reply rules from it.
enum ProofreadKind {
  // No kind is named. A request of this kind is refused.
  PROOFREAD_KIND_UNSPECIFIED = 0;
  // Text a machine read off the pages of a printed book.
  PROOFREAD_KIND_SCAN = 1;
  // Text a machine heard in a recording.
  PROOFREAD_KIND_SPEECH = 2;
}

// ProofreadLine is one numbered run of words.
message ProofreadLine {
  int32 number = 1;
  string text = 2;
}

// ProofreadGroup is lines answered for as a whole. A scan group is one page.
// A speech request carries the whole recording as its one group.
message ProofreadGroup {
  int32 number = 1;
  repeated ProofreadLine lines = 2;
}

// ProofreadScanOptions are the settings of a scan request.
message ProofreadScanOptions {
  // How far a one-line correction may stand from the line as read, as a share
  // of the longer of the two. Zero takes the proofreader's own limit.
  double max_edit_distance = 1;
}

// ProofreadSpeechOptions are the settings of a speech request. Speech
// corrections stand at any distance from the line as heard.
message ProofreadSpeechOptions {
  // The lines one model request holds.
  int32 size = 1;
  // The lines one model request shares with the one before it.
  int32 overlap = 2;
  // The proofreader answers the lines from this number on.
  int32 from_line = 3;
  // The most lines answered in one call. Zero answers every line from from_line.
  int32 line_limit = 4;
}

message ProofreadTextRequest {
  ProofreadKind kind = 1;
  repeated ProofreadGroup groups = 2;

  // The settings of the kind named. A request whose options are of the other
  // kind, or are absent, is refused.
  oneof options {
    ProofreadScanOptions scan = 3;
    ProofreadSpeechOptions speech = 4;
  }
}

// ProofreadCorrection puts line number right. A correction of several lines
// puts them together as one, and last is the final line of the run; otherwise
// last is zero or equal to number.
message ProofreadCorrection {
  int32 number = 1;
  int32 last = 2;
  string text = 3;
}

message ProofreadTextResponse {
  repeated ProofreadCorrection corrections = 1;

  // How many groups or batches the model answered with something that is no
  // correction.
  int32 uncorrected = 2;

  // Speech only: the line to continue from, and whether nothing is left after
  // the lines answered.
  int32 next_line = 3;
  bool is_done = 4;
}
