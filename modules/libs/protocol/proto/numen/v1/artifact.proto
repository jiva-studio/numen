syntax = "proto3";

// What a client may ask about the artifacts made from a vault's files.
//
// An artifact is what a model wrote about one file: the text read out of a
// scan, the words heard in a recording, and those words put right. The file
// itself is the person's and is never touched; an artifact stands beside it,
// under a name of the application's own.
package numen.v1;

option go_package = "github.com/jiva-studio/numen/modules/libs/protocol/gen/numen/v1;numenv1";

// ArtifactService answers what has been made from a file of the vault, makes
// one, and takes one away.
service ArtifactService {
  // ListArtifacts is every artifact a file can carry and what has become of
  // each. A file whose kind carries none is answered with none.
  //
  // It is asked before anything is offered over a file: whether a book has been
  // read is a question about the book, and the only other way to ask it is to
  // ask for the book to be read again and be refused.
  rpc ListArtifacts(ListArtifactsRequest) returns (ListArtifactsResponse);

  // CreateArtifact asks for one to be made, and answers at once with what
  // became of the ask. The work carries on behind the answer, and how far it
  // gets is in the list of what is being done.
  //
  // A file already carrying the artifact is left alone and answered with what
  // stands. A file a person named is never turned away for want of a turn: it
  // waits in line and is taken up before anything the vault set itself.
  rpc CreateArtifact(CreateArtifactRequest) returns (CreateArtifactResponse);

  // DeleteArtifact takes one away, with everything cut from it. The file stands
  // as it did before anything was made from it, and it is offered again.
  rpc DeleteArtifact(DeleteArtifactRequest) returns (DeleteArtifactResponse);
}

// An Artifact is one thing a model wrote about one file of the vault.
message Artifact {
  // Name is where it stands: the vault, the file it was made from, and the
  // name the store keeps it under.
  //
  //   vaults/{vault}/files/{path}/artifacts/asr.corrected
  //
  // It is answered and never asked with: a request names the file and the
  // artifact of it, and the vault is the one the window is showing.
  string name = 1;

  // State is what has become of it.
  State state = 2;

  // Error is what stopped it, and is set when it failed.
  string error = 3;

  // Size is how many bytes stand under that name. A file being written is
  // appended to as the work goes, so it keeps its name and grows: how long it
  // now is is what tells a caller that what it already read has moved on.
  int64 size = 4;
}

// State is what has become of one artifact.
enum State {
  STATE_UNSPECIFIED = 0;

  // Nothing has been made. The file carries this artifact and none of it
  // stands.
  STATE_NONE = 1;

  // A run over this file is waiting behind the one going now.
  STATE_QUEUED = 2;

  // A run is writing it now.
  STATE_RUNNING = 3;

  // A run wrote part of it and is not holding it: it stopped, and what it
  // reached is on disk. Asking again begins afresh.
  STATE_STOPPED = 4;

  // The whole of it stands.
  STATE_DONE = 5;

  // A run read the file and found nothing to write down — a recording holding
  // no speech. Asking again reads the same file and finds the same, so what it
  // found is kept and answered instead.
  STATE_EMPTY = 6;

  // A run could not read the file at all, and error says what it said about it.
  // Taking the artifact away is how a person asks for the file to be tried
  // afresh.
  STATE_FAILED = 7;
}

message ListArtifactsRequest {
  // The file of the vault, as the vault holds it.
  string path = 1;
}

message ListArtifactsResponse {
  // Every artifact this file can carry, whether or not any of it stands. A row
  // is how a client is told that nothing has been made, which is an answer and
  // not an absence.
  repeated Artifact artifacts = 1;
}

message CreateArtifactRequest {
  // The file of the vault, as the vault holds it.
  string path = 1;

  // Which artifact of it to make. It is the last part of the artifact's name:
  //
  //   ocr             the text read out of a scan
  //   asr             the words heard in a recording
  //   asr.corrected   those words put right
  //
  // Which model does the work follows from the file, and is not asked for
  // here.
  string artifact_id = 2;
}

message CreateArtifactResponse {
  Artifact artifact = 1;
}

message DeleteArtifactRequest {
  // The file of the vault, as the vault holds it.
  string path = 1;

  // Which artifact of it to take away. Only `asr` is taken away here: it is
  // everything listening to a recording produced, and the words put right go
  // with it.
  string artifact_id = 2;
}

message DeleteArtifactResponse {
  // The artifact as it now stands, which is nothing.
  Artifact artifact = 1;
}
