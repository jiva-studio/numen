syntax = "proto3";

// What a client running a person's cards may ask.
//
// Review is an application of its own, beside the editor and over the same core
// (ADR-0030), so this service stands beside the editor's and shares nothing with
// it. It reaches every vault the installation knows, because what a person owes
// today is owed across all of them.
//
// A card is laid out here, unlike the cards service, which hands a face over as
// the markdown it was written as: what a person is shown is the face filled with
// one card's values, and nothing above this has the two halves to fill it with.
package numen.v1;

option go_package = "github.com/jiva-studio/numen/modules/libs/protocol/gen/numen/v1;numenv1";

// ReviewService is the front door, a session, and the answers given in it.
service ReviewService {
  // Owing is what every vault the installation knows comes to today: how much
  // it holds, how much is due, and how much has never been asked. It is what
  // the application opens on.
  //
  // A vault the index does not carry yet is listed with nothing counted and
  // says so: the list of its decks is the index's answer, and this application
  // builds none.
  rpc Owing(OwingRequest) returns (OwingResponse);

  // Start opens a run and hands over what to ask, in order. A run writes one
  // file of its own in the vault and nothing else ever appends to it.
  //
  // Naming a deck asks that deck alone. Naming none asks the whole vault, which
  // is the ordinary way to sit down to this.
  rpc Start(StartRequest) returns (StartResponse);

  // Answer writes down how a card came back. What comes back is the identifier
  // of the line, which is what taking that answer back names.
  rpc Answer(AnswerRequest) returns (AnswerResponse);

  // TakeBack writes down that an answer was taken back. Both lines stay in the
  // file: nothing in a log is ever rewritten or removed.
  rpc TakeBack(TakeBackRequest) returns (TakeBackResponse);

  // Edit brings the editor forward with a deck open at one card. It is the one
  // thing this application hands over, and between two processes it is an
  // invocation and not a call.
  rpc Edit(EditRequest) returns (EditResponse);
}

// Rating is how well a card came back. A person says which of the four, and
// nothing decides it for them.
enum Rating {
  RATING_UNSPECIFIED = 0;
  // RATING_AGAIN is a card that did not come back at all.
  RATING_AGAIN = 1;
  // RATING_HARD is a card that came back, slowly and with effort.
  RATING_HARD = 2;
  // RATING_GOOD is a card that came back.
  RATING_GOOD = 3;
  // RATING_EASY is a card that came back with none.
  RATING_EASY = 4;
}

// VaultOwing is one vault, and what its cards come to today.
message VaultOwing {
  string vault_id = 1;
  string name = 2;
  string path = 3;

  // Faces is every card the vault holds, counted once for each face it is shown
  // through. Due is what was answered before and is owed today; New is what
  // nobody has answered.
  int32 faces = 4;
  int32 due = 5;
  int32 new = 6;

  // Decks is the same three numbers for each deck, by the path of its file.
  repeated DeckOwing decks = 7;

  // Set when the vault could not be counted: it has never been read by the
  // editor, or its files could not be reached. The three numbers are then zero
  // and this says why, in the person's own words.
  string unread = 8;
}

message DeckOwing {
  string deck = 1;
  int32 faces = 2;
  int32 due = 3;
  int32 new = 4;
}

// Asked is one card face as it is put to a person.
message Asked {
  // Deck is the path of the file the card stands in, and section the name of
  // the section it stands under. A card standing before the first section
  // carries none.
  string deck = 1;
  string section = 2;

  // Card is the mark the card is known by, and face the name of the face it is
  // shown through. The two together are what an answer is recorded against.
  string card = 3;
  string face = 4;

  // Heading is what the card's heading shows, which is the first line of its
  // first field.
  string heading = 5;

  // Front and back are the face laid out with this card's values, as markdown.
  string front = 6;
  string back = 7;

  // Seen is false for a card nobody has answered, which is what a person means
  // by a new card. Due is when it comes round, and stands only where it has
  // been answered.
  bool seen = 8;
  string due = 9;
}

message OwingRequest {}

message OwingResponse {
  repeated VaultOwing vaults = 1;
}

message StartRequest {
  string vault_id = 1;
  // Deck is the path of one deck, or empty for every deck the vault holds.
  string deck = 2;
}

message StartResponse {
  // Run is what an answer given in this sitting is written to, and it is what
  // an Answer names.
  string run = 1;
  repeated Asked asked = 2;
}

message AnswerRequest {
  string vault_id = 1;
  string run = 2;
  string card = 3;
  string face = 4;
  Rating rating = 5;
  // Took is how long the card stood on the screen, in milliseconds. It is the
  // one thing about an answer that cannot be measured later.
  int64 took_ms = 6;
}

message AnswerResponse {
  // Answer is the identifier of the line written, which is what taking it back
  // names.
  string answer = 1;
  // Due is when the card comes round again, as the answers now stand.
  string due = 2;
}

message TakeBackRequest {
  string vault_id = 1;
  string run = 2;
  // Answer is the identifier a previous Answer came back with.
  string answer = 3;
}

message TakeBackResponse {}

message EditRequest {
  string vault_id = 1;
  string deck = 2;
  string card = 3;
}

message EditResponse {
  // Set when the editor could not be started, in the person's own words. The
  // review goes on either way.
  string refused = 1;
}
