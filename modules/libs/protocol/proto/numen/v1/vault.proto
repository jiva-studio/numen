syntax = "proto3";

// What a client may ask about a vault.
//
// This file is the contract, and the only place it is written down. The Go that
// answers and the TypeScript that asks are both generated from it, so a field
// that changes here fails to compile on the side that has not caught up.
//
// Nothing of the index is described here: a note is addressed by the path it is
// filed under, which is what the vault calls it.
package numen.v1;

option go_package = "github.com/jiva-studio/numen/modules/libs/protocol/gen/numen/v1;numenv1";

// VaultService answers questions about the one vault a client is looking at.
service VaultService {
  // State is what the vault is and how far reading it has got.
  rpc State(StateRequest) returns (StateResponse);

  // Opening is the note to show when nothing else has been chosen. It answers
  // with nothing until a scan has stored something.
  rpc Opening(OpeningRequest) returns (OpeningResponse);

  // Neighbourhood is one note and everything joined to it.
  rpc Neighbourhood(NeighbourhoodRequest) returns (NeighbourhoodResponse);

  // Names is the names in a vault that match what was typed: a note's own
  // title, and the headings inside notes. It is asked as a person types, and
  // the last word matches on its prefix.
  //
  // It reads names and nothing else. Searching the text a vault holds is
  // Search, and that answers with passages.
  rpc Names(NamesRequest) returns (NamesResponse);

  // Search is the text a vault holds that answers what was typed, by the words
  // in it or by what it means. The caller says which half runs, so a client
  // drawing the two apart asks twice.
  rpc Search(SearchRequest) returns (SearchResponse);

  // Changes reports the notes that changed on disk, for as long as the caller
  // listens. It says which notes, and nothing about them: the caller knows
  // what it is showing and asks for what it needs.
  rpc Changes(ChangesRequest) returns (stream ChangesResponse);

  // Focus reports the notes something else asked to be put in front of the
  // person — an agent working the vault beside them — for as long as the
  // caller listens. What travelling there looks like is the client's.
  rpc Focus(FocusRequest) returns (stream FocusResponse);

  // Editing reports a change being made to a note's prose while it is being
  // made, for as long as the caller listens. It is what a person reading that
  // note is shown; the note itself arrives the way every other change does.
  rpc Editing(EditingRequest) returns (stream EditingResponse);

  // Tasks reports everything the application is doing behind the window, for as
  // long as the caller listens: what it is, what it is on, and how far it has
  // got.
  //
  // The whole list arrives every time any of it changes, and the first arrives
  // at once, so a window that opened while work was running is told about it.
  // It is a stream rather than a question asked over and over, because what is
  // being done is known here the moment it changes and work can begin without
  // the window asking for it — an agent is told to read a document, and this is
  // where the person watching sees it happen.
  rpc Tasks(TasksRequest) returns (stream TasksResponse);

  // Read answers with the prose of a note, below its frontmatter.
  rpc Read(ReadRequest) returns (ReadResponse);

  // Write puts prose into a note, keeping the frontmatter the file has when the
  // write lands and creating the file where there is none. A note that no
  // longer holds the prose the caller read is left alone and answered
  // `changed`.
  rpc Write(WriteRequest) returns (WriteResponse);

  // Create makes a note. The file is named after the title, and the links the
  // note carries are written into it as it is made, so it arrives joined.
  rpc Create(CreateRequest) returns (CreateResponse);

  // Join writes a relationship into one note. The note at the other end is left
  // alone: a link is one end's account of a relationship.
  rpc Join(JoinRequest) returns (JoinResponse);

  // Quitting says the window is going, for as long as the caller listens. A
  // caller holding work that is only in its own memory writes it now and
  // answers with Flushed.
  rpc Quitting(QuittingRequest) returns (stream QuittingResponse);

  // Flushed says what a caller has left. Nothing left lets the window go; work
  // a person is being asked about keeps it open. A caller that never says it is
  // waited for and then left behind.
  rpc Flushed(FlushedRequest) returns (FlushedResponse);
}

// Refusal is why a note could not be read or written.
enum Refusal {
  REFUSAL_UNSPECIFIED = 0;

  // Nothing is at the path. A read says so; a write creates the file.
  REFUSAL_MISSING = 1;

  // The file is in the vault and is not a note.
  REFUSAL_NOT_A_NOTE = 2;

  // The file is not text this can carry.
  REFUSAL_NOT_TEXT = 3;

  // The file is past the size a note is read at.
  REFUSAL_TOO_LARGE = 4;

  // The prose opens with a frontmatter delimiter, so writing it would put a
  // second block inside the first.
  REFUSAL_BODY_REFUSED = 5;

  // The frontmatter cannot be read, so the note can be neither read nor written
  // from here.
  REFUSAL_UNREADABLE = 6;

  // A file is already where the note would be made. Nothing is written.
  REFUSAL_OCCUPIED = 7;
}

// Note is a note as something else refers to it.
message Note {
  // Path is what the vault calls the note, and how it is asked for again.
  string path = 1;
  string title = 2;
  // Identifier is what the file carries, empty for a note made outside the
  // application.
  string identifier = 3;
}

// Seat is where a note sits relative to the one in focus. A sibling is written
// nowhere: it is another child of a shared parent.
enum Seat {
  SEAT_UNSPECIFIED = 0;
  SEAT_PARENT = 1;
  SEAT_CHILD = 2;
  SEAT_JUMP = 3;
  SEAT_SIBLING = 4;
}

message Seated {
  Note note = 1;
  Seat seat = 2;
  // What the person wrote on the link, when they wrote anything.
  string label = 3;

  // The note the relationship runs from, when that is not the one in focus: a
  // sibling is another child of a shared parent, and this is that parent.
  string through = 4;
}

message StateRequest {}

message StateResponse {
  string name = 1;
  string path = 2;
  // Indexed is how many notes the running scan has stored.
  int64 indexed = 3;
  // Ready is set when the scan has finished.
  bool ready = 4;

  // Why the scan stopped, when it stopped for a reason. A vault that could
  // not be read is not an empty one.
  string failed = 5;

  // Why the vault is not being followed, when it is not. Changes will only
  // appear when something asks for them again.
  string unwatched = 6;

  // Why an agent cannot be reached, when one cannot. The window works and the
  // panel says this instead of answering.
  string unreachable = 17;

  // Chunks is how many spans of text the index holds, and embedded is how many
  // of those carry a vector. Cutting finishes long before embedding does, so
  // the pair is what says how far searching by meaning has got. Both are zero
  // for a vault nothing has cut yet.
  int64 chunks = 7;
  int64 embedded = 8;

  // Reading is the source being read now, as the vault calls it. Empty when
  // nothing is being read, which is not the same as everything being done:
  // `ready` says that.
  string reading = 9;

  // Embedding says whether anything is going to turn the chunks into vectors.
  // False for an installation with no model, where `embedded` stays where it is
  // and the vault is searched by its words.
  bool embedding = 10;

  // Books is how many the vault holds, and books_read how many of those have
  // been accounted for — read, skipped as unchanged, or found gone. Cutting is
  // counted in books because that is what it opens; embedding is counted in
  // chunks, and the two phases are told apart by `learning`.
  int64 books = 11;
  int64 books_read = 12;

  // Learning names a phase: it is set while vectors are being made, and from
  // the moment a write lands until they have been. It is what tells the two
  // phases apart, since both name a source and move a count.
  bool learning = 13;

  // Busy is set while the vault is still being read: its notes, then its books,
  // then their vectors. Reading a book and embedding one change no file, so this
  // is the only thing that says there is more to come. `ready` says the notes
  // are done, which is a smaller claim.
  bool busy = 14;

  // Owing is how many chunks the pass now running found with no vector, and
  // made is how many of those it has made one for. They are the work in hand,
  // where chunks and embedded are the whole of what the vault holds.
  int64 owing = 15;
  int64 made = 16;

}

message TasksRequest {}

message TasksResponse {
  // Everything being done now, in the order the work began. The list arrives
  // whole, because what is being done is a list and not a set of differences to
  // apply.
  repeated Task tasks = 1;
}

// A Task is one piece of work the application is doing behind the window.
//
// Every kind of work is one of these. That is the point: the next kind is an
// entry in a list rather than another field on the state, another thing for the
// window to poll, and another branch in what draws it.
message Task {
  // Id is what this work is called, so that the same work reported again
  // replaces itself rather than appearing twice.
  string id = 1;

  // Doing is the work, in the words to show. About is what it is on, and is
  // empty for work that is on nothing in particular.
  string doing = 2;
  string about = 3;

  // Done and total are how far it has got, when there is a total to count
  // against. Both zero is work running with nothing to count, which is an
  // ordinary state and not an unknown one.
  int64 done = 4;
  int64 total = 5;

  // Failed is why the work stopped, when it stopped badly.
  string failed = 6;
}

message OpeningRequest {}

message OpeningResponse {
  // Absent while a scan has stored nothing, and for a vault that holds no
  // notes.
  optional Note note = 1;
}

message ChangesRequest {}

message ChangesResponse {
  // Paths of the notes that changed. A note that was removed is named here
  // too: what changed about it is that it is gone.
  repeated string paths = 1;

  // Set when the vault has to be read again rather than followed — more
  // changed at once than could be reported.
  bool reload = 2;

  // The notes that were renamed by this application, each by where it was and
  // where it now is. A client showing one of them follows it there.
  repeated Renamed renamed = 3;
}

// Renamed is a note that is no longer where it was. The bytes do not change on
// the way, so this says nothing about what the note holds.
message Renamed {
  string from = 1;
  string to = 2;
}


message FocusRequest {}

message FocusResponse {
  // The note to see the neighbourhood from.
  string path = 1;
}

message EditingRequest {}

message EditingResponse {
  // The change this reports on. Every report of one change carries the same
  // name, and no two changes carry one.
  string change = 1;
  // The note being changed.
  string path = 2;
  // The stretch being replaced, counted the way a client counts text: in UTF-16
  // code units over the prose a read answers with.
  int32 from = 3;
  int32 to = 4;
  // What is going in where that stretch stands.
  string text = 5;
  // The last report of this change, which arrives whether the change landed or
  // was refused.
  bool done = 6;
}

message NeighbourhoodRequest {
  string path = 1;
}

message NeighbourhoodResponse {
  Note focus = 1;
  repeated Seated related = 2;
}

message NamesRequest {
  // What was typed, as it was typed. Words are matched together, and the last
  // of them on its prefix.
  string query = 1;

  // How many names to answer with. Zero takes the number the vault chooses.
  int32 limit = 2;
}

message NamesResponse {
  // The names that matched, best first, with a note's own title before a
  // heading inside one.
  repeated Named found = 1;
}

// Named is one name that matched, and the note it stands for. A note's own
// title matched when there is no heading here; otherwise the note is what the
// heading stands in.
message Named {
  Note note = 1;

  // The heading that matched, absent when the note's own title did.
  optional Heading heading = 2;

  // Where in that name the words stand, counted the way a client counts text:
  // in UTF-16 code units.
  // A word reached by its prefix is marked whole.
  repeated Span at = 3;
}

// Heading is one line of a note that names what stands below it.
message Heading {
  string text = 1;

  // The line it stands on, counted from the first line of the prose.
  int32 line = 2;
}

// Span is a run of text, by where it begins and where it ends.
message Span {
  int32 from = 1;
  int32 to = 2;
}

// Half is which half of a search runs.
enum Half {
  // Both halves run, and what they answer is merged into one ranking.
  HALF_UNSPECIFIED = 0;

  // The words typed, matched as words.
  HALF_WORDS = 1;

  // What the words mean, matched against the vectors the index holds. A vault
  // nothing has embedded answers with nothing.
  HALF_MEANING = 2;
}

message SearchRequest {
  string query = 1;

  // How many passages to answer with. Zero takes the number the vault chooses.
  int32 limit = 2;

  Half half = 3;
}

message SearchResponse {
  // The passages that answer, best first, one per source.
  repeated Passage found = 1;
}

// Passage is what a search returns: the text around a hit, and where it came
// from.
message Passage {
  // The file the text was read out of, as the vault calls it.
  string path = 1;

  // The note the text was read out of, absent for a source that is not one.
  // A window that opens notes offers to open these and no others.
  optional Note note = 2;

  string text = 3;

  // Where in that text the words typed stand, counted the way a client counts
  // text: in UTF-16 code units. Empty for a hit by meaning, which stands on no
  // word in particular.
  repeated Span at = 4;

  // What the source's own numbering calls the place, empty when the format
  // offered none.
  string location = 5;
}

message ReadRequest {
  string path = 1;
}

message ReadResponse {
  // The prose below the frontmatter, with line endings as LF. Empty when the
  // note is refused.
  string body = 1;

  // Set when the note was not read, and why.
  optional Refusal refusal = 2;

  // The file this prose came out of. Absent when the note was refused.
  optional Fingerprint at = 3;
}

// Fingerprint is which file this is: where it is filed, how big it is, and when
// it last changed.
message Fingerprint {
  string path = 1;
  int64 size = 2;

  // When the file last changed, in nanoseconds since the epoch.
  int64 mtime = 3;
}

// Seen is what a caller last saw of a note: the prose a read gave it, and the
// file that read came out of. A note still holding either is the note this
// caller read.
message Seen {
  // The prose below the frontmatter, with line endings as LF, as the read gave
  // it.
  string prose = 1;

  // The file the prose came out of.
  Fingerprint at = 2;
}

message WriteRequest {
  string path = 1;

  // The prose to put below the frontmatter, with line endings as LF.
  string body = 2;

  // What this caller last saw of the note. Absent for a write that lands on
  // whatever the note now holds.
  optional Seen seen = 3;
}

message WriteResponse {
  // Set when nothing was written, and why.
  optional Refusal refusal = 1;

  // Set when the note holds prose this caller has not read. Nothing was
  // written, and the person chooses what happens to their text.
  bool changed = 2;

  // The file the write produced, for the caller to present at its next write.
  // Absent when nothing was written.
  optional Fingerprint at = 3;
}

// NewLink is one relationship as the note it is written in declares it: the
// note at the other end, by the path it is filed under, and where that note
// sits seen from this one. A sibling cannot be written — it is another child of
// a shared parent.
message NewLink {
  string to = 1;
  Seat seat = 2;

  // What the person calls this relationship, when they call it anything.
  string label = 3;
}

message CreateRequest {
  // What the note is called. The file is named after it.
  string title = 1;

  // Where in the vault it goes, relative to the root. Empty is the root.
  string folder = 2;

  // What the note is joined to, written into it as it is made.
  repeated NewLink links = 3;
}

message CreateResponse {
  // Where the note is filed. Empty when nothing was made.
  string path = 1;

  // Set when nothing was made, and why.
  optional Refusal refusal = 2;
}

message JoinRequest {
  // The note the link is written in.
  string path = 1;
  NewLink link = 2;
}

message JoinResponse {
  // Set when nothing was written, and why.
  optional Refusal refusal = 1;

  // Set when the note changed between being read and being written. Nothing
  // was written, and the caller reads the note again before asking for this.
  bool changed = 2;
}

message QuittingRequest {}

message QuittingResponse {
  // What this caller answers Flushed with. The stream opens by saying it, so
  // a caller knows it is listening before anything is asked of it.
  string token = 1;

  // Set when the window is going and this caller's unwritten work has to land.
  bool flush = 2;
}

// Owed is what a caller has left when it answers.
enum Owed {
  // Nothing is left.
  OWED_UNSPECIFIED = 0;

  // Everything this caller held is written.
  OWED_WRITTEN = 1;

  // Something this caller holds could not be written, and a person is being
  // asked what to do with it. The window stays until they answer.
  OWED_ASKING = 2;
}

message FlushedRequest {
  // The token this caller was given when it began listening.
  string token = 1;

  // What this caller has left.
  Owed owed = 2;
}

message FlushedResponse {}
