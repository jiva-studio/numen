syntax = "proto3";

// What a client may ask about a vault.
//
// This file is the contract, and the only place it is written down. The Go that
// answers and the TypeScript that asks are both generated from it, so a field
// that changes here fails to compile on the side that has not caught up.
//
// Nothing of the index is described here: a note is addressed by the path it is
// filed under, which is what the vault calls it.
package numen.v1;

option go_package = "github.com/jiva-studio/numen/modules/libs/protocol/gen/numen/v1;numenv1";

// VaultService answers questions about the one vault a client is looking at.
service VaultService {
  // State is what the vault is and how far reading it has got.
  rpc State(StateRequest) returns (StateResponse);

  // Opening is the note to show when nothing else has been chosen. It answers
  // with nothing until a scan has stored something.
  rpc Opening(OpeningRequest) returns (OpeningResponse);

  // Neighbourhood is one note and everything joined to it.
  rpc Neighbourhood(NeighbourhoodRequest) returns (NeighbourhoodResponse);

  // Changes reports the notes that changed on disk, for as long as the caller
  // listens. It says which notes, and nothing about them: the caller knows
  // what it is showing and asks for what it needs.
  rpc Changes(ChangesRequest) returns (stream ChangesResponse);

  // Focus reports the notes something else asked to be put in front of the
  // person — an agent working the vault beside them — for as long as the
  // caller listens. What travelling there looks like is the client's.
  rpc Focus(FocusRequest) returns (stream FocusResponse);

  // Read answers with the prose of a note, below its frontmatter.
  rpc Read(ReadRequest) returns (ReadResponse);

  // Write puts prose into a note, keeping the frontmatter the file has when the
  // write lands and creating the file where there is none. What was on disk
  // under an edit made elsewhere is replaced.
  rpc Write(WriteRequest) returns (WriteResponse);

  // Quitting says the window is going, for as long as the caller listens. A
  // caller holding work that is only in its own memory writes it now and
  // answers with Flushed.
  rpc Quitting(QuittingRequest) returns (stream QuittingResponse);

  // Flushed says a caller has written everything it owed, and the window may
  // go. A caller that never says it is waited for and then left behind.
  rpc Flushed(FlushedRequest) returns (FlushedResponse);
}

// Refusal is why a note could not be read or written.
enum Refusal {
  REFUSAL_UNSPECIFIED = 0;

  // Nothing is at the path. A read says so; a write creates the file.
  REFUSAL_MISSING = 1;

  // The file is in the vault and is not a note.
  REFUSAL_NOT_A_NOTE = 2;

  // The file is not text this can carry.
  REFUSAL_NOT_TEXT = 3;

  // The file is past the size a note is read at.
  REFUSAL_TOO_LARGE = 4;

  // The prose opens with a frontmatter delimiter, so writing it would put a
  // second block inside the first.
  REFUSAL_BODY_REFUSED = 5;

  // The frontmatter cannot be read, so the note can be neither read nor written
  // from here.
  REFUSAL_UNREADABLE = 6;
}

// Note is a note as something else refers to it.
message Note {
  // Path is what the vault calls the note, and how it is asked for again.
  string path = 1;
  string title = 2;
  // Identifier is what the file carries, empty for a note made outside the
  // application.
  string identifier = 3;
}

// Seat is where a note sits relative to the one in focus. A sibling is written
// nowhere: it is another child of a shared parent.
enum Seat {
  SEAT_UNSPECIFIED = 0;
  SEAT_PARENT = 1;
  SEAT_CHILD = 2;
  SEAT_JUMP = 3;
  SEAT_SIBLING = 4;
}

message Seated {
  Note note = 1;
  Seat seat = 2;
  // What the person wrote on the link, when they wrote anything.
  string label = 3;

  // The note the relationship runs from, when that is not the one in focus: a
  // sibling is another child of a shared parent, and this is that parent.
  string through = 4;
}

message StateRequest {}

message StateResponse {
  string name = 1;
  string path = 2;
  // Indexed is how many notes the running scan has stored.
  int64 indexed = 3;
  // Ready is set when the scan has finished.
  bool ready = 4;

  // Why the scan stopped, when it stopped for a reason. A vault that could
  // not be read is not an empty one.
  string failed = 5;

  // Why the vault is not being followed, when it is not. Changes will only
  // appear when something asks for them again.
  string unwatched = 6;

  // Chunks is how many spans of text the index holds, and embedded is how many
  // of those carry a vector. Cutting finishes long before embedding does, so
  // the pair is what says how far searching by meaning has got. Both are zero
  // for a vault nothing has cut yet.
  int64 chunks = 7;
  int64 embedded = 8;

  // Reading is the source being read now, as the vault calls it. Empty when
  // nothing is being read, which is not the same as everything being done:
  // `ready` says that.
  string reading = 9;

  // Embedding says whether anything is going to turn the chunks into vectors.
  // False for an installation with no model, where `embedded` stays where it is
  // and the vault is searched by its words.
  bool embedding = 10;

  // Books is how many the vault holds, and books_read how many of those have
  // been accounted for — read, skipped as unchanged, or found gone. Cutting is
  // counted in books because that is what it opens; embedding is counted in
  // chunks, and the two phases are told apart by `learning`.
  int64 books = 11;
  int64 books_read = 12;

  // Learning is set while vectors are being made. It is what tells the two
  // phases apart: both name a source and move a count, and the counts are of
  // different things.
  bool learning = 13;

  // Busy is set while the vault is still being read: its notes, then its books,
  // then their vectors. Reading a book and embedding one change no file, so this
  // is the only thing that says there is more to come. `ready` says the notes
  // are done, which is a smaller claim.
  bool busy = 14;
}

message OpeningRequest {}

message OpeningResponse {
  // Absent while a scan has stored nothing, and for a vault that holds no
  // notes.
  optional Note note = 1;
}

message ChangesRequest {}

message ChangesResponse {
  // Paths of the notes that changed. A note that was removed is named here
  // too: what changed about it is that it is gone.
  repeated string paths = 1;

  // Set when the vault has to be read again rather than followed — more
  // changed at once than could be reported.
  bool reload = 2;
}

message FocusRequest {}

message FocusResponse {
  // The note to see the neighbourhood from.
  string path = 1;
}

message NeighbourhoodRequest {
  string path = 1;
}

message NeighbourhoodResponse {
  Note focus = 1;
  repeated Seated related = 2;
}

message ReadRequest {
  string path = 1;
}

message ReadResponse {
  // The prose below the frontmatter, with line endings as LF. Empty when the
  // note is refused.
  string body = 1;

  // Set when the note was not read, and why.
  optional Refusal refusal = 2;
}

message WriteRequest {
  string path = 1;

  // The prose to put below the frontmatter, with line endings as LF.
  string body = 2;
}

message WriteResponse {
  // Set when nothing was written, and why.
  optional Refusal refusal = 1;
}

message QuittingRequest {}

message QuittingResponse {
  // What this caller answers Flushed with. The stream opens by saying it, so
  // a caller knows it is listening before anything is asked of it.
  string token = 1;

  // Set when the window is going and this caller's unwritten work has to land.
  bool flush = 2;
}

message FlushedRequest {
  // The token this caller was given when it began listening.
  string token = 1;
}

message FlushedResponse {}
