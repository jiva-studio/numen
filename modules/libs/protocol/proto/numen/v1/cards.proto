syntax = "proto3";

// What a client may ask about the stencils and the decks a vault holds.
//
// A stencil declares the fields a card has and the faces it is shown by; a
// deck holds the cards. Both are notes, so both are addressed by the path they
// are filed under, and both are refused for the reasons any note is.
//
// Nothing here is laid out. A face travels as the markdown it was written as,
// with its `{{Field}}` where they stand, and putting a card's values into it is
// the client's.
package numen.v1;

import "numen/v1/vault.proto";

option go_package = "github.com/jiva-studio/numen/modules/libs/protocol/gen/numen/v1;numenv1";

// CardsService answers about the stencils and the decks of the one vault a
// client is looking at.
service CardsService {
  // Stencils is what a person choosing what kind of card to write next is
  // shown: every stencil in the vault, by what it is called and what it asks
  // for. The faces are read one stencil at a time.
  //
  // A stencil that could not be read is absent from the answer.
  rpc Stencils(StencilsRequest) returns (StencilsResponse);

  // ReadStencil is the fields and the faces of one stencil.
  rpc ReadStencil(ReadStencilRequest) returns (ReadStencilResponse);

  // WriteStencil puts fields and faces into a stencil, creating the file where
  // there is none. Every frontmatter key but `fields` stays as the person wrote
  // it, and a stencil that no longer holds what the caller read is left alone
  // and answered `changed`.
  rpc WriteStencil(WriteStencilRequest) returns (WriteStencilResponse);

  // ReadDeck is the cards of one deck, in the order they stand in the file.
  rpc ReadDeck(ReadDeckRequest) returns (ReadDeckResponse);

  // WriteDeck puts cards into a deck, in the order they are given, creating the
  // file where there is none. The frontmatter stays as the person wrote it, and
  // a deck that no longer holds what the caller read is left alone and answered
  // `changed`.
  //
  // The preamble, the tail and each card's lead are written back as they
  // arrive, so the parts of the file a client did not touch come out as the
  // bytes they went in as.
  rpc WriteDeck(WriteDeckRequest) returns (WriteDeckResponse);
}

// Stencil is what a card is cut by: the fields it is asked for, and the faces
// it is shown through.
message Stencil {
  // Path is what the vault calls the note, and how it is asked for again.
  string path = 1;
  string title = 2;

  // The names of the fields, in the order a person is asked for them. A name is
  // text and nothing else.
  repeated string fields = 3;

  // The faces, in the order they stand in the note. One card is shown once
  // through each.
  repeated Face faces = 4;

  // What was wrong with the note and was not guessed at, in the order it was
  // found. The stencil is read either way.
  repeated Problem problems = 5;
}

// Offered is one stencil as the list of them names it: where it is filed, what
// it is called, and what it asks a person for.
message Offered {
  string path = 1;
  string title = 2;

  // The names of the fields, in the order a person is asked for them.
  repeated string fields = 3;
}

// Face is one way a stencil shows a card.
message Face {
  // What the face is called.
  string name = 1;

  // What is shown before the answer and after it, each markdown with `{{Field}}`
  // standing where a value goes. `{{title}}` stands for the card's own name.
  string front = 2;
  string back = 3;
}

// Deck is a note whose body is cards.
message Deck {
  // Path is what the vault calls the note, and how it is asked for again.
  string path = 1;
  string title = 2;

  // The prose below the frontmatter and above the first card, with line endings
  // as LF. A deck carrying no card is all preamble.
  string preamble = 3;

  // The cards, in the order they stand in the note.
  repeated Card cards = 4;

  // What was wrong with the note and was not guessed at, in the order it was
  // found. The deck is read either way, and every card a person wrote is here.
  repeated Problem problems = 5;

  // What the file ends with once the last value has been read, with line
  // endings as LF. It is no card's, and it is written back as it arrives.
  string tail = 6;
}

// Problem is something in a file that could not be acted on and was not guessed
// at. The file is read either way, and each one carries where it stands so that
// the interface marks the card or the face it is against.
message Problem {
  Fault fault = 1;

  // The card it stands against, counted from the first card the deck answers
  // with. Absent for a problem against no card, and for every problem of a
  // stencil.
  optional int32 card = 2;

  // The face it stands against, counted from the first face the stencil answers
  // with. Absent for a problem against no face.
  optional int32 face = 3;

  // The field's name, as the file spells it. Empty for a problem against no
  // field.
  string field = 4;

  // What is wrong, in the words to show.
  string text = 5;
}

// Fault is what a problem is. The list is closed: an interface marks a card and
// a face by what is wrong with them, so a fault nobody decided on is drawn
// nowhere.
enum Fault {
  FAULT_UNSPECIFIED = 0;

  // `fields` declares a name twice. The first stands.
  FAULT_FIELD_DECLARED_TWICE = 1;

  // `fields` is absent or empty, so a card cut by this stencil has nothing to
  // be named by.
  FAULT_STENCIL_WITHOUT_FIELDS = 2;

  // A face carries no front or no back. It lays out nothing.
  FAULT_FACE_MISSING_A_SIDE = 3;

  // A `{{Field}}` names a field outside `fields`. The rest of the face is read
  // as usual.
  FAULT_PLACEHOLDER_UNDECLARED = 4;

  // The first paragraph under a card's heading is not a lone wikilink. The
  // values are read.
  FAULT_CARD_WITHOUT_A_STENCIL = 5;

  // A card's wikilink reaches a note that is not a stencil. The values are
  // read.
  FAULT_STENCIL_IS_NOT_ONE = 6;

  // A second-level heading carries no text. The card is read and shown marked.
  FAULT_CARD_WITHOUT_A_NAME = 7;

  // Two cards are called one name. The first stands as that name, and the rest
  // are read and shown marked.
  FAULT_CARD_NAMED_TWICE = 8;

  // One card writes a field's heading twice. The first stands, and the second
  // is kept in the file.
  FAULT_FIELD_WRITTEN_TWICE = 9;

  // A field renamed in a stencil did not reach this deck, so a card holds a
  // heading the stencil no longer declares.
  FAULT_FIELD_NOT_RENAMED = 10;

  // A card carries its stencil's first field as a heading of its own as well as
  // in the heading above. The heading above stands, and the third-level one is
  // kept in the file and shown by no face.
  FAULT_FIRST_FIELD_WRITTEN_TWICE = 11;
}

// Card is one filled-in set of a stencil's fields.
message Card {
  // The heading the card stands under, which is what the card is called and
  // half of how it is addressed.
  string name = 1;

  // The stencil this card is cut by, as the wikilink beneath its heading names
  // it, without the brackets. Empty for a card written under no wikilink.
  string stencil = 2;

  // The prose between that wikilink and the first field, with line endings as
  // LF. It is written back as it arrives.
  string lead = 3;

  // The values, in the order they stand under the card. A field the stencil
  // declares and the card leaves out is absent here.
  repeated Value values = 4;

  // Where the stencil that wikilink names is filed, resolved the way any link
  // is. Empty for a card naming none and for a name that reaches no note, and a
  // write carries nothing here.
  string stencil_at = 5;
}

// Value is what a person wrote under one of a card's fields.
message Value {
  // The field's name, as the heading spells it.
  string field = 1;

  // The markdown below that heading, with line endings as LF.
  string text = 2;
}

message StencilsRequest {
  // How many stencils to answer with. Zero takes the number the vault chooses,
  // and a number above the ceiling the vault sets takes that ceiling.
  int32 limit = 1;
}

message StencilsResponse {
  // The stencils, by path, with case ignored.
  repeated Offered stencils = 1;

  // How many stencils the vault holds. It stands above the length of the list
  // when the ceiling was reached, and the interface says so.
  int32 held = 2;
}

message ReadStencilRequest {
  string path = 1;
}

message ReadStencilResponse {
  // Absent when the stencil was refused.
  optional Stencil stencil = 1;

  // Set when the stencil was not read, and why.
  optional Refusal refusal = 2;

  // The file this stencil came out of, for the caller to present at its next
  // write. Absent when the stencil was refused.
  optional Fingerprint at = 3;
}

message WriteStencilRequest {
  string path = 1;

  // The names of the fields, in the order a person is asked for them.
  repeated string fields = 2;

  // The faces, in the order they are to stand in the note.
  repeated Face faces = 3;

  // The file this caller last read. Absent for a write that lands on whatever
  // the stencil now holds.
  optional Fingerprint seen = 4;
}

message WriteStencilResponse {
  // Set when nothing was written, and why.
  optional Refusal refusal = 1;

  // Set when the file is no longer the one this caller read. Nothing was
  // written, and the person chooses what happens to their text.
  bool changed = 2;

  // The file the write produced, for the caller to present at its next write.
  // Absent when nothing was written.
  optional Fingerprint at = 3;
}

message ReadDeckRequest {
  string path = 1;
}

message ReadDeckResponse {
  // Absent when the deck was refused.
  optional Deck deck = 1;

  // Set when the deck was not read, and why.
  optional Refusal refusal = 2;

  // The file this deck came out of, for the caller to present at its next
  // write. Absent when the deck was refused.
  optional Fingerprint at = 3;

  // The size a deck is read up to, in bytes. Set with REFUSAL_DECK_TOO_LARGE,
  // so the interface names the bound without holding a number of its own.
  int64 bound = 4;
}

message WriteDeckRequest {
  string path = 1;

  // The prose to stand below the frontmatter and above the first card, with
  // line endings as LF.
  string preamble = 2;

  // The cards, in the order they are to stand in the note.
  repeated Card cards = 3;

  // The file this caller last read. Absent for a write that lands on whatever
  // the deck now holds.
  optional Fingerprint seen = 4;

  // What the file is to end with, below the last value, with line endings as
  // LF.
  string tail = 5;
}

message WriteDeckResponse {
  // Set when nothing was written, and why.
  optional Refusal refusal = 1;

  // Set when the file is no longer the one this caller read. Nothing was
  // written, and the person chooses what happens to their text.
  bool changed = 2;

  // The file the write produced, for the caller to present at its next write.
  // Absent when nothing was written.
  optional Fingerprint at = 3;

  // The size a deck is written up to, in bytes. Set with
  // REFUSAL_DECK_TOO_LARGE, so the interface names the bound without holding a
  // number of its own.
  int64 bound = 4;
}
