version: "2"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  default: none
  enable:
    - errcheck
    - nilerr
    - bodyclose
    - contextcheck
    - staticcheck
    - unused
    - depguard

  settings:
    depguard:
      rules:
        sdk-isolation:
          list-mode: lax
          deny:
            - pkg: "github.com/jiva-studio/numen/modules/libs/core"
              desc: "plugin SDK must not import core packages"
            - pkg: "github.com/jiva-studio/numen/modules/apps"
              desc: "plugin SDK must not import host applications"

  exclusions:
    presets:
      - std-error-handling
    rules:
      - text: "SA1019.*h2c"
        linters: [staticcheck]
      - source: ^\s*(defer )?.*\.Close\(\)$
        linters: [errcheck]
      - source: ^\s*os\.Stdout\.Sync\(\)$
        linters: [errcheck]
      - path: _test\.go$
        text: "QF1001"
        linters: [staticcheck]
