version = 1

test_patterns = [
  "**/*_test.go",
  "**/*.test.ts",
  "**/*.spec.ts",
  "**/*.stories.ts",
  "**/fixtures/**",
  "**/testsupport/**",
  "modules/tests/**"
]

exclude_patterns = [
  "**/gen/**",
  "**/*.pb.go",
  "**/*.connect.go",
  "**/*_pb.ts",
  "**/*_connect.ts",
  "**/testdata/**",
  "**/dist/**",
  "**/build/**",
  "**/vendor/**",
  "**/node_modules/**",
  "**/*.min.js",
  "**/*.wasm"
]

[[analyzers]]
name = "go"

[[analyzers]]
name = "javascript"

  [analyzers.meta]
  module_system = "es-modules"
  environment = ["browser", "nodejs", "vitest"]
  dialect = "typescript"
