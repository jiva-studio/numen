version = 1

test_patterns = [
  "**/*_test.go",
  "**/*.test.ts",
  "**/*.spec.ts"
]

exclude_patterns = [
  "**/gen/**",
  "**/*.pb.go",
  "**/*.connect.go",
  "**/*_pb.ts",
  "**/*_connect.ts",
  "**/testdata/**",
  "**/dist/**",
  "**/build/**",
  "**/vendor/**",
  "**/node_modules/**",
  "**/*.min.js",
  "**/*.wasm",
  "**/*_test.go",
  "**/*.test.ts",
  "**/*.spec.ts",
  "**/*.stories.ts",
  "**/fixtures/**",
  "**/testsupport/**",
  "modules/tests/**",
  "**/eslint.config.js",
  "**/vite.config.ts",
  "**/vitest.config.ts"
]

[[analyzers]]
name = "go"
enabled = true

[[analyzers]]
name = "javascript"
enabled = true

  [analyzers.meta]
  module_system = "es6"
  ecma_version = "2024"
  environment = ["browser", "nodejs"]
  dialect = "typescript"

[[analyzers]]
name = "secrets"
enabled = false

[[analyzers]]
name = "java"
enabled = false

[[analyzers]]
name = "sql"
enabled = false

[[analyzers]]
name = "shell"
enabled = false
