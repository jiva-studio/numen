# The images of the real sync server, by digest. numen-cloud publishes them to its private GHCR packages; the job of this
# repository reads them with its own GITHUB_TOKEN. Fill the digests from that publish (ghcr.io/jiva-studio/numen-sync@sha256:...).
# While the lines are empty, `make sync_stack_up` takes the images from NUMEN_SYNC_IMAGE and NUMEN_SYNC_DEV_IMAGE in the environment.
NUMEN_SYNC_IMAGE=
NUMEN_SYNC_DEV_IMAGE=
