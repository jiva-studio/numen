# The real sync server and what it needs, for the tests of Numen Sync. The two images are private; their digests are in stack.lock.
# Bring it up with `make sync_stack_up`; `make sync_stack_env` prints the settings the tests read.
# The ports are on 127.0.0.1 only. Development keys and passwords: this stack holds no real data.
name: numen-sync-test

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: postgres
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off"]
    configs:
      - source: database
        target: /docker-entrypoint-initdb.d/10-sync.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 30

  bucket:
    image: versity/versitygw
    command: ["--access", "numendev", "--secret", "numendevsecret", "--port", ":7070", "--region", "us-east-1", "posix", "--sidecar", "/meta", "/data"]
    ports:
      - "127.0.0.1:7070:7070"

  bucket-init:
    image: amazon/aws-cli
    depends_on: [bucket]
    environment:
      AWS_ACCESS_KEY_ID: numendev
      AWS_SECRET_ACCESS_KEY: numendevsecret
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for i in $$(seq 1 30); do
          if aws --endpoint-url http://bucket:7070 s3api head-bucket --bucket numen-sync 2>/dev/null \
            || aws --endpoint-url http://bucket:7070 s3api create-bucket --bucket numen-sync 2>/dev/null; then
            exit 0
          fi
          sleep 1
        done
        echo "the bucket was not made" >&2
        exit 1
    restart: "no"

  keys:
    image: ${NUMEN_SYNC_DEV_IMAGE:?set NUMEN_SYNC_DEV_IMAGE or fill tests/server/stack.lock}
    entrypoint: ["/bin/sh", "-c"]
    command: ["/numen-sync-dev keys -dir /keys -not-before $$(date +%s) -days 365 && chmod 755 /keys && chmod 644 /keys/epoch-signing-key /keys/epoch-certificate.json"]
    volumes: ["keys:/keys"]
    restart: "no"

  payment:
    image: ${NUMEN_SYNC_DEV_IMAGE:?set NUMEN_SYNC_DEV_IMAGE or fill tests/server/stack.lock}
    entrypoint: ["/numen-sync-dev"]
    command:
      - payment
      - -listen=0.0.0.0:8788
      - -public-url=http://127.0.0.1:8788
      - -control=0.0.0.0:8789
      - -webhook-target=http://sync:8787/webhooks/creem
      - -webhook-secret=whsec_numen_dev_standin_secret
    ports:
      - "127.0.0.1:8788:8788"
      - "127.0.0.1:8789:8789"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8789/checkouts"]
      interval: 3s
      retries: 20

  sync:
    image: ${NUMEN_SYNC_IMAGE:?set NUMEN_SYNC_IMAGE or fill tests/server/stack.lock}
    environment:
      NUMEN_SYNC_ENV: dev
      NUMEN_SYNC_LISTEN_ADDR: 0.0.0.0:8787
      NUMEN_SYNC_PUBLIC_URL: http://127.0.0.1:8787
      NUMEN_SYNC_DB_URL: postgres://numen_sync:numen_sync@postgres:5432/numen_sync?sslmode=disable
      NUMEN_SYNC_DB_MIGRATE_URL: postgres://numen_sync_owner:numen_sync_owner@postgres:5432/numen_sync?sslmode=disable
      NUMEN_SYNC_BUCKET_ENDPOINT: http://bucket:7070
      NUMEN_SYNC_BUCKET_REGION: us-east-1
      NUMEN_SYNC_BUCKET_NAME: numen-sync
      NUMEN_SYNC_BUCKET_ACCESS_KEY_ID: numendev
      NUMEN_SYNC_BUCKET_SECRET_ACCESS_KEY: numendevsecret
      NUMEN_SYNC_HEALTH_TOKEN: numen-test-health-token
      NUMEN_SYNC_PAYMENT_API_URL: http://payment:8788
      NUMEN_SYNC_PAYMENT_API_KEY: creem_test_standin
      NUMEN_SYNC_PAYMENT_WEBHOOK_SECRET: whsec_numen_dev_standin_secret
      NUMEN_SYNC_PAYMENT_MODE: test
      NUMEN_SYNC_LIMIT_SIGN_IN_SOURCE_PER_MINUTE: "100000"
      NUMEN_SYNC_LIMIT_ACCOUNTS_NEW_SOURCE_PER_HOUR: "100000"
      NUMEN_SYNC_LIMIT_ACCOUNTS_NEW_GLOBAL_PER_HOUR: "100000"
      NUMEN_SYNC_LIMIT_CHALLENGES_GLOBAL_PER_MINUTE: "100000"
      NUMEN_SYNC_EPOCH_SIGNING_KEY_FILE: /keys/epoch-signing-key
      NUMEN_SYNC_EPOCH_CERTIFICATE_FILE: /keys/epoch-certificate.json
    volumes: ["keys:/keys:ro"]
    ports: ["127.0.0.1:8787:8787"]
    depends_on:
      postgres: {condition: service_healthy}
      bucket-init: {condition: service_completed_successfully}
      keys: {condition: service_completed_successfully}
      payment: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "/numen-sync", "healthcheck"]
      interval: 3s
      retries: 40

configs:
  database:
    content: |
      CREATE USER numen_sync_owner PASSWORD 'numen_sync_owner';
      CREATE USER numen_sync PASSWORD 'numen_sync';
      CREATE DATABASE numen_sync OWNER numen_sync_owner;
      \connect numen_sync
      REVOKE CREATE ON SCHEMA public FROM PUBLIC;
      GRANT USAGE ON SCHEMA public TO numen_sync;
      ALTER DEFAULT PRIVILEGES FOR ROLE numen_sync_owner IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO numen_sync;
      ALTER DEFAULT PRIVILEGES FOR ROLE numen_sync_owner IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO numen_sync;

volumes:
  keys:
