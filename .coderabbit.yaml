# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: 'en-US'
tone_instructions: 'Be concise and technical. Respect coding guidelines in AGENTS.md.'

reviews:
  profile: 'chill'
  request_changes_workflow: true
  high_level_summary: true
  # The summary goes into the walkthrough comment; in the description it would become part of the squash commit.
  high_level_summary_in_walkthrough: true
  review_status: false
  poem: false
  # A review starts only on "@coderabbitai review", posted after the nm-review approval (.agents/rules/process.md §4, step 5).
  auto_review:
    enabled: false
  # Generated by buf from libs/core/protocol and the plugin contracts.
  path_filters:
    - '!**/*.pb.go'
    - '!**/*_pb.ts'
    - '!**/*.connect.go'
  # CI checks style/names and style/comments, so a review of wording repeats it.
  path_instructions:
    - path: '**/*.{go,ts,vue}'
      instructions: |
        Report only correctness bugs, data loss or integrity problems, security problems and violations of the rules in AGENTS.md.
        Do not comment on naming, comment wording or formatting: the CI checks style/names and style/comments cover them.
    - path: '**/*.md'
      instructions: |
        Report only a contradiction with another rule file, with AGENTS.md or with the code.
        Do not comment on wording, structure or style.
  tools:
    ast-grep:
      enabled: true

chat:
  auto_reply: true
