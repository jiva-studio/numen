sonar.projectKey=jiva-studio_numen
sonar.organization=jiva-studio
sonar.sources=modules
sonar.exclusions=**/gen/**,**/*.pb.go,**/*.connect.go,**/dist/**,**/build/**,**/node_modules/**,**/*.wasm,**/testdata/**,**/testsupport/**
sonar.tests=modules
sonar.test.inclusions=**/*_test.go,**/*.test.ts,**/*.spec.ts
sonar.test.exclusions=**/testdata/**,**/testsupport/**

# Multicriteria issue exclusions
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8

# Ignore Web a11y label checks in UI and plugins
sonar.issue.ignore.multicriteria.e1.ruleKey=Web:InputWithoutLabelCheck
sonar.issue.ignore.multicriteria.e1.resourceKey=modules/libs/ui/**,modules/plugins/**

# Ignore Web tabindex on reader scrollable viewport
sonar.issue.ignore.multicriteria.e2.ruleKey=Web:S6845
sonar.issue.ignore.multicriteria.e2.resourceKey=modules/libs/ui/src/features/reader/ui/Reader.vue

# Ignore Web missing html/xml lang attributes in reader test documents
sonar.issue.ignore.multicriteria.e3.ruleKey=Web:S5254
sonar.issue.ignore.multicriteria.e3.resourceKey=modules/plugins/reader-epub/**

# Allow unsafe-inline style in mobile CSP
sonar.issue.ignore.multicriteria.e4.ruleKey=Web:S7039
sonar.issue.ignore.multicriteria.e4.resourceKey=modules/apps/mobile/index.html

# Ignore dynamic SQL inspection on internal query map lookups
sonar.issue.ignore.multicriteria.e5.ruleKey=go:S2077
sonar.issue.ignore.multicriteria.e5.resourceKey=modules/libs/core/adapter/index/**

# Ignore test driver mock transaction rollback warning
sonar.issue.ignore.multicriteria.e6.ruleKey=godre:S8168
sonar.issue.ignore.multicriteria.e6.resourceKey=modules/libs/core/adapter/index/migrate_test.go

# Ignore file permission checks on appstate files and permission simulation helpers
sonar.issue.ignore.multicriteria.e7.ruleKey=go:S2612
sonar.issue.ignore.multicriteria.e7.resourceKey=modules/libs/core/internal/adapter/appstate/**,modules/libs/core/internal/testsupport/**

# Ignore intentional UPDATE without WHERE in historical migrations
sonar.issue.ignore.multicriteria.e8.ruleKey=plsql:DeleteOrUpdateWithoutWhereCheck
sonar.issue.ignore.multicriteria.e8.resourceKey=modules/libs/core/adapter/index/migration/0002_fts_prefix.sql
