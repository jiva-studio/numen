// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    configurations.classpath {
        resolutionStrategy.activateDependencyLocking()
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath 'com.google.gms:google-services:4.5.0'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

// The versions every configuration of the app resolves are pinned in
// app/gradle.lockfile, and the build classpath in buildscript-gradle.lockfile.
// Write them again with: ./gradlew :app:dependencies buildEnvironment --write-locks
project(':app') {
    dependencyLocking {
        lockAllConfigurations()
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    // Every module builds with the tools this machine has, whatever its own
    // default says.
    plugins.withId('com.android.library') {
        android { buildToolsVersion rootProject.ext.buildToolsVersion }
    }
    plugins.withId('com.android.application') {
        android { buildToolsVersion rootProject.ext.buildToolsVersion }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
