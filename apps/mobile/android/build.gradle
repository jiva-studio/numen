// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    // Build-tool dependencies of AGP and google-services, pinned to releases fixed for known advisories.
    ext.pinnedBuildToolVersions = [
        'io.netty:netty-codec-http'          : '4.1.140.Final',
        'io.netty:netty-codec-http2'         : '4.1.140.Final',
        'io.netty:netty-handler'             : '4.1.140.Final',
        'io.netty:netty-handler-proxy'       : '4.1.140.Final',
        'io.netty:netty-codec'               : '4.1.140.Final',
        'io.netty:netty-common'              : '4.1.140.Final',
        'org.bouncycastle:bcprov-jdk18on'    : '1.86',
        'org.bouncycastle:bcpkix-jdk18on'    : '1.86',
        'com.google.guava:guava'             : '33.8.0-jre',
        'commons-io:commons-io'              : '2.22.0',
        'org.apache.commons:commons-compress': '1.28.0',
        'com.google.protobuf:protobuf-java'  : '3.25.9',
        'com.google.protobuf:protobuf-java-util': '3.25.9',
        'com.google.protobuf:protobuf-kotlin': '3.25.9',
        'org.bitbucket.b_c:jose4j'           : '0.9.7',
        'org.jdom:jdom2'                     : '2.0.6.1',
    ]
    configurations.classpath {
        resolutionStrategy.activateDependencyLocking()
        resolutionStrategy.force(pinnedBuildToolVersions.collect { module, version -> "$module:$version" })
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath 'com.google.gms:google-services:4.5.0'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

// The versions every configuration of the project resolves are pinned in
// gradle.lockfile and app/gradle.lockfile, and the build classpath in
// buildscript-gradle.lockfile. Write them again with:
// ./gradlew dependencies :app:dependencies buildEnvironment --write-locks
dependencyLocking {
    lockAllConfigurations()
}

project(':app') {
    dependencyLocking {
        lockAllConfigurations()
    }
}

allprojects {
    configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            def version = rootProject.ext.pinnedBuildToolVersions["${details.requested.group}:${details.requested.name}"]
            if (version != null) {
                details.useVersion version
            }
        }
    }
    repositories {
        google()
        mavenCentral()
    }
    // Every module builds with the tools this machine has, whatever its own
    // default says.
    plugins.withId('com.android.library') {
        android { buildToolsVersion rootProject.ext.buildToolsVersion }
    }
    plugins.withId('com.android.application') {
        android { buildToolsVersion rootProject.ext.buildToolsVersion }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
